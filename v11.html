<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#070b14"/><title>Personal OS</title><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script><script src="https://cdn.tailwindcss.com"></script><style>html,body,#root{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#eef2ff}*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}.glass{background:rgba(17,24,39,.72);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.12)}.progress{background:linear-gradient(90deg,#818cf8,#38bdf8)}</style></head><body><div id="root"></div><script type="text/babel" data-version="1.1">
const{useEffect,useState}=React;const KEY='personal_os_v1';const seed={tasks:[{id:1,title:'Complete Personal OS V1 structure',project:'Personal OS',priority:'High',status:'In Progress',due:'Today'},{id:2,title:'Review pending customer evidence request',project:'Work',priority:'High',status:'Todo',due:'Today'},{id:3,title:'Update SIEM troubleshooting knowledge',project:'Knowledge',priority:'Medium',status:'Todo',due:'Tomorrow'},{id:4,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'This week'},{id:5,title:'Clean up project notes',project:'Personal OS',priority:'Low',status:'Done',due:'Today'}],projects:[{id:1,name:'Personal OS',description:'Command Center + Knowledge Base + AI COO',progress:32,health:'On track',color:'from-indigo-500 to-sky-400'},{id:2,name:'SIEM Automation',description:'Evidence collection and reporting workflow',progress:78,health:'On track',color:'from-emerald-500 to-cyan-400'},{id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus',color:'from-fuchsia-500 to-violet-400'},{id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady',color:'from-amber-400 to-orange-500'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source/destination, device and event type before requesting high-volume logs.'},{id:3,title:'Personal OS idea',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}],activity:[{text:'Personal OS V1 started',time:'Today · 4:10 PM',type:'project'},{text:'Project milestone reviewed',time:'Today · 2:30 PM',type:'progress'},{text:'Firewall investigation note captured',time:'Yesterday · 6:05 PM',type:'knowledge'},{text:'Customer follow-up completed',time:'Yesterday · 4:40 PM',type:'task'}]};
const clone=x=>JSON.parse(JSON.stringify(x));function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.tasks?x:clone(seed)}catch{return clone(seed)}}function now(){return new Date()}function dateLabel(){return new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now())}function stamp(){return 'Today · '+new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit'}).format(now())}function log(d,text,type){return[{text,time:stamp(),type},...(d.activity||[])].slice(0,50)}
const nav=[['dashboard','Dashboard'],['tasks','Tasks'],['projects','Projects'],['knowledge','Knowledge'],['activity','Activity'],['ai','AI COO']];const Button=({children,onClick,primary})=><button onClick={onClick} className={'px-4 py-2.5 rounded-xl text-sm font-semibold '+(primary?'bg-indigo-500 hover:bg-indigo-400':'bg-white/5 hover:bg-white/10')}>{children}</button>;const Field=({value,onChange,placeholder,type='text'})=><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 outline-none"/>;
function App(){const[data,setData]=useState(load),[page,setPage]=useState('dashboard'),[query,setQuery]=useState('');useEffect(()=>localStorage.setItem(KEY,JSON.stringify(data)),[data]);const active=data.tasks.filter(t=>t.status!=='Done'),done=data.tasks.length-active.length,completion=data.tasks.length?Math.round(done/data.tasks.length*100):0;const search=a=>a.filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));const update=(x)=>setData(x);const addTask=t=>update({...data,tasks:[{...t,id:Date.now()},...data.tasks],activity:log(data,'Task created: '+t.title,'task')});const toggle=id=>{let t=data.tasks.find(x=>x.id===id),status=t.status==='Done'?'Todo':'Done';update({...data,tasks:data.tasks.map(x=>x.id===id?{...x,status}:x),activity:log(data,(status==='Done'?'Task completed: ':'Task reopened: ')+t.title,'task')})};const editTask=t=>update({...data,tasks:data.tasks.map(x=>x.id===t.id?t:x),activity:log(data,'Task updated: '+t.title,'task')});const deleteTask=id=>{let t=data.tasks.find(x=>x.id===id);update({...data,tasks:data.tasks.filter(x=>x.id!==id),activity:log(data,'Task deleted: '+t.title,'task')})};const addProject=p=>update({...data,projects:[{...p,id:Date.now()},...data.projects],activity:log(data,'Project created: '+p.name,'project')});const editProject=p=>update({...data,projects:data.projects.map(x=>x.id===p.id?p:x),activity:log(data,'Project updated: '+p.name,'project')});const deleteProject=id=>{let p=data.projects.find(x=>x.id===id);update({...data,projects:data.projects.filter(x=>x.id!==id),activity:log(data,'Project deleted: '+p.name,'project')})};const addNote=n=>update({...data,notes:[{...n,id:Date.now()},...data.notes],activity:log(data,'Knowledge note created: '+n.title,'knowledge')});const editNote=n=>update({...data,notes:data.notes.map(x=>x.id===n.id?n:x),activity:log(data,'Knowledge note updated: '+n.title,'knowledge')});const deleteNote=id=>{let n=data.notes.find(x=>x.id===id);update({...data,notes:data.notes.filter(x=>x.id!==id),activity:log(data,'Knowledge note deleted: '+n.title,'knowledge')})};const exportData=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-os-backup.json';a.click()};const importData=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tasks||!x.projects||!x.notes)throw 0;update({...x,activity:log(data,'Backup imported','system')})}catch{alert('Invalid Personal OS backup file.')}};r.readAsText(f);e.target.value=''};const reset=()=>{if(confirm('Reset Personal OS to demo data?'))update(clone(seed))};return <div className="min-h-full bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,.16),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,.1),transparent_30%)]"><div className="max-w-[1500px] mx-auto min-h-screen flex"><aside className="w-64 shrink-0 border-r border-white/10 p-5 hidden md:flex flex-col"><div className="flex items-center gap-3 mb-8"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center font-black">P</div><div><b>Personal OS</b><div className="text-xs text-slate-400">your operating system</div></div></div><div className="space-y-1">{nav.map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'w-full text-left px-3 py-2.5 rounded-xl text-sm '+(page===k?'bg-white/10':'text-slate-400 hover:bg-white/5')}>{l}</button>)}</div><div className="mt-auto glass rounded-2xl p-4"><div className="text-xs text-indigo-300">V1.1 · Local-first</div><div className="text-sm font-medium mt-1">Data stays in this browser.</div><div className="text-xs text-slate-500 mt-2">No server · No subscription</div></div></aside><main className="flex-1 min-w-0"><header className="sticky top-0 z-10 px-5 md:px-8 py-4 border-b border-white/10 bg-[#070b14]/85 backdrop-blur-xl"><div className="flex gap-3"><div className="md:hidden font-bold self-center">Personal OS</div><div className="relative flex-1 max-w-xl"><span className="absolute left-3 top-2.5 text-slate-500">⌕</span><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search tasks, projects, knowledge..." className="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-sm outline-none"/></div><Button primary onClick={()=>setPage('ai')}>Ask AI COO</Button></div><div className="md:hidden flex gap-1 mt-3 overflow-x-auto">{nav.map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'px-3 py-2 rounded-lg text-xs whitespace-nowrap '+(page===k?'bg-white/10':'text-slate-400')}>{l}</button>)}</div></header><section className="p-5 md:p-8 max-w-[1250px] mx-auto">{page==='dashboard'?<Dashboard data={data} active={active} done={done} completion={completion} setPage={setPage} toggle={toggle}/>:page==='tasks'?<Tasks data={data} tasks={search(data.tasks)} addTask={addTask} toggle={toggle} editTask={editTask} deleteTask={deleteTask}/>:page==='projects'?<Projects data={data} items={search(data.projects)} add={addProject} edit={editProject} del={deleteProject}/>:page==='knowledge'?<Knowledge data={data} items={search(data.notes)} add={addNote} edit={editNote} del={deleteNote}/>:page==='activity'?<Activity data={data}/>:<AICOO data={data} completion={completion}/>}</section></main></div></div>}
const Title=({title,sub,action})=><div className="flex justify-between gap-4 items-start mb-7"><div><h1 className="text-3xl font-bold">{title}</h1><p className="text-slate-400 mt-2">{sub}</p></div>{action}</div>;
function Dashboard({data,active,done,completion,setPage,toggle}){let high=active.filter(t=>t.priority==='High');return <><div className="mb-8"><div className="text-sm text-indigo-300 mb-2">{dateLabel()}</div><h1 className="text-3xl md:text-4xl font-bold">Good {now().getHours()<12?'morning':now().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">Here’s your current picture. Focus on what moves the needle.</p></div><div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">{[['Open tasks',active.length],['Completed',done],['Projects',data.projects.length],['Knowledge notes',data.notes.length]].map((x,i)=><div className="glass rounded-2xl p-5" key={x[0]}><div className="text-sm text-slate-400">{x[0]}</div><div className="text-3xl font-bold mt-2">{x[1]}</div></div>)}</div><div className="grid lg:grid-cols-[1.5fr_1fr] gap-5"><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="flex justify-between mb-5"><div><b>Today’s focus</b><div className="text-xs text-slate-500 mt-1">{completion}% completion · {high.length} high priority open</div></div><button onClick={()=>setPage('tasks')} className="text-xs text-indigo-300">View all →</button></div><div className="h-2 bg-white/5 rounded-full overflow-hidden mb-5"><div className="progress h-full" style={{width:completion+'%'}}/></div><div className="space-y-2">{active.slice(0,5).map(t=><div className="flex items-center gap-3 p-3 rounded-xl bg-white/[.03]" key={t.id}><button onClick={()=>toggle(t.id)} className="w-5 h-5 rounded-full border border-slate-500"/><div className="flex-1"><div className="text-sm">{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority} · {t.status}</div></div><span className="text-xs text-slate-400">{t.due}</span></div>)}</div></div><div className="glass rounded-2xl p-5"><b>Project health</b><div className="space-y-4 mt-4">{data.projects.map(p=><div key={p.id}><div className="flex justify-between text-sm mb-2"><span>{p.name}</span><span className="text-slate-400">{p.progress}%</span></div><div className="h-2 bg-white/5 rounded-full overflow-hidden"><div className={'h-full rounded-full bg-gradient-to-r '+p.color} style={{width:p.progress+'%'}}/></div><div className="text-xs text-slate-500 mt-1">{p.health}</div></div>)}</div></div></div><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="text-xs uppercase tracking-widest text-indigo-300">AI COO</div><h2 className="text-xl font-semibold mt-2">Priority recommendation</h2><p className="text-slate-400 text-sm mt-2">{high[0]?'Start with “'+high[0].title+'”. High-priority work should lead the queue.':'No high-priority tasks are open. Move a project forward.'}</p><button onClick={()=>setPage('ai')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open AI COO →</button></div><div className="glass rounded-2xl p-5"><b>Recent activity</b>{data.activity.slice(0,5).map((a,i)=><div className="flex gap-3 mt-4" key={i}><div className="w-2 h-2 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{a.time}</div></div></div>)}</div></div></div></>}
function TaskForm({initial,projects,onSave,onCancel}){let d=initial||{title:'',project:'Personal OS',priority:'Medium',status:'Todo',due:'Today'},[f,setF]=useState(d),s=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5 grid md:grid-cols-2 gap-3"><div className="md:col-span-2"><Field value={f.title} onChange={v=>s('title',v)} placeholder="Task title"/></div><select value={f.project} onChange={e=>s('project',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Personal OS</option>{projects.map(p=><option key={p.id}>{p.name}</option>)}<option>Work</option><option>Knowledge</option></select><select value={f.priority} onChange={e=>s('priority',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>High</option><option>Medium</option><option>Low</option></select><select value={f.status} onChange={e=>s('status',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Todo</option><option>In Progress</option><option>Done</option></select><input type="date" value={/^\d{4}-\d{2}-\d{2}$/.test(f.due)?f.due:''} onChange={e=>s('due',e.target.value||'Today')} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><div className="md:col-span-2 flex justify-end gap-2"><Button onClick={onCancel}>Cancel</Button><Button primary onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save task</Button></div></div>}
function Tasks({data,tasks,addTask,toggle,editTask,deleteTask}){let[show,setShow]=useState(false),[editing,setEditing]=useState(null),[status,setStatus]=useState('All'),[priority,setPriority]=useState('All');let list=tasks.filter(t=>(status==='All'||t.status===status)&&(priority==='All'||t.priority===priority));return <><Title title="Tasks" sub="Capture work, keep it moving, and close the loop." action={<Button primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add task</Button>}/><div className="flex gap-2 mb-5"><select value={status} onChange={e=>setStatus(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option>All</option><option>Todo</option><option>In Progress</option><option>Done</option></select><select value={priority} onChange={e=>setPriority(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option>All</option><option>High</option><option>Medium</option><option>Low</option></select><span className="text-xs text-slate-500 self-center">{list.length} shown</span></div>{show&&<TaskForm projects={data.projects} onCancel={()=>setShow(false)} onSave={t=>{addTask(t);setShow(false)}}/>}<div className="glass rounded-2xl overflow-hidden">{list.map((t,i)=><div className={'p-4 '+(i?'border-t border-white/5':'')} key={t.id}>{editing===t.id?<TaskForm initial={t} projects={data.projects} onCancel={()=>setEditing(null)} onSave={x=>{editTask(x);setEditing(null)}}/>:<div className="flex items-center gap-4"><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border shrink-0 '+(t.status==='Done'?'bg-emerald-500 border-emerald-500':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1 min-w-0"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.due} · {t.status}</div></div><span className="text-xs px-2 py-1 rounded-full bg-white/5">{t.priority}</span><button onClick={()=>setEditing(t.id)} className="text-xs text-indigo-300">Edit</button><button onClick={()=>deleteTask(t.id)} className="text-xs text-rose-300">Delete</button></div>}</div>)}{!list.length&&<div className="p-8 text-center text-sm text-slate-500">No tasks match these filters.</div>}</div></>}
function ProjectForm({initial,onSave,onCancel}){let d=initial||{name:'',description:'',progress:0,health:'On track',color:'from-indigo-500 to-sky-400'},[f,setF]=useState(d),s=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5 grid md:grid-cols-2 gap-3"><Field value={f.name} onChange={v=>s('name',v)} placeholder="Project name"/><Field value={f.description} onChange={v=>s('description',v)} placeholder="Description"/><Field type="number" value={f.progress} onChange={v=>s('progress',Math.max(0,Math.min(100,Number(v))))} placeholder="Progress %"/><select value={f.health} onChange={e=>s('health',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select><div className="md:col-span-2 flex justify-end gap-2"><Button onClick={onCancel}>Cancel</Button><Button primary onClick={()=>f.name.trim()&&onSave({...f,name:f.name.trim()})}>Save project</Button></div></div>}
function Projects({items,add,edit,del}){let[show,setShow]=useState(false),[editing,setEditing]=useState(null);return <><Title title="Projects" sub="See what is active, healthy, and at risk." action={<Button primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add project</Button>}/>{show&&<ProjectForm onCancel={()=>setShow(false)} onSave={p=>{add(p);setShow(false)}}/>}<div className="grid md:grid-cols-2 gap-5">{items.map(p=>editing===p.id?<ProjectForm key={p.id} initial={p} onCancel={()=>setEditing(null)} onSave={x=>{edit(x);setEditing(null)}}/>:<div className="glass rounded-2xl p-5" key={p.id}><div className={'h-1.5 w-20 rounded-full bg-gradient-to-r '+p.color+' mb-4'}/><div className="flex justify-between"><div><div className="text-lg font-semibold">{p.name}</div><p className="text-sm text-slate-400 mt-1">{p.description}</p></div><div className="text-2xl font-bold">{p.progress}%</div></div><div className="mt-5 h-2 bg-white/5 rounded-full overflow-hidden"><div className={'h-full bg-gradient-to-r '+p.color} style={{width:p.progress+'%'}}/></div><div className="flex justify-between text-xs text-slate-500 mt-3"><span>{p.health}</span><span className="flex gap-3"><button onClick={()=>setEditing(p.id)} className="text-indigo-300">Edit</button><button onClick={()=>del(p.id)} className="text-rose-300">Delete</button></span></div></div>)}{!items.length&&<div className="glass rounded-2xl p-8 text-center text-sm text-slate-500 md:col-span-2">No projects found.</div>}</div></>}
function NoteForm({initial,onSave,onCancel}){let d=initial||{title:'',tag:'General',body:''},[f,setF]=useState(d),s=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5 space-y-3"><Field value={f.title} onChange={v=>s('title',v)} placeholder="Note title"/><Field value={f.tag} onChange={v=>s('tag',v)} placeholder="Tag / category"/><textarea rows="5" value={f.body} onChange={e=>s('body',e.target.value)} placeholder="Write your knowledge..." className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 resize-y"/><div className="flex justify-end gap-2"><Button onClick={onCancel}>Cancel</Button><Button primary onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save note</Button></div></div>}
function Knowledge({items,add,edit,del}){let[show,setShow]=useState(false),[editing,setEditing]=useState(null),[tag,setTag]=useState('All');let tags=['All',...new Set(items.map(n=>n.tag))],list=tag==='All'?items:items.filter(n=>n.tag===tag);return <><Title title="Knowledge" sub="Capture useful knowledge and make it easy to retrieve." action={<Button primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add note</Button>}/><div className="flex gap-2 mb-5 overflow-x-auto">{tags.map(t=><button key={t} onClick={()=>setTag(t)} className={'px-3 py-2 rounded-xl text-xs '+(tag===t?'bg-indigo-500':'bg-white/5 text-slate-400')}>{t}</button>)}</div>{show&&<NoteForm onCancel={()=>setShow(false)} onSave={n=>{add(n);setShow(false)}}/>}<div className="grid md:grid-cols-2 gap-5">{list.map(n=>editing===n.id?<NoteForm key={n.id} initial={n} onCancel={()=>setEditing(null)} onSave={x=>{edit(x);setEditing(null)}}/>:<div className="glass rounded-2xl p-5" key={n.id}><div className="flex justify-between gap-3"><div><div className="text-lg font-semibold">{n.title}</div><span className="inline-block mt-2 text-xs px-2 py-1 rounded-full bg-indigo-500/10 text-indigo-300">{n.tag}</span></div><div className="flex gap-2"><button onClick={()=>setEditing(n.id)} className="text-xs text-indigo-300">Edit</button><button onClick={()=>del(n.id)} className="text-xs text-rose-300">Delete</button></div></div><p className="text-sm text-slate-400 mt-4 leading-6">{n.body}</p></div>)}{!list.length&&<div className="glass rounded-2xl p-8 text-center text-sm text-slate-500 md:col-span-2">No knowledge notes found.</div>}</div></>}
function Activity({data}){return <><Title title="Activity" sub="A lightweight history of what changed in your Personal OS."/><div className="glass rounded-2xl p-5 space-y-5">{data.activity.length?data.activity.map((a,i)=><div className="flex gap-4" key={i}><div className="w-3 h-3 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{a.time} · {a.type}</div></div></div>):<div className="text-center text-slate-500">No activity yet.</div>}</div></>}
function AICOO({data,completion}){let open=data.tasks.filter(t=>t.status!=='Done'),focus=open.find(t=>t.priority==='High')||open[0];return <><Title title="AI COO" sub="Your deterministic, local-first operating assistant."/><div className="grid lg:grid-cols-2 gap-5"><div className="glass rounded-2xl p-6"><div className="text-xs uppercase tracking-widest text-indigo-300">Next move</div><div className="text-2xl font-semibold mt-2">{focus?focus.title:'Everything is clear.'}</div><p className="text-slate-400 mt-3">{focus?`Priority: ${focus.priority} · ${focus.status} · ${focus.project}`:'You have no open tasks. Create the next meaningful action.'}</p></div><div className="glass rounded-2xl p-6"><div className="text-xs uppercase tracking-widest text-sky-300">System pulse</div><div className="grid grid-cols-2 gap-4 mt-4">{[[completion+'%','task completion'],[open.length,'open tasks'],[data.projects.filter(p=>p.health==='Needs focus'||p.health==='At risk').length,'projects needing focus'],[data.notes.length,'knowledge notes']].map(x=><div key={x[1]}><div className="text-2xl font-bold">{x[0]}</div><div className="text-xs text-slate-500">{x[1]}</div></div>)}</div></div><div className="glass rounded-2xl p-6 lg:col-span-2"><b>Operating guidance</b><div className="grid md:grid-cols-3 gap-4 mt-4">{[['1 · Protect focus','Do the highest-priority open task before adding more work.'],['2 · Keep projects moving','Use progress and health to spot where attention is needed.'],['3 · Capture knowledge','Turn repeated troubleshooting and decisions into searchable notes.']].map(x=><div className="p-4 rounded-xl bg-white/[.03]" key={x[0]}><b>{x[0]}</b><p className="text-xs text-slate-500 mt-2">{x[1]}</p></div>)}</div></div></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
