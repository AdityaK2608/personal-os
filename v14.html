<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Personal OS 14.0</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.app{max-width:1380px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;letter-spacing:-.03em}.muted{color:#8e949d;font-size:11px}.btn{border:1px solid #2c3037;background:#171a1f;color:#fff;padding:9px 12px;border-radius:11px;font-weight:750;cursor:pointer}.primary{background:#fff;color:#111;border-color:#fff}.layout{display:grid;grid-template-columns:240px 1fr 300px;gap:12px}.card{background:#12151a;border:1px solid #24282f;border-radius:20px;padding:15px}.nav button{width:100%;text-align:left;margin:4px 0}.nav .active{background:#fff;color:#111}.label{font-size:9px;letter-spacing:.16em;color:#777d86;font-weight:900}.h{font-size:25px;font-weight:900;letter-spacing:-.05em;margin:5px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.metric{background:#171a1f;border:1px solid #252930;border-radius:15px;padding:12px}.metric b{font-size:22px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.col{background:#0f1115;border:1px solid #22262d;border-radius:17px;padding:9px;min-height:430px}.col h3{font-size:11px;margin:2px 2px 8px;color:#9ba1aa}.task{background:#191c21;border:1px solid #292d34;border-radius:13px;padding:10px;margin-bottom:7px;cursor:pointer}.task b{font-size:12px;line-height:1.35}.task small{display:block;color:#838993;font-size:9px;margin-top:6px}.score{float:right;border-radius:99px;background:#292d34;padding:3px 6px;font-size:8px}.input{width:100%;background:#171a1f;border:1px solid #30343b;color:#fff;padding:11px;border-radius:12px;outline:0}.chat{height:245px;overflow:auto;display:grid;align-content:start;gap:7px;margin:10px 0}.msg{font-size:11px;line-height:1.5;padding:9px 11px;border-radius:13px;max-width:90%;white-space:pre-wrap}.user{justify-self:end;background:#fff;color:#111}.ai{background:#1b1e24}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.quick button{text-align:left;font-size:10px}.timeline{display:grid;gap:6px;max-height:260px;overflow:auto}.event{background:#181b20;padding:9px;border-radius:11px;font-size:10px}.bar{height:6px;background:#292d34;border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#fff}.empty{color:#686e77;font-size:10px;padding:10px}.toast{position:fixed;right:15px;bottom:15px;background:#fff;color:#111;padding:10px 13px;border-radius:11px;font-size:11px;font-weight:800}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.right{grid-column:1/-1}.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:none}.metrics{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.col{min-height:180px}} </style></head><body><div class="app"><div class="top"><div><div class="brand">PERSONAL OS · 14.0</div><div class="muted">AI Workbench · local-first · Aditya</div></div><div><button class="btn" onclick="location.href='v13.html'">v13</button></div></div><div class="layout"><aside class="card nav"><div class="label">WORKSPACE</div><button id="n-board" class="btn active" onclick="view('board')">Command Board</button><button id="n-timeline" class="btn" onclick="view('timeline')">Timeline</button><button id="n-projects" class="btn" onclick="view('projects')">Projects</button><button id="n-memory" class="btn" onclick="view('memory')">Memory</button><button class="btn" onclick="backup()">Export OS</button><div class="label" style="margin-top:20px">COMMANDS</div><div class="muted" style="line-height:1.7;margin-top:7px">briefing · review<br>add task …<br>complete task …<br>move task … to …<br>find … · remember …<br>recall … · plan …</div></aside><main id="main"></main><aside class="right"><div class="card"><div class="label">AI COPILOT</div><div id="chat" class="chat"></div><div style="display:flex;gap:6px"><input id="cmd" class="input" placeholder="Tell the OS what to do"><button class="btn primary" onclick="send()">Run</button></div><div class="quick"><button class="btn" onclick="run('briefing')">Briefing</button><button class="btn" onclick="run('review')">Review</button><button class="btn" onclick="run('plan today')">Plan today</button><button class="btn" onclick="run('show overdue')">Overdue</button></div></div><div class="card" style="margin-top:12px"><div class="label">FOCUS</div><div id="focus" style="margin-top:9px"></div></div></aside></div></div><script>(function(){'use strict';var KEY='personal_os_v80',MEM='personal_os_v12_memory',viewName='board',chat=[];function get(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],projects:[],notes:[],decisions:[],activity:[]}}catch(e){return{tasks:[],projects:[],notes:[],decisions:[],activity:[]}}}function put(d){d.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function score(t){var s=t.priority==='High'?60:t.priority==='Medium'?30:10;if(t.lane==='NOW')s+=25;if(t.status==='Blocked')s-=20;if(t.due){var x=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/864e5);if(x<0)s+=60;else if(x===0)s+=40;else if(x<=2)s+=25}return s}function state(){var d=get(),o=(d.tasks||[]).filter(t=>t.status!=='Done'),today=new Date().toISOString().slice(0,10);return{d:d,o:o,over:o.filter(t=>t.due&&t.due<today),soon:o.filter(t=>t.due&&t.due>=today&&t.due<=new Date(Date.now()+2*864e5).toISOString().slice(0,10)),mem:memories()}}function memories(){try{return JSON.parse(localStorage.getItem(MEM)||'[]')}catch(e){return[]}}function log(d,text){d.activity=d.activity||[];d.activity.unshift({id:Date.now(),text:text,time:new Date().toISOString()});d.activity=d.activity.slice(0,100);put(d)}function answer(q){var d=get(),s=q.trim(),l=s.toLowerCase(),st=state();if(!s)return'';if(l==='help')return'Commands: briefing · review · plan today · add task <title> · complete task <id/title> · move task <title> to <lane> · find <term> · note <text> · remember <text> · recall <term> · show overdue';if(l==='briefing'||l==='today'||l==='daily briefing'){var a=st.o.slice().sort((x,y)=>score(y)-score(x));return'FOCUS\n'+(a[0]?a[0].title:'No open tasks')+'\n\nOVERDUE\n'+(st.over[0]?st.over[0].title:'None')+'\n\nDUE SOON\n'+(st.soon.slice(0,3).map(x=>x.title).join('\n')||'None')+'\n\nNEXT: protect time for the highest-scoring task.'}if(l==='review')return'WORK REVIEW\n\nOpen: '+st.o.length+'\nOverdue: '+st.over.length+'\nDue within 2 days: '+st.soon.length+'\nBlocked: '+st.o.filter(x=>x.status==='Blocked').length+'\nProjects: '+(d.projects||[]).length+'\nMemories: '+st.mem.length;if(l==='plan today'||l==='plan'){var a=st.o.slice().sort((x,y)=>score(y)-score(x)).slice(0,5);return'TODAY PLAN\n\n'+(a.map((x,i)=>(i+1)+'. '+x.title+' — '+(x.due||'no date')).join('\n')||'Nothing queued.')+'\n\nProtect the top 1–2 items before taking new work.'}if(l.startsWith('add task ')){var title=s.slice(9).trim();d.tasks=d.tasks||[];d.tasks.push({id:Date.now(),title:title,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'});log(d,'Added task: '+title);return'Added task: '+title}if(l.startsWith('complete task ')){var q=s.slice(14).trim(),t=(d.tasks||[]).find(x=>String(x.id)===q||x.title.toLowerCase()===q.toLowerCase());if(!t)return'Task not found. Use show tasks.';t.status='Done';log(d,'Completed task: '+t.title);return'Completed: '+t.title}if(l.startsWith('move task ')){var z=s.slice(10),parts=z.split(/\s+to\s+/i),name=(parts[0]||'').trim(),lane=(parts[1]||'').trim().toUpperCase(),t=(d.tasks||[]).find(x=>x.title.toLowerCase()===name.toLowerCase()||String(x.id)===name);if(!t)return'Task not found.';var allowed=['NOW','FOLLOW-UP','WAITING','SOMEDAY','BLOCKED'];if(allowed.indexOf(lane)<0)return'Lane must be NOW, FOLLOW-UP, WAITING, SOMEDAY, or BLOCKED.';t.lane=lane;if(lane==='BLOCKED')t.status='Blocked';log(d,'Moved '+t.title+' to '+lane);return'Moved '+t.title+' → '+lane}if(l==='show overdue'||l==='overdue')return st.over.map(x=>'• '+x.title+' — '+x.due).join('\n')||'No overdue tasks.';if(l==='show tasks'||l==='tasks')return st.o.slice().sort((a,b)=>score(b)-score(a)).map((x,i)=>(i+1)+'. '+x.title+' ['+x.status+' · '+x.lane+']').join('\n')||'No open tasks.';if(l.startsWith('find ')){var term=l.slice(5),hits=[];(d.tasks||[]).forEach(x=>{if((x.title+' '+x.project+' '+x.area).toLowerCase().includes(term))hits.push('Task: '+x.title)});(d.notes||[]).forEach(x=>{if((x.title+' '+x.body+' '+x.tag).toLowerCase().includes(term))hits.push('Note: '+x.title)});(d.projects||[]).forEach(x=>{if((x.name+' '+x.goal).toLowerCase().includes(term))hits.push('Project: '+x.name)});return hits.join('\n')||'No local matches.'}if(l.startsWith('remember ')){var m=st.mem;m.unshift({text:s.slice(9).trim(),time:new Date().toISOString()});localStorage.setItem(MEM,JSON.stringify(m.slice(0,60)));return'Remembered locally.'}if(l.startsWith('recall ')){var term=l.slice(7),m=st.mem.filter(x=>x.text.toLowerCase().includes(term));return m.map(x=>'• '+x.text).join('\n')||'No matching memory.'}if(l.startsWith('note ')){d.notes=d.notes||[];d.notes.push({id:Date.now(),title:'Command note',tag:'Captured',body:s.slice(5).trim(),area:'Inbox'});log(d,'Captured note');return'Note saved.'}return'Try “help”. I can plan, prioritize, create, complete, move, search, remember, and review.'}function send(){var e=document.getElementById('cmd'),q=e.value.trim();if(!q)return;chat.push({r:'user',t:q},{r:'ai',t:answer(q)});e.value='';drawChat();renderMain();renderFocus()}function drawChat(){document.getElementById('chat').innerHTML=chat.map(x=>'<div class="msg '+x.r+'">'+esc(x.t)+'</div>').join('');var c=document.getElementById('chat');c.scrollTop=c.scrollHeight}function run(q){document.getElementById('cmd').value=q;send()}window.send=send;window.run=run;window.view=function(v){viewName=v;document.querySelectorAll('.nav .btn').forEach(x=>x.classList.remove('active'));var n=document.getElementById('n-'+v);if(n)n.classList.add('active');renderMain()};function renderMain(){var st=state(),d=st.d;if(viewName==='board'){var lanes=['NOW','FOLLOW-UP','WAITING','BLOCKED'];document.getElementById('main').innerHTML='<div class="metrics"><div class="metric"><div class="muted">OPEN</div><b>'+st.o.length+'</b></div><div class="metric"><div class="muted">OVERDUE</div><b>'+st.over.length+'</b></div><div class="metric"><div class="muted">DUE SOON</div><b>'+st.soon.length+'</b></div><div class="metric"><div class="muted">PROJECTS</div><b>'+((d.projects||[]).length)+'</b></div></div><div class="card"><div class="label">COMMAND BOARD</div><div class="h">Work in motion</div><div class="board">'+lanes.map(l=>'<div class="col"><h3>'+l+' · '+st.o.filter(t=>t.lane===l).length+'</h3>'+st.o.filter(t=>t.lane===l).sort((a,b)=>score(b)-score(a)).map(t=>'<div class="task" onclick="completeBy('+t.id+')"><span class="score">'+score(t)+'</span><b>'+esc(t.title)+'</b><small>'+esc(t.priority)+' · '+esc(t.due||'no date')+'</small></div>').join('')+'</div>').join('')+'</div></div>'}else if(viewName==='timeline'){document.getElementById('main').innerHTML='<div class="card"><div class="label">TIMELINE</div><div class="h">Next 14 days</div><div class="timeline">'+st.o.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)).map(t=>'<div class="event"><b>'+esc(t.due)+'</b> · '+esc(t.title)+'<br><span class="muted">'+esc(t.priority)+' · '+esc(t.status)+'</span></div>').join('')+'</div></div>'}else if(viewName==='projects'){document.getElementById('main').innerHTML='<div class="card"><div class="label">PORTFOLIO</div><div class="h">Projects</div>'+(d.projects||[]).map(p=>'<div class="item" style="background:#181b20;padding:12px;border-radius:13px;margin-top:8px"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.goal||'')+'</div><div class="bar"><i style="width:'+Math.min(100,Number(p.progress)||0)+'%"></i></div><div class="muted" style="margin-top:5px">'+(p.progress||0)+'% · '+esc(p.health||'')+'</div></div>').join('')+'</div>'}else{document.getElementById('main').innerHTML='<div class="card"><div class="label">LOCAL MEMORY</div><div class="h">What the OS remembers</div>'+(st.mem.map(m=>'<div class="item" style="background:#181b20;padding:11px;border-radius:12px;margin-top:7px;font-size:11px">'+esc(m.text)+'</div>').join('')||'<div class="empty">No memories yet. Use “remember …”.</div>')+'</div>'}}function completeBy(id){var d=get(),t=(d.tasks||[]).find(x=>x.id===id);if(!t)return;t.status='Done';log(d,'Completed task: '+t.title);renderMain();renderFocus();toast('Completed: '+t.title)}window.completeBy=completeBy;function renderFocus(){var st=state(),x=st.o.slice().sort((a,b)=>score(b)-score(a))[0];document.getElementById('focus').innerHTML=x?'<b>'+esc(x.title)+'</b><div class="muted" style="margin-top:4px">'+esc(x.priority)+' · '+esc(x.lane)+' · score '+score(x)+'</div>':'<span class="muted">No open work.</span>'}function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}window.backup=function(){var b=new Blob([JSON.stringify({version:'14.0',data:get(),memory:memories(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v14-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()});renderMain();renderFocus();chat.push({r:'ai',t:'v14 online. I can plan, prioritize, create, complete, move, search, remember, and review. Try “plan today”.'});drawChat()})()</script></body></html>
