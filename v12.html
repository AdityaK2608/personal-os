<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f5f7"><title>Personal OS 12.0</title><style>body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;background:#f4f5f7;color:#111}.app{max-width:1280px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-weight:900}.muted{color:#858a92;font-size:12px}.btn{border:1px solid #dfe2e6;background:#fff;padding:10px 13px;border-radius:12px;font-weight:750;cursor:pointer}.dark{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.card{background:#ffffffd9;border:1px solid #fff;border-radius:24px;padding:20px;box-shadow:0 16px 55px #1111}.label{font-size:10px;letter-spacing:.15em;color:#8a8f97;font-weight:900}.h{font-size:28px;letter-spacing:-.055em;font-weight:900;margin:5px 0 12px}.chat{height:500px;overflow:auto;display:grid;align-content:start;gap:9px;margin:15px 0}.msg{max-width:82%;padding:11px 13px;border-radius:16px;font-size:13px;line-height:1.55;white-space:pre-wrap}.user{justify-self:end;background:#111;color:#fff}.ai{justify-self:start;background:#eceef1}.composer{display:flex;gap:8px}.composer input{flex:1;border:1px solid #d9dce1;border-radius:14px;padding:13px;outline:0;background:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.metric{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:12px;border-radius:15px;background:#f6f7f8;margin-top:9px}.item b{font-size:13px}.pill{background:#e8eaed;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:850}.bar{height:8px;background:#e5e7ea;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#111}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tools button{text-align:left}.status{padding:12px;border-radius:16px;background:#111;color:#fff;margin-bottom:10px}.status span{color:#bbb}.timeline{display:grid;gap:7px}.event{font-size:11px;padding:9px;border-left:2px solid #111;background:#f7f7f8;border-radius:0 10px 10px 0}.kbd{font-size:10px;color:#8a8f97}.modal{position:fixed;inset:0;background:#0005;display:grid;place-items:center;padding:18px;z-index:50}.modalIn{width:min(700px,100%);background:#fff;border-radius:25px;padding:20px}.area{width:100%;min-height:120px;border:1px solid #ddd;border-radius:12px;padding:11px;box-sizing:border-box}.memory{max-height:180px;overflow:auto}@media(max-width:850px){.grid{grid-template-columns:1fr}.chat{height:55vh}.app{padding:10px}} </style></head><body><div id="app" class="app"></div><script>(function(){'use strict';var KEY='personal_os_v80',MEM='personal_os_v12_memory';var session=[];function get(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[]}}catch(e){return{tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[]}}}function put(d){d.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function score(t){var s=t.priority==='High'?55:t.priority==='Medium'?30:10;if(t.lane==='NOW')s+=30;if(t.status==='Blocked')s-=30;if(t.due){var d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/864e5);if(d<0)s+=55;else if(d===0)s+=40;else if(d<=2)s+=25}return s}function state(){var d=get(),o=(d.tasks||[]).filter(t=>t.status!=='Done'),over=o.filter(t=>t.due&&t.due<new Date().toISOString().slice(0,10));return{open:o,over:over,projects:d.projects||[],notes:d.notes||[],decisions:d.decisions||[],activity:d.activity||[]}}function remember(text){try{var m=JSON.parse(localStorage.getItem(MEM)||'[]');m.unshift({text:text,time:new Date().toISOString()});localStorage.setItem(MEM,JSON.stringify(m.slice(0,40)))}catch(e){}}function memories(){try{return JSON.parse(localStorage.getItem(MEM)||'[]')}catch(e){return[]}}function answer(q){var d=get(),s=q.trim(),l=s.toLowerCase(),st=state();if(!s)return'';if(l==='help')return'Available actions:\n\n• briefing — prioritized daily plan\n• add task <title>\n• complete task <id or exact title>\n• show tasks / show overdue / show projects\n• find <term>\n• note <text>\n• remember <text>\n• recall <term>\n• review — identify what needs attention';if(l==='briefing'||l==='today'||l==='daily briefing'){var o=st.open.slice().sort((a,b)=>score(b)-score(a));return'TODAY\'S BRIEFING\n\nFocus: '+(o[0]?o[0].title:'No high-priority open task')+'\nScore: '+(o[0]?score(o[0]):'—')+'\n\nClear: '+(st.over[0]?st.over[0].title:'Nothing overdue')+'\n\nProjects: '+(st.projects.map(p=>p.name+' ('+(p.progress||0)+'%)').join(', ')||'None')+'\n\nRule: finish or deliberately defer before adding more.'}if(l==='review'){var blocked=st.open.filter(t=>t.status==='Blocked'),soon=st.open.filter(t=>t.due&&t.due<=new Date(Date.now()+2*864e5).toISOString().slice(0,10));return'REVIEW\n\nOverdue: '+st.over.length+'\nBlocked: '+blocked.length+'\nDue within 2 days: '+soon.length+'\nDecisions logged: '+st.decisions.length+'\n\n'+(blocked.length?'Blocked: '+blocked.map(t=>t.title).join(', '):'No blocked tasks.')+'\n'+(soon.length?'Soon: '+soon.map(t=>t.title).join(', '):'Nothing due soon.')}if(l.startsWith('add task ')){var title=s.slice(9).trim();d.tasks=d.tasks||[];var t={id:Date.now(),title:title,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'};d.tasks.push(t);d.activity=d.activity||[];d.activity.unshift({id:Date.now(),text:'Added task: '+title,time:new Date().toISOString()});put(d);return'Added: '+title+'\nI placed it in NOW with Medium priority.'}if(l.startsWith('complete task ')){var x=s.slice(14).trim(),t=(d.tasks||[]).find(a=>String(a.id)===x||a.title.toLowerCase()===x.toLowerCase());if(!t)return'I could not find that task. Try “show tasks”.';t.status='Done';d.activity=d.activity||[];d.activity.unshift({id:Date.now(),text:'Completed: '+t.title,time:new Date().toISOString()});put(d);return'Completed: '+t.title}if(l==='show tasks'||l==='tasks'){return st.open.slice().sort((a,b)=>score(b)-score(a)).map((t,i)=>(i+1)+'. '+t.title+' ['+t.priority+', '+t.lane+']'+(t.due?' — '+t.due:'')).join('\n')||'No open tasks.'}if(l==='show overdue'||l==='overdue')return st.over.map(t=>'• '+t.title+' — '+t.due).join('\n')||'No overdue tasks.';if(l==='show projects'||l==='projects')return st.projects.map(p=>'• '+p.name+' — '+(p.progress||0)+'% — '+p.health).join('\n')||'No projects.';if(l.startsWith('find ')){var z=l.slice(5),hits=[];(d.tasks||[]).forEach(t=>{if((t.title+' '+t.project+' '+t.area).toLowerCase().includes(z))hits.push('Task: '+t.title)});(d.notes||[]).forEach(n=>{if((n.title+' '+n.body+' '+n.tag).toLowerCase().includes(z))hits.push('Note: '+n.title)});(d.projects||[]).forEach(p=>{if((p.name+' '+p.goal).toLowerCase().includes(z))hits.push('Project: '+p.name)});return hits.join('\n')||'No local matches.'}if(l.startsWith('note ')){var b=s.slice(5).trim();d.notes=d.notes||[];d.notes.push({id:Date.now(),title:'Command note',tag:'Captured',body:b,area:'Inbox'});put(d);return'Note saved locally.'}if(l.startsWith('remember ')){var b=s.slice(9).trim();remember(b);return'I will remember that in this browser\'s local memory.'}if(l.startsWith('recall ')){var z=l.slice(7),m=memories().filter(x=>x.text.toLowerCase().includes(z));return m.length?m.map(x=>'• '+x.text).join('\n'):'No matching memory found.'}return'I can execute that if you phrase it as a task, search, note, memory, briefing, or review command. Type “help” for examples.'}function add(role,text){session.push({role:role,text:text});drawChat()}function drawChat(){document.getElementById('chat').innerHTML=session.map(x=>'<div class="msg '+x.role+'">'+esc(x.text)+'</div>').join('');var c=document.getElementById('chat');c.scrollTop=c.scrollHeight}function render(){var st=state();document.getElementById('app').innerHTML='<div class="top"><div><div class="brand">PERSONAL OS · 12.0</div><div class="muted">Memory + Review Engine · local-first · Aditya</div></div><div><button class="btn" onclick="location.href=\'v11.html\'">v11</button></div></div><div class="grid"><section class="card"><div class="label">OS ASSISTANT</div><div class="h">What should we handle?</div><div class="muted">v12 adds persistent local memory, review intelligence, and safer command feedback.</div><div id="chat" class="chat"></div><div class="composer"><input id="cmd" placeholder="Try: briefing · remember … · review · find firewall"><button class="btn dark" onclick="send()">Run</button></div><div class="kbd" style="margin-top:8px">Enter to run · “help” for commands</div></section><aside><div class="card"><div class="label">LIVE STATE</div><div class="metric" style="margin-top:10px"><div class="item"><div class="muted">OPEN</div><b>'+st.open.length+'</b></div><div class="item"><div class="muted">OVERDUE</div><b>'+st.over.length+'</b></div><div class="item"><div class="muted">PROJECTS</div><b>'+st.projects.length+'</b></div><div class="item"><div class="muted">MEMORIES</div><b>'+memories().length+'</b></div></div><div class="label" style="margin-top:17px">TOP QUEUE</div>'+st.open.slice().sort((a,b)=>score(b)-score(a)).slice(0,5).map(t=>'<div class="item"><div class="row"><b>'+esc(t.title)+'</b><span class="pill">'+score(t)+'</span></div><div class="muted" style="margin-top:4px">'+esc(t.status)+' · '+esc(t.due||'no date')+'</div></div>').join('')+'</div><div class="card" style="margin-top:14px"><div class="label">QUICK ACTIONS</div><div class="tools"><button class="btn" onclick="run(\'briefing\')">Daily briefing</button><button class="btn" onclick="run(\'review\')">Run review</button><button class="btn" onclick="run(\'show overdue\')">Overdue</button><button class="btn" onclick="run(\'show projects\')">Projects</button><button class="btn" onclick="memoryPanel()">Memory</button><button class="btn" onclick="backup()">Backup</button></div></div></aside></div>'+(session.length?'':'');document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()});drawChat()}window.send=function(){var e=document.getElementById('cmd'),q=e.value.trim();if(!q)return;add('user',q);add('ai',answer(q));e.value='';renderStateOnly()};function renderStateOnly(){var st=state(),el=document.querySelector('.metric');if(!el)return;el.innerHTML='<div class="item"><div class="muted">OPEN</div><b>'+st.open.length+'</b></div><div class="item"><div class="muted">OVERDUE</div><b>'+st.over.length+'</b></div><div class="item"><div class="muted">PROJECTS</div><b>'+st.projects.length+'</b></div><div class="item"><div class="muted">MEMORIES</div><b>'+memories().length+'</b></div>'}window.run=function(q){document.getElementById('cmd').value=q;send()};window.memoryPanel=function(){var m=memories();alert(m.length?'LOCAL MEMORY\n\n'+m.map(x=>'• '+x.text).join('\n'):'No memories saved. Use “remember …”.')};window.backup=function(){var d=get(),bundle={version:'12.0',data:d,memory:memories(),exportedAt:new Date().toISOString()},b=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v12-backup.json';a.click();URL.revokeObjectURL(a.href)};render();add('ai','Hi Aditya. v12 is ready. I can prioritize work, modify tasks, search local records, and keep a small local memory. Try “briefing” or “remember …”.')})()</script></body></html>
