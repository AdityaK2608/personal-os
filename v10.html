<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Personal OS 10.0</title><style>body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#0d0e10;color:#f5f5f7}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;font-size:17px}.sub{color:#9b9da4;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#17191d;border:1px solid #282b31;border-radius:22px;padding:20px}.wide{grid-column:span 2}.label{font-size:10px;letter-spacing:.15em;color:#858991;font-weight:850}.big{font-size:42px;font-weight:900;letter-spacing:-.07em;margin-top:5px}.h{font-size:25px;letter-spacing:-.04em;margin:5px 0 12px}.muted{color:#9b9da4}.item{padding:13px;border-radius:15px;background:#1d2025;margin-top:9px}.row{display:flex;justify-content:space-between;gap:10px}.pill{background:#292c32;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800}.btn{border:1px solid #33363d;background:#1a1c20;color:#fff;padding:10px 13px;border-radius:12px;font-weight:750;cursor:pointer}.primary{background:#fff;color:#111;border-color:#fff}.bar{height:8px;background:#2b2e34;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}.insight{line-height:1.65;color:#c9cbd0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button{border:1px solid #2c2f35;background:#17191d;color:#aaa;padding:9px 12px;border-radius:12px}.nav button.on{background:#fff;color:#111}.capture{display:flex;gap:8px}.capture input{flex:1;background:#17191d;border:1px solid #30333a;color:#fff;padding:12px;border-radius:13px;outline:0}.danger{color:#ff9b9b}.kbd{font-size:10px;border:1px solid #383b42;padding:3px 6px;border-radius:6px;color:#999}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">PERSONAL OS · 10.0</div><div class="sub">Decision Engine · local-first · Aditya</div></div><button class="btn" onclick="location.href='index.html'">Open classic OS</button></div><div class="nav"><button class="on">Intelligence</button><button onclick="showQueue()">Priority Queue</button><button onclick="showReview()">Daily Review</button><button onclick="backup()">Backup</button></div><div id="view"></div></div><script>(function(){var KEY='personal_os_v80';function get(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[]}}catch(e){return{tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[]}}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function score(t){var s=t.priority==='High'?55:t.priority==='Medium'?30:10;if(t.lane==='NOW')s+=30;if(t.status==='Blocked')s-=35;if(t.due){var d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/864e5);if(d<0)s+=55;else if(d===0)s+=40;else if(d<=2)s+=25}return s}function render(){var d=get(),open=(d.tasks||[]).filter(t=>t.status!=='Done').sort((a,b)=>score(b)-score(a)),done=(d.tasks||[]).filter(t=>t.status==='Done').length,rate=d.tasks&&d.tasks.length?Math.round(done/d.tasks.length*100):0,urgent=open.filter(t=>score(t)>=80).length;document.getElementById('view').innerHTML='<div class="capture"><input id="capture" placeholder="Quick thought / task…"><button class="btn primary" onclick="capture()">Capture</button></div><div class="grid" style="margin-top:14px"><div class="card"><div class="label">TODAY\'S SIGNAL</div><div class="big">'+urgent+'</div><div class="muted">high-attention items</div></div><div class="card"><div class="label">COMPLETION</div><div class="big">'+rate+'%</div><div class="muted">overall task completion</div></div><div class="card"><div class="label">DECISION LOAD</div><div class="big">'+(d.decisions||[]).length+'</div><div class="muted">logged decisions</div></div><div class="card wide"><div class="label">DAILY BRIEFING</div><div class="h">If I were operating your day</div><p class="insight">Start with <b>'+esc(open[0]?open[0].title:'a meaningful next action')+'</b>. Protect a focused block for it. Clear overdue work before creating new commitments. Review project health before spending more effort. Capture decisions while context is fresh.</p><div class="row"><span class="muted">Recommended sequence</span><span class="pill">1 focus → 1 clear → 1 review</span></div></div><div class="card"><div class="label">SYSTEM STATE</div><div class="h">Local & portable</div><p class="insight">Your working data is stored in browser localStorage. Export a JSON backup whenever you want a portable copy.</p><span class="kbd">No server required</span></div><div class="card wide"><div class="label">PRIORITY QUEUE</div><div class="h">What should happen next?</div><div>'+open.slice(0,8).map((t,i)=>'<div class="item"><div class="row"><b>'+(i+1)+'. '+esc(t.title)+'</b><span class="pill">score '+score(t)+'</span></div><div class="muted" style="font-size:11px;margin-top:5px">'+esc(t.project||t.area||'Unassigned')+' · '+esc(t.due||'No due date')+'</div></div>').join('')+'</div></div><div class="card"><div class="label">PROJECTS</div><div class="h">Health check</div>'+((d.projects||[]).map(p=>'<div class="item"><div class="row"><b>'+esc(p.name)+'</b><span class="pill">'+esc(p.health)+'</span></div><div class="bar" style="margin-top:8px"><i style="width:'+Math.min(100,p.progress||0)+'%"></i></div></div>').join('')||'<div class="muted">No projects yet.</div>')+'</div></div>'}window.capture=function(){var el=document.getElementById('capture'),v=el.value.trim();if(!v)return;var d=get();d.tasks=d.tasks||[];d.tasks.push({id:Date.now(),title:v,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'});d.activity=d.activity||[];d.activity.unshift({id:Date.now(),text:'Captured: '+v,time:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(d));el.value='';render()};window.showQueue=function(){var d=get(),o=(d.tasks||[]).filter(t=>t.status!=='Done').sort((a,b)=>score(b)-score(a));alert(o.map((t,i)=>(i+1)+'. '+t.title+' — '+score(t)).join('\n')||'Queue is clear.')};window.showReview=function(){var d=get();alert('Daily Review\n\n1. What is the one outcome that matters most?\n2. Which overdue item needs a decision?\n3. What can I close, delegate, or delete?\n4. What did I learn today?\n\nOpen Journal / Decisions in the classic OS to record it.')};window.backup=function(){var b=new Blob([JSON.stringify(get(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v10-backup.json';a.click()};render()})()</script></body></html>
