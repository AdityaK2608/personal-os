<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Personal OS 18.0 · AI Core</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e8eaed;font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1300px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:950;letter-spacing:-.05em}.muted{color:#858b94;font-size:12px}.btn{border:1px solid #2b323a;background:#15191e;color:#ddd;padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.dark{background:#eee;color:#111}.shell{display:grid;grid-template-columns:240px 1fr;gap:14px}.side,.card{background:#11151a;border:1px solid #242a31;border-radius:18px}.side{padding:14px;min-height:calc(100vh - 90px)}.side button{width:100%;text-align:left;margin:4px 0}.side .active{background:#eee;color:#111}.main{min-width:0}.hero{padding:22px;border-radius:20px;background:#eee;color:#111;margin-bottom:14px}.hero h1{font-size:32px;letter-spacing:-.06em;margin:5px 0}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.card{padding:16px}.label{font-size:9px;letter-spacing:.18em;font-weight:950;color:#818891}.h{font-size:21px;font-weight:950;letter-spacing:-.04em;margin:4px 0 12px}.chat{height:430px;overflow:auto;display:grid;align-content:start;gap:8px}.msg{max-width:90%;white-space:pre-wrap;line-height:1.5;padding:10px 12px;border-radius:13px;font-size:13px}.user{justify-self:end;background:#eee;color:#111}.ai{background:#1a2026}.composer{display:flex;gap:7px;margin-top:10px}.input{flex:1;background:#0c1014;border:1px solid #303740;color:#eee;padding:12px;border-radius:11px;outline:none}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.item{border:1px solid #242a31;border-radius:12px;padding:10px;margin-bottom:7px}.item b{font-size:12px}.pill{float:right;background:#272e36;border-radius:99px;padding:4px 7px;font-size:9px;font-weight:900}.metric{padding:11px;border:1px solid #242a31;border-radius:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.metric b{display:block;font-size:20px;margin-top:3px}.code{font:11px ui-monospace,monospace;color:#aeb5be}.toast{position:fixed;right:15px;bottom:15px;background:#eee;color:#111;padding:10px 13px;border-radius:10px;font-weight:800}@media(max-width:900px){.shell,.grid{grid-template-columns:1fr}.side{min-height:auto}.metrics{grid-template-columns:1fr 1fr}} </style></head><body><div class="app"><div class="top"><div><div class="brand">PERSONAL OS · 18.0</div><div class="muted">AI Core · context engine · reasoning · actions · local-first · Aditya</div></div><button class="btn" onclick="location.href='v17.html'">Technical Core</button></div><div class="shell"><aside class="side"><div class="label">AI CORE</div><button id="a-chat" class="btn active" onclick="show('chat')">◉ AI Command</button><button id="a-context" class="btn" onclick="show('context')">◌ Context</button><button id="a-memory" class="btn" onclick="show('memory')">∞ Memory</button><button id="a-diagnostics" class="btn" onclick="show('diagnostics')">◇ Diagnostics</button><div style="height:14px"></div><div class="label">QUICK ACTIONS</div><button class="btn" onclick="ask('briefing')">Daily briefing</button><button class="btn" onclick="ask('plan my day')">Plan my day</button><button class="btn" onclick="ask('show overdue')">Show overdue</button><button class="btn" onclick="ask('review')">System review</button><div class="muted" style="margin-top:18px;line-height:1.7">This is not model training. v18 is a deterministic AI orchestration layer that can later connect to a real model without changing the data/action architecture.</div></aside><main class="main"><div id="content"></div></main></div></div><script src="ai-core-v18.js"></script><script>(function(){var page='chat',history=[];function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}function context(){return PersonalOSAI.context()}function render(){var c=document.getElementById('content'),x=context();if(page==='chat'){c.innerHTML='<div class="hero"><div class="label">AI CORE · ONLINE</div><h1>Your operating system has a brain.</h1><div class="muted">Natural-language commands, persistent memory, local context and safe deterministic actions.</div></div><div class="metrics"><div class="metric">OPEN<b>'+x.open.length+'</b></div><div class="metric">OVERDUE<b>'+x.overdue.length+'</b></div><div class="metric">BLOCKED<b>'+x.blocked.length+'</b></div><div class="metric">MEMORY<b>'+x.memory.length+'</b></div></div><div class="grid"><div class="card"><div class="label">CONVERSATION</div><div class="h">OS Copilot</div><div id="chat" class="chat">'+(history.length?history.map(function(m){return'<div class="msg '+m.role+'">'+esc(m.text)+'</div>'}).join(''):'<div class="msg ai">Ready. Ask me to plan, search, remember, review, create or change work.</div>')+'</div><div class="composer"><input id="q" class="input" placeholder="Tell Personal OS what to do…" onkeydown="if(event.key===\'Enter\')send()"><button class="btn dark" onclick="send()">Run</button></div><div class="quick"><button class="btn" onclick="ask(\'briefing\')">Briefing</button><button class="btn" onclick="ask(\'plan my day\')">Plan</button><button class="btn" onclick="ask(\'show overdue\')">Overdue</button><button class="btn" onclick="ask(\'show blocked\')">Blocked</button></div></div><div class="card"><div class="label">NEXT ACTIONS</div><div class="h">What the AI sees</div><div class="item"><b>Highest score</b><div class="muted">'+esc((x.open.slice().sort(function(a,b){return PersonalOSAI.score(b)-PersonalOSAI.score(a)})[0]||{}).title||'None')+'</div></div><div class="item"><b>Due soon</b><div class="muted">'+esc(x.dueSoon.slice(0,4).map(function(t){return t.title}).join(' · ')||'None')+'</div></div><div class="item"><b>Memory</b><div class="muted">'+x.memory.length+' persistent local memories</div></div></div></div>'}else if(page==='context'){c.innerHTML='<div class="card"><div class="label">CONTEXT ENGINE</div><div class="h">Live working context</div><div class="item"><b>Open work</b><div class="muted">'+x.open.length+'</div></div><div class="item"><b>Overdue</b><div class="muted">'+x.overdue.map(function(t){return t.title}).join(' · ')||'None'+'</div></div><div class="item"><b>Due soon</b><div class="muted">'+x.dueSoon.map(function(t){return t.title}).join(' · ')||'None'+'</div></div><div class="item"><b>Projects</b><div class="muted">'+(x.d.projects||[]).map(function(p){return p.name}).join(' · ')||'None'+'</div></div><div class="item"><b>Recent activity</b><div class="muted">'+(x.d.activity||[]).slice(0,5).map(function(a){return a.text}).join(' · ')||'None'+'</div></div></div>'}else if(page==='memory'){c.innerHTML='<div class="card"><div class="label">LONG-TERM MEMORY</div><div class="h">What Personal OS remembers</div>'+(x.memory.map(function(m){return'<div class="item"><b>'+esc(m.text)+'</b><div class="muted">'+esc(m.time||'')+'</div></div>'}).join('')||'<div class="muted">No memories yet. Tell the AI: “remember …”</div>')+'</div>'}else{c.innerHTML='<div class="card"><div class="label">DIAGNOSTICS</div><div class="h">AI Engine Diagnostics</div><div class="item"><b>Engine</b><div class="muted">PersonalOSAI v'+PersonalOSAI.version+'</div></div><div class="item"><b>Parser</b><div class="muted">Intent classification + entity extraction</div></div><div class="item"><b>Reasoning</b><div class="muted">Priority, deadline, blocked-state and context scoring</div></div><div class="item"><b>Actions</b><div class="muted">Create, complete, move, remember, capture</div></div><div class="item"><b>External model</b><div class="muted">Not connected — no API key exposed in browser</div></div><pre class="code">'+esc(JSON.stringify(PersonalOSAI.parse('move task firewall logs to waiting'),null,2))+'</pre></div>'}document.querySelectorAll('.side button').forEach(function(b){b.classList.remove('active')});var n=document.getElementById('a-'+page);if(n)n.classList.add('active')}function show(p){page=p;render()}function send(){var q=document.getElementById('q'),v=(q.value||'').trim();if(!v)return;ask(v);q.value=''}function ask(v){history.push({role:'user',text:v});var r=PersonalOSAI.run(v);history.push({role:'ai',text:r.text});render();setTimeout(function(){var el=document.getElementById('chat');if(el)el.scrollTop=el.scrollHeight},0)}window.show=show;window.send=send;window.ask=ask;render()})();</script></body></html>
