ackground:#111;color:#fff;border-color:#111}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 18px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#92979f;font-weight:850}.h1{font-size:clamp(36px,5vw,60px);line-height:1.02;letter-spacing:-.06em;margin:7px 0 0;font-weight:850}.h2{font-size:27px;letter-spacing:-.045em;margin:5px 0;font-weight:830}.copy{color:#70757f;line-height:1.65}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:rgba(255,255,255,.77);border:1px solid #fff;border-radius:25px;padding:21px;box-shadow:0 16px 55px rgba(15,23,42,.07);backdrop-filter:blur(18px)}.hero{padding:28px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.kpi{font-size:34px;font-weight:850;letter-spacing:-.05em;margin-top:4px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;background:#eff0f3;color:#5d626b;font-size:11px;font-weight:800}.pill.dark{background:#111;color:#fff}.list{display:grid;gap:10px}.item{padding:14px;border-radius:18px;background:rgba(255,255,255,.65);border:1px solid #edf0f2}.chips{display:flex;flex-wrap:wrap;gap:7px}.knowledgeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.knowledgeCard{cursor:pointer;min-height:180px}.knowledgeCard:hover{transform:translateY(-2px);box-shadow:0 20px 55px rgba(15,23,42,.1)}.muted{color:#8a8f98}.small{font-size:12px}.task{display:grid;grid-template-columns:1.7fr .8fr .8fr .8fr auto;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #eceef0}.task:first-child{border-top:0}.taskTitle{font-weight:780}.results{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid #e7e9ec;border-radius:18px;padding:7px;box-shadow:0 20px 50px rgba(15,23,42,.12);z-index:30;max-height:60vh;overflow:auto}.result{display:block;width:100%;background:transparent;border:0;text-align:left;padding:10px;border-radius:12px}.result:hover{background:#f1f2f4}.modal{position:fixed;inset:0;background:rgba(0,0,0,.22);backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;z-index:50}.modalIn{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 30px 100px rgba(15,23,42,.2)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#81868e;font-weight:800;margin-bottom:6px}.input,.area{width:100%;border:1px solid #dfe2e6;border-radius:13px;background:#f7f8f9;padding:11px 12px;outline:none}.area{min-height:130px;resize:vertical}.mobile{display:none}.fallback{padding:40px;max-width:900px;margin:auto}.errorBox{margin-top:12px;padding:12px;border-radius:12px;background:#fff1f2;color:#9f2332;font-size:12px;display:none}@media(max-width:1060px){.shell{display:block;padding:10px}.side{display:none}.main{padding-bottom:85px}.mobile{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);padding:7px;border-radius:22px;z-index:40;box-shadow:0 18px 55px rgba(15,23,42,.14)}.mobile button{flex:1;text-align:center;font-size:10px;padding:11px 4px}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.knowledgeGrid{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:1fr auto}.task>:nth-child(2),.task>:nth-child(3),.task>:nth-child(4){display:none}.top{flex-wrap:wrap}.searchWrap{width:100%}.actions{width:100%}.actions .btn{flex:1}.form{grid-template-columns:1fr}}@media(max-width:650px){.g4,.g2,.knowledgeGrid{grid-template-columns:1fr}.card,.hero{padding:18px;border-radius:22px}.h1{font-size:39px}.actions .btn:not(.dark){display:none}}
</style></head><body><div id="app" class="app"><div class="fallback"><div class="eyebrow">Personal OS 7.2</div><h1 class="h1">Loading Personal Brain…</h1><p class="copy">If JavaScript is available, your workspace will appear here. This screen is also a deliberate fallback so a runtime failure never produces a blank page.</p><div class="errorBox" id="errorBox"></div></div></div><script>(function(){'use strict';

Databases:['SQL Basics','Indexes','Query Plans','Transactions','ACID','Locks and Deadlocks','Connection Pools','Backup and Restore','Replication','Normalization','Database Monitoring','Slow Query Troubleshooting','Partitioning','Caching','Schema Migrations','Data Integrity'],

var summary={Linux:'Practical Linux operations using observable system state and reversible troubleshooting.',RHEL:'RHEL administration patterns with verification and recovery in mind.',Networking:'A layered reference for isolating endpoint, path, service and evidence problems.',Cybersecurity:'Security fundamentals centered on least privilege, layered controls and evidence.','SIEM / SOC':'SOC reference connecting logging, detection quality, triage, evidence and escalation.',Cloud:'Cloud operations reference focused on identity, networking, observability, resilience and cost.',DevOps:'Delivery reference focused on repeatability, validation, automation and rollback.',Programming:'Programming reference focused on clear inputs, outputs, tests and observability.',Databases:'Database reference focused on integrity, query behavior, locking and recovery.','AI and ML':'AI/ML reference focused on concepts, retrieval, evaluation, uncertainty and safe use.',Productivity:'Productivity reference focused on reducing friction, next actions and reviews.'};
var KB=[];Object.keys(topics).forEach(function(d){topics[d].forEach(function(t,i){KB.push({id:'kb-'+d+'-'+i,title:t,category:d,kind:'Built-in',summary:summary[d],tags:[d,t],body:t+'\n\nPractical reference\nDefine the objective and current state. Gather observable signals, isolate the relevant layer, choose the smallest safe action, verify the result, and document what worked.\n\nChecklist\n1. Define the problem.\n2. Verify the current state.\n3. Isolate the failing layer or decision.\n4. Apply a small reversible change.\n5. Verify and document the outcome.'})})});
function fresh(){var n=new Date().toISOString();return{schemaVersion:7,createdAt:n,updatedAt:n,settings:{dailyObjective:'Capture useful knowledge and turn the right context into action.'},areas:['Work','Personal','Learning','Projects'],tasks:[{id:1,title:'Explore the Knowledge Engine',project:'Personal OS',area:'Projects',lane:'NOW',priority:'High',status:'In Progress',due:n.slice(0,10),context:'Deep Work'},{id:2,title:'Review important customer follow-up',project:'',area:'Work',lane:'FOLLOW-UP',priority:'High',status:'Todo',due:new Date(Date.now()+86400000).toISOString().slice(0,10),context:'Computer'}],projects:[{id:1,name:'Personal OS',goal:'Build a private operating system for everyday work and learning',progress:72,health:'On track'},{id:2,name:'SIEM Automation',goal:'Reduce manual evidence work',progress:78,health:'On track'},{id:3,name:'Prod1',goal:'Ship the next useful product milestone',progress:64,health:'Needs focus'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.',project:'',area:'Learning'},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source, destination, device and event type before requesting high-volume logs.',project:'SIEM Automation',area:'Work'}],activity:[{id:1,text:'Personal OS 7.2 initialized',time:n,type:'system'}],trash:[]}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var x=JSON.parse(localStorage.getItem(K));return x&&typeof x==='object'?x:fresh()}catch(e){return fresh()}}
var state=load();if(!Array.isArray(state.tasks))state.tasks=[];if(!Array.isArray(state.projects))state.projects=[];if(!Array.isArray(state.notes))state.notes=[];if(!Array.isArray(state.activity))state.activity=[];if(!Array.isArray(state.areas))state.areas=['Work','Personal','Learning','Projects'];
var page='home',query='',category='All';
function persist(){try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}}
function score(t){var s={High:60,Medium:35,Low:15}[t.priority]||15;if(t.lane==='NOW')s+=30;if(t.lane==='FOLLOW-UP')s+=15;if(t.status==='Blocked')s-=50;if(t.due){var n=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(n<0)s+=60;else if(n===0)s+=45;else if(n===1)s+=30;else if(n<=3)s+=15}var p=state.projects.filter(function(x){return x.name===t.project})[0];if(p){if(p.health==='At risk')s+=35;if(p.health==='Needs focus')s+=20}return s}
function go(p){page=p;render()}
function search(q){var ql=String(q||'').toLowerCase().trim();if(!ql)return[];var out=[];KB.forEach(function(x){var text=(x.title+' '+x.category+' '+x.summary+' '+x.body).toLowerCase();if(text.indexOf(ql)>=0)out.push(x)});state.notes.forEach(function(x){var text=(x.title+' '+x.tag+' '+x.body+' '+x.project+' '+x.area).toLowerCase();if(text.indexOf(ql)>=0)out.push({id:'n-'+x.id,title:x.title,category:x.tag||x.area,kind:'Personal',summary:x.body.slice(0,140),body:x.body,note:x})});state.tasks.forEach(function(x){if((x.title+' '+x.project+' '+x.area+' '+x.context).toLowerCase().indexOf(ql)>=0)out.push({id:'t-'+x.id,title:x.title,category:x.project||x.area,kind:'Task',summary:x.lane+' · '+x.priority,body:x.title,task:x})});return out.slice(0,20)}
function pageHead(k,s,a){return '<div class="head"><div><div class="eyebrow">'+esc(k)+'</div><div class="h1">'+esc(s)+'</div><div class="copy">'+esc(a||'')+'</div></div>'+(page==='knowledge'?'<button class="btn dark" onclick="newNote()">New note</button>':'')+'</div>'}
function home(){var open=state.tasks.filter(function(t){return t.status!=='Done'}).sort(function(a,b){return score(b)-score(a)}),risk=state.projects.filter(function(p){return p.health==='Needs focus'||p.health==='At risk'}),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';return '<div class="card hero"><div class="eyebrow">Personal Brain · Knowledge Engine</div><div class="h1">'+g+', Aditya</div><p class="copy">'+esc(state.settings.dailyObjective)+'</p><div class="chips"><span class="pill dark">'+open.length+' open</span><span class="pill">'+KB.length+' built-in entries</span><span class="pill">'+state.notes.length+' personal notes</span><span class="pill">'+Object.keys(topics).length+' domains</span></div></div><div class="grid g4" style="margin-top:16px"><div class="card"><div class="muted small">DO THIS NOW</div><div class="kpi" style="font-size:22px">'+esc(open[0]?open[0].title:'Clear the queue')+'</div></div><div class="card"><div class="muted small">KNOWLEDGE</div><div class="kpi">'+(KB.length+state.notes.length)+'</div></div><div class="card"><div class="muted small">FOLLOW-UPS</div><div class="kpi">'+state.tasks.filter(function(t){return t.lane==='FOLLOW-UP'&&t.status!=='Done'}).length+'</div></div><div class="card"><div class="muted small">PROJECT RISK</div><div class="kpi">'+risk.length+'</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><div class="eyebrow">Execution</div><div class="h2">Daily Top 3</div><div class="list" style="margin-top:12px">'+open.slice(0,3).map(function(t,i){return '<div class="item"><div class="row"><div><span class="pill">#'+(i+1)+'</span> <strong>'+esc(t.title)+'</strong><div class="muted small">'+esc(t.project||t.area)+' · '+esc(t.lane)+'</div></div><button class="btn" onclick="done('+t.id+')">Done</button></div></div>'}).join('')+'</div></div><div class="card"><div class="eyebrow">Second brain</div><div class="h2">Knowledge pulse</div><p class="copy">Search the built-in technical library and your private notes together. Open a topic for practical guidance.</p><button class="btn dark" onclick="go(\'knowledge\')">Browse knowledge</button></div></div>'}
function tasks(){return pageHead('Execution','Tasks','NOW · LATER · FOLLOW-UP with practical context.')+'<div class="card"><div class="list">'+state.tasks.map(function(t){return '<div class="task"><div><div class="taskTitle">'+esc(t.title)+'</div><div class="muted small">'+esc(t.project||t.area)+' · '+esc(t.context)+'</div></div><span class="pill">'+esc(t.lane)+'</span><span class="pill">'+esc(t.priority)+'</span><span class="pill">'+esc(t.status)+'</span><div><button class="icon" onclick="done('+t.id+')">Done</button></div></div>'}).join('')+'</div></div>'}
function knowledge(){var list=category==='All'?KB:KB.filter(function(x){return x.category===category});list=list.concat(category==='All'||category==='Personal'?state.notes.map(function(n){return{id:'n-'+n.id,title:n.title,category:n.tag||n.area,kind:'Personal',summary:n.body.slice(0,140),body:n.body,note:n}}):[]);return pageHead('Second Brain','Knowledge','A large built-in technical reference plus your private knowledge, searchable locally.')+'<div class="grid g3"><div class="card"><div class="muted small">BUILT-IN</div><div class="kpi">'+KB.length+'</div><div class="copy small">Reference topics across '+Object.keys(topics).length+' domains.</div></div><div class="card"><div class="muted small">PERSONAL</div><div class="kpi">'+state.notes.length+'</div><div class="copy small">Your private browser-local notes.</div></div><div class="card"><div class="muted small">SEARCH</div><div class="kpi">Ctrl+K</div><div class="copy small">Search knowledge, tasks and projects.</div></div></div><div class="chips" style="margin:16px 0">'+['All'].concat(Object.keys(topics),['Personal']).map(function(c){return '<button class="pill '+(category===c?'dark':'')+'" onclick="setCategory('+JSON.stringify(c)+')">'+esc(c)+'</button>'}).join('')+'</div><div class="knowledgeGrid">'+list.map(function(n){return '<div class="card knowledgeCard" onclick="openKB('+JSON.stringify(n.id)+')"><div class="row"><span class="pill">'+esc(n.category)+'</span><span class="muted small">'+esc(n.kind)+'</span></div><div class="h2" style="font-size:20px">'+esc(n.title)+'</div><p class="copy small">'+esc(n.summary)+'</p></div>'}).join('')+'</div>'}
function projects(){return pageHead('Context','Projects','Goals, execution and knowledge context.')+'<div class="grid g3">'+state.projects.map(function(p){var ts=state.tasks.filter(function(t){return t.project===p.name}),done=ts.filter(function(t){return t.status==='Done'}).length,pct=ts.length?Math.round(done/ts.length*100):p.progress;return '<div class="card"><div class="row"><span class="pill">'+esc(p.health)+'</span><span class="muted small">'+ts.length+' tasks</span></div><div class="h2">'+esc(p.name)+'</div><p class="copy small">'+esc(p.goal)+'</p><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row small" style="margin-top:7px"><span>'+pct+'% pulse</span><span>'+ts.filter(function(t){return t.status!=='Done'}).length+' open</span></div></div>'}).join('')+'</div>'}
function activity(){return pageHead('History','Activity','Local operating history.')+'<div class="card"><div class="timeline">'+state.activity.slice().reverse().map(function(e){return '<div class="event"><div class="muted small">'+esc(new Date(e.time).toLocaleString())+'</div><div><span class="pill">'+esc(e.type||'system')+'</span> <strong>'+esc(e.text)+'</strong></div></div>'}).join('')+'</div></div>'}
function settings(){return pageHead('System','Settings','Local workspace controls.')+'<div class="grid g2"><div class="card"><div class="h2">Knowledge Engine</div><p class="copy">'+KB.length+' built-in reference entries across '+Object.keys(topics).length+' domains. No API or backend required.</p></div><div class="card"><div class="h2">Backup</div><p class="copy">Your workspace remains browser-local.</p><button class="btn dark" onclick="backup()">Export JSON</button></div></div>'}
function render(){var a=document.getElementById('app');var open=search(query),main='';if(page==='home')main=home();else if(page==='tasks')main=tasks();else if(page==='knowledge')main=knowledge();else if(page==='projects')main=projects();else if(page==='activity')main=activity();else main=settings();var nav=[['home','⌂','Home'],['tasks','✓','Tasks'],['knowledge','▣','Knowledge'],['projects','◇','Projects'],['activity','◷','Activity'],['settings','⚙','Settings']];a.innerHTML='<div class="shell"><aside class="side"><div class="brand"><div class="mark">PO</div><div><b>Personal OS</b><small>Knowledge Engine · V7.2</small></div></div><div class="nav">'+nav.map(function(n){return '<button class="'+(page===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'&nbsp; '+n[2]+'</button>'}).join('')+'</div><div class="foot"><b>'+KB.length+' knowledge entries</b><span>Built-in library + your private local context. ₹0 core architecture.</span></div></aside><main class="main"><div class="top"><div class="searchWrap"><input id="globalSearch" class="search" value="'+esc(query)+'" placeholder="Search everything…  Ctrl+K" oninput="setQuery(this.value)">'+(query?'<div class="results">'+open.map(function(x){return '<button class="result" onclick="openResult('+JSON.stringify(x.id)+')"><div class="row"><strong>'+esc(x.title)+'</strong><span class="pill">'+esc(x.kind)+'</span></div><div class="muted small">'+esc(x.category)+' · '+esc(x.summary)+'</div></button>'}).join('')+'</div>':'')+'</div><div class="actions"><button class="btn" onclick="newNote()">Capture note</button><button class="btn dark" onclick="newTask()">New task</button></div></div>'+main+'</main></div><div class="mobile">'+nav.slice(0,5).map(function(n){return '<button class="'+(page===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'<br>'+n[2]+'</button>'}).join('')+'<button onclick="go(\'settings\')">•••<br>More</button></div>';var el=document.getElementById('globalSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function setQuery(v){query=v;render()}function setCategory(c){category=c;render()}function done(id){state.tasks=state.tasks.map(function(t){return t.id===id?Object.assign({},t,{status:'Done',completedAt:new Date().toISOString()}):t});state.activity.push({id:uid(),text:'Completed task',time:now(),type:'task'});persist();render()}
function uid(){return Date.now()+Math.floor(Math.random()*10000)}
function openKB(id){var n=KB.filter(function(x){return x.id===id})[0]||state.notes.map(function(n){return{id:'n-'+n.id,title:n.title,category:n.tag,kind:'Personal',summary:n.body.slice(0,140),body:n.body,note:n}}).filter(function(x){return x.id===id})[0];if(!n)return;document.body.insertAdjacentHTML('beforeend','<div class="modal" id="kbModal"><div class="modalIn"><div class="head"><div><div class="eyebrow">'+esc(n.category)+'</div><div class="h2">'+esc(n.title)+'</div></div><button class="btn" onclick="closeModal()">Close</button></div><div class="article">'+esc(n.body)+'</div>'+(n.kind==='Personal'?'<div style="margin-top:18px"><button class="btn dark" onclick="noteToTask('+JSON.stringify(n.title)+')">Create task from note</button></div>':'')+'</div></div>')}
function openResult(id){var x=search(query).filter(function(y){return y.id===id})[0];if(!x)return;if(x.kind==='Built-in'||x.kind==='Personal'){go('knowledge');setTimeout(function(){openKB(id)},0)}else{go('tasks');query=''}}
function closeModal(){var x=document.getElementById('kbModal');if(x)x.remove()}
function noteToTask(title){state.tasks.unshift({id:uid(),title:title,project:'',area:'Personal',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Knowledge'});state.activity.push({id:uid(),text:'Created task from knowledge: '+title,time:now(),type:'knowledge'});persist();closeModal();go('tasks')}
function newTask(){var title=prompt('Task title');if(!title)return;state.tasks.unshift({id:uid(),title:title,project:'',area:'Personal',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'General'});state.activity.push({id:uid(),text:'Created task: '+title,time:now(),type:'task'});persist();go('tasks')}
function newNote(){var title=prompt('Note title');if(!title)return;var body=prompt('Note content')||'';state.notes.unshift({id:uid(),title:title,tag:'General',body:body,project:'',area:'Personal',links:[]});state.activity.push({id:uid(),text:'Created note: '+title,time:now(),type:'knowledge'});persist();go('knowledge')}
function backup(){var b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v7.2-backup.json';a.click();URL.revokeObjectURL(a.href)}
window.go=go;window.setQuery=setQuery;window.setCategory=setCategory;window.done=done;window.openKB=openKB;window.openResult=openResult;window.closeModal=closeModal;window.noteToTask=noteToTask;window.newTask=newTask;window.newNote=newNote;window.backup=backup;
window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();var x=document.getElementById('globalSearch');if(x)x.focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();newTask()}if(e.key==='Escape')closeModal()});
try{render()}catch(err){var box=document.getElementById('errorBox');if(box){box.style.display='block';box.textContent='Personal OS could not start: '+err.message}}persist();
})();</script></body></html>
