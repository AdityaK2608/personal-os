function normalize(raw){const d=clone(seed);if(raw&&typeof raw==='object'){Object.assign(d,raw);d.schemaVersion=V;d.settings={...seed.settings,...(raw.settings||{})};for(const k of ['areas','tasks','projects','notes','activity','trash'])if(!Array.isArray(d[k]))d[k]=clone(seed[k]);d.tasks=d.tasks.map(t=>({...t,id:t.id||uid(),title:String(t.title||'Untitled task'),project:String(t.project||''),area:String(t.area||'Personal'),lane:['NOW','LATER','FOLLOW-UP'].includes(t.lane)?t.lane:'LATER',priority:['High','Medium','Low'].includes(t.priority)?t.priority:'Medium',status:['Todo','In Progress','Blocked','Done'].includes(t.status)?t.status:'Todo',due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'',dependsOn:Array.isArray(t.dependsOn)?t.dependsOn:[],context:String(t.context||'General'),createdAt:t.createdAt||now(),updatedAt:t.updatedAt||now()}));d.projects=d.projects.map(p=>({...p,id:p.id||uid(),name:String(p.name||'Untitled project'),description:String(p.description||''),goal:String(p.goal||''),progress:Math.min(100,Math.max(0,Number(p.progress)||0)),health:['On track','Steady','Needs focus','At risk'].includes(p.health)?p.health:'Steady'}));d.notes=d.notes.map(n=>({...n,id:n.id||uid(),title:String(n.title||'Untitled note'),tag:String(n.tag||'General'),body:String(n.body||''),project:String(n.project||''),area:String(n.area||'Personal'),links:Array.isArray(n.links)?n.links:[]}));d.activity=d.activity.slice(0,260);d.trash=d.trash.slice(0,160)}return d}

function score(t,d){if(t.status==='Done')return-9999;let s={High:60,Medium:35,Low:15}[t.priority]||15;const p=d.projects.find(p=>p.name===t.project);if(p?.health==='At risk')s+=35;if(p?.health==='Needs focus')s+=20;if(t.lane==='NOW')s+=30;if(t.lane==='FOLLOW-UP')s+=18;if(t.status==='Blocked')s-=45;if(t.due){const n=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(n<0)s+=65;else if(n===0)s+=50;else if(n===1)s+=32;else if(n<=3)s+=18}for(const dep of t.dependsOn||[]){const x=d.tasks.find(z=>z.id===dep);if(x&&x.status!=='Done')s-=55}return s}
function related(note,d){const n=new Set(words([note.title,note.tag,note.body,note.project,note.area].join(' ')));const taskHits=d.tasks.map(t=>({t,n:words([t.title,t.project,t.area,t.context].join(' ')).filter(w=>n.has(w)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,4);const projectHits=d.projects.map(p=>({p,n:words([p.name,p.description,p.goal].join(' ')).filter(w=>n.has(w)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,4);return{taskHits,projectHits}}
function searchAll(q,d){const qs=words(q);if(!qs.length)return[];const fields=x=>JSON.stringify(x).toLowerCase();const a=builtIn.filter(x=>qs.some(w=>fields(x).includes(w))).map(x=>({...x,score:qs.reduce((n,w)=>n+(x.title.toLowerCase().includes(w)?5:fields(x).includes(w)?1:0),0)}));const b=[...d.tasks.map(x=>({...x,kind:'Task',category:x.project||x.area,summary:x.context,body:x.title})),...d.projects.map(x=>({...x,kind:'Project',category:x.health,summary:x.description,body:x.goal})),...d.notes.map(x=>({...x,kind:'Personal',category:x.tag,summary:x.body.slice(0,150)}))].filter(x=>qs.some(w=>fields(x).includes(w))).map(x=>({...x,score:qs.reduce((n,w)=>n+(fields(x).includes(w)?2:0),0)}));return[...a,...b].sort((x,y)=>y.score-x.score).slice(0,20)}

function Home(){const age=open.length?Math.round(open.reduce((s,t)=>s+(Date.now()-new Date(t.createdAt||now()).getTime())/86400000,0)/open.length):0;return <><div className="hero card"><div className="eyebrow">Personal Brain · V7 Knowledge Engine</div><div className="h1">{greeting}, Aditya</div><p className="copy">{d.settings.dailyObjective}</p><div className="chips"><span className="pill dark">{open.length} open</span><span className="pill">{builtIn.length} built-in entries</span><span className="pill">{d.notes.length} personal notes</span><span className="pill">{Object.keys(knowledgeTopics).length} domains</span></div></div><div className="grid g4 section"><div className="card stat"><div className="muted small">DO THIS NOW</div><div className="kpi" style={{fontSize:23}}>{top3[0]?.title||'Clear the queue'}</div><div className="copy small">Ranked using lane, priority, deadline, project health and dependencies.</div></div><div className="card stat"><div className="muted small">KNOWLEDGE</div><div className="kpi">{builtIn.length+d.notes.length}</div><div className="copy small">Reference entries + your private notes.</div></div><div className="card stat"><div className="muted small">FOLLOW-UPS</div><div className="kpi">{follow.length}</div><div className="copy small">Waiting or response-driven work.</div></div><div className="card stat"><div className="muted small">OPEN AGE</div><div className="kpi">{age}d</div><div className="copy small">Average age of active work.</div></div></div><div className="grid g2 section"><div className="card"><div className="row"><div><div className="eyebrow">Execution</div><div className="h2">Daily Top 3</div></div><Btn dark onClick={()=>setPage('focus')}>Focus</Btn></div><div className="list section">{top3.map((t,i)=><div className="item" key={t.id}><div className="row"><div><span className="pill">#{i+1}</span> <strong>{t.title}</strong><div className="muted small">{t.project||t.area} · {t.lane} · {t.priority}</div></div><button className="icon" onClick={()=>toggle(t.id)}>Done</button></div></div>)}</div></div><div className="card"><div className="eyebrow">Context</div><div className="h2">Project pulse</div><div className="list section">{risk.map(p=><div className="item" key={p.id}><div className="row"><strong>{p.name}</strong><span className={'pill '+(p.health==='At risk'?'red':'amber')}>{p.health}</span></div><div className="small muted">{p.goal}</div></div>)}{!risk.length&&<div className="empty">No project risk signals.</div>}</div></div></div></>}
function Focus(){return <><div className="head"><div><div className="eyebrow">Execution engine</div><div className="h1">Focus</div><div className="copy">One next action, ranked from your connected workspace.</div></div></div><div className="grid g3">{top3.map((t,i)=><div className={'card '+(i===0?'hero':'')} key={t.id}><span className="pill dark">{i===0?'DO THIS NOW':'TOP '+(i+1)}</span><div className="h2">{t.title}</div><div className="copy small section">{t.project||t.area} · {t.context}</div><div className="chips section"><span className="pill">{t.lane}</span><span className="pill">{t.priority}</span>{t.due&&<span className="pill">Due {t.due}</span>}</div><div className="section"><Btn dark onClick={()=>toggle(t.id)}>Mark {t.status==='Done'?'open':'done'}</Btn></div></div>)}</div></>}
function Tasks(){return <><div className="head"><div><div className="eyebrow">Execution</div><div className="h1">Tasks</div><div className="copy">NOW · LATER · FOLLOW-UP with project and dependency context.</div></div><Btn dark onClick={()=>setModal({type:'task',item:null})}>New task</Btn></div><div className="card"><div className="list">{d.tasks.map(t=><div className="task" key={t.id}><div><div className="tasktitle">{t.title}</div><div className="muted small">{t.project||t.area} · {t.context}</div></div><span className="pill">{t.lane}</span><span className="pill">{t.priority}</span><span className={'pill '+(t.status==='Blocked'?'red':'')}>{t.status}</span><div><button className="icon" onClick={()=>toggle(t.id)}>Done</button> <button className="icon" onClick={()=>setModal({type:'task',item:t})}>Edit</button></div></div>)}</div></div></>}
function Knowledge(){return <><div className="head"><div><div className="eyebrow">Second Brain</div><div className="h1">Knowledge</div><div className="copy">A large built-in technical reference plus your private knowledge, searchable together.</div></div><div><span className="pill dark">{builtIn.length} built-in</span> <Btn dark onClick={()=>setModal({type:'note',item:null})}>New note</Btn></div></div><div className="grid g3"><div className="card"><div className="muted small">TOTAL LIBRARY</div><div className="kpi">{builtIn.length+d.notes.length}</div><div className="copy small">{builtIn.length} reference entries + {d.notes.length} personal.</div></div><div className="card"><div className="muted small">DOMAINS</div><div className="kpi">{Object.keys(knowledgeTopics).length}</div><div className="copy small">Linux, RHEL, Networking, Security, SIEM/SOC, Cloud, DevOps, Programming, Databases, AI/ML and Productivity.</div></div><div className="card"><div className="muted small">GLOBAL SEARCH</div><div className="kpi">⌘K</div><div className="copy small">Search the reference library and your connected workspace at once.</div></div></div><div className="chips section">{cats.map(c=><button key={c} className={'pill '+(cat===c?'dark':'')} onClick={()=>setCat(c)}>{c}</button>)}</div><div className="knowledge-grid section">{knowledge.map(n=><div className="card knowledge-card" key={n.id} onClick={()=>setSel(n)}><div className="row"><span className="pill">{n.category}</span><span className="muted small">{n.kind}</span></div><div className="h2" style={{fontSize:20}}>{n.title}</div><p className="copy small">{n.summary}</p><div className="chips"><span className="pill">{n.tags?.[1]||n.tags?.[0]||n.tag||'reference'}</span></div></div>)}</div></>}
function Projects(){return <><div className="head"><div><div className="eyebrow">Context</div><div className="h1">Projects</div><div className="copy">Goals, tasks and knowledge in one context.</div></div></div><div className="grid g3">{d.projects.map(p=>{const ts=d.tasks.filter(t=>t.project===p.name),done=ts.filter(t=>t.status==='Done').length,pct=ts.length?Math.round(done/ts.length*100):p.progress,ns=d.notes.filter(n=>n.project===p.name);return <div className="card" key={p.id}><div className="row"><span className="pill">{p.health}</span><span className="muted small">{ts.length} tasks · {ns.length} notes</span></div><div className="h2">{p.name}</div><div className="copy small">{p.description}</div><div className="section small"><strong>Goal</strong><div className="muted">{p.goal}</div></div><div className="progress section"><div className="bar" style={{width:pct+'%'}}/></div><div className="row small section"><span>{pct}% pulse</span><span>{ts.filter(t=>t.status!=='Done').length} open</span></div></div>})}</div></>}
function Ask(){const [ask,setAsk]=useState('');const hits=ask?searchAll(ask,d):top3.map(t=>({id:t.id,title:t.title,kind:'Task',category:t.project||t.area,summary:'Recommended next action'}));const answer=ask?`Found ${hits.length} connected records for “${ask}”. Start with the strongest match, then open its project or knowledge context.`:'Ask about work, projects, knowledge, blockers, or priorities. V7 answers from the local workspace and built-in library.';return <><div className="head"><div><div className="eyebrow">Local intelligence</div><div className="h1">Ask My OS</div><div className="copy">A context search layer over your knowledge and execution data.</div></div></div><div className="card hero"><div className="h2">What do you want to know?</div><div className="top" style={{marginTop:18}}><input className="search" value={ask} onChange={e=>setAsk(e.target.value)} placeholder="Try: firewall, RHEL CPU, Prod1, what should I do now…"/></div><div className="quote"><strong>Local answer</strong><span>{answer}</span></div></div><div className="grid g2 section">{hits.slice(0,8).map(x=><div className="card" key={x.id}><div className="row"><span className="pill">{x.kind}</span><span className="muted small">{x.category}</span></div><div className="h2" style={{fontSize:20}}>{x.title}</div><div className="copy small">{x.summary}</div></div>)}</div></>}
function Activity(){return <><div className="head"><div><div className="eyebrow">History</div><div className="h1">Activity</div><div className="copy">A local trail of workspace changes.</div></div></div><div className="card"><div className="timeline">{d.activity.map((e,i)=><div className="event" key={e.id||i}><div className="muted small">{new Date(e.time).toLocaleString()}</div><div><span className="pill">{e.type}</span> <strong>{e.text}</strong></div></div>)}</div></div></>}
function Settings(){return <><div className="head"><div><div className="eyebrow">System</div><div className="h1">Settings</div><div className="copy">Local workspace and Knowledge Engine controls.</div></div></div><div className="grid g2"><div className="card"><div className="h2">Knowledge Engine</div><p className="copy">{builtIn.length} built-in reference entries are bundled into V7 across {Object.keys(knowledgeTopics).length} domains. They remain available without an API or backend.</p></div><div className="card"><div className="h2">Workspace backup</div><p className="copy">Export your private workspace as JSON. Built-in knowledge is reconstructed by the app and does not need to be copied into your backup.</p><div className="chips"><Btn dark onClick={exportData}>Export backup</Btn><Btn danger onClick={()=>{localStorage.removeItem(KEY);setD(clone(seed));log('Workspace reset to V7 defaults','system')}}>Reset workspace</Btn></div></div></div><div className="card section"><div className="h2">Zero-cost architecture</div><p className="copy">Static GitHub Pages app · React via CDN · browser-local persistence · bundled knowledge corpus · deterministic local search/scoring · no server · no mandatory API key.</p></div></>}
function Btn({children,onClick,dark=false,danger=false}){return <button className={'btn '+(dark?'dark ':'')+(danger?'danger':'')} onClick={onClick}>{children}</button>}
function Modal(){if(!modal)return null;if(modal.type==='task'){const t=modal.item||{title:'',project:'',area:'Personal',lane:'NOW',priority:'Medium',status:'Todo',due:'',dependsOn:[],context:'General'};return <div className="modal"><div className="modalin"><div className="modalhead"><div><div className="eyebrow">Task</div><div className="h2">{modal.item?'Edit task':'New task'}</div></div><button className="icon" onClick={()=>setModal(null)}>Close</button></div><form className="form" onSubmit={e=>{e.preventDefault();const f=new FormData(e.currentTarget);saveTask({...t,title:String(f.get('title')),project:String(f.get('project')),area:String(f.get('area')),lane:String(f.get('lane')),priority:String(f.get('priority')),status:String(f.get('status')),due:String(f.get('due')),context:String(f.get('context')),dependsOn:[]})}}><div className="field"><label>Title</label><input className="input" name="title" defaultValue={t.title} required/></div><div className="field"><label>Project</label><input className="input" name="project" defaultValue={t.project}/></div><div className="field"><label>Area</label><select className="select" name="area" defaultValue={t.area}>{d.areas.map(a=><option key={a}>{a}</option>)}</select></div><div className="field"><label>Lane</label><select className="select" name="lane" defaultValue={t.lane}><option>NOW</option><option>LATER</option><option>FOLLOW-UP</option></select></div><div className="field"><label>Priority</label><select className="select" name="priority" defaultValue={t.priority}><option>High</option><option>Medium</option><option>Low</option></select></div><div className="field"><label>Status</label><select className="select" name="status" defaultValue={t.status}><option>Todo</option><option>In Progress</option><option>Blocked</option><option>Done</option></select></div><div className="field"><label>Due</label><input className="input" type="date" name="due" defaultValue={t.due}/></div><div className="field"><label>Context</label><input className="input" name="context" defaultValue={t.context}/></div><div className="field" style={{gridColumn:'1/-1'}}><Btn dark>{modal.item?'Save changes':'Create task'}</Btn></div></form></div></div>}
const n=modal.item||{title:'',tag:'General',body:'',project:'',area:'Personal',links:[]};return <div className="modal"><div className="modalin"><div className="modalhead"><div><div className="eyebrow">Private knowledge</div><div className="h2">{modal.item?'Edit note':'New note'}</div></div><button className="icon" onClick={()=>setModal(null)}>Close</button></div><form className="form" onSubmit={e=>{e.preventDefault();const f=new FormData(e.currentTarget);saveNote({...n,title:String(f.get('title')),tag:String(f.get('tag')),body:String(f.get('body')),project:String(f.get('project')),area:String(f.get('area'))})}}><div className="field"><label>Title</label><input className="input" name="title" defaultValue={n.title} required/></div><div className="field"><label>Tag</label><input className="input" name="tag" defaultValue={n.tag}/></div><div className="field"><label>Project</label><input className="input" name="project" defaultValue={n.project}/></div><div className="field"><label>Area</label><select className="select" name="area" defaultValue={n.area}>{d.areas.map(a=><option key={a}>{a}</option>)}</select></div><div className="field" style={{gridColumn:'1/-1'}}><label>Body</label><textarea className="area" name="body" defaultValue={n.body}/></div><div className="field" style={{gridColumn:'1/-1'}}><Btn dark>{modal.item?'Save note':'Create note'}</Btn></div></form></div></div>}
function NoteView(){if(!sel)return null;const personal=sel.kind==='Personal';const rel=personal?related(sel,d):{taskHits:[],projectHits:[]};return <div className="modal"><div className="modalin"><div className="modalhead"><div><div className="eyebrow">{sel.category}</div><div className="h2">{sel.title}</div><div className="chips"><span className="pill">{sel.kind}</span>{(sel.tags||[]).slice(0,3).map(x=><span className="pill" key={x}>{x}</span>)}</div></div><button className="icon" onClick={()=>setSel(null)}>Close</button></div><div className="article">{sel.body}</div>{personal&&<><div className="grid g2 section"><div className="card"><div className="eyebrow">Related tasks</div>{rel.taskHits.length?rel.taskHits.map(x=><div className="item" key={x.t.id}><strong>{x.t.title}</strong><div className="muted small">{x.t.project||x.t.area}</div></div>):<div className="empty">No strong matches.</div>}</div><div className="card"><div className="eyebrow">Related projects</div>{rel.projectHits.length?rel.projectHits.map(x=><div className="item" key={x.p.id}><strong>{x.p.name}</strong><div className="muted small">{x.p.goal}</div></div>):<div className="empty">No strong matches.</div>}</div></div><div className="section"><Btn dark onClick={()=>fromNote(sel)}>Create task from this knowledge</Btn> <Btn onClick={()=>{setModal({type:'note',item:sel});setSel(null)}}>Edit note</Btn></div></>}</div></div>}
const nav=[['home','⌂','Home'],['focus','◉','Focus'],['tasks','✓','Tasks'],['knowledge','▣','Knowledge'],['projects','◇','Projects'],['ask','⌕','Ask OS'],['activity','◷','Activity'],['settings','⚙','Settings']];
return <div className="app"><div className="shell"><aside className="side"><div className="brand"><div className="mark">PO</div><div><b>Personal OS</b><small>Knowledge Engine · V7</small></div></div><div className="nav">{nav.map(([k,ic,l])=><button className={page===k?'on':''} key={k} onClick={()=>setPage(k)}>{ic}&nbsp; {l}</button>)}</div><div className="foot"><b>{builtIn.length} knowledge entries</b><span>Built-in library + your private local context. ₹0 core architecture.</span></div></aside><main className="main"><div className="top"><div className="searchwrap"><input id="global-search" className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search everything…  Ctrl+K"/>{q&&<div className="results">{search.map(x=><button className="res" key={x.id} onClick={()=>{if(x.kind==='Built-in'||x.kind==='Personal'){setPage('knowledge');setSel(x)}else if(x.kind==='Task')setPage('tasks');else setPage('projects')}}><div className="row"><strong>{x.title}</strong><span className="pill">{x.kind}</span></div><div className="muted small">{x.category} · {x.summary}</div></button>)}</div>}</div><div className="top-actions"><Btn onClick={()=>setModal({type:'note',item:null})}>Capture note</Btn><Btn dark onClick={()=>setModal({type:'task',item:null})}>New task</Btn></div></div>{page==='home'?<Home/>:page==='focus'?<Focus/>:page==='tasks'?<Tasks/>:page==='knowledge'?<Knowledge/>:page==='projects'?<Projects/>:page==='ask'?<Ask/>:page==='activity'?<Activity/>:<Settings/>}<div className="mobile">{nav.slice(0,5).map(([k,ic,l])=><button key={k} className={page===k?'on':''} onClick={()=>setPage(k)}>{ic}<br/>{l}</button>)}<button className={page==='settings'?'on':''} onClick={()=>setPage('settings')}>•••<br/>More</button></div><Modal/><NoteView/></main></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
