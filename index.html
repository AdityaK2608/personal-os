const Badge=({children,tone=''})=><span className={'pill '+tone}>{children}</span>;
const Row=({t})=><div className="task"><div><div className="tasktitle">{t.title}</div><div className="small muted">{t.project||t.area} · {t.context}</div></div><Badge tone={t.priority==='High'?'red':t.priority==='Medium'?'amber':''}>{t.priority}</Badge><Badge>{t.lane}</Badge><div className="small muted">{t.due||'No date'}</div><div className="split"><button className="icon" onClick={()=>toggle(t.id)}>✓</button><button className="icon" onClick={()=>setModal({type:'task',data:t})}>Edit</button></div></div>;
function Home(){return <><div className="head"><div><div className="eyebrow">{new Intl.DateTimeFormat('en-IN',{weekday:'long',month:'long',day:'numeric'}).format(new Date())}</div><div className="h1">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya.</div><div className="copy">Your personal operating picture, not another to-do list.</div></div></div><div className="grid g4"><div className="card"><div className="eyebrow">Open</div><div className="kpi">{open.length}</div><div className="small muted">active work</div></div><div className="card"><div className="eyebrow">Today</div><div className="kpi">{todayOpen.length}</div><div className="small muted">due today</div></div><div className="card"><div className="eyebrow">Blocked</div><div className="kpi">{blocked.length}</div><div className="small muted">waiting on dependencies</div></div><div className="card"><div className="eyebrow">Complete</div><div className="kpi">{completion}%</div><div className="small muted">workspace completion</div></div></div><div className="section grid g2"><div className="card hero"><div className="eyebrow">Today's objective</div><div className="h2">{d.settings.dailyObjective}</div><div className="section"><Badge tone="dark">Do this now</Badge></div><div className="section">{top3[0]?<Row t={top3[0]}/>:<div className="quote"><strong>Queue is clear</strong><span>No open work needs immediate attention.</span></div>}</div></div><div className="card"><div className="row"><div><div className="eyebrow">AI COO</div><div className="h2">Operating brief</div></div><button className="btn" onClick={()=>setPage('coo')}>Open</button></div><div className="section list">{risk.slice(0,3).map(p=><div className="quote" key={p.id}><strong>{p.name}</strong><span>{p.health} · {p.progress}% baseline · {d.tasks.filter(t=>t.project===p.name&&t.status!=='Done').length} open tasks</span></div>)}{blocked.length?<div className="quote"><strong>{blocked.length} dependency risk{blocked.length>1?'s':''}</strong><span>Resolve blockers before expanding the NOW queue.</span></div>:<div className="quote"><strong>No critical blockers</strong><span>Keep NOW small and use LATER for non-urgent work.</span></div>}</div></div></div><div className="section grid g2"><div className="card"><div className="row"><div><div className="eyebrow">Daily Top 3</div><div className="h2">Execution queue</div></div><button className="btn" onClick={()=>setPage('focus')}>Focus</button></div><div className="section list">{top3.map((t,i)=><div className="item" key={t.id}><div className="row"><div><Badge tone="dark">{i+1}</Badge> <b style={{marginLeft:6}}>{t.title}</b></div><Badge>{t.lane}</Badge></div><div className="small muted" style={{marginTop:7}}>{t.project||t.area} · {t.due||'No date'} · score {score(t,d)}</div></div>)}</div></div><div className="card"><div className="eyebrow">Second brain</div><div className="h2">Context on hand</div><div className="section grid g3"><div className="item"><div className="eyebrow">Areas</div><div className="kpi">{d.areas.length}</div></div><div className="item"><div className="eyebrow">Projects</div><div className="kpi">{d.projects.length}</div></div><div className="item"><div className="eyebrow">Notes</div><div className="kpi">{d.notes.length}</div></div></div><div className="section"><button className="btn dark" onClick={()=>setModal({type:'note',data:null})}>Capture knowledge</button></div></div></div></>}
function Focus(){return <><div className="head"><div><div className="eyebrow">Execution mode</div><div className="h1">Focus.</div><div className="copy">One high-leverage action at a time.</div></div></div><div className="grid g2"><div className="card hero"><div className="eyebrow">Do this now</div>{top3[0]?<><div className="h2">{top3[0].title}</div><div className="split section"><Badge tone="dark">{top3[0].lane}</Badge><Badge tone={top3[0].priority==='High'?'red':top3[0].priority==='Medium'?'amber':''}>{top3[0].priority}</Badge></div><p className="copy">{top3[0].status==='Blocked'?'Blocked by unfinished work.':top3[0].due===day()?'Due today. Close this loop before adding more work.':'Highest local execution score based on urgency, project health, lane, age and dependencies.'}</p><div className="split"><button className="btn dark" onClick={()=>toggle(top3[0].id)}>Complete</button><button className="btn" onClick={()=>setModal({type:'task',data:top3[0]})}>Edit</button></div></>:<div className="quote"><strong>Nothing urgent</strong><span>Your active queue is clear.</span></div>}</div><div className="card"><div className="eyebrow">Dependency graph</div><div className="h2">What is waiting?</div><div className="section list">{blocked.length?blocked.map(t=><div className="item" key={t.id}><b>{t.title}</b><div className="small muted" style={{marginTop:5}}>{(t.dependsOn||[]).map(id=>d.tasks.find(x=>x.id===id)?.title||'Unknown dependency').join(' · ')||'Marked blocked manually'}</div></div>):<div className="quote"><strong>No blockers</strong><span>Dependencies are currently clear.</span></div>}</div></div></div><div className="section card"><div className="row"><div><div className="eyebrow">Task lanes</div><div className="h2">NOW · LATER · FOLLOW-UP</div></div><button className="btn" onClick={()=>setModal({type:'task',data:null})}>Quick add</button></div><div className="section grid g3">{['NOW','LATER','FOLLOW-UP'].map(l=><div key={l}><div className="eyebrow">{l}</div><div className="section list">{open.filter(t=>t.lane===l).map(t=><div className="item" key={t.id}><div className="row"><b>{t.title}</b><button className="icon" onClick={()=>setModal({type:'task',data:t})}>Edit</button></div><div className="small muted" style={{marginTop:5}}>{t.project||t.area} · {t.priority}</div></div>)}</div></div>)}</div></div></>}
function Tasks(){const [lane,setLane]=useState('ALL');const list=open.filter(t=>lane==='ALL'||t.lane===lane);return <><div className="head"><div><div className="eyebrow">Work queue</div><div className="h1">Tasks.</div><div className="copy">Everything captured. Only the important work rises to NOW.</div></div><button className="btn dark" onClick={()=>setModal({type:'task',data:null})}>New task</button></div><div className="card"><div className="split"><button className={'btn '+(lane==='ALL'?'dark':'')} onClick={()=>setLane('ALL')}>All</button>{['NOW','LATER','FOLLOW-UP'].map(x=><button key={x} className={'btn '+(lane===x?'dark':'')} onClick={()=>setLane(x)}>{x}</button>)}</div><div className="section">{list.length?list.map(t=><Row key={t.id} t={t}/>):<div className="quote"><strong>No tasks here</strong><span>Move another task into this lane or capture something new.</span></div>}</div></div></>}
function Projects(){return <><div className="head"><div><div className="eyebrow">Goals & contexts</div><div className="h1">Projects.</div><div className="copy">Projects now connect goals, execution and knowledge.</div></div><button className="btn dark" onClick={()=>setModal({type:'project',data:null})}>New project</button></div><div className="grid g2">{d.projects.map(p=>{const ts=d.tasks.filter(t=>t.project===p.name),ns=d.notes.filter(n=>n.project===p.name),doneP=ts.length?Math.round(ts.filter(t=>t.status==='Done').length/ts.length*100):0;return <div className="card" key={p.id}><div className="row"><div><div className="h2">{p.name}</div><div className="small muted">{p.goal||p.description}</div></div><Badge tone={p.health==='At risk'?'red':p.health==='Needs focus'?'amber':'green'}>{p.health}</Badge></div><div className="section small muted">Baseline {p.progress}% · task completion {doneP}%</div><div className="progress section"><div className="bar" style={{width:p.progress+'%'}}/></div><div className="section grid g3"><div className="item"><div className="eyebrow">Open</div><div className="kpi">{ts.filter(t=>t.status!=='Done').length}</div></div><div className="item"><div className="eyebrow">Done</div><div className="kpi">{ts.filter(t=>t.status==='Done').length}</div></div><div className="item"><div className="eyebrow">Notes</div><div className="kpi">{ns.length}</div></div></div><div className="section split"><button className="btn" onClick={()=>setModal({type:'project',data:p})}>Edit</button><button className="btn" onClick={()=>{setQ(p.name);setPage('knowledge')}}>Find context</button></div></div>})}</div></>}
function Knowledge(){return <><div className="head"><div><div className="eyebrow">Second brain</div><div className="h1">Knowledge.</div><div className="copy">Networked notes that can become action.</div></div><button className="btn dark" onClick={()=>setModal({type:'note',data:null})}>New note</button></div><div className="grid g2">{d.notes.map(n=>{const rs=related(n,d);return <div className="card" key={n.id}><div className="row"><div><div className="h2">{n.title}</div><div className="small muted">{n.tag} · {n.area}{n.project?' · '+n.project:''}</div></div><Badge>{n.tag}</Badge></div><p className="copy">{n.body}</p>{rs.length>0&&<><div className="eyebrow section">Related execution</div><div className="section list">{rs.slice(0,3).map(t=><div className="item" key={t.id}><div className="row"><b>{t.title}</b><button className="icon" onClick={()=>setModal({type:'task',data:t})}>Open</button></div></div>)}</div></>}<div className="section split"><button className="btn dark" onClick={()=>{const t={title:n.title,project:n.project,area:n.area,lane:'NOW',priority:'Medium',status:'Todo',due:'',dependsOn:[],context:'Knowledge'};saveTask(t)}}>→ Task</button><button className="btn" onClick={()=>setModal({type:'note',data:n})}>Edit</button><button className="btn" onClick={()=>removeNote(n.id)}>Delete</button></div></div>})}</div></>}
function Areas(){return <><div className="head"><div><div className="eyebrow">Persistent context</div><div className="h1">Areas.</div><div className="copy">Responsibilities that cut across projects.</div></div><button className="btn" onClick={()=>setD(x=>({...x,areas:[...x.areas,'New Area'],activity:[act('Created area: New Area','system'),...x.activity]}))}>Add area</button></div><div className="grid g4">{d.areas.map(a=><div className="card" key={a}><div className="h2">{a}</div><div className="small muted">Persistent responsibility</div><div className="section grid g2"><div className="item"><div className="eyebrow">Tasks</div><div className="kpi">{d.tasks.filter(t=>t.area===a&&t.status!=='Done').length}</div></div><div className="item"><div className="eyebrow">Notes</div><div className="kpi">{d.notes.filter(n=>n.area===a).length}</div></div></div></div>)}</div></>}
function Insights(){const ages=open.length?Math.round(open.reduce((n,t)=>n+Math.max(0,(Date.now()-new Date(t.createdAt||Date.now()))/86400000),0)/open.length):0;return <><div className="head"><div><div className="eyebrow">Operating telemetry</div><div className="h1">Insights.</div><div className="copy">Local signals from your own operating system.</div></div></div><div className="grid g4"><div className="card"><div className="eyebrow">Completion</div><div className="kpi">{completion}%</div></div><div className="card"><div className="eyebrow">Open aging</div><div className="kpi">{ages}d</div></div><div className="card"><div className="eyebrow">High priority</div><div className="kpi">{open.filter(t=>t.priority==='High').length}</div></div><div className="card"><div className="eyebrow">Risk projects</div><div className="kpi">{risk.length}</div></div></div><div className="section grid g2"><div className="card"><div className="eyebrow">Lane mix</div><div className="h2">Where attention lives</div><div className="section list">{['NOW','LATER','FOLLOW-UP'].map(l=><div className="item" key={l}><div className="row"><b>{l}</b><span>{open.filter(t=>t.lane===l).length}</span></div><div className="progress section"><div className="bar" style={{width:(open.length?open.filter(t=>t.lane===l).length/open.length*100:0)+'%'}}/></div></div>)}</div></div><div className="card"><div className="eyebrow">Project pulse</div><div className="h2">Movement</div><div className="section list">{d.projects.map(p=><div className="item" key={p.id}><div className="row"><b>{p.name}</b><Badge tone={p.health==='At risk'?'red':p.health==='Needs focus'?'amber':'green'}>{p.health}</Badge></div><div className="small muted" style={{marginTop:6}}>{d.tasks.filter(t=>t.project===p.name&&t.status!=='Done').length} open tasks · {d.notes.filter(n=>n.project===p.name).length} linked notes</div></div>)}</div></div></div></>}
function Activity(){const [f,setF]=useState('ALL');const xs=d.activity.filter(a=>f==='ALL'||a.type===f);return <><div className="head"><div><div className="eyebrow">History</div><div className="h1">Activity.</div><div className="copy">Meaningful changes across the workspace.</div></div></div><div className="card"><div className="split">{['ALL','task','project','knowledge','system'].map(x=><button key={x} className={'btn '+(f===x?'dark':'')} onClick={()=>setF(x)}>{x}</button>)}</div><div className="timeline section">{xs.map((a,i)=><div className="event" key={a.id||i}><div className="small muted">{new Date(a.time).toLocaleString('en-IN',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div><div><b>{a.text}</b><div className="small muted" style={{marginTop:3}}>{a.type}</div></div></div>)}</div></div></>}
function COO(){const r=[];if(blocked.length)r.push(['Clear blockers first',`${blocked.length} open item${blocked.length>1?'s are':' is'} blocked or waiting on dependencies. Resolve these before expanding NOW.`]);if(risk.length)r.push(['Review project health',`${risk.map(p=>p.name).join(', ')} need attention. Related work is automatically elevated.`]);if(todayOpen.length)r.push(['Close today',`${todayOpen.length} item${todayOpen.length>1?'s are':' is'} due today. Treat today’s deadlines as the first decision gate.`]);if(!r.length)r.push(['Protect momentum','No critical local risk is detected. Keep NOW small and use LATER for non-urgent work.']);return <><div className="head"><div><div className="eyebrow">Local intelligence</div><div className="h1">AI COO.</div><div className="copy">Deterministic reasoning over your private workspace. No external AI key required.</div></div></div><div className="grid g2">{r.map((x,i)=><div className="card hero" key={i}><div className="eyebrow">Recommendation {i+1}</div><div className="h2">{x[0]}</div><p className="copy">{x[1]}</p><button className="btn dark" onClick={()=>setPage('focus')}>Take action</button></div>)}</div><div className="section card"><div className="eyebrow">Ask My OS</div><div className="h2">Search your context</div><div className="copy">Use the global search for questions such as “what is blocking Prod1?”, “firewall investigation”, or “what do I know about RHEL?”.</div><div className="section split"><button className="btn dark" onClick={()=>document.getElementById('global-search')?.focus()}>Search context</button><button className="btn" onClick={()=>setPage('knowledge')}>Open knowledge</button></div></div></>}
function Settings(){return <><div className="head"><div><div className="eyebrow">Control center</div><div className="h1">Settings.</div><div className="copy">Workspace identity, storage and recovery.</div></div></div><div className="grid g2"><div className="card"><div className="h2">Workspace</div><div className="section form"><div className="field"><label>Name</label><input className="input" value={d.settings.workspaceName} onChange={e=>setD(x=>({...x,settings:{...x.settings,workspaceName:e.target.value}}))}/></div><div className="field"><label>Schema</label><input className="input" value={'V'+V} disabled/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Daily objective</label><textarea className="area" value={d.settings.dailyObjective} onChange={e=>setD(x=>({...x,settings:{...x.settings,dailyObjective:e.target.value}}))}/></div></div></div><div className="card"><div className="h2">Data & recovery</div><div className="section split"><button className="btn dark" onClick={exportJSON}>Export JSON</button><button className="btn" onClick={importJSON}>Import JSON</button><button className="btn" onClick={async()=>{await addSnap(d,'Manual snapshot');setSnapList(await snaps())}}>Create snapshot</button><button className="btn danger" onClick={freshReset}>Reset demo</button></div><div className="section small muted">IndexedDB primary · localStorage fallback · no server sync.</div></div></div><div className="section card"><div className="row"><div><div className="eyebrow">Recovery</div><div className="h2">Snapshots</div></div><Badge>{snapList.length}</Badge></div><div className="section list">{snapList.length?snapList.map(s=><div className="item" key={s.id}><div className="row"><div><b>{s.label}</b><div className="small muted">{new Date(s.time).toLocaleString('en-IN')}</div></div><button className="btn" onClick={()=>{setD(normalize(s.data));alert('Snapshot restored.')}}>Restore</button></div></div>):<div className="quote"><strong>No snapshots yet</strong><span>Create one before a major change or import.</span></div>}</div></div><div className="section card"><div className="h2">Recovery bin</div><div className="small muted">Deleted tasks and notes remain locally recoverable.</div><div className="section list">{d.trash.length?d.trash.slice(0,12).map((x,i)=><div className="item" key={i}><div className="row"><div><b>{x.data?.title||'Deleted record'}</b><div className="small muted">{x.type}</div></div><button className="btn" onClick={()=>recover(x)}>Recover</button></div></div>):<div className="quote"><strong>Recovery bin is empty</strong><span>Deleted records will appear here.</span></div>}</div></div></>}
function Modal(){if(!modal)return null;const type=modal.type;return <div className="modal" onMouseDown={e=>e.target===e.currentTarget&&setModal(null)}><div className="modalin"><div className="modalhead"><div><div className="eyebrow">Editor</div><div className="h2">{type==='task'?'Task':type==='project'?'Project':'Knowledge'}</div></div><button className="btn" onClick={()=>setModal(null)}>Close</button></div>{type==='task'?<TaskForm data={modal.data}/>:type==='project'?<ProjectForm data={modal.data}/>:<NoteForm data={modal.data}/>}</div></div>}
function TaskForm({data}){const [x,setX]=useState(data||{title:'',project:'',area:d.areas[0]||'Personal',lane:'LATER',priority:'Medium',status:'Todo',due:'',dependsOn:[],context:'General'});return <form onSubmit={e=>{e.preventDefault();saveTask(x);setModal(null)}} className="form"><div className="field" style={{gridColumn:'1/-1'}}><label>Title</label><input className="input" required value={x.title} onChange={e=>setX({...x,title:e.target.value})}/></div><div className="field"><label>Lane</label><select className="select" value={x.lane} onChange={e=>setX({...x,lane:e.target.value})}>{['NOW','LATER','FOLLOW-UP'].map(v=><option key={v}>{v}</option>)}</select></div><div className="field"><label>Priority</label><select className="select" value={x.priority} onChange={e=>setX({...x,priority:e.target.value})}>{['High','Medium','Low'].map(v=><option key={v}>{v}</option>)}</select></div><div className="field"><label>Status</label><select className="select" value={x.status} onChange={e=>setX({...x,status:e.target.value})}>{['Todo','In Progress','Blocked','Done'].map(v=><option key={v}>{v}</option>)}</select></div><div className="field"><label>Due</label><input className="input" type="date" value={x.due||''} onChange={e=>setX({...x,due:e.target.value})}/></div><div className="field"><label>Project</label><select className="select" value={x.project||''} onChange={e=>setX({...x,project:e.target.value})}><option value="">No project</option>{d.projects.map(p=><option key={p.id}>{p.name}</option>)}</select></div><div className="field"><label>Area</label><select className="select" value={x.area} onChange={e=>setX({...x,area:e.target.value})}>{d.areas.map(a=><option key={a}>{a}</option>)}</select></div><div className="field"><label>Context</label><input className="input" value={x.context||''} onChange={e=>setX({...x,context:e.target.value})}/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Dependencies</label><select multiple className="select" style={{minHeight:105}} value={(x.dependsOn||[]).map(String)} onChange={e=>setX({...x,dependsOn:Array.from(e.target.selectedOptions).map(o=>Number(o.value))})}>{d.tasks.filter(t=>t.id!==x.id&&t.status!=='Done').map(t=><option key={t.id} value={t.id}>{t.title}</option>)}</select></div><div style={{gridColumn:'1/-1'}} className="split"><button className="btn dark">Save task</button>{x.id&&<button className="btn danger" type="button" onClick={()=>{removeTask(x.id);setModal(null)}}>Delete</button>}</div></form>}
function ProjectForm({data}){const [x,setX]=useState(data||{name:'',description:'',goal:'',progress:0,health:'Steady'});return <form onSubmit={e=>{e.preventDefault();saveProject(x);setModal(null)}} className="form"><div className="field"><label>Name</label><input className="input" required value={x.name} onChange={e=>setX({...x,name:e.target.value})}/></div><div className="field"><label>Health</label><select className="select" value={x.health} onChange={e=>setX({...x,health:e.target.value})}>{['On track','Steady','Needs focus','At risk'].map(v=><option key={v}>{v}</option>)}</select></div><div className="field"><label>Progress</label><input className="input" type="number" min="0" max="100" value={x.progress} onChange={e=>setX({...x,progress:e.target.value})}/></div><div className="field"><label>Goal</label><input className="input" value={x.goal||''} onChange={e=>setX({...x,goal:e.target.value})}/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Description</label><textarea className="area" value={x.description} onChange={e=>setX({...x,description:e.target.value})}/></div><div style={{gridColumn:'1/-1'}}><button className="btn dark">Save project</button></div></form>}
function NoteForm({data}){const [x,setX]=useState(data||{title:'',tag:'General',body:'',project:'',area:d.areas[0]||'Personal',links:[]});return <form onSubmit={e=>{e.preventDefault();saveNote(x);setModal(null)}} className="form"><div className="field" style={{gridColumn:'1/-1'}}><label>Title</label><input className="input" required value={x.title} onChange={e=>setX({...x,title:e.target.value})}/></div><div className="field"><label>Tag</label><input className="input" value={x.tag} onChange={e=>setX({...x,tag:e.target.value})}/></div><div className="field"><label>Area</label><select className="select" value={x.area} onChange={e=>setX({...x,area:e.target.value})}>{d.areas.map(a=><option key={a}>{a}</option>)}</select></div><div className="field"><label>Project</label><select className="select" value={x.project||''} onChange={e=>setX({...x,project:e.target.value})}><option value="">No project</option>{d.projects.map(p=><option key={p.id}>{p.name}</option>)}</select></div><div className="field" style={{gridColumn:'1/-1'}}><label>Body</label><textarea className="area" required value={x.body} onChange={e=>setX({...x,body:e.target.value})}/></div><div style={{gridColumn:'1/-1'}}><button className="btn dark">Save note</button></div></form>}
function Page(){switch(page){case'focus':return <Focus/>;case'tasks':return <Tasks/>;case'projects':return <Projects/>;case'knowledge':return <Knowledge/>;case'areas':return <Areas/>;case'insights':return <Insights/>;case'activity':return <Activity/>;case'coo':return <COO/>;case'settings':return <Settings/>;default:return <Home/>}}
return <div className="app"><div className="shell"><Nav/><main className="main"><div className="top"><div className="searchwrap"><input id="global-search" className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search your second brain…  Ctrl/⌘ K"/>{q&&<div className="results">{search(q,d).length?search(q,d).map((x,i)=><button key={i} className="res" onClick={()=>{setPage(x.type==='Task'?'tasks':x.type==='Project'?'projects':'knowledge');setQ('')}}><b>{x.title||x.name}</b><div className="small muted">{x.type} · {x.project||x.tag||x.health||x.area}</div></button>):<div className="small muted" style={{padding:10}}>No matching context.</div>}</div>}</div><div className="top-actions"><button className="btn" onClick={()=>setModal({type:'note',data:null})}>Capture</button><button className="btn dark" onClick={()=>setModal({type:'task',data:null})}>+ Task</button></div></div><Page/></main></div><Modal/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
