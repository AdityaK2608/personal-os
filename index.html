function normalize(raw){const d=clone(seed);if(!raw||typeof raw!=='object')return d;d.schemaVersion=VERSION;d.createdAt=raw.createdAt||d.createdAt;d.updatedAt=now();d.settings={...d.settings,...(raw.settings||{})};for(const k of ['tasks','projects','notes','activity','trash'])if(Array.isArray(raw[k]))d[k]=raw[k];d.tasks=d.tasks.map(x=>({...x,id:x.id||uid(),title:String(x.title||'Untitled task'),project:String(x.project||''),priority:['High','Medium','Low'].includes(x.priority)?x.priority:'Medium',status:['Todo','In Progress','Done','Blocked'].includes(x.status)?x.status:'Todo',due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||'')?x.due:'',dependsOn:Array.isArray(x.dependsOn)?x.dependsOn:[],createdAt:x.createdAt||now(),updatedAt:x.updatedAt||now()}));d.projects=d.projects.map(x=>({...x,id:x.id||uid(),name:String(x.name||'Untitled project'),description:String(x.description||''),progress:Math.min(100,Math.max(0,Number(x.progress)||0)),health:['On track','Needs focus','At risk','Steady'].includes(x.health)?x.health:'Steady'}));d.notes=d.notes.map(x=>({...x,id:x.id||uid(),title:String(x.title||'Untitled note'),tag:String(x.tag||'General'),body:String(x.body||'')}));d.activity=d.activity.slice(0,180);return d}
function legacyLoad(){try{const v5=JSON.parse(localStorage.getItem(KEY));if(v5)return normalize(v5);for(const k of ['personal_os_v4','personal_os_v3','personal_os_v2','personal_os_v1']){const x=JSON.parse(localStorage.getItem(k));if(x){const d=normalize(x);d.activity=[{id:uid(),text:'Workspace migrated into V5',time:now(),type:'system'},...d.activity];return d}}}catch(e){}return clone(seed)}

async function dbGet(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).get(id);rq.onsuccess=()=>res(rq.result?.value||null);rq.onerror=()=>rej(rq.error)})}
async function dbPut(value){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:'current',value});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function dbSnap(value){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(SNAP,'readwrite'),s=tx.objectStore(SNAP);s.put({id:uid(),createdAt:now(),value});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function dbSnaps(){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(SNAP,'readonly'),idx=tx.objectStore(SNAP).index('createdAt');const rq=idx.getAll();rq.onsuccess=()=>res((rq.result||[]).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8));rq.onerror=()=>rej(rq.error)})}catch(e){return[]}}
const saveFallback=d=>localStorage.setItem(KEY,JSON.stringify(d));
async function loadWorkspace(){try{const v=await dbGet('current');if(v)return normalize(v)}catch(e){}const legacy=legacyLoad();try{await dbPut(legacy);await dbSnap(legacy)}catch(e){}saveFallback(legacy);return legacy}
const words=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(Boolean);
const taskDone=t=>t.status==='Done';
function dependencyMap(tasks){const m=new Map(tasks.map(t=>[t.id,t]));return t=>(t.dependsOn||[]).map(id=>m.get(id)).filter(Boolean)}
function scoreTask(t,projects,tasks){if(taskDone(t))return-9999;let s={High:65,Medium:38,Low:16}[t.priority]||16;const p=projects.find(x=>x.name===t.project);if(p?.health==='At risk')s+=40;if(p?.health==='Needs focus')s+=24;const deps=dependencyMap(tasks)(t);if(deps.some(x=>!taskDone(x))){s-=18}else if((t.dependsOn||[]).length){s+=10}if(/^\d{4}-\d{2}-\d{2}$/.test(t.due)){const days=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(days<0)s+=65;else if(days===0)s+=52;else if(days===1)s+=36;else if(days<=3)s+=18}const age=Math.max(0,Math.floor((Date.now()-new Date(t.createdAt||Date.now()))/86400000));s+=Math.min(25,age*3);if(t.status==='Blocked')s-=28;return s}
function taskReason(t,projects,tasks){const p=projects.find(x=>x.name===t.project),r=[];if(t.priority==='High')r.push('high priority');if(/^\d{4}-\d{2}-\d{2}$/.test(t.due)){const d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(d<0)r.push('overdue');else if(d===0)r.push('due today');else if(d<=2)r.push('deadline is close')}if(p?.health==='At risk')r.push('project is at risk');else if(p?.health==='Needs focus')r.push('project needs focus');const deps=dependencyMap(tasks)(t);if(deps.some(x=>!taskDone(x)))r.push('blocked by dependencies');return r.length?r.join(', '):'highest available leverage'}
function searchAll(q,d){const ws=words(q);if(!ws.length)return[];const rows=[...d.tasks.map(x=>({...x,type:'Task',text:[x.title,x.project,x.priority,x.status].join(' ')})),...d.projects.map(x=>({...x,type:'Project',text:[x.name,x.description,x.health].join(' ')})),...d.notes.map(x=>({...x,type:'Knowledge',text:[x.title,x.tag,x.body].join(' ')}))];return rows.map(x=>({...x,score:ws.reduce((n,w)=>n+(words(x.text).includes(w)?10:0)+(x.text.toLowerCase().includes(w)?3:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8)}
function related(note,d){const nw=new Set(words([note.title,note.tag,note.body].join(' ')));const items=[...d.tasks.map(x=>({...x,type:'Task',text:x.title+' '+x.project})),...d.projects.map(x=>({...x,type:'Project',text:x.name+' '+x.description}))].map(x=>({...x,score:words(x.text).reduce((n,w)=>n+(nw.has(w)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4);return items}
function dateLabel(due){if(!due)return'No due date';const d=Math.ceil((new Date(due+'T23:59:59')-new Date())/86400000);if(d<0)return`Overdue · ${due}`;if(d===0)return'Today';if(d===1)return'Tomorrow';return due}
function pctFromTasks(project,tasks){const a=tasks.filter(t=>t.project===project.name);return a.length?Math.round(a.filter(taskDone).length/a.length*100):project.progress}

function App(){const[d,setD]=useState(null),[page,setPage]=useState('home'),[q,setQ]=useState(''),[modal,setModal]=useState(null),[snaps,setSnaps]=useState([]),[storage,setStorage]=useState('Booting local database…'),[toast,setToast]=useState('');

const open=d.tasks.filter(x=>x.status!=='Done'),done=d.tasks.filter(taskDone),ranked=[...open].sort((a,b)=>scoreTask(b,d.projects,d.tasks)-scoreTask(a,d.projects,d.tasks)),top3=ranked.slice(0,3),risks=d.projects.filter(x=>['At risk','Needs focus'].includes(x.health));
const log=(text,type='system')=>setD(x=>({...x,updatedAt:now(),activity:[{id:uid(),text,time:now(),type},...(Array.isArray(x.activity)?x.activity:[])].slice(0,180)}));
const setTask=t=>setD(x=>{const exists=x.tasks.some(a=>a.id===t.id),z={...t,id:t.id||uid(),createdAt:t.createdAt||now(),updatedAt:now()};return{...x,updatedAt:now(),tasks:exists?x.tasks.map(a=>a.id===z.id?z:a):[z,...x.tasks],activity:[{id:uid(),text:(exists?'Updated task: ':'Created task: ')+z.title,time:now(),type:'task'},...x.activity].slice(0,180)}});
const setProject=p=>setD(x=>{const z={...p,id:p.id||uid()};return{...x,projects:x.projects.some(a=>a.id===z.id)?x.projects.map(a=>a.id===z.id?z:a):[z,...x.projects],updatedAt:now(),activity:[{id:uid(),text:'Project saved: '+z.name,time:now(),type:'project'},...x.activity].slice(0,180)}});

const reset=()=>{const nd=clone(seed);nd.activity=[{id:uid(),text:'Workspace reset to V5 demo data',time:now(),type:'system'}];setD(nd);setToast('Demo workspace restored')};
const restoreSnap=async(s)=>{const nd=normalize(s.value);nd.activity=[{id:uid(),text:'Restored local snapshot',time:now(),type:'recovery'},...nd.activity];setD(nd);setToast('Snapshot restored')};
function Header(){const rs=searchAll(q,d);return <div className="top"><div className="search-wrap"><input id="global-search" className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search everything · Ctrl+K"/>{q&&<div className="results">{rs.length?rs.map(x=><button className="result" key={x.type+x.id} onClick={()=>{setPage(x.type==='Task'?'tasks':x.type==='Project'?'projects':'knowledge');setQ('')}}><b>{x.type}</b> · {x.title||x.name}</button>):<div className="empty">No matching workspace records</div>}</div>}</div><div className="top-actions"><Button onClick={()=>setModal({type:'task',item:null})}>New task</Button><Button dark onClick={()=>setPage('focus')}>Focus now</Button></div></div>}
function Home(){return <><div className="page-head"><div><div className="eyebrow">{new Intl.DateTimeFormat('en-IN',{weekday:'long',month:'long',day:'numeric'}).format(new Date())}</div><div className="h1">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya.</div><div className="copy">Your workspace is local, recoverable and increasingly aware of what deserves attention.</div></div><span className="pill dark">V5 · local intelligence</span></div><div className="grid g4"><div className="card"><div className="eyebrow">Open loops</div><div className="kpi">{open.length}</div><div className="muted small">{done.length} completed</div></div><div className="card"><div className="eyebrow">Critical</div><div className="kpi">{ranked.filter(t=>scoreTask(t,d.projects,d.tasks)>=80).length}</div><div className="muted small">needs near-term action</div></div><div className="card"><div className="eyebrow">Project risk</div><div className="kpi">{risks.length}</div><div className="muted small">needs attention</div></div><div className="card"><div className="eyebrow">Knowledge</div><div className="kpi">{d.notes.length}</div><div className="muted small">connected local notes</div></div></div><div className="grid g2 section"><div className="card hero"><div className="eyebrow">Today’s objective</div><div className="h2">{d.settings.dailyObjective}</div><div className="section list">{top3.map((t,i)=><div className="item" key={t.id}><div className="row"><b>{i+1}. {t.title}</b><span className="pill">{Math.round(scoreTask(t,d.projects,d.tasks))}</span></div><div className="tag" style={{marginTop:5}}>{taskReason(t,d.projects,d.tasks)} · {dateLabel(t.due)}</div></div>)}</div></div><div className="card"><div className="row"><div><div className="eyebrow">Operating brief</div><div className="h2">What needs your attention</div></div><Button onClick={()=>setPage('coo')}>Open AI COO</Button></div><div className="section list">{risks.length?<div className="notice dark"><strong>{risks.length} project{risks.length>1?'s':''} need attention.</strong><span>{risks.map(x=>x.name).join(' · ')}</span></div>:<div className="notice"><strong>Workspace is balanced.</strong><span>No project-level risk signal is currently elevated.</span></div>}<div className="notice"><strong>{ranked.filter(t=>t.status==='Blocked'||dependencyMap(d.tasks)(t).some(x=>!taskDone(x))).length} dependency-limited tasks</strong><span>Focus on unblocking work before adding more commitments.</span></div></div></div></div></>}
function Focus(){const t=top3[0];return <><div className="page-head"><div><div className="eyebrow">Focus engine</div><div className="h1">Do the next right thing.</div><div className="copy">V5 scores urgency, leverage, health, age and dependencies locally.</div></div></div>{t?<div className="card hero"><span className="pill dark">Recommended now</span><div className="h2" style={{fontSize:38,marginTop:14}}>{t.title}</div><div className="copy" style={{marginTop:8}}>{taskReason(t,d.projects,d.tasks)}.</div><div className="grid g3 section"><div className="item"><div className="metric-label">Priority</div><div className="metric-value">{t.priority}</div></div><div className="item"><div className="metric-label">Due</div><div className="metric-value">{dateLabel(t.due)}</div></div><div className="item"><div className="metric-label">Score</div><div className="metric-value">{Math.round(scoreTask(t,d.projects,d.tasks))}</div></div></div><div style={{marginTop:18,display:'flex',gap:8}}><Button dark onClick={()=>complete(t.id)}>Mark {taskDone(t)?'open':'done'}</Button><Button onClick={()=>setModal({type:'task',item:t})}>Edit task</Button></div></div>:<div className="card empty">No open work. Your focus queue is clear.</div>}</>}
function Tasks(){return <><div className="page-head"><div><div className="eyebrow">Execution</div><div className="h1">Tasks.</div><div className="copy">Open work ranked by V5’s local execution engine.</div></div><Button dark onClick={()=>setModal({type:'task',item:null})}>Add task</Button></div><div className="card"><div className="table-head muted small"><b>Task</b><b>Project</b><b>Priority</b><b>Due</b><b></b></div>{open.length?open.map(t=><div className="task" key={t.id}><div><div className="task-title">{t.title}</div><div className="tag">{t.status} · score {Math.round(scoreTask(t,d.projects,d.tasks))}{dependencyMap(d.tasks)(t).some(x=>!taskDone(x))?' · blocked':''}</div></div><div className="small">{t.project||'—'}</div><div><span className="pill">{t.priority}</span></div><div className="small">{dateLabel(t.due)}</div><div style={{display:'flex',gap:6}}><button className="icon-btn" onClick={()=>complete(t.id)}>✓</button><button className="icon-btn" onClick={()=>setModal({type:'task',item:t})}>Edit</button><button className="icon-btn" onClick={()=>remove('tasks',t.id)}>×</button></div></div>):<div className="empty">No open tasks.</div>}</div></>}
function Projects(){return <><div className="page-head"><div><div className="eyebrow">Portfolio</div><div className="h1">Projects.</div><div className="copy">V5 derives a project pulse from linked work while preserving your manual baseline.</div></div><Button dark onClick={()=>setModal({type:'project',item:null})}>Add project</Button></div><div className="grid g2">{d.projects.map(p=>{const linked=d.tasks.filter(t=>t.project===p.name),pct=pctFromTasks(p,d.tasks);return <div className="card" key={p.id}><div className="row"><div><div style={{fontSize:20,fontWeight:820}}>{p.name}</div><div className="tag">{p.description}</div></div><span className="pill dark">{p.health}</span></div><div className="section"><div className="row small"><span>{linked.length} linked tasks</span><b>{pct}%</b></div><div className="progress" style={{marginTop:8}}><div className="bar" style={{width:pct+'%'}}/></div></div><div className="section" style={{display:'flex',gap:7}}><Button onClick={()=>setModal({type:'project',item:p})}>Edit</Button></div></div>})}</div></>}
function Knowledge(){return <><div className="page-head"><div><div className="eyebrow">Knowledge graph</div><div className="h1">Knowledge.</div><div className="copy">Notes now connect to likely tasks and projects through lightweight local semantic overlap.</div></div><Button dark onClick={()=>setModal({type:'note',item:null})}>Add knowledge</Button></div><div className="grid g2">{d.notes.map(n=><div className="card" key={n.id}><div className="row"><span className="pill">{n.tag}</span><div style={{display:'flex',gap:6}}><button className="icon-btn" onClick={()=>makeTaskFromNote(n)}>→ Task</button><button className="icon-btn" onClick={()=>setModal({type:'note',item:n})}>Edit</button><button className="icon-btn" onClick={()=>remove('notes',n.id)}>×</button></div></div><div style={{fontSize:20,fontWeight:820,marginTop:12}}>{n.title}</div><div className="copy" style={{fontSize:13,marginTop:7}}>{n.body}</div><div className="section"><div className="eyebrow">Related</div><div className="list" style={{marginTop:7}}>{related(n,d).map(x=><div className="item small" key={x.type+x.id}><b>{x.type}</b> · {x.title||x.name}</div>)}{!related(n,d).length&&<div className="tag">No strong overlap yet.</div>}</div></div></div>)}</div></>}
function Insights(){const last7=[...Array(7)].map((_,i)=>{const dt=new Date(Date.now()-(6-i)*86400000);const k=dt.toISOString().slice(0,10);return {k,label:dt.toLocaleDateString('en-IN',{weekday:'short'}),n:d.activity.filter(a=>(a.time||'').startsWith(k)&&a.type==='task').length}});const avgAge=open.length?Math.round(open.reduce((n,t)=>n+Math.max(0,(Date.now()-new Date(t.createdAt||Date.now()))/86400000),0)/open.length):0;return <><div className="page-head"><div><div className="eyebrow">Local analytics</div><div className="h1">Insights.</div><div className="copy">Lightweight operating metrics built entirely from your browser history.</div></div></div><div className="grid g4"><div className="card"><div className="eyebrow">Completion</div><div className="kpi">{d.tasks.length?Math.round(done.length/d.tasks.length*100):0}%</div></div><div className="card"><div className="eyebrow">Open age</div><div className="kpi">{avgAge}d</div></div><div className="card"><div className="eyebrow">High priority</div><div className="kpi">{open.filter(t=>t.priority==='High').length}</div></div><div className="card"><div className="eyebrow">Knowledge growth</div><div className="kpi">{d.notes.length}</div></div></div><div className="card section"><div className="eyebrow">Task activity · last 7 days</div><div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:10,alignItems:'end',height:170,marginTop:20}}>{last7.map(x=><div key={x.k} style={{height:140,display:'flex',flexDirection:'column',justifyContent:'flex-end',gap:7,textAlign:'center'}}><div style={{height:Math.max(8,x.n*22),background:'#111',borderRadius:8}} title={`${x.n} task actions`}/><div className="tag">{x.label}</div></div>)}</div></div><div className="grid g3 section">{d.projects.map(p=><div className="item" key={p.id}><div className="metric-label">{p.name}</div><div className="metric-value">{pctFromTasks(p,d.tasks)}%</div><div className="tag">{p.health} · {d.tasks.filter(t=>t.project===p.name).length} tasks</div></div>)}</div></>}
function COO(){const blocked=open.filter(t=>t.status==='Blocked'||dependencyMap(d.tasks)(t).some(x=>!taskDone(x)));const stale=ranked.filter(t=>Math.floor((Date.now()-new Date(t.createdAt||Date.now()))/86400000)>=5).slice(0,3);const notesWithAction=d.notes.filter(n=>related(n,d).length);return <><div className="page-head"><div><div className="eyebrow">Deterministic local executive layer</div><div className="h1">AI COO.</div><div className="copy">No API key. No external model. Recommendations are derived from your own workspace state.</div></div></div><div className="grid g2"><div className="card hero"><span className="pill dark">Daily brief</span><div className="h2">You have {open.length} open loops and {risks.length} project-level risk signals.</div><div className="copy" style={{marginTop:8}}>The strongest next action is <b>{top3[0]?.title||'to clear the remaining queue'}</b>. {top3[0]?taskReason(top3[0],d.projects,d.tasks):'There is no open work requiring attention.'}</div><div className="section"><Button dark onClick={()=>top3[0]&&complete(top3[0].id)}>Execute recommendation</Button></div></div><div className="card"><div className="eyebrow">Diagnosis</div><div className="list section">{blocked.length?<div className="notice"><strong>{blocked.length} blocked or dependency-limited tasks</strong><span>Resolve blockers before increasing active commitments.</span></div>:<div className="notice"><strong>No blockers detected.</strong><span>Your current queue is execution-ready.</span></div>}{stale.length?<div className="notice"><strong>{stale.length} stale task{stale.length>1?'s':''}</strong><span>{stale.map(t=>t.title).join(' · ')}</span></div>:null}{notesWithAction?<div className="notice"><strong>{notesWithAction.length} knowledge items have action matches</strong><span>Turn relevant notes into work when context is fresh.</span></div>:null}</div></div></div><div className="card section"><div className="row"><div><div className="eyebrow">Recommendation queue</div><div className="h2">Why these three</div></div><span className="pill">rule engine · V5</span></div><div className="section list">{top3.map((t,i)=><div className="item" key={t.id}><div className="row"><b>{i+1}. {t.title}</b><span className="pill dark">{Math.round(scoreTask(t,d.projects,d.tasks))}</span></div><div className="tag" style={{marginTop:5}}>{taskReason(t,d.projects,d.tasks)}</div></div>)}</div></div></>}
function Activity(){return <><div className="page-head"><div><div className="eyebrow">Audit trail</div><div className="h1">Activity.</div><div className="copy">Recent workspace mutations and execution events.</div></div></div><div className="card"><div className="list">{d.activity.length?d.activity.map(a=><div className="item" key={a.id}><div className="row"><b>{a.text}</b><span className="tag">{new Date(a.time).toLocaleString('en-IN')}</span></div><div className="tag" style={{marginTop:5}}>{a.type}</div></div>):<div className="empty">No activity yet.</div>}</div></div></>}
function Settings(){return <><div className="page-head"><div><div className="eyebrow">Workspace infrastructure</div><div className="h1">Settings.</div><div className="copy">V5 uses IndexedDB first, localStorage fallback, migration, and recovery snapshots.</div></div></div><div className="grid g2"><div className="card"><div className="eyebrow">Storage</div><div className="h2">{storage}</div><div className="copy" style={{marginTop:7}}>Primary data lives in your browser. It is not uploaded to GitHub by Personal OS.</div><div className="section"><span className="pill dark">Schema V{VERSION}</span></div></div><div className="card"><div className="eyebrow">Recovery</div><div className="h2">{snaps.length} local snapshots</div><div className="copy">Automatic snapshots keep the latest local workspace states available for restore.</div><div className="section list">{snaps.slice(0,4).map(s=><div className="item row" key={s.id}><span className="small">{new Date(s.createdAt).toLocaleString('en-IN')}</span><Button onClick={()=>restoreSnap(s)}>Restore</Button></div>)}</div></div></div><div className="card section"><div className="eyebrow">Backup & recovery</div><div className="h2">Take your data with you.</div><div className="copy">Export creates a JSON backup with a SHA-256 integrity digest when supported by the browser. Import validates the core collections before replacing the active workspace.</div><div style={{display:'flex',gap:8,marginTop:16,flexWrap:'wrap'}}><Button dark onClick={exportData}>Export V5 backup</Button><label className="btn">Import backup<input type="file" accept="application/json" onChange={importData} style={{display:'none'}}/></label><Button danger onClick={reset}>Reset demo data</Button></div></div><div className="card section"><div className="eyebrow">Workspace identity</div><div className="form-grid" style={{marginTop:12}}><div className="field"><label>Workspace name</label><input className="input" value={d.settings.workspaceName} onChange={e=>setD(x=>({...x,settings:{...x.settings,workspaceName:e.target.value}}))}/></div><div className="field"><label>Daily objective</label><input className="input" value={d.settings.dailyObjective} onChange={e=>setD(x=>({...x,settings:{...x.settings,dailyObjective:e.target.value}}))}/></div></div></div></>}
function Modal(){if(!modal)return null;const type=modal.type,item=modal.item||{};const close=()=>setModal(null);if(type==='task')return <TaskModal item={item} onSave={x=>{setTask(x);close()}} onClose={close} tasks={d.tasks} projects={d.projects}/>;if(type==='project')return <ProjectModal item={item} onSave={x=>{setProject(x);close()}} onClose={close}/>;return <NoteModal item={item} onSave={x=>{setNote(x);close()}} onClose={close}/>}
function TaskModal({item,onSave,onClose,tasks,projects}){const[form,setForm]=useState({title:item.title||'',project:item.project||'',priority:item.priority||'Medium',status:item.status||'Todo',due:item.due||'',dependsOn:item.dependsOn||[]});return <div className="modal"><div className="modal-inner"><div className="modal-head"><div><div className="eyebrow">Task editor</div><div className="h2">{item.id?'Edit task':'New task'}</div></div><button className="icon-btn" onClick={onClose}>Close</button></div><div className="form-grid"><div className="field" style={{gridColumn:'1/-1'}}><label>Title</label><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} autoFocus/></div><div className="field"><label>Project</label><select className="select" value={form.project} onChange={e=>setForm({...form,project:e.target.value})}><option value="">None</option>{projects.map(p=><option key={p.id}>{p.name}</option>)}</select></div><div className="field"><label>Priority</label><select className="select" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>{['High','Medium','Low'].map(x=><option key={x}>{x}</option>)}</select></div><div className="field"><label>Status</label><select className="select" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>{['Todo','In Progress','Done','Blocked'].map(x=><option key={x}>{x}</option>)}</select></div><div className="field"><label>Due</label><input className="input" type="date" value={form.due} onChange={e=>setForm({...form,due:e.target.value})}/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Dependencies</label><select className="select" multiple size="4" value={form.dependsOn.map(String)} onChange={e=>setForm({...form,dependsOn:[...e.target.selectedOptions].map(o=>Number(o.value))})}>{tasks.filter(t=>t.id!==item.id).map(t=><option key={t.id} value={t.id}>{t.title} · {t.status}</option>)}</select></div></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:18}}><Button onClick={onClose}>Cancel</Button><Button dark onClick={()=>form.title.trim()&&onSave(form)}>Save task</Button></div></div></div>}
function ProjectModal({item,onSave,onClose}){const[form,setForm]=useState({name:item.name||'',description:item.description||'',progress:item.progress??50,health:item.health||'Steady'});return <div className="modal"><div className="modal-inner"><div className="modal-head"><div><div className="eyebrow">Project editor</div><div className="h2">{item.id?'Edit project':'New project'}</div></div><button className="icon-btn" onClick={onClose}>Close</button></div><div className="form-grid"><div className="field" style={{gridColumn:'1/-1'}}><label>Name</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Description</label><input className="input" value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div><div className="field"><label>Progress baseline</label><input className="input" type="number" min="0" max="100" value={form.progress} onChange={e=>setForm({...form,progress:Number(e.target.value)})}/></div><div className="field"><label>Health</label><select className="select" value={form.health} onChange={e=>setForm({...form,health:e.target.value})}>{['On track','Needs focus','At risk','Steady'].map(x=><option key={x}>{x}</option>)}</select></div></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:18}}><Button onClick={onClose}>Cancel</Button><Button dark onClick={()=>form.name.trim()&&onSave(form)}>Save project</Button></div></div></div>}
function NoteModal({item,onSave,onClose}){const[form,setForm]=useState({title:item.title||'',tag:item.tag||'General',body:item.body||''});return <div className="modal"><div className="modal-inner"><div className="modal-head"><div><div className="eyebrow">Knowledge editor</div><div className="h2">{item.id?'Edit knowledge':'New knowledge'}</div></div><button className="icon-btn" onClick={onClose}>Close</button></div><div className="form-grid"><div className="field"><label>Title</label><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></div><div className="field"><label>Tag</label><input className="input" value={form.tag} onChange={e=>setForm({...form,tag:e.target.value})}/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Body</label><textarea className="textarea" value={form.body} onChange={e=>setForm({...form,body:e.target.value})}/></div></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:18}}><Button onClick={onClose}>Cancel</Button><Button dark onClick={()=>form.title.trim()&&onSave(form)}>Save knowledge</Button></div></div></div>}
function renderPage(page){switch(page){case'focus':return <Focus/>;case'tasks':return <Tasks/>;case'projects':return <Projects/>;case'knowledge':return <Knowledge/>;case'insights':return <Insights/>;case'coo':return <COO/>;case'activity':return <Activity/>;case'settings':return <Settings/>;default:return <Home/>}}
return <div className="app"><div className="shell"><aside className="side"><div className="brand"><div className="mark">P</div><div><b>Personal OS</b><small>V5 · local first</small></div></div><div className="nav">{nav.map(([id,label])=><button key={id} className={page===id?'on':''} onClick={()=>setPage(id)}>{label}</button>)}</div><div className="side-foot"><b>Private by architecture.</b><span>IndexedDB → localStorage fallback · automatic recovery snapshots · no paid backend.</span></div></aside><main className="main"><Header/>{renderPage(page)}</main></div><div className="mobile">{nav.slice(0,7).map(([id,label])=><button key={id} className={page===id?'on':''} onClick={()=>setPage(id)}>{label}</button>)}<button onClick={()=>setPage('settings')}>More</button></div><Modal/>{toast&&<div style={{position:'fixed',right:18,bottom:18,zIndex:60,background:'#111',color:'#fff',padding:'12px 15px',borderRadius:14,fontSize:12,fontWeight:750,boxShadow:'0 15px 45px rgba(0,0,0,.22)'}}>{toast}</div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
