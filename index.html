<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Personal OS</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,body,#root{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#eef2ff}*{box-sizing:border-box}.glass{background:rgba(17,24,39,.72);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.12)}.scrollbar::-webkit-scrollbar{width:8px}.scrollbar::-webkit-scrollbar-thumb{background:#334155;border-radius:20px}.progress{background:linear-gradient(90deg,#818cf8,#38bdf8)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {useEffect,useMemo,useState}=React;
      const seed={
        tasks:[
          {id:1,title:'Complete Personal OS V1 structure',project:'Personal OS',priority:'High',status:'In Progress',due:'Today'},
          {id:2,title:'Review pending customer evidence request',project:'Work',priority:'High',status:'Todo',due:'Today'},
          {id:3,title:'Update SIEM troubleshooting knowledge',project:'Knowledge',priority:'Medium',status:'Todo',due:'Tomorrow'},
          {id:4,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'This week'},
          {id:5,title:'Clean up project notes',project:'Personal OS',priority:'Low',status:'Done',due:'Today'}
        ],
        projects:[
          {id:1,name:'Personal OS',description:'Command Center + Knowledge Base + AI COO',progress:32,health:'On track',color:'from-indigo-500 to-sky-400'},
          {id:2,name:'SIEM Automation',description:'Evidence collection and reporting workflow',progress:78,health:'On track',color:'from-emerald-500 to-cyan-400'},
          {id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus',color:'from-fuchsia-500 to-violet-400'},
          {id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady',color:'from-amber-400 to-orange-500'}
        ],
        notes:[
          {id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},
          {id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source/destination, device and event type before requesting high-volume logs.'},
          {id:3,title:'Personal OS idea',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}
        ],
        activity:[
          {text:'Personal OS V1 started',time:'Today · 4:10 PM',type:'project'},
          {text:'Project milestone reviewed',time:'Today · 2:30 PM',type:'progress'},
          {text:'Firewall investigation note captured',time:'Yesterday · 6:05 PM',type:'knowledge'},
          {text:'Customer follow-up completed',time:'Yesterday · 4:40 PM',type:'task'}
        ]
      };
      function load(){try{return JSON.parse(localStorage.getItem('personal_os_v1'))||seed}catch{return seed}}
      const Icon=({children})=><span className="inline-flex items-center justify-center w-5 h-5">{children}</span>;
      const nav=[['dashboard','Dashboard','⌂'],['tasks','Tasks','✓'],['projects','Projects','▣'],['knowledge','Knowledge','◈'],['activity','Activity','◷'],['ai','AI COO','✦']];
      function App(){
        const [data,setData]=useState(load); const [page,setPage]=useState('dashboard'); const [query,setQuery]=useState(''); const [newTask,setNewTask]=useState('');
        useEffect(()=>localStorage.setItem('personal_os_v1',JSON.stringify(data)),[data]);
        const done=data.tasks.filter(t=>t.status==='Done').length; const total=data.tasks.length; const completion=total?Math.round(done/total*100):0;
        const active=data.tasks.filter(t=>t.status!=='Done');
        const search=(arr)=>arr.filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
        function addTask(){if(!newTask.trim())return;setData({...data,tasks:[{id:Date.now(),title:newTask.trim(),project:'Personal OS',priority:'Medium',status:'Todo',due:'Today'},...data.tasks]});setNewTask('')}
        function toggle(id){setData({...data,tasks:data.tasks.map(t=>t.id===id?{...t,status:t.status==='Done'?'Todo':'Done'}:t)})}
        return <div className="min-h-full bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,.16),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,.1),transparent_30%)]">
          <div className="max-w-[1500px] mx-auto min-h-screen flex">
            <aside className="w-64 shrink-0 border-r border-white/10 px-5 py-6 hidden md:flex flex-col">
              <div className="flex items-center gap-3 mb-8"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center font-black">P</div><div><div className="font-bold tracking-tight">Personal OS</div><div className="text-xs text-slate-400">your operating system</div></div></div>
              <div className="space-y-1">{nav.map(([key,label,ico])=><button key={key} onClick={()=>setPage(key)} className={'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition '+(page===key?'bg-white/10 text-white':'text-slate-400 hover:bg-white/5 hover:text-white')}><Icon>{ico}</Icon>{label}</button>)}</div>
              <div className="mt-auto glass rounded-2xl p-4"><div className="text-xs text-slate-400 mb-1">V1 · Local-first</div><div className="text-sm font-medium">Your data stays in this browser.</div><div className="text-xs text-slate-500 mt-2">No server. No subscription.</div></div>
            </aside>
            <main className="flex-1 min-w-0">
              <header className="sticky top-0 z-10 px-5 md:px-8 py-4 border-b border-white/10 bg-[#070b14]/85 backdrop-blur-xl"><div className="flex items-center gap-4"><div className="md:hidden font-bold">Personal OS</div><div className="relative flex-1 max-w-xl"><span className="absolute left-3 top-2.5 text-slate-500">⌕</span><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search tasks, projects, knowledge..." className="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-sm outline-none focus:border-indigo-400/50" /></div><button onClick={()=>setPage('ai')} className="px-4 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-sm font-semibold">Ask AI COO</button></div></header>
              <section className="p-5 md:p-8 max-w-[1250px] mx-auto">{page==='dashboard'&&<Dashboard data={data} completion={completion} active={active} setPage={setPage} toggle={toggle} newTask={newTask} setNewTask={setNewTask} addTask={addTask}/>} {page==='tasks'&&<Tasks data={data} toggle={toggle} newTask={newTask} setNewTask={setNewTask} addTask={addTask} search={search}/>} {page==='projects'&&<Projects data={data} setData={setData} search={search}/>} {page==='knowledge'&&<Knowledge data={data} search={search}/>} {page==='activity'&&<Activity data={data}/>} {page==='ai'&&<AICOO data={data} completion={completion}/>}</section>
            </main>
          </div>
        </div>
      }
      function Dashboard({data,completion,active,setPage,toggle,newTask,setNewTask,addTask}){return <>
        <div className="mb-8"><div className="text-sm text-indigo-300 mb-2">Wednesday, 2 September 2026</div><h1 className="text-3xl md:text-4xl font-bold tracking-tight">Good evening, Aditya 👋</h1><p className="text-slate-400 mt-2">Here’s your current picture. Focus on what moves the needle.</p></div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">{[['Open tasks',active.length,'text-sky-300'],['Completed',data.tasks.filter(t=>t.status==='Done').length,'text-emerald-300'],['Projects',data.projects.length,'text-indigo-300'],['Knowledge notes',data.notes.length,'text-amber-300']].map(x=><div className="glass rounded-2xl p-5" key={x[0]}><div className="text-sm text-slate-400">{x[0]}</div><div className={'text-3xl font-bold mt-2 '+x[2]}>{x[1]}</div></div>)}</div>
        <div className="grid lg:grid-cols-[1.5fr_1fr] gap-5"><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="flex items-center justify-between mb-5"><div><div className="font-semibold">Today’s focus</div><div className="text-xs text-slate-500 mt-1">{completion}% task completion</div></div><button onClick={()=>setPage('tasks')} className="text-xs text-indigo-300 hover:text-white">View all →</button></div><div className="w-full h-2 bg-white/5 rounded-full overflow-hidden mb-5"><div className="progress h-full rounded-full" style={{width:completion+'%'}}/></div><div className="space-y-2">{active.slice(0,4).map(t=><div key={t.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/[.03]"><button onClick={()=>toggle(t.id)} className="w-5 h-5 rounded-full border border-slate-500 hover:border-indigo-400"/><div className="flex-1"><div className="text-sm">{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority}</div></div><span className={'text-xs '+(t.priority==='High'?'text-rose-300':t.priority==='Medium'?'text-amber-300':'text-slate-400')}>{t.due}</span></div>)}</div><div className="flex gap-2 mt-4"><input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="Add a quick task..." className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none"/><button onClick={addTask} className="px-4 rounded-xl bg-white/10 hover:bg-white/15 text-sm">Add</button></div></div>
        <div className="glass rounded-2xl p-5"><div className="font-semibold mb-4">Active projects</div><div className="space-y-4">{data.projects.map(p=><div key={p.id}><div className="flex justify-between text-sm mb-2"><span>{p.name}</span><span className="text-slate-400">{p.progress}%</span></div><div className="h-2 bg-white/5 rounded-full overflow-hidden"><div className={'h-full rounded-full bg-gradient-to-r '+p.color} style={{width:p.progress+'%'}}/></div><div className="text-xs text-slate-500 mt-1.5">{p.health}</div></div>)}</div></div></div>
        <div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="text-xs uppercase tracking-widest text-indigo-300 mb-2">AI COO</div><div className="text-xl font-semibold">Your recommended next move</div><p className="text-slate-400 text-sm mt-2">Finish the Personal OS V1 structure first. It unlocks the foundation for your knowledge and AI workflows.</p><button onClick={()=>setPage('ai')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open AI COO →</button></div><div className="glass rounded-2xl p-5"><div className="flex items-center justify-between mb-4"><div className="font-semibold">Recent activity</div><button onClick={()=>setPage('activity')} className="text-xs text-indigo-300">See all</button></div><div className="space-y-4">{data.activity.slice(0,4).map((a,i)=><div key={i} className="flex gap-3"><div className="w-2 h-2 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{a.time}</div></div></div>)}</div></div></div></div></>}
      function Tasks({data,toggle,newTask,setNewTask,addTask,search}){const tasks=search(data.tasks);return <div><Title title="Tasks" sub="Capture work, keep it moving, and close the loop."/><div className="flex gap-2 mb-5"><input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="What needs to get done?" className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none"/><button onClick={addTask} className="px-5 rounded-xl bg-indigo-500 font-semibold">Add task</button></div><div className="glass rounded-2xl overflow-hidden">{tasks.map((t,i)=><div className={'flex items-center gap-4 p-4 '+(i?'border-t border-white/5':'')} key={t.id}><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border flex items-center justify-center '+(t.status==='Done'?'bg-emerald-500 border-emerald-500 text-white':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.due}</div></div><span className={'text-xs px-2.5 py-1 rounded-full bg-white/5 '+(t.priority==='High'?'text-rose-300':t.priority==='Medium'?'text-amber-300':'text-slate-400')}>{t.priority}</span></div>)}</div></div>}
      function Projects({data,setData,search}){return <div><Title title="Projects" sub="See what is active, healthy, and at risk."/><div className="grid md:grid-cols-2 gap-5">{search(data.projects).map(p=><div className="glass rounded-2xl p-5" key={p.id}><div className={'h-1.5 w-20 rounded-full bg-gradient-to-r '+p.color+' mb-4'}/><div className="flex justify-between gap-4"><div><div className="text-lg font-semibold">{p.name}</div><p className="text-sm text-slate-400 mt-1">{p.description}</p></div><div className="text-2xl font-bold">{p.progress}%</div></div><div className="mt-5 h-2 bg-white/5 rounded-full overflow-hidden"><div className={'h-full rounded-full bg-gradient-to-r '+p.color} style={{width:p.progress+'%'}}/></div><div className="flex items-center justify-between text-xs text-slate-500 mt-3"><span>{p.health}</span><button onClick={()=>setData({...data,projects:data.projects.map(x=>x.id===p.id?{...x,progress:Math.min(100,x.progress+5)}:x),activity:[{text:`${p.name} progress updated`,time:'Just now',type:'progress'},...data.activity]})} className="text-indigo-300">+5% progress</button></div></div>)}</div></div>}
      function Knowledge({data,search}){return <div><Title title="Knowledge Base" sub="Your private memory for notes, solutions, and reusable context."/><div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">{search(data.notes).map(n=><article className="glass rounded-2xl p-5" key={n.id}><div className="flex items-center justify-between"><span className="text-xs px-2.5 py-1 rounded-full bg-indigo-500/15 text-indigo-200">{n.tag}</span><span className="text-slate-500">↗</span></div><h3 className="font-semibold mt-4">{n.title}</h3><p className="text-sm text-slate-400 mt-2 leading-6">{n.body}</p></article>)}</div></div>}
      function Activity({data}){return <div><Title title="Activity" sub="A lightweight history of what moved forward."/><div className="glass rounded-2xl p-5"><div className="space-y-6">{data.activity.map((a,i)=><div key={i} className="flex gap-4"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-sky-400"/>{i!==data.activity.length-1&&<div className="w-px flex-1 bg-white/10 mt-2"/>}</div><div className="pb-2"><div className="font-medium">{a.text}</div><div className="text-xs text-slate-500 mt-1">{a.time} · {a.type}</div></div></div>)}</div></div></div>}
      function AICOO({data,completion}){const open=data.tasks.filter(t=>t.status!=='Done').length; const high=data.tasks.filter(t=>t.status!=='Done'&&t.priority==='High').length;return <div><Title title="AI COO" sub="The decision layer of your Personal OS. V1 uses deterministic recommendations; AI provider integration comes next."/><div className="grid lg:grid-cols-2 gap-5"><div className="glass rounded-2xl p-6"><div className="text-xs uppercase tracking-widest text-indigo-300">Recommendation</div><h2 className="text-2xl font-bold mt-2">Work on the highest-leverage open item.</h2><p className="text-slate-400 mt-3">You have {open} open tasks, including {high} high-priority item{high===1?'':'s'}. Your current completion rate is {completion}%.</p><div className="mt-6 p-4 rounded-2xl bg-white/[.04] border border-white/5"><div className="font-semibold">→ {data.tasks.find(t=>t.status!=='Done'&&t.priority==='High')?.title||'Review your project backlog'}</div><div className="text-xs text-slate-500 mt-2">Reason: urgency + impact + momentum.</div></div></div><div className="glass rounded-2xl p-6"><div className="font-semibold mb-4">Ask your COO</div><div className="space-y-3"><div className="p-3 rounded-xl bg-white/[.04] text-sm text-slate-300">“What should I focus on today?”</div><div className="p-3 rounded-xl bg-white/[.04] text-sm text-slate-300">“Which project needs attention?”</div><div className="p-3 rounded-xl bg-white/[.04] text-sm text-slate-300">“Summarize my recent progress.”</div></div><div className="mt-5 text-xs text-slate-500">V1 foundation is ready. A real LLM/RAG connector can be added in V2 without changing the dashboard.</div></div></div></div>}
      const Title=({title,sub})=><div className="mb-7"><h1 className="text-3xl font-bold tracking-tight">{title}</h1><p className="text-slate-400 mt-2">{sub}</p></div>;
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
