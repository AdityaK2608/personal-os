<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Personal OS 8.0</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#121316;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 8% 0,#fff 0,transparent 34%),linear-gradient(180deg,#f6f6f8,#eceef2)}.shell{max-width:1500px;margin:auto;min-height:100vh;display:flex;gap:18px;padding:18px}.side{width:240px;flex:none;background:#ffffffd9;border:1px solid #fff;border-radius:28px;padding:18px;display:flex;flex-direction:column;box-shadow:0 20px 70px #1111;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;padding:4px 5px 22px}.mark{width:42px;height:42px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:14px}.brand small{display:block;color:#8b9098;font-size:10px;margin-top:3px}.nav{display:grid;gap:4px}.nav button,.mobile button{border:0;background:transparent;color:#686d76;padding:11px 12px;border-radius:14px;text-align:left;font-weight:750}.nav button.on,.mobile button.on{background:#111;color:#fff}.sideFoot{margin-top:auto;background:#111;color:#fff;border-radius:20px;padding:14px;font-size:12px}.sideFoot span{display:block;color:#b9bcc2;margin-top:5px;line-height:1.45}.main{flex:1;min-width:0}.top{display:flex;gap:10px;margin-bottom:18px}.searchWrap{position:relative;flex:1}.search{width:100%;height:48px;border:1px solid #e2e4e8;border-radius:16px;background:#ffffffd9;padding:0 16px;outline:0}.actions{display:flex;gap:8px}.btn{border:1px solid #dfe2e6;background:#ffffffd9;padding:11px 15px;border-radius:14px;font-weight:750;color:#333}.btn.dark{background:#111;color:#fff;border-color:#111}.btn.soft{background:#eef0f3}.btn.red{color:#b4232f;background:#fff0f2;border-color:#f1d0d5}.results{position:absolute;top:56px;left:0;right:0;background:#fff;border:1px solid #e5e7ea;border-radius:18px;z-index:20;box-shadow:0 25px 60px #1112;padding:7px;max-height:55vh;overflow:auto}.result{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:12px}.result:hover{background:#f1f2f4}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 18px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#92979f;font-weight:900}.h1{font-size:clamp(38px,5vw,62px);letter-spacing:-.065em;line-height:1;margin:7px 0;font-weight:900}.h2{font-size:27px;letter-spacing:-.045em;margin:4px 0;font-weight:850}.copy{color:#70757f;line-height:1.6}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#ffffffc7;border:1px solid #fff;border-radius:24px;padding:20px;box-shadow:0 18px 58px #1111110f;backdrop-filter:blur(16px)}.hero{padding:27px}.kpi{font-size:34px;font-weight:900;letter-spacing:-.055em;margin-top:4px}.muted{color:#8b9098}.small{font-size:12px}.tiny{font-size:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:9px}.item{padding:13px;border-radius:17px;background:#ffffffa8;border:1px solid #eceef1}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eff0f3;color:#5e636c;font-size:10px;font-weight:850}.pill.dark{background:#111;color:#fff}.bar{height:8px;background:#e7e9ec;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111;border-radius:99px}.task{display:grid;grid-template-columns:1.7fr .7fr .7fr .8fr auto;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #eceef0}.task:first-child{border-top:0}.taskTitle{font-weight:800}.knowledge{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.knowledge .item{min-height:145px;cursor:pointer;transition:.15s}.knowledge .item:hover{transform:translateY(-2px)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#81868e;font-weight:850;margin-bottom:6px}.input,.select,.area{width:100%;border:1px solid #dfe2e6;border-radius:13px;background:#f7f8f9;padding:11px 12px;outline:0}.area{min-height:130px;resize:vertical}.modal{position:fixed;inset:0;background:#0005;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;z-index:50}.modalIn{width:min(780px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:27px;padding:22px;box-shadow:0 30px 100px #0003}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 15px;border-radius:14px;z-index:100;box-shadow:0 20px 60px #0003}.mobile{display:none}.stat{font-size:12px;color:#656a73}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:5px;background:#e7e9ec}.heat i.a{background:#aaa}.heat i.b{background:#777}.heat i.c{background:#444}.heat i.d{background:#111}.split{display:flex;gap:10px;align-items:center}.score{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;border:8px solid #e7e9ec;font-size:21px;font-weight:900}.empty{padding:24px;text-align:center;color:#8b9098;border:1px dashed #d8dbe0;border-radius:18px}.mobile button{text-align:center;font-size:10px}
@media(max-width:1080px){.shell{display:block;padding:10px}.side{display:none}.main{padding-bottom:82px}.mobile{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:#fffffff2;padding:7px;border-radius:22px;box-shadow:0 18px 55px #1112;z-index:40}.mobile button{flex:1}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.knowledge{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:1fr auto}.task>:nth-child(2),.task>:nth-child(3),.task>:nth-child(4){display:none}.top{flex-wrap:wrap}.searchWrap{width:100%}.actions{width:100%}.actions .btn{flex:1}.form{grid-template-columns:1fr}}@media(max-width:650px){.g4,.g2,.knowledge{grid-template-columns:1fr}.card,.hero{padding:18px;border-radius:22px}.h1{font-size:40px}.actions .btn:not(.dark){display:none}}
</style></head><body><div id="app" class="app"></div><script>
(function(){'use strict';
var KEY='personal_os_v80',VERSION='8.0',store={page:'home',q:'',modal:null,selected:null};
var seed={createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),tasks:[{id:1,title:'Explore the Knowledge Engine',project:'Personal OS',area:'Projects',lane:'NOW',priority:'High',status:'In Progress',due:new Date().toISOString().slice(0,10),context:'Deep Work'},{id:2,title:'Review important customer follow-up',project:'',area:'Work',lane:'FOLLOW-UP',priority:'High',status:'Todo',due:new Date(Date.now()+864e5).toISOString().slice(0,10),context:'Computer'}],projects:[{id:1,name:'Personal OS',goal:'Build a private operating system for everyday work and learning',progress:72,health:'On track'},{id:2,name:'SIEM Automation',goal:'Reduce manual evidence work',progress:78,health:'On track'},{id:3,name:'Prod1',goal:'Ship the next useful product milestone',progress:64,health:'Needs focus'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.',area:'Learning'},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source, destination, device and event type before requesting high-volume logs.',project:'SIEM Automation',area:'Work'}],journal:[],decisions:[],activity:[]};
var topics=['Linux','RHEL','Networking','Cybersecurity','SIEM / SOC','Cloud','DevOps','Programming','Databases','AI and ML','Productivity'];var kb={};topics.forEach(function(x){kb[x]=['Fundamentals','Troubleshooting','Best Practices','Checklist','Common Mistakes'].map(function(y){return x+' — '+y})});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function id(){return Date.now()+Math.floor(Math.random()*999)}function today(){return new Date().toISOString().slice(0,10)}function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x)return x;for(var k of ['personal_os_v73','personal_os_v72','personal_os_v71','personal_os_v7']){x=JSON.parse(localStorage.getItem(k));if(x)return x}}catch(e){}return JSON.parse(JSON.stringify(seed))}var data=load();['tasks','projects','notes','journal','decisions','activity'].forEach(function(k){if(!Array.isArray(data[k]))data[k]=[]});function save(){data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data))}function log(t){data.activity.unshift({id:id(),text:t,time:new Date().toISOString()});data.activity=data.activity.slice(0,100);save()}function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},1800)}
function nav(p){store.page=p;store.q='';render()}function openModal(type,obj){store.modal=type;store.selected=obj||null;render()}function closeModal(){store.modal=null;store.selected=null;render()}
function dueScore(t){if(t.status==='Done')return-9999;var s={High:55,Medium:30,Low:10}[t.priority]||10;if(t.lane==='NOW')s+=30;if(t.lane==='FOLLOW-UP')s+=15;if(t.status==='Blocked')s-=35;if(t.due){var d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/864e5);if(d<0)s+=55;else if(d===0)s+=40;else if(d<=2)s+=25;else if(d<=7)s+=10}var p=data.projects.find(function(p){return p.name===t.project});if(p&&p.health==='At risk')s+=30;if(p&&p.health==='Needs focus')s+=15;return s}
function results(q){q=q.toLowerCase().trim();if(!q)return[];var a=[];data.tasks.forEach(function(t){if((t.title+' '+t.project+' '+t.area).toLowerCase().includes(q))a.push({type:'Task',title:t.title,obj:t})});data.projects.forEach(function(p){if((p.name+' '+p.goal).toLowerCase().includes(q))a.push({type:'Project',title:p.name,obj:p})});data.notes.forEach(function(n){if((n.title+' '+n.body+' '+n.tag).toLowerCase().includes(q))a.push({type:'Note',title:n.title,obj:n})});topics.forEach(function(c){kb[c].forEach(function(k){if(k.toLowerCase().includes(q))a.push({type:'Knowledge',title:k,obj:{title:k,tag:c}})})});return a.slice(0,15)}
function layout(content,title,sub){var navs=[['home','Command Center'],['tasks','Tasks'],['projects','Projects'],['knowledge','Knowledge'],['journal','Journal'],['analytics','Analytics'],['decisions','Decisions']];return '<div class="shell"><aside class="side"><div class="brand"><div class="mark">A</div><div><b>Personal OS</b><small>Aditya · v'+VERSION+'</small></div></div><div class="nav">'+navs.map(function(n){return '<button class="'+(store.page===n[0]?'on':'')+'" onclick="OS.nav(\''+n[0]+'\')">'+n[1]+'</button>'}).join('')+'</div><div style="margin-top:12px"><button class="btn dark" style="width:100%" onclick="OS.quick()">+ Quick Capture</button></div><div class="sideFoot"><b>Local-first</b><span>Your data stays in this browser. Export a backup from Settings.</span></div></aside><main class="main"><div class="top"><div class="searchWrap"><input class="search" value="'+esc(store.q)+'" placeholder="Search tasks, projects, knowledge…  /" oninput="OS.search(this.value)">'+(store.q?'<div class="results">'+results(store.q).map(function(r){return '<button class="result" onclick="OS.result(\''+esc(r.type)+'\','+JSON.stringify(r.title)+')"><b>'+esc(r.title)+'</b><div class="small muted">'+r.type+'</div></button>'}).join('')+'</div>':'')+'</div><div class="actions"><button class="btn" onclick="OS.exportData()">Export</button><button class="btn dark" onclick="OS.quick()">+ Capture</button></div></div><div class="head"><div><div class="eyebrow">'+esc(title||'Personal Operating System')+'</div><h1>'+esc(title||'Command Center')+'</h1><div class="copy">'+esc(sub||'Turn context into clear next actions.')+'</div></div></div>'+content+'</main><nav class="mobile">'+navs.slice(0,5).map(function(n){return '<button class="'+(store.page===n[0]?'on':'')+'" onclick="OS.nav(\''+n[0]+'\')">'+n[1]+'</button>'}).join('')+'</nav></div>'}
function home(){var open=data.tasks.filter(function(t){return t.status!=='Done'}),done=data.tasks.filter(function(t){return t.status==='Done'}),top=open.sort(function(a,b){return dueScore(b)-dueScore(a)}).slice(0,5),due=open.filter(function(t){return t.due&&t.due<=today()}).length;return layout('<div class="grid g4"><div class="card"><div class="muted small">OPEN TASKS</div><div class="kpi">'+open.length+'</div><div class="small">'+due+' due / overdue</div></div><div class="card"><div class="muted small">COMPLETED</div><div class="kpi">'+done.length+'</div><div class="small">All-time local record</div></div><div class="card"><div class="muted small">PROJECTS</div><div class="kpi">'+data.projects.length+'</div><div class="small">Active workstreams</div></div><div class="card"><div class="muted small">KNOWLEDGE</div><div class="kpi">'+topics.length*5+'</div><div class="small">Built-in reference nodes</div></div></div><div class="grid g2" style="margin-top:15px"><div class="card hero"><div class="eyebrow">TODAY</div><h2>What deserves attention?</h2><p class="copy">'+esc(data.tasks.length?'Your highest-scoring work is ranked below. Start with one meaningful move.':'Capture your first task, note, or idea.')+'</p><div class="list">'+(top.length?top.map(taskRow).join(''):'<div class="empty">No open work. Nice.</div>')+'</div></div><div class="card"><div class="row"><div><div class="eyebrow">PROJECT PULSE</div><h2>Workstreams</h2></div><button class="btn soft" onclick="OS.nav(\'projects\')">View all</button></div><div class="list">'+data.projects.map(function(p){return '<div class="item"><div class="row"><b>'+esc(p.name)+'</b><span class="pill">'+esc(p.health)+'</span></div><div class="small muted" style="margin:7px 0">'+esc(p.goal)+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,p.progress))+'%"></i></div><div class="small muted" style="margin-top:5px">'+p.progress+'% complete</div></div>'}).join('')+'</div></div></div><div class="grid g2" style="margin-top:15px"><div class="card"><div class="eyebrow">RECENT ACTIVITY</div><div class="list" style="margin-top:10px">'+(data.activity.slice(0,6).map(function(a){return '<div class="item"><b>'+esc(a.text)+'</b><div class="tiny muted">'+new Date(a.time).toLocaleString()+'</div></div>'}).join('')||'<div class="empty">Activity appears as you use the OS.</div>')+'</div></div><div class="card"><div class="eyebrow">QUICK START</div><h2>Capture without friction</h2><p class="copy">Use Quick Capture for tasks, notes, journal entries and decisions. Everything is stored locally.</p><button class="btn dark" onclick="OS.quick()">Open Capture</button></div></div>','Command Center','A practical dashboard for deciding what to do next.');}
function taskRow(t){return '<div class="task"><div><div class="taskTitle">'+esc(t.title)+'</div><div class="small muted">'+esc(t.project||t.area||'Unassigned')+'</div></div><span class="pill">'+esc(t.priority)+'</span><span class="pill">'+esc(t.lane)+'</span><span class="small muted">'+esc(t.due||'No date')+'</span><button class="btn soft" onclick="OS.editTask('+t.id+')">Open</button></div>'}
function tasks(){var arr=data.tasks.slice().sort(function(a,b){return dueScore(b)-dueScore(a)});return layout('<div class="row" style="margin-bottom:12px"><div class="split"><span class="pill dark">'+arr.filter(function(t){return t.status!=="Done"}).length+' open</span><span class="small muted">Sorted by priority + urgency</span></div><button class="btn dark" onclick="OS.newTask()">+ Task</button></div><div class="card">'+(arr.length?arr.map(taskRow).join(''):'<div class="empty">No tasks yet.</div>')+'</div>','Tasks','A single queue, ranked by what matters now.');}
function projects(){return layout('<div class="row" style="margin-bottom:12px"><span class="small muted">Track outcomes, not just activity.</span><button class="btn dark" onclick="OS.newProject()">+ Project</button></div><div class="grid g3">'+(data.projects.map(function(p){return '<div class="card"><div class="row"><b>'+esc(p.name)+'</b><span class="pill">'+esc(p.health)+'</span></div><p class="copy">'+esc(p.goal)+'</p><div class="bar"><i style="width:'+p.progress+'%"></i></div><div class="row small muted" style="margin-top:7px"><span>'+p.progress+'%</span><span>'+data.tasks.filter(function(t){return t.project===p.name&&t.status!=="Done"}).length+' open tasks</span></div></div>'}).join('')||'<div class="empty">Create your first project.</div>')+'</div>','Projects','Keep every workstream tied to an outcome and a visible health signal.');}
function knowledge(){var arr=[];topics.forEach(function(c){kb[c].forEach(function(k){arr.push({title:k,tag:c})})});return layout('<div class="knowledge">'+arr.map(function(n){return '<div class="item" onclick="OS.knowledge('+JSON.stringify(n.title)+','+JSON.stringify(n.tag)+')"><span class="pill">'+esc(n.tag)+'</span><h3>'+esc(n.title)+'</h3><div class="small muted">Open practical reference →</div></div>'}).join('')+'</div>','Knowledge','A compact reference layer for the topics you work with most.');}
function journal(){return layout('<div class="row" style="margin-bottom:12px"><span class="small muted">Write to think, then turn useful thoughts into actions.</span><button class="btn dark" onclick="OS.newJournal()">+ Journal Entry</button></div><div class="list">'+(data.journal.slice().reverse().map(function(j){return '<div class="card"><div class="row"><b>'+esc(j.title||'Daily reflection')+'</b><span class="small muted">'+esc(j.date)+'</span></div><p class="copy" style="white-space:pre-wrap">'+esc(j.body)+'</p></div>'}).join('')||'<div class="empty">No journal entries yet.</div>')+'</div>','Journal','A private space for reflection, lessons, and turning experience into reusable knowledge.');}
function analytics(){var total=data.tasks.length,done=data.tasks.filter(function(t){return t.status==='Done'}).length,rate=total?Math.round(done/total*100):0,overdue=data.tasks.filter(function(t){return t.status!=='Done'&&t.due&&t.due<today()}).length;var focus=data.tasks.filter(function(t){return t.context==='Deep Work'&&t.status!=='Done'}).length;return layout('<div class="grid g4"><div class="card"><div class="muted small">COMPLETION RATE</div><div class="kpi">'+rate+'%</div><div class="small">'+done+' of '+total+' tasks done</div></div><div class="card"><div class="muted small">OVERDUE</div><div class="kpi">'+overdue+'</div><div class="small">Needs a decision</div></div><div class="card"><div class="muted small">DEEP WORK QUEUE</div><div class="kpi">'+focus+'</div><div class="small">Open focus tasks</div></div><div class="card"><div class="muted small">DECISIONS</div><div class="kpi">'+data.decisions.length+'</div><div class="small">Logged choices</div></div></div><div class="grid g2" style="margin-top:15px"><div class="card"><div class="eyebrow">WEEKLY PULSE</div><h2>Activity map</h2><div class="heat" style="margin-top:15px">'+Array.from({length:35},function(_,i){var v=(i*17+data.activity.length*3)%5;return '<i class="'+(['','a','b','c','d'][v])+'"></i>'}).join('')+'</div><p class="small muted">Use this as a visual rhythm check, not a productivity score.</p></div><div class="card"><div class="eyebrow">PROJECT HEALTH</div><div class="list" style="margin-top:10px">'+data.projects.map(function(p){return '<div class="item"><div class="row"><b>'+esc(p.name)+'</b><span>'+p.progress+'%</span></div><div class="bar" style="margin-top:8px"><i style="width:'+p.progress+'%"></i></div><div class="small muted" style="margin-top:6px">'+esc(p.health)+'</div></div>'}).join('')+'</div></div></div><div class="card" style="margin-top:15px"><div class="eyebrow">WEEKLY REVIEW</div><h2>Three questions</h2><div class="grid g3"><div class="item"><b>What moved?</b><p class="small muted">Look at completed work and project progress.</p></div><div class="item"><b>What is stuck?</b><p class="small muted">Resolve blocked or overdue work before adding more.</p></div><div class="item"><b>What should stop?</b><p class="small muted">Archive work that no longer serves a real outcome.</p></div></div></div>','Analytics','See patterns in your work without turning the OS into a vanity dashboard.');}
function decisions(){return layout('<div class="row" style="margin-bottom:12px"><span class="small muted">Record consequential choices so future-you has context.</span><button class="btn dark" onclick="OS.newDecision()">+ Decision</button></div><div class="list">'+(data.decisions.slice().reverse().map(function(d){return '<div class="card"><div class="row"><b>'+esc(d.title)+'</b><span class="small muted">'+esc(d.date)+'</span></div><p class="copy">'+esc(d.decision)+'</p><div class="small"><b>Why:</b> '+esc(d.reason||'—')+'</div><div class="small muted" style="margin-top:5px">Review: '+esc(d.review||'Not set')+'</div></div>'}).join('')||'<div class="empty">No decisions logged.</div>')+'</div>','Decisions','Make important choices explicit, reviewable, and easier to learn from.');}
function modal(){if(!store.modal)return'';var m=store.modal,o=store.selected||{};if(m==='quick')return '<div class="modal"><div class="modalIn"><div class="row"><div><div class="eyebrow">QUICK CAPTURE</div><h2>Get it out of your head</h2></div><button class="btn" onclick="OS.close()">Close</button></div><div class="form" style="margin-top:15px"><div class="field"><label>Type</label><select id="qtype" class="select"><option value="task">Task</option><option value="note">Note</option><option value="journal">Journal</option><option value="decision">Decision</option></select></div><div class="field"><label>Title</label><input id="qtitle" class="input" placeholder="What is it?"></div><div class="field" style="grid-column:1/-1"><label>Details</label><textarea id="qbody" class="area" placeholder="Context, next action, or thought…"></textarea></div></div><div style="margin-top:14px;text-align:right"><button class="btn dark" onclick="OS.capture()">Save</button></div></div></div>';if(m==='task')return formTask(o);if(m==='project')return formProject(o);if(m==='journal')return formJournal(o);if(m==='decision')return formDecision(o);if(m==='knowledge')return '<div class="modal"><div class="modalIn"><div class="row"><div><span class="pill">'+esc(o.tag)+'</span><h2>'+esc(o.title)+'</h2></div><button class="btn" onclick="OS.close()">Close</button></div><p class="copy">Define the objective and current state. Gather observable signals, isolate the relevant layer, choose the smallest safe action, verify the result, and document what worked.</p><div class="item"><b>Practical loop</b><ol><li>Define the problem.</li><li>Verify current state.</li><li>Isolate the failing layer.</li><li>Apply a small reversible change.</li><li>Verify and document.</li></ol></div></div></div>';return''}
function formTask(o){return '<div class="modal"><div class="modalIn"><div class="row"><h2>'+(o.id?'Edit':'New')+' Task</h2><button class="btn" onclick="OS.close()">Close</button></div><div class="form" style="margin-top:14px"><div class="field"><label>Title</label><input id="f_title" class="input" value="'+esc(o.title||'')+'"></div><div class="field"><label>Project</label><input id="f_project" class="input" value="'+esc(o.project||'')+'"></div><div class="field"><label>Priority</label><select id="f_priority" class="select"><option '+(o.priority==='High'?'selected':'')+'>High</option><option '+(o.priority==='Medium'?'selected':'')+'>Medium</option><option '+(o.priority==='Low'?'selected':'')+'>Low</option></select></div><div class="field"><label>Lane</label><select id="f_lane" class="select"><option '+(o.lane==='NOW'?'selected':'')+'>NOW</option><option '+(o.lane==='FOLLOW-UP'?'selected':'')+'>FOLLOW-UP</option><option '+(o.lane==='LATER'?'selected':'')+'>LATER</option></select></div><div class="field"><label>Status</label><select id="f_status" class="select"><option '+(o.status==='Todo'?'selected':'')+'>Todo</option><option '+(o.status==='In Progress'?'selected':'')+'>In Progress</option><option '+(o.status==='Blocked'?'selected':'')+'>Blocked</option><option '+(o.status==='Done'?'selected':'')+'>Done</option></select></div><div class="field"><label>Due</label><input id="f_due" type="date" class="input" value="'+esc(o.due||'')+'"></div></div><div style="margin-top:14px;text-align:right"><button class="btn dark" onclick="OS.saveTask('+(o.id||0)+')">Save Task</button></div></div></div>'}
function formProject(o){return '<div class="modal"><div class="modalIn"><div class="row"><h2>Project</h2><button class="btn" onclick="OS.close()">Close</button></div><div class="form" style="margin-top:14px"><div class="field"><label>Name</label><input id="p_name" class="input" value="'+esc(o.name||'')+'"></div><div class="field"><label>Progress %</label><input id="p_progress" type="number" min="0" max="100" class="input" value="'+(o.progress||0)+'"></div><div class="field" style="grid-column:1/-1"><label>Outcome</label><textarea id="p_goal" class="area">'+esc(o.goal||'')+'</textarea></div><div class="field"><label>Health</label><select id="p_health" class="select"><option>On track</option><option>Needs focus</option><option>At risk</option></select></div></div><div style="margin-top:14px;text-align:right"><button class="btn dark" onclick="OS.saveProject('+(o.id||0)+')">Save Project</button></div></div></div>'}
function formJournal(){return '<div class="modal"><div class="modalIn"><div class="row"><h2>Journal Entry</h2><button class="btn" onclick="OS.close()">Close</button></div><div class="field" style="margin-top:14px"><label>Title</label><input id="j_title" class="input" placeholder="Daily reflection"></div><div class="field" style="margin-top:12px"><label>Entry</label><textarea id="j_body" class="area" placeholder="What happened? What did you learn? What changes next?"></textarea></div><div style="margin-top:14px;text-align:right"><button class="btn dark" onclick="OS.saveJournal()">Save Entry</button></div></div></div>'}
function formDecision(){return '<div class="modal"><div class="modalIn"><div class="row"><h2>Decision Log</h2><button class="btn" onclick="OS.close()">Close</button></div><div class="form" style="margin-top:14px"><div class="field" style="grid-column:1/-1"><label>Decision</label><input id="d_title" class="input" placeholder="What did I decide?"></div><div class="field" style="grid-column:1/-1"><label>Context / reason</label><textarea id="d_reason" class="area"></textarea></div><div class="field"><label>Review date</label><input id="d_review" type="date" class="input"></div></div><div style="margin-top:14px;text-align:right"><button class="btn dark" onclick="OS.saveDecision()">Save Decision</button></div></div></div>'}
function render(){var c={home:home,tasks:tasks,projects:projects,knowledge:knowledge,journal:journal,analytics:analytics,decisions:decisions}[store.page]||home;document.getElementById('app').innerHTML=c()+modal()}
window.OS={nav:nav,quick:function(){openModal('quick')},close:closeModal,search:function(v){store.q=v;render()},result:function(type,title){store.q='';if(type==='Task'){var t=data.tasks.find(function(x){return x.title===title});openModal('task',t)}else if(type==='Project'){var p=data.projects.find(function(x){return x.name===title});openModal('project',p)}else if(type==='Note'){toast('Personal note found: '+title)}else openModal('knowledge',{title:title,tag:title.split(' — ')[0]})},knowledge:function(title,tag){openModal('knowledge',{title:title,tag:tag})},newTask:function(){openModal('task')},editTask:function(x){openModal('task',data.tasks.find(function(t){return t.id===x}))},newProject:function(){openModal('project')},newJournal:function(){openModal('journal')},newDecision:function(){openModal('decision')},capture:function(){var typ=document.getElementById('qtype').value,title=document.getElementById('qtitle').value.trim(),body=document.getElementById('qbody').value.trim();if(!title){toast('Add a title');return}if(typ==='task')data.tasks.push({id:id(),title:title,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'});if(typ==='note')data.notes.push({id:id(),title:title,tag:'Captured',body:body,area:'Inbox'});if(typ==='journal')data.journal.push({id:id(),title:title,body:body,date:today()});if(typ==='decision')data.decisions.push({id:id(),title:title,decision:body,reason:'Captured quickly',date:today(),review:''});log('Captured '+typ+': '+title);closeModal();toast('Captured')},saveTask:function(taskId){var t=taskId?data.tasks.find(function(x){return x.id===taskId}):{id:id()};t.title=document.getElementById('f_title').value.trim();t.project=document.getElementById('f_project').value.trim();t.priority=document.getElementById('f_priority').value;t.lane=document.getElementById('f_lane').value;t.status=document.getElementById('f_status').value;t.due=document.getElementById('f_due').value;t.area=t.area||'Work';if(!taskId)data.tasks.push(t);log((taskId?'Updated ':'Created ')+t.title);closeModal();toast('Saved')},saveProject:function(pid){var p=pid?data.projects.find(function(x){return x.id===pid}):{id:id()};p.name=document.getElementById('p_name').value.trim();p.progress=Number(document.getElementById('p_progress').value)||0;p.goal=document.getElementById('p_goal').value.trim();p.health=document.getElementById('p_health').value;if(!pid)data.projects.push(p);log('Updated project: '+p.name);closeModal();toast('Saved')},saveJournal:function(){var title=document.getElementById('j_title').value.trim()||'Daily reflection',body=document.getElementById('j_body').value.trim();if(!body){toast('Write something first');return}data.journal.push({id:id(),title:title,body:body,date:today()});log('Added journal entry');closeModal();toast('Saved')},saveDecision:function(){var title=document.getElementById('d_title').value.trim(),reason=document.getElementById('d_reason').value.trim();if(!title){toast('Add the decision');return}data.decisions.push({id:id(),title:title,decision:title,reason:reason,date:today(),review:document.getElementById('d_review').value});log('Logged decision: '+title);closeModal();toast('Saved')},exportData:function(){var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-os-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}};save();render();document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.querySelector('.search').focus()}if(e.key.toLowerCase()==='n'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA')OS.quick();if(e.key==='Escape'&&store.modal)OS.close()});})();
</script></body></html>
