<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;background:#f4f5f7;color:#111}.app{min-height:100vh;background:radial-gradient(circle at 10% 0%,#fff 0,rgba(255,255,255,.9) 24%,transparent 46%),linear-gradient(180deg,#f5f5f7,#eceef2)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1480px;margin:auto;min-height:100vh;padding:18px;display:flex;gap:18px}.side{width:248px;flex:0 0 248px;padding:18px;border-radius:28px;background:rgba(255,255,255,.78);border:1px solid #fff;box-shadow:0 20px 65px rgba(15,23,42,.08);backdrop-filter:blur(24px);display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;padding:7px 7px 18px}.mark{width:42px;height:42px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:850}.brand b{display:block}.brand small{display:block;color:#8d929a;margin-top:2px}.nav{display:grid;gap:5px}.nav button,.mobile button{padding:12px 13px;border-radius:14px;background:transparent;color:#686d76;font-weight:750;text-align:left}.nav button.on,.nav button:hover,.mobile button.on{background:#111;color:#fff}.foot{margin-top:auto;background:#111;color:#fff;border-radius:20px;padding:14px}.foot b{font-size:13px}.foot span{display:block;margin-top:4px;color:#b9bcc2;font-size:11px;line-height:1.5}.main{flex:1;min-width:0;padding:4px 4px 30px}.top{display:flex;gap:10px;align-items:center;padding-bottom:16px}.searchWrap{position:relative;flex:1}.search{width:100%;height:48px;padding:0 16px;border-radius:16px;border:1px solid #e3e5e8;background:rgba(255,255,255,.84);outline:0;box-shadow:0 8px 26px rgba(15,23,42,.05)}.actions{display:flex;gap:8px}.btn{padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.84);border:1px solid #e0e2e6;color:#30323a;font-weight:780}.btn.dark{background:#111;color:#fff;border-color:#111}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:6px 0 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#92979f;font-weight:850}.h1{font-size:clamp(36px,5vw,60px);line-height:1.02;letter-spacing:-.06em;font-weight:860;margin:7px 0 0}.h2{font-size:27px;letter-spacing:-.045em;font-weight:840;margin:5px 0 0}.copy{color:#70757f;line-height:1.65}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:rgba(255,255,255,.77);border:1px solid #fff;border-radius:25px;padding:21px;box-shadow:0 18px 58px rgba(15,23,42,.07);backdrop-filter:blur(22px)}.hero{padding:28px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(245,246,249,.85))}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:10px}.item{padding:14px;border-radius:18px;background:rgba(255,255,255,.65);border:1px solid #edf0f2}.muted{color:#8a8f98}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#eff0f3;color:#5d626b;font-size:11px;font-weight:820}.pill.dark{background:#111;color:#fff}.pill.green{background:#e9f7ee;color:#236d3d}.pill.amber{background:#fff5d8;color:#765600}.pill.red{background:#fff0f1;color:#a52835}.kpi{font-size:34px;font-weight:860;letter-spacing:-.05em;margin-top:4px}.bar{height:8px;border-radius:999px;background:#e7e8eb;overflow:hidden}.bar i{display:block;height:100%;background:#111;border-radius:999px}.task{display:grid;grid-template-columns:1.7fr .7fr .7fr .85fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #eceef0}.task:first-child{border-top:0}.taskTitle{font-weight:790}.small{font-size:12px}.icon{padding:8px 10px;border-radius:11px;background:#eef0f3;color:#50545b;font-weight:820}.knowledgeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.knowledgeCard{min-height:185px;cursor:pointer;transition:.15s}.knowledgeCard:hover{transform:translateY(-2px);box-shadow:0 22px 62px rgba(15,23,42,.11)}.article{white-space:pre-wrap;line-height:1.8;color:#454a52}.chips{display:flex;gap:7px;flex-wrap:wrap}.results{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid #e8eaed;border-radius:18px;padding:7px;box-shadow:0 20px 50px rgba(15,23,42,.13);z-index:25;max-height:60vh;overflow:auto}.result{display:block;width:100%;padding:10px;border-radius:12px;background:transparent;text-align:left}.result:hover{background:#f1f2f4}.timeline{display:grid}.event{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-top:1px solid #eceef0}.event:first-child{border-top:0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.24);backdrop-filter:blur(12px);display:grid;place-items:center;padding:20px;z-index:50}.modalIn{width:min(780px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 30px 100px rgba(15,23,42,.2)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#81868e;font-weight:840;margin-bottom:6px}.input,.select,.area{width:100%;padding:11px 12px;border-radius:13px;border:1px solid #dfe2e6;background:#f7f8f9;outline:0}.area{min-height:130px;resize:vertical}.mobile{display:none}
@media(max-width:1080px){.shell{display:block;padding:10px}.side{display:none}.main{padding-bottom:88px}.mobile{display:flex;position:fixed;left:10px;right:10px;bottom:10px;padding:7px;background:rgba(255,255,255,.91);backdrop-filter:blur(24px);border-radius:23px;box-shadow:0 18px 55px rgba(15,23,42,.14);z-index:40}.mobile button{flex:1;text-align:center;font-size:10px;padding:11px 5px}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.knowledgeGrid{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:1fr auto}.task>:nth-child(2),.task>:nth-child(3),.task>:nth-child(4){display:none}.top{flex-wrap:wrap}.searchWrap{width:100%}.actions{width:100%}.actions .btn{flex:1}.form{grid-template-columns:1fr}}@media(max-width:650px){.g4,.g2,.knowledgeGrid{grid-template-columns:1fr}.card,.hero{padding:18px;border-radius:22px}.h1{font-size:39px}.actions .btn:not(.dark){display:none}.event{grid-template-columns:1fr}.top{padding-bottom:12px}}

<div id="app" class="app"></div>
<script>
(function(){
'use strict';
const VERSION='7.1',KEY='personal_os_v71';
const domains={
'Linux':['CPU Troubleshooting','Memory & Swap','Disk Space','Disk I/O','Load Average','Processes & Signals','Systemd Services','Journalctl','File Permissions','SSH Hardening','Package Management','Linux Networking','Cron & Timers','Environment Variables','Logs & Rotation','Boot Troubleshooting'],
'RHEL':['DNF Package Management','SELinux Modes','SELinux Troubleshooting','firewalld','nmcli','LVM','Logical Volume Expansion','XFS Management','Chrony Time Sync','System Performance','Boot Troubleshooting','Kernel Parameters','Subscription Management','Cockpit','System Roles','Resource Limits'],
'Networking':['TCP vs UDP','DNS Troubleshooting','HTTP Status Codes','TLS Handshake','Routing Tables','ARP & Neighbor Discovery','NAT','CIDR & Subnets','Ports & Sockets','Packet Capture','MTU Problems','Load Balancing','DHCP','BGP Basics','VLANs','Network Troubleshooting Method'],
'Cybersecurity':['CIA Triad','Authentication vs Authorization','Least Privilege','Defense in Depth','Phishing Detection','Password Security','MFA','Vulnerability Management','Incident Response','Threat Modeling','Security Logging','Zero Trust','Attack Surface','Security Baselines','Patch Management','Security Monitoring'],
'SIEM / SOC':['SIEM Architecture','Log Sources','Parsing & Normalization','Correlation Rules','Use Cases','False Positives','Incident Triage','Evidence Collection','QRadar Basics','SOC Escalation','Log Retention','Detection Engineering','Offense Investigation','Event Search','Reference Sets','SOC Metrics'],
'Cloud':['IaaS PaaS SaaS','VPC Concepts','IAM','Security Groups','Load Balancers','Object Storage','Cloud Monitoring','Cloud DNS','Autoscaling','High Availability','Backup & Disaster Recovery','Cloud Cost Basics','Regions & Zones','Cloud Networking','Secrets Management','Cloud Logging'],
'DevOps':['Git Workflow','Branching Strategies','CI/CD','Build Artifacts','Deployment Strategies','Blue-Green Deployments','Canary Releases','Infrastructure as Code','Secrets Management','Container Basics','Health Checks','Rollback Strategy','Release Gates','Observability','Artifact Promotion','Configuration Management'],
'Programming':['Variables & Types','Functions','Error Handling','Data Structures','Algorithms','Regular Expressions','JSON','REST APIs','Async Programming','Testing','Logging','Debugging','Version Control','Input Validation','API Design','Performance Basics'],
'Databases':['SQL Basics','Indexes','Query Plans','Transactions','ACID','Locks & Deadlocks','Connection Pools','Backup & Restore','Replication','Normalization','Database Monitoring','Slow Query Troubleshooting','Partitioning','Caching','Schema Migrations','Data Integrity'],
'AI & ML':['AI vs ML','Supervised Learning','Unsupervised Learning','Neural Networks','Embeddings','RAG','Prompt Engineering','Evaluation','Hallucinations','Fine-Tuning','Inference','AI Safety','Agents','Context Windows','Vector Search','Model Monitoring'],
'Productivity':['Inbox Processing','Deep Work','Prioritization','Weekly Review','Goal Setting','Task Decomposition','Context Switching','Meeting Notes','Knowledge Capture','Personal Metrics','Decision Logs','Habit Design','Daily Planning','Follow-up Management','Focus Blocks','Review Rituals']};
const summaries={Linux:'Practical Linux operations using observable system state, safe commands and reversible troubleshooting.',RHEL:'RHEL administration patterns with verification, change discipline and recovery in mind.',Networking:'A layered network troubleshooting reference: verify the endpoint, path, service and evidence before changing configuration.',Cybersecurity:'Security fundamentals centered on least privilege, layered controls, evidence and explicit risk ownership.','SIEM / SOC':'SOC reference connecting logs, detection quality, investigation scope, evidence handling and escalation.',Cloud:'Cloud operations reference focused on identity, networking, observability, resilience and cost awareness.',DevOps:'Delivery reference focused on repeatability, validation, automation and safe rollback.',Programming:'Programming reference focused on clear inputs/outputs, failure handling, tests and observability.',Databases:'Database operations reference focused on measurement, integrity, query behavior, locking and recovery.','AI & ML':'AI/ML reference focused on concepts, retrieval, evaluation, uncertainty and responsible use.',Productivity:'Productivity reference focused on reducing friction, making next actions explicit and reviewing outcomes.'};
const builtIn=[];Object.keys(domains).forEach(domain=>domains[domain].forEach((title,i)=>builtIn.push({id:'kb-'+i+'-'+domain,title,category:domain,kind:'Built-in',summary:summaries[domain],tags:[domain,title],body:title+'\\n\\nPractical reference\\nDefine the objective and current state first. Gather observable signals, isolate the failing layer or decision, choose the smallest safe action, verify the result, and document the outcome.\\n\\nChecklist\\n1. Define the problem or objective.\\n2. Verify current state with measurements, logs or direct observation.\\n3. Isolate the relevant component, dependency or context.\\n4. Apply the smallest reversible change.\\n5. Verify the outcome and record what changed.\\n\\nOperational note\\nPrefer commands and actions that are easy to explain, reproduce and reverse.')));
function now(){return new Date().toISOString()}
function uid(){return Date.now()+Math.floor(Math.random()*10000)}
function clone(o){return JSON.parse(JSON.stringify(o))}
const seed={schemaVersion:7,createdAt:now(),updatedAt:now(),settings:{workspaceName:'Personal OS',dailyObjective:'Capture useful knowledge and turn the right context into action.'},areas:['Work','Personal','Learning','Projects'],tasks:[{id:1,title:'Explore the Knowledge Engine',project:'Personal OS',area:'Projects',lane:'NOW',priority:'High',status:'In Progress',due:new Date().toISOString().slice(0,10),dependsOn:[],context:'Deep Work',createdAt:now(),updatedAt:now()},{id:2,title:'Review important customer follow-up',project:'',area:'Work',lane:'FOLLOW-UP',priority:'High',status:'Todo',due:new Date(Date.now()+86400000).toISOString().slice(0,10),dependsOn:[],context:'Computer',createdAt:now(),updatedAt:now()}],projects:[{id:1,name:'Personal OS',description:'Personal command center and second brain',goal:'Build a private operating system for everyday work and learning',progress:72,health:'On track'},{id:2,name:'SIEM Automation',description:'Evidence collection and reporting',goal:'Reduce manual evidence work',progress:78,health:'On track'},{id:3,name:'Prod1',description:'Personal product development',goal:'Ship the next useful product milestone',progress:64,health:'Needs focus'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.',project:'',area:'Learning',links:[]},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source, destination, device and event type before requesting high-volume logs.',project:'SIEM Automation',area:'Work',links:[]}],activity:[{id:1,text:'Personal OS V7.1 runtime initialized',time:now(),type:'system'}],trash:[]};
function normalize(x){if(!x||typeof x!=='object')return clone(seed);const d=clone(seed);Object.assign(d,x);d.schemaVersion=7;d.settings=Object.assign({},seed.settings,x.settings||{});for(const k of ['areas','tasks','projects','notes','activity','trash'])if(!Array.isArray(d[k]))d[k]=clone(seed[k]);d.tasks=d.tasks.map(t=>Object.assign({},t,{id:t.id||uid(),title:String(t.title||'Untitled task'),project:String(t.project||''),area:String(t.area||'Personal'),lane:['NOW','LATER','FOLLOW-UP'].includes(t.lane)?t.lane:'LATER',priority:['High','Medium','Low'].includes(t.priority)?t.priority:'Medium',status:['Todo','In Progress','Blocked','Done'].includes(t.status)?t.status:'Todo',due:/^\\d{4}-\\d{2}-\\d{2}$/.test(t.due||'')?t.due:'',dependsOn:Array.isArray(t.dependsOn)?t.dependsOn:[],context:String(t.context||'General')}));return d}
function load(){try{const direct=JSON.parse(localStorage.getItem(KEY));if(direct)return normalize(direct);for(const k of ['personal_os_v7','personal_os_v6','personal_os_v5','personal_os_v4','personal_os_v3','personal_os_v2','personal_os_v1']){const x=JSON.parse(localStorage.getItem(k));if(x)return normalize(x)}}catch(e){}return clone(seed)}
let data=load(),page='home',query='',category='All',selected=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},data,{updatedAt:now()})))}catch(e){}}
function log(text,type){data.activity.unshift({id:uid(),text,time:now(),type:type||'system'});data.activity=data.activity.slice(0,260);save()}
function score(t){if(t.status==='Done')return-9999;let s={High:60,Medium:35,Low:15}[t.priority]||15;const p=data.projects.find(x=>x.name===t.project);if(p&&p.health==='At risk')s+=35;if(p&&p.health==='Needs focus')s+=20;if(t.lane==='NOW')s+=30;if(t.lane==='FOLLOW-UP')s+=18;if(t.status==='Blocked')s-=45;if(t.due){const n=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(n<0)s+=65;else if(n===0)s+=50;else if(n===1)s+=32;else if(n<=3)s+=18}return s}
function fields(x){return JSON.stringify(x).toLowerCase()}
function searchAll(q){const w=q.toLowerCase().split(/\\s+/).filter(Boolean);if(!w.length)return[];return [...builtIn.map(x=>Object.assign({},x,{score:w.reduce((n,z)=>n+(x.title.toLowerCase().includes(z)?5:0)+(fields(x).includes(z)?1:0),0)})),...data.notes.map(x=>Object.assign({},x,{kind:'Personal',category:x.tag,summary:x.body.slice(0,140),score:w.reduce((n,z)=>n+(fields(x).includes(z)?2:0),0)})),...data.tasks.map(x=>Object.assign({},x,{kind:'Task',category:x.project||x.area,summary:x.context,score:w.reduce((n,z)=>n+(fields(x).includes(z)?2:0),0)})),...data.projects.map(x=>Object.assign({},x,{kind:'Project',category:x.health,summary:x.description,score:w.reduce((n,z)=>n+(fields(x).includes(z)?2:0),0)}))].filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,20)}
function related(note){const n=new Set((note.title+' '+note.tag+' '+note.body+' '+note.project+' '+note.area).toLowerCase().split(/\\W+/).filter(Boolean));return data.tasks.map(t=>({t,n:(t.title+' '+t.project+' '+t.area+' '+t.context).toLowerCase().split(/\\W+/).filter(z=>n.has(z)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,4)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function badge(text,cls){return '<span class="pill '+(cls||'')+'">'+esc(text)+'</span>'}
function header(title,kicker,copy,action){return '<div class="head"><div><div class="eyebrow">'+esc(kicker)+'</div><div class="h1">'+esc(title)+'</div><div class="copy">'+esc(copy)+'</div></div>'+(action||'')+'</div>'}
function home(){const open=data.tasks.filter(t=>t.status!=='Done').sort((a,b)=>score(b)-score(a));const top=open.slice(0,3),risk=data.projects.filter(p=>['Needs focus','At risk'].includes(p.health));const follow=open.filter(t=>t.lane==='FOLLOW-UP').length;return '<div class="card hero"><div class="eyebrow">Personal Brain · Knowledge Engine</div><div class="h1">Good evening, Aditya</div><p class="copy">'+esc(data.settings.dailyObjective)+'</p><div class="chips">'+badge(open.length+' open','dark')+badge(builtIn.length+' built-in')+badge(data.notes.length+' personal notes')+badge(Object.keys(domains).length+' domains')+'</div></div><div class="grid g4" style="margin-top:18px"><div class="card"><div class="muted small">DO THIS NOW</div><div class="kpi" style="font-size:22px">'+esc(top[0]?top[0].title:'Clear the queue')+'</div><div class="copy small">Ranked by lane, priority, deadline, project health and blockers.</div></div><div class="card"><div class="muted small">KNOWLEDGE</div><div class="kpi">'+(builtIn.length+data.notes.length)+'</div><div class="copy small">Reference entries + private notes.</div></div><div class="card"><div class="muted small">FOLLOW-UPS</div><div class="kpi">'+follow+'</div><div class="copy small">Response-driven work.</div></div><div class="card"><div class="muted small">PROJECTS AT RISK</div><div class="kpi">'+risk.length+'</div><div class="copy small">Needs focus or at risk.</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="row"><div><div class="eyebrow">Execution</div><div class="h2">Daily Top 3</div></div><button class="btn dark" onclick="go('focus')">Focus</button></div><div class="list" style="margin-top:14px">'+top.map((t,i)=>'<div class="item"><div class="row"><div>'+badge('#'+(i+1))+' <strong>'+esc(t.title)+'</strong><div class="muted small">'+esc(t.project||t.area)+' · '+esc(t.lane)+' · '+esc(t.priority)+'</div></div><button class="icon" onclick="toggleTask('+t.id+')">Done</button></div></div>').join('')+'</div></div><div class="card"><div class="eyebrow">Second brain</div><div class="h2">Explore knowledge</div><p class="copy">Search the built-in technical library or your own notes. Every personal note can connect back to execution.</p><button class="btn dark" onclick="go('knowledge')">Open Knowledge</button></div></div>'}
function focus(){const top=data.tasks.filter(t=>t.status!=='Done').sort((a,b)=>score(b)-score(a)).slice(0,3);return header('Focus','Execution engine','One next action, ranked from your connected workspace.')+'<div class="grid g3">'+top.map((t,i)=>'<div class="card '+(i===0?'hero':'')+'">'+badge(i===0?'DO THIS NOW':'TOP '+(i+1),'dark')+'<div class="h2">'+esc(t.title)+'</div><div class="copy small">'+esc(t.project||t.area)+' · '+esc(t.context)+'</div><div class="chips" style="margin-top:12px">'+badge(t.lane)+badge(t.priority)+(t.due?badge('Due '+t.due):'')+'</div><div style="margin-top:14px"><button class="btn dark" onclick="toggleTask('+t.id+')">Mark done</button></div></div>').join('')+'</div>'}
function tasks(){return header('Tasks','Execution','NOW · LATER · FOLLOW-UP with project and context.', '<button class="btn dark" onclick="openTask()">New task</button>')+'<div class="card"><div class="list">'+data.tasks.map(t=>'<div class="task"><div><div class="taskTitle">'+esc(t.title)+'</div><div class="muted small">'+esc(t.project||t.area)+' · '+esc(t.context)+'</div></div>'+badge(t.lane)+badge(t.priority)+badge(t.status,t.status==='Blocked'?'red':'')+'<div><button class="icon" onclick="toggleTask('+t.id+')">Done</button> <button class="icon" onclick="openTask('+t.id+')">Edit</button></div></div>').join('')+'</div></div>'}
function projects(){return header('Projects','Context','Goals, execution and knowledge in one place.')+'<div class="grid g3">'+data.projects.map(p=>{const ts=data.tasks.filter(t=>t.project===p.name),dn=ts.filter(t=>t.status==='Done').length,pct=ts.length?Math.round(dn/ts.length*100):p.progress,ns=data.notes.filter(n=>n.project===p.name);return '<div class="card"><div class="row">'+badge(p.health,p.health==='At risk'?'red':p.health==='Needs focus'?'amber':'green')+'<span class="muted small">'+ts.length+' tasks · '+ns.length+' notes</span></div><div class="h2">'+esc(p.name)+'</div><div class="copy small">'+esc(p.description)+'</div><div class="section small" style="margin-top:14px"><strong>Goal</strong><div class="muted">'+esc(p.goal)+'</div></div><div class="bar" style="margin-top:14px"><i style="width:'+pct+'%"></i></div><div class="row small" style="margin-top:7px"><span>'+pct+'% pulse</span><span>'+ts.filter(t=>t.status!=='Done').length+' open</span></div></div>'}).join('')+'</div>'}
function knowledge(){let list=category==='All'?builtIn.concat(data.notes.map(n=>Object.assign({},n,{kind:'Personal',category:n.tag,summary:n.body.slice(0,140),tags:[n.tag,n.project,n.area]}))):category==='Personal'?data.notes.map(n=>Object.assign({},n,{kind:'Personal',category:n.tag,summary:n.body.slice(0,140),tags:[n.tag,n.project,n.area]})):builtIn.filter(x=>x.category===category);return header('Knowledge','Second Brain','A large built-in technical reference plus your private knowledge, searchable together.', '<button class="btn dark" onclick="openNote()">New note</button>')+'<div class="grid g3"><div class="card"><div class="muted small">TOTAL LIBRARY</div><div class="kpi">'+(builtIn.length+data.notes.length)+'</div><div class="copy small">'+builtIn.length+' built-in · '+data.notes.length+' personal.</div></div><div class="card"><div class="muted small">DOMAINS</div><div class="kpi">'+Object.keys(domains).length+'</div><div class="copy small">Technical reference organized by domain.</div></div><div class="card"><div class="muted small">SOURCE</div><div class="kpi">0 API</div><div class="copy small">Bundled locally. No backend required.</div></div></div><div class="chips" style="margin-top:18px">'+['All'].concat(Object.keys(domains)).concat(['Personal']).map(c=>'<button class="pill '+(category===c?'dark':'')+'" onclick="setCategory('+JSON.stringify(c)+')">'+esc(c)+'</button>').join('')+'</div><div class="knowledgeGrid" style="margin-top:18px">'+list.map(n=>'<div class="card knowledgeCard" onclick="viewKnowledge('+JSON.stringify(n.id)+')"><div class="row">'+badge(n.category)+'<span class="muted small">'+esc(n.kind)+'</span></div><div class="h2" style="font-size:20px">'+esc(n.title)+'</div><p class="copy small">'+esc(n.summary)+'</p><div class="chips">'+(n.tags||[]).slice(0,2).map(x=>badge(x)).join('')+'</div></div>').join('')+'</div>'}
function ask(){const hits=query?searchAll(query):data.tasks.filter(t=>t.status!=='Done').sort((a,b)=>score(b)-score(a)).slice(0,5);return header('Ask My OS','Local intelligence','Search your personal context and the built-in knowledge library.')+'<div class="card hero"><div class="h2">What do you want to know?</div><p class="copy">Try “RHEL CPU”, “firewall”, “Prod1”, “SIEM”, or “what should I do now”.</p>'+ (query?'<div class="quote" style="margin-top:14px">Found '+hits.length+' connected records for “'+esc(query)+'”.</div>':'')+'</div><div class="grid g2" style="margin-top:18px">'+hits.map(x=>'<div class="card"><div class="row">'+badge(x.kind||'Task')+badge(x.category||x.project||x.area||'')+'</div><div class="h2" style="font-size:20px">'+esc(x.title)+'</div><div class="copy small">'+esc(x.summary||x.context||'Recommended next action.')+'</div></div>').join('')+'</div>'}
function activity(){return header('Activity','History','A local trail of meaningful workspace changes.')+'<div class="card timeline">'+data.activity.map(e=>'<div class="event"><div class="muted small">'+new Date(e.time).toLocaleString()+'</div><div>'+badge(e.type)+' <strong>'+esc(e.text)+'</strong></div></div>').join('')+'</div>'}
function settings(){return header('Settings','System','Local workspace and Knowledge Engine controls.')+'<div class="grid g2"><div class="card"><div class="h2">Knowledge Engine</div><p class="copy">'+builtIn.length+' built-in entries across '+Object.keys(domains).length+' domains. The knowledge corpus is generated inside the browser app, so it stays available without an API.</p></div><div class="card"><div class="h2">Workspace</div><p class="copy">Your personal tasks, projects and notes are stored locally in this browser.</p><button class="btn dark" onclick="exportData()">Export JSON</button> <button class="btn" onclick="resetData()">Reset</button></div></div>'}
function render(){let body=page==='home'?home():page==='focus'?focus():page==='tasks'?tasks():page==='projects'?projects():page==='knowledge'?knowledge():page==='ask'?ask():page==='activity'?activity():settings();document.getElementById('app').innerHTML='<div class="shell"><aside class="side"><div class="brand"><div class="mark">PO</div><div><b>Personal OS</b><small>Knowledge Engine · V7.1</small></div></div><div class="nav">'+nav().map(x=>'<button class="'+(page===x[0]?'on':'')+'" onclick="go('+JSON.stringify(x[0])+')">'+x[1]+'&nbsp; '+x[2]+'</button>').join('')+'</div><div class="foot"><b>'+builtIn.length+' knowledge entries</b><span>Built-in library + your private local context. ₹0 architecture.</span></div></aside><main class="main"><div class="top"><div class="searchWrap"><input id="search" class="search" value="'+esc(query)+'" placeholder="Search everything…  Ctrl+K" oninput="setQuery(this.value)">'+(query?'<div class="results">'+searchAll(query).map(x=>'<button class="result" onclick="resultClick('+JSON.stringify(x.kind)+','+JSON.stringify(x.id)+')"><div class="row"><strong>'+esc(x.title)+'</strong>'+badge(x.kind)+'</div><div class="muted small">'+esc(x.category||'')+' · '+esc(x.summary||x.context||'')+'</div></button>').join('')+'</div>':'')+'</div><div class="actions"><button class="btn" onclick="openNote()">Capture note</button><button class="btn dark" onclick="openTask()">New task</button></div></div>'+body+'<div class="mobile">'+nav().slice(0,5).map(x=>'<button class="'+(page===x[0]?'on':'')+'" onclick="go('+JSON.stringify(x[0])+')">'+x[1]+'<br>'+x[2]+'</button>').join('')+'<button class="'+(page==='settings'?'on':'')+'" onclick="go(\"settings\")">•••<br>More</button></div></main></div>';}
function nav(){return [['home','⌂','Home'],['focus','◉','Focus'],['tasks','✓','Tasks'],['projects','◇','Projects'],['knowledge','▣','Knowledge'],['ask','⌕','Ask OS'],['activity','◷','Activity'],['settings','⚙','Settings']]}
window.go=function(p){page=p;selected=null;render()};window.setCategory=function(c){category=c;render()};window.setQuery=function(v){query=v;render();setTimeout(function(){const el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(v.length,v.length)}},0)};
window.toggleTask=function(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='Done'?'Todo':'Done';t.updatedAt=now();log((t.status==='Done'?'Completed: ':'Reopened: ')+t.title,'task');save();render()};
window.resultClick=function(kind,id){query='';if(kind==='Built-in'||kind==='Personal'){page='knowledge';selected=id;render();setTimeout(function(){viewKnowledge(id)},0)}else if(kind==='Task')page='tasks';else if(kind==='Project')page='projects';render()};
window.viewKnowledge=function(id){selected=id;const item=builtIn.find(x=>x.id===id)||data.notes.find(x=>String(x.id)===String(id));if(!item)return;const personal=item.kind==='Personal';let relatedHtml='';if(personal){const rel=related(item);relatedHtml='<div class="grid g2" style="margin-top:18px"><div class="card"><div class="eyebrow">Related tasks</div>'+ (rel.length?rel.map(x=>'<div class="item" style="margin-top:10px"><strong>'+esc(x.t.title)+'</strong><div class="muted small">'+esc(x.t.project||x.t.area)+'</div></div>').join(''):'<div class="muted small" style="margin-top:10px">No strong matches.</div>')+'</div></div><div style="margin-top:18px"><button class="btn dark" onclick="fromNote('+JSON.stringify(item.id)+')">Create task from knowledge</button> <button class="btn" onclick="openNote('+JSON.stringify(item.id)+')">Edit note</button></div>'}document.body.insertAdjacentHTML('beforeend','<div class="modal" id="knowledgeModal"><div class="modalIn"><div class="row"><div><div class="eyebrow">'+esc(item.category)+'</div><div class="h2">'+esc(item.title)+'</div><div class="chips" style="margin-top:8px">'+(item.tags||[]).map(x=>badge(x)).join('')+'</div></div><button class="icon" onclick="closeModal()">Close</button></div><div class="article" style="margin-top:18px">'+esc(item.body)+'</div>'+relatedHtml+'</div></div>')};
window.closeModal=function(){document.querySelectorAll('.modal').forEach(x=>x.remove())};
window.fromNote=function(id){const n=data.notes.find(x=>String(x.id)===String(id));if(!n)return;data.tasks.unshift({id:uid(),title:n.title,project:n.project||'',area:n.area||'Personal',lane:'NOW',priority:'Medium',status:'Todo',due:'',dependsOn:[],context:n.tag||'Knowledge',createdAt:now(),updatedAt:now()});log('Created task from knowledge: '+n.title,'knowledge');save();closeModal();go('tasks')};
window.openTask=function(id){const t=id?data.tasks.find(x=>x.id===id):{title:'',project:'',area:'Personal',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'General'};document.body.insertAdjacentHTML('beforeend','<div class="modal" id="taskModal"><div class="modalIn"><div class="row"><div><div class="eyebrow">Task</div><div class="h2">'+(id?'Edit task':'New task')+'</div></div><button class="icon" onclick="closeModal()">Close</button></div><form class="form" style="margin-top:16px" onsubmit="submitTask(event,'+JSON.stringify(id||'')+')"><div class="field"><label>Title</label><input class="input" name="title" value="'+esc(t.title)+'" required></div><div class="field"><label>Project</label><input class="input" name="project" value="'+esc(t.project)+'"></div><div class="field"><label>Area</label><select class="select" name="area">'+data.areas.map(a=>'<option '+(a===t.area?'selected':'')+'>'+esc(a)+'</option>').join('')+'</select></div><div class="field"><label>Lane</label><select class="select" name="lane">'+['NOW','LATER','FOLLOW-UP'].map(a=>'<option '+(a===t.lane?'selected':'')+'>'+a+'</option>').join('')+'</select></div><div class="field"><label>Priority</label><select class="select" name="priority">'+['High','Medium','Low'].map(a=>'<option '+(a===t.priority?'selected':'')+'>'+a+'</option>').join('')+'</select></div><div class="field"><label>Status</label><select class="select" name="status">'+['Todo','In Progress','Blocked','Done'].map(a=>'<option '+(a===t.status?'selected':'')+'>'+a+'</option>').join('')+'</select></div><div class="field"><label>Due</label><input class="input" type="date" name="due" value="'+esc(t.due)+'"></div><div class="field"><label>Context</label><input class="input" name="context" value="'+esc(t.context)+'"></div><div style="grid-column:1/-1"><button class="btn dark">Save task</button></div></form></div></div>')};
window.submitTask=function(e,id){e.preventDefault();const f=new FormData(e.currentTarget),x={title:String(f.get('title')),project:String(f.get('project')),area:String(f.get('area')),lane:String(f.get('lane')),priority:String(f.get('priority')),status:String(f.get('status')),due:String(f.get('due')),context:String(f.get('context')),dependsOn:[]};if(id){const t=data.tasks.find(q=>String(q.id)===String(id));Object.assign(t,x,{updatedAt:now()});log('Updated task: '+t.title,'task')}else{data.tasks.unshift(Object.assign(x,{id:uid(),createdAt:now(),updatedAt:now()}));log('Created task: '+x.title,'task')}save();closeModal();render()};
window.openNote=function(id){const n=id?data.notes.find(x=>String(x.id)===String(id)):{title:'',tag:'General',body:'',project:'',area:'Personal'};document.body.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalIn"><div class="row"><div><div class="eyebrow">Private knowledge</div><div class="h2">'+(id?'Edit note':'New note')+'</div></div><button class="icon" onclick="closeModal()">Close</button></div><form class="form" style="margin-top:16px" onsubmit="submitNote(event,'+JSON.stringify(id||'')+')"><div class="field"><label>Title</label><input class="input" name="title" value="'+esc(n.title)+'" required></div><div class="field"><label>Tag</label><input class="input" name="tag" value="'+esc(n.tag||'')+'"></div><div class="field"><label>Project</label><input class="input" name="project" value="'+esc(n.project||'')+'"></div><div class="field"><label>Area</label><select class="select" name="area">'+data.areas.map(a=>'<option '+(a===n.area?'selected':'')+'>'+esc(a)+'</option>').join('')+'</select></div><div class="field" style="grid-column:1/-1"><label>Body</label><textarea class="area" name="body">'+esc(n.body||'')+'</textarea></div><div style="grid-column:1/-1"><button class="btn dark">Save note</button></div></form></div></div>')};
window.submitNote=function(e,id){e.preventDefault();const f=new FormData(e.currentTarget),x={title:String(f.get('title')),tag:String(f.get('tag')),body:String(f.get('body')),project:String(f.get('project')),area:String(f.get('area')),links:[]};if(id){const n=data.notes.find(q=>String(q.id)===String(id));Object.assign(n,x);log('Updated note: '+n.title,'knowledge')}else{data.notes.unshift(Object.assign(x,{id:uid()}));log('Created note: '+x.title,'knowledge')}save();closeModal();render()};
window.exportData=function(){const blob=new Blob([JSON.stringify(Object.assign({},data,{exportedAt:now(),builtInKnowledgeCount:builtIn.length}),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-os-v7-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};
window.resetData=function(){if(!confirm('Reset your local workspace to V7 defaults?'))return;data=clone(seed);save();log('Workspace reset to V7 defaults','system');render()};
window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search')?.focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openTask()}if(e.key==='Escape')closeModal()});
render();
})();
</script>
</body></html>
