function render(){document.getElementById('app').innerHTML=app();var s=document.getElementById('globalSearch');if(s&&store.query){s.focus();s.setSelectionRange(s.value.length,s.value.length)}}
function openModal(type,item){store.modal={type:type,item:item||null};render()}
function closeAll(){store.modal=null;store.selected=null;render()}
function handle(a,el){var act=el.getAttribute('data-action'),v=el.getAttribute('data-value'),i=Number(el.getAttribute('data-id'));if(act==='nav')return go(el.getAttribute('data-page'));if(act==='search-input'){store.query=el.value;return render()}if(act==='clear-search'){store.query='';return render()}if(act==='category'){store.category=v;return render()}if(act==='new-task')return openModal('task');if(act==='new-note')return openModal('note');if(act==='new-project')return openModal('project');if(act==='close-modal'||act==='close-selected')return closeAll();if(act==='focus-next'){go('tasks');return}if(act==='toggle-task'){var t=data.tasks.filter(function(x){return x.id===i})[0];if(t){t.status=t.status==='Done'?'Todo':'Done';t.completedAt=t.status==='Done'?now():null;log((t.status==='Done'?'Completed ':'Reopened ')+t.title,'task');save();render()}return}if(act==='edit-task'){return openModal('task',data.tasks.filter(function(x){return x.id===i})[0])}if(act==='delete-task'){var t2=data.tasks.filter(function(x){return x.id===i})[0];if(t2&&confirm('Delete this task?')){data.tasks=data.tasks.filter(function(x){return x.id!==i});log('Deleted task: '+t2.title,'task');save();render()}return}if(act==='edit-project'){return openModal('project',data.projects.filter(function(x){return x.id===i})[0])}if(act==='edit-note'){return openModal('note',data.notes.filter(function(x){return x.id===i})[0]);}if(act==='delete-note'){var n=data.notes.filter(function(x){return x.id===i})[0];if(n&&confirm('Delete this note?')){data.notes=data.notes.filter(function(x){return x.id!==i});log('Deleted note: '+n.title,'knowledge');save();closeAll()}return}if(act==='open-kb'){var all=KB.concat(data.notes.map(function(n){return{id:'n-'+n.id,title:n.title,category:n.tag||n.area,kind:'Personal',summary:n.body.slice(0,140),body:n.body,note:n}}));store.selected=all.filter(function(x){return x.id===el.getAttribute('data-id')})[0]||null;render();return}if(act==='search-result'){var rr=allResults(store.query).filter(function(x){return x.id===el.getAttribute('data-id')})[0];if(rr){if(rr.kind==='Built-in'||rr.kind==='Personal'){store.page='knowledge';store.selected=rr}else if(rr.kind==='Task'){store.page='tasks'}else if(rr.kind==='Project'){store.page='projects'}render()}return}if(act==='note-to-task'){var nn=data.notes.filter(function(x){return x.id===i})[0];if(nn){data.tasks.unshift({id:id(),title:nn.title,project:nn.project||'',area:nn.area||'Personal',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:nn.tag||'Knowledge'});log('Created task from knowledge: '+nn.title,'knowledge');save();store.selected=null;store.page='tasks';render()}return}if(act==='export'){var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v7.3-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported');return}if(act==='import'){document.getElementById('importFile')?.click();return}if(act==='reset'){if(confirm('Reset your local workspace to the V7.3 starter data?')){data=fresh();save();log('Workspace reset','system');save();render();toast('Workspace reset')}}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-action]');if(el)handle(null,el)});document.addEventListener('input',function(e){if(e.target&&e.target.getAttribute('data-action')==='search-input'){store.query=e.target.value;render()}});document.addEventListener('submit',function(e){if(e.target.id==='editForm'){e.preventDefault();var f=new FormData(e.target),m=store.modal;if(m.type==='task'){var x=m.item||{};var z=Object.assign({},x,{id:x.id||id(),title:String(f.get('title')),project:String(f.get('project')),area:String(f.get('area')),lane:String(f.get('lane')),priority:String(f.get('priority')),status:String(f.get('status')),due:String(f.get('due')),context:String(f.get('context')),updatedAt:now(),createdAt:x.createdAt||now()});if(m.item)data.tasks=data.tasks.map(function(t){return t.id===z.id?z:t});else data.tasks.unshift(z);log((m.item?'Updated task: ':'Created task: ')+z.title,'task')}else{var p=m.item||{};var q=Object.assign({},p,{id:p.id||id(),name:String(f.get('name')),goal:String(f.get('goal')),progress:Math.max(0,Math.min(100,Number(f.get('progress')||0))),health:String(f.get('health'))});if(m.item)data.projects=data.projects.map(function(x){return x.id===q.id?q:x});else data.projects.unshift(q);log((m.item?'Updated project: ':'Created project: ')+q.name,'project')}save();store.modal=null;render()}if(e.target.id==='noteForm'){e.preventDefault();var f2=new FormData(e.target),m2=store.modal,n0=m2.item||{},n1=Object.assign({},n0,{id:n0.id||id(),title:String(f2.get('title')),tag:String(f2.get('tag')),body:String(f2.get('body')),project:String(f2.get('project')),area:String(f2.get('area'))});if(m2.item)data.notes=data.notes.map(function(n){return n.id===n1.id?n1:n});else data.notes.unshift(n1);log((m2.item?'Updated note: ':'Created note: ')+n1.title,'knowledge');save();store.modal=null;render()}});document.addEventListener('change',function(e){if(e.target.id==='importFile'&&e.target.files[0]){var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!Array.isArray(x.tasks)||!Array.isArray(x.projects)||!Array.isArray(x.notes))throw new Error('Invalid backup');data=x;log('Imported workspace backup','system');save();render();toast('Backup imported')}catch(err){toast('Import failed: '+err.message)}};r.readAsText(e.target.files[0])}});window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal('task')}if(e.key==='Escape')closeAll()});render();})();</script></body></html>
