const{useEffect,useMemo,useState}=React;const V=5.1,KEY='personal_os_v51',DB='personal_os_db_v5',STORE='workspace',SNAP='snapshots_v5';const iso=()=>new Date().toISOString(),uid=()=>Date.now()+Math.floor(Math.random()*10000),clone=x=>JSON.parse(JSON.stringify(x)),today=()=>new Date().toISOString().slice(0,10);const base={schemaVersion:5.1,createdAt:iso(),updatedAt:iso(),settings:{workspaceName:'Personal OS',dailyObjective:'Protect deep work and close the highest-leverage open loop.'},tasks:[{id:1,title:'Review the highest-leverage open loop',project:'Personal OS',priority:'High',status:'In Progress',due:today(),dependsOn:[],createdAt:iso()} ,{id:2,title:'Review important customer follow-up',project:'Work',priority:'High',status:'Todo',due:new Date(Date.now()+86400000).toISOString().slice(0,10),dependsOn:[],createdAt:iso()},{id:3,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:new Date(Date.now()+3*86400000).toISOString().slice(0,10),dependsOn:[],createdAt:iso()}],projects:[{id:1,name:'Personal OS',description:'Personal command center',progress:50,health:'On track'},{id:2,name:'SIEM Automation',description:'Evidence collection and reporting',progress:78,health:'On track'},{id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus'}],notes:[{id:1,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source, destination, device and event type before requesting high-volume logs.'},{id:2,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'}],activity:[{id:1,text:'Personal OS V5.1 initialized',time:iso(),type:'system'}],trash:[]};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});if(!db.objectStoreNames.contains(SNAP))db.createObjectStore(SNAP,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function dbGet(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).get('current');q.onsuccess=()=>res(q.result?.data||null);q.onerror=()=>rej(q.error)})}async function dbPut(data){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).put({id:'current',data});q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}async function snaps(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(SNAP).objectStore(SNAP).getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)));q.onerror=()=>rej(q.error)})}async function snapPut(data,label='Auto snapshot'){const db=await idb();const row={id:uid(),createdAt:iso(),label,data};return new Promise((res,rej)=>{const q=db.transaction(SNAP,'readwrite').objectStore(SNAP).put(row);q.onsuccess=()=>res(row);q.onerror=()=>rej(q.error)})}async function snapDel(id){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(SNAP,'readwrite').objectStore(SNAP).delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
const words=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(Boolean);function score(t,ps,tasks){if(t.status==='Done')return-1e4;let v={High:60,Medium:35,Low:15}[t.priority]||15;const p=ps.find(x=>x.name===t.project);if(p?.health==='At risk')v+=35;if(p?.health==='Needs focus')v+=20;if(t.due&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)){const d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(d<0)v+=60;else if(d===0)v+=45;else if(d===1)v+=30;else if(d<=3)v+=15}v+=Math.min(24,Math.max(0,Math.floor((Date.now()-new Date(t.createdAt||Date.now()))/86400000))*3);const blocked=(t.dependsOn||[]).some(id=>{const x=tasks.find(z=>z.id===id);return x&&x.status!=='Done'});if(blocked)v-=50;return v}function related(n,d){const nw=new Set(words(n.title+' '+n.tag+' '+n.body));const hit=s=>{const ws=words(s);return ws.reduce((a,w)=>a+(nw.has(w)?1:0),0)};return{tasks:d.tasks.map(x=>({...x,h:hit(x.title+' '+x.project)})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h).slice(0,4),projects:d.projects.map(x=>({...x,h:hit(x.name+' '+x.description)})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h).slice(0,4)}}
function Btn({children,onClick,dark, danger}){return <button className={'btn '+(dark?'dark ':'')+(danger?'danger':'')} onClick={onClick}>{children}</button>}
function App(){const[d,setD]=useState(base),[ready,setReady]=useState(false),[page,setPage]=useState('home'),[q,setQ]=useState(''),[modal,setModal]=useState(null),[sn,setSn]=useState([]),[filter,setFilter]=useState('all');const open=d.tasks.filter(t=>t.status!=='Done'),rank=useMemo(()=>[...open].sort((a,b)=>score(b,d.projects,d.tasks)-score(a,d.projects,d.tasks)),[d]);useEffect(()=>{(async()=>{try{let x=await dbGet();if(!x){for(const k of ['personal_os_v5','personal_os_v4','personal_os_v3','personal_os_v2','personal_os_v1']){try{const old=JSON.parse(localStorage.getItem(k));if(old){x=normalize(old);await snapPut(x,'Pre-V5.1 migration snapshot');break}}catch(e){}}}setD(normalize(x||base));}catch(e){try{setD(normalize(JSON.parse(localStorage.getItem('personal_os_v5')||'null')))}catch(_){} }setReady(true)})()},[]);useEffect(()=>{if(ready){const x={...d,updatedAt:iso()};dbPut(x).catch(()=>localStorage.setItem(KEY,JSON.stringify(x)));localStorage.setItem(KEY,JSON.stringify(x))}},[d,ready]);useEffect(()=>{(async()=>{try{setSn(await snaps())}catch(e){}})()},[page]);useEffect(()=>{const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('global-search')?.focus()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();setModal({kind:'task',item:null})}if(e.key==='Escape')setQ('')};addEventListener('keydown',h);return()=>removeEventListener('keydown',h)},[]);
function log(text,type='system'){setD(x=>({...x,activity:[{id:uid(),text,time:iso(),type},...(Array.isArray(x.activity)?x.activity:[])].slice(0,220)}))}function toggle(id){setD(x=>({...x,tasks:x.tasks.map(t=>t.id===id?{...t,status:t.status==='Done'?'Todo':'Done',completedAt:t.status==='Done'?undefined:iso(),updatedAt:iso()}:t)}));log('Task status changed','task')}function saveTask(t){setD(x=>{const id=t.id||uid(),nt={...t,id,createdAt:t.createdAt||iso(),updatedAt:iso(),dependsOn:Array.isArray(t.dependsOn)?t.dependsOn:[]},exists=x.tasks.some(a=>a.id===id);return{...x,tasks:exists?x.tasks.map(a=>a.id===id?nt:a):[nt,...x.tasks]}});log((t.id?'Updated task: ':'Created task: ')+t.title,'task');setModal(null)}function removeTask(id){setD(x=>{const t=x.tasks.find(a=>a.id===id);return{...x,tasks:x.tasks.filter(a=>a.id!==id),trash:[{kind:'task',deletedAt:iso(),data:t},...x.trash].slice(0,80)}});log('Task moved to recovery bin','recovery')}function saveNote(n){setD(x=>{const id=n.id||uid(),nn={...n,id},e=x.notes.some(a=>a.id===id);return{...x,notes:e?x.notes.map(a=>a.id===id?nn:a):[nn,...x.notes]}});log((n.id?'Updated note: ':'Created note: ')+n.title,'knowledge');setModal(null)}function removeNote(id){setD(x=>{const n=x.notes.find(a=>a.id===id);return{...x,notes:x.notes.filter(a=>a.id!==id),trash:[{kind:'note',deletedAt:iso(),data:n},...x.trash].slice(0,80)}});log('Knowledge note moved to recovery bin','recovery')}function restoreTrash(i){setD(x=>{const r=x.trash[i];if(!r)return x;return r.kind==='task'?{...x,tasks:[r.data,...x.tasks],trash:x.trash.filter((_,j)=>j!==i)}:{...x,notes:[r.data,...x.notes],trash:x.trash.filter((_,j)=>j!==i)}});log('Item restored from recovery bin','recovery')}async function makeSnap(label='Manual snapshot'){await snapPut(d,label);setSn(await snaps());log('Recovery snapshot created','recovery')}async function restoreSnap(row){if(confirm('Restore this local snapshot? Current data will be snapshotted first.')){await makeSnap('Before restore');setD(normalize(row.data));log('Workspace restored from snapshot','recovery')}}async function exportData(){const payload=JSON.stringify({...d,exportedAt:iso(),exportVersion:V});let digest='';try{digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(payload));digest=Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}const out=JSON.stringify({...d,exportedAt:iso(),exportVersion:V,sha256:digest},null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));a.download='personal-os-v5.1-backup.json';a.click();URL.revokeObjectURL(a.href)}function search(){const w=words(q);if(!w.length)return[];const rows=[...d.tasks.map(x=>({...x,type:'Task',text:x.title+' '+x.project+' '+x.status})),...d.projects.map(x=>({...x,type:'Project',text:x.name+' '+x.description+' '+x.health})),...d.notes.map(x=>({...x,type:'Knowledge',text:x.title+' '+x.tag+' '+x.body}))];return rows.map(x=>({...x,s:w.reduce((n,z)=>n+(words(x.text).includes(z)?1:0),0)})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,8)}const res=search();
function Home(){const top=rank.slice(0,3),high=open.filter(t=>t.priority==='High').length,risk=d.projects.filter(p=>['Needs focus','At risk'].includes(p.health));return <><div className="head"><div><div className="eyebrow">Personal OS · V5.1</div><div className="h1">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya.</div><div className="copy">{new Date().toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric'})} · {d.settings.dailyObjective}</div></div><Btn dark onClick={()=>setModal({kind:'task',item:null})}>New task</Btn></div><div className="grid g4"><div className="card"><div className="muted">Open work</div><div className="kpi">{open.length}</div></div><div className="card"><div className="muted">High priority</div><div className="kpi">{high}</div></div><div className="card"><div className="muted">Projects needing focus</div><div className="kpi">{risk.length}</div></div><div className="card"><div className="muted">Recovery items</div><div className="kpi">{d.trash.length}</div></div></div><div className="grid g2" style={{marginTop:16}}><div className="card"><div className="eyebrow">Daily Top 3</div><div className="h2">What deserves attention</div><div className="list" style={{marginTop:14}}>{top.map((t,i)=><div className="item" key={t.id}><div className="row"><b>{i+1}. {t.title}</b><span className="pill dark">{Math.max(0,Math.round(score(t,d.projects,d.tasks)))}</span></div><div className="muted small">{t.project||'No project'} · {t.due||'No due date'} · {t.status}</div></div>)}{!top.length&&<div className="item muted">No open work.</div>}</div></div><div className="card"><div className="eyebrow">Operating pulse</div><div className="h2">Why now</div><div className="list" style={{marginTop:14}}><div className="item"><b>{high?'High-priority work is waiting.':'Priority queue is calm.'}</b><div className="muted small">{high?'Start with the highest scored open loop.':'Protect the current focus block.'}</div function Tasks(){return <><div className="head"><div><div className="eyebrow">Execution</div><div className="h1">Tasks</div></div><Btn dark onClick={()=>setModal({kind:'task',item:null})}>New task</Btn></div><div className="card">{open.map(t=><div className="task" key={t.id}><div><div className="row"><b>{t.title}</b><span className="pill">{Math.max(0,Math.round(score(t,d.projects,d.tasks)))}</span></div><div className="muted small">{t.project||'No project'} · {t.dependsOn?.length||0} dependencies · {t.due||'No due date'}</div></div><span className="pill">{t.priority}</span><span className="pill">{t.status}</span><span className="pill">{t.due||'—'}</span><div style={{display:'flex',gap:6}}><button className="icon" onClick={()=>toggle(t.id)}>Done</button><button className="icon" onClick={()=>setModal({kind:'task',item:t})}>Edit</button><button className="icon" onClick={()=>removeTask(t.id)}>⌫</button></div></div>)}{!open.length&&<div className="muted">Everything is complete.</div>}</div></>}

function Knowledge(){return <><div className="head"><div><div className="eyebrow">Knowledge</div><div className="h1">Library</div></div><Btn dark onClick={()=>setModal({kind:'note',item:null})}>New note</Btn></div><div className="grid g2">{d.notes.map(n=>{const r=related(n,d);return <div className="card" key={n.id}><div className="row"><span className="pill dark">{n.tag}</span><div style={{display:'flex',gap:5}}><button className="icon" onClick={()=>setModal({kind:'note',item:n})}>Edit</button><button className="icon" onClick={()=>removeNote(n.id)}>⌫</button></div></div><div className="h2">{n.title}</div><div className="copy">{n.body}</div><div className="muted small" style={{marginTop:12}}>Related tasks: {r.tasks.length? r.tasks.map(x=>x.title).join(' · '):'None detected locally'}</div><button className="btn" style={{marginTop:10}} onClick={()=>saveTask({title:n.title,project:r.projects[0]?.name||'',priority:'Medium',status:'Todo',due:'',dependsOn:[]})}>Convert to task</button></div>})}</div></>}
function Insights(){const days=[...Array(7)].map((_,i)=>{const dte=new Date(Date.now()-(6-i)*86400000);const k=dte.toISOString().slice(0,10);return{label:dte.toLocaleDateString('en-IN',{weekday:'short'}),n:d.activity.filter(a=>a.time?.slice(0,10)===k).length}});const age=open.length?Math.round(open.reduce((s,t)=>s+Math.max(0,(Date.now()-new Date(t.createdAt||Date.now()))/86400000),0)/open.length):0;return <><div className="head"><div><div className="eyebrow">Signals</div><div className="h1">Insights</div></div></div><div className="grid g4"><div className="card"><div className="muted">Open aging</div><div className="kpi">{age}d</div></div><div className="card"><div className="muted">Knowledge items</div><div className="kpi">{d.notes.length}</div></div><div className="card"><div className="muted">Snapshots</div><div className="kpi">{sn.length}</div></div><div className="card"><div className="muted">Activity events</div><div className="kpi">{d.activity.length}</div></div></div><div className="card" style={{marginTop:16}}><div className="h2">Seven-day execution activity</div><div className="grid g4" style={{marginTop:16}}>{days.map(x=><div key={x.label}><div className="muted small">{x.label}</div><div className="barline" style={{marginTop:7}}><div style={{width:Math.min(100,x.n*18)+'%'}}/></div><div className="muted small" style={{marginTop:5}}>{x.n} events</div></div>)}</div></div></>}
function COO(){const top=rank[0],blocked=open.filter(t=>(t.dependsOn||[]).some(id=>d.tasks.find(x=>x.id===id&&x.status!=='Done'))),stale=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>5*86400000);return <><div className="head"><div><div className="eyebrow">Local intelligence</div><div className="h1">AI COO</div><div className="copy">Deterministic, private and fully browser-side.</div></div></div><div className="grid g3"><div className="card"><div className="eyebrow">Do next</div><div className="h2">{top?.title||'Nothing urgent'}</div><div className="copy" style={{marginTop:8}}>{top?'Highest score after priority, deadline, project health, age and dependency signals.':'Your queue is clear.'}</div></div><div className="card"><div className="eyebrow">Blocked</div><div className="kpi">{blocked.length}</div><div className="copy">Work waiting on unfinished dependencies.</div></div><div className="card"><div className="eyebrow">Neglected</div><div className="kpi">{stale.length}</div><div className="copy">Open items older than five days.</div></div></div></>}
function Activity(){const rows=d.activity.filter(a=>filter==='all'||a.type===filter);return <><div className="head"><div><div className="eyebrow">Trace</div><div className="h1">Activity</div></div><select className="select" style={{width:170}} value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">All events</option><option value="task">Tasks</option><option value="knowledge">Knowledge</option><option value="recovery">Recovery</option><option value="system">System</option></select></div><div className="card"><div className="list">{rows.map(a=><div className="item" key={a.id||uid()}><div className="row"><b>{a.text}</b><span className="muted small">{new Date(a.time).toLocaleString('en-IN')}</span></div><div className="muted small">{a.type}</div></div>)}</div></div></>}
function Settings(){return <><div className="head"><div><div className="eyebrow">System</div><div className="h1">Settings</div></div></div><div className="grid g2"><div className="card"><div className="h2">Recovery</div><div className="copy">Recent local snapshots protect against accidental edits and restores.</div><div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}><Btn dark onClick={()=>makeSnap('Manual snapshot')}>Create snapshot</Btn><Btn onClick={()=>setPage('activity')}>View activity</Btn></div><div className="list" style={{marginTop:14}}>{sn.slice(0,5).map(s=><div className="item" key={s.id}><div className="row"><b>{s.label}</b><button className="icon" onClick={()=>restoreSnap(s)}>Restore</button></div><div className="muted small">{new Date(s.createdAt).toLocaleString('en-IN')}</div></div>)}</div></div><div className="card"><div className="h2">Recovery bin</div><div className="copy">Deleted tasks and knowledge remain recoverable locally.</div><div className="list" style={{marginTop:14}}>{d.trash.map((r,i)=><div className="item" key={i}><div className="row"><b>{r.data?.title||'Deleted item'}</b><button className="icon" onClick={()=>restoreTrash(i)}>Restore</button></div><div className="muted small">{r.kind} · {new Date(r.deletedAt).toLocaleString('en-IN')}</div></div>)}{!d.trash.length&&<div className="item muted">Recovery bin is empty.</div>}</div></div><div className="card"><div className="h2">Workspace</div><div className="copy">IndexedDB primary · localStorage compatibility fallback · schema {d.schemaVersion}</div><div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}><Btn onClick={exportData}>Export backup</Btn><Btn danger onClick={()=>{if(confirm('Reset this workspace to V5.1 demo data?')){setD(clone(base));log('Workspace reset to V5.1 demo data','system')}}}>Reset demo</Btn></div></div></div></>}
function Modal(){if(!modal)return null;if(modal.kind==='task')return <div className="modal"><div className="modalin"><div className="row"><div><div className="eyebrow">Task</div><div className="h2">{modal.item?'Edit task':'New task'}</div></div><button className="icon" onClick={()=>setModal(null)}>✕</button></div><TaskForm item={modal.item}/></div></div>;return <div className="modal"><div className="modalin"><div className="row"><div><div className="eyebrow">Knowledge</div><div className="h2">{modal.item?'Edit note':'New note'}</div></div><button className="icon" onClick={()=>setModal(null)}>✕</button></div><NoteForm item={modal.item}/></div></div>}
function TaskForm({item}){const[x,setX]=useState(item||{title:'',project:'',priority:'Medium',status:'Todo',due:'',dependsOn:[]});const deps=d.tasks.filter(t=>t.id!==x.id);return <div className="form" style={{marginTop:16}}><div className="field" style={{gridColumn:'1/-1'}}><label>Title</label><input className="input" value={x.title} onChange={e=>setX({...x,title:e.target.value})}/></div><div className="field"><label>Project</label><input className="input" value={x.project} onChange={e=>setX({...x,project:e.target.value})}/></div><div className="field"><label>Priority</label><select className="select" value={x.priority} onChange={e=>setX({...x,priority:e.target.value})}><option>High</option><option>Medium</option><option>Low</option></select></div><div className="field"><label>Status</label><select className="select" value={x.status} onChange={e=>setX({...x,status:e.target.value})}><option>Todo</option><option>In Progress</option><option>Blocked</option><option>Done</option></select></div><div className="field"><label>Due</label><input className="input" type="date" value={x.due||''} onChange={e=>setX({...x,due:e.target.value})}/></div><div className="field" style={{gridColumn:'1/-1'}}><label>Depends on</label><select className="select" multiple value={x.dependsOn||[]} onChange={e=>setX({...x,dependsOn:[...e.target.selectedOptions].map(o=>Number(o.value))})}>{deps.map(t=><option value={t.id} key={t.id}>{t.title}</option>)}</select></div><div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end',gap:8,marginTop:6}}><Btn onClick={()=>setModal(null)}>Cancel</Btn><Btn dark onClick={()=>x.title.trim()&&saveTask(x)}>Save task</Btn></div></div>}
function NoteForm({item}){const[x,setX]=useState(item||{title:'',tag:'General',body:''});return <div style={{marginTop:16}}><div className="field"><label>Title</label><input className="input" value={x.title} onChange={e=>setX({...x,title:e.target.value})}/></div><div className="field" style={{marginTop:12}}><label>Tag</label><input className="input" value={x.tag} onChange={e=>setX({...x,tag:e.target.value})}/></div><div className="field" style={{marginTop:12}}><label>Body</label><textarea className="area" value={x.body} onChange={e=>setX({...x,body:e.target.value})}/></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:12}}><Btn onClick={()=>setModal(null)}>Cancel</Btn><Btn dark onClick={()=>x.title.trim()&&saveNote(x)}>Save note</Btn></div></div>}
const pages={home:Home,focus:()=> <><div className="head"><div><div className="eyebrow">Execution</div><div className="h1">Focus</div></div></div><div className="card hero">{rank[0]?<><div className="eyebrow">Recommended next</div><div className="h2">{rank[0].title}</div><div className="copy" style={{marginTop:8}}>Score {Math.round(score(rank[0],d.projects,d.tasks))} · {rank[0].project||'No project'} · due {rank[0].due||'no date'}</div><div style={{marginTop:16}}><Btn dark onClick={()=>toggle(rank[0].id)}>Mark complete</Btn></div></>:<div className="h2">Nothing needs your attention.</div>}</div></>,tasks:Tasks,projects:Projects,knowledge:Knowledge,insights:Insights,coo:COO,activity:Activity,settings:Settings};const nav=[['home','Home'],['focus','Focus'],['tasks','Tasks'],['projects','Projects'],['knowledge','Knowledge'],['insights','Insights'],['coo','AI COO'],['activity','Activity'],['settings','Settings']];const C=pages[page]||Home;return <div className="app"><div className="shell"><aside className="side"><div className="brand"><div className="mark">P</div><div><b>Personal OS</b><small>V5.1</small></div></div><div className="nav">{nav.map(([id,label])=><button key={id} className={page===id?'on':''} onClick={()=>setPage(id)}>{label}</button>)}</div><div className="foot"><b>Local-first</b><span>Private browser workspace. ₹0 core. No server required.</span></div></aside><main className="main"><div className="top"><div className="searchwrap"><input id="global-search" className="search" placeholder="Search tasks, projects, knowledge · Ctrl/⌘K" value={q} onChange={e=>setQ(e.target.value)}/>{q&&res.length>0&&<div className="results">{res.map((r,i)=><button className="res" key={i} onClick={()=>{setPage(r.type==='Task'?'tasks':r.type==='Project'?'projects':'knowledge');setQ('')}}><b>{r.title||r.name}</b><span className="muted small"> · {r.type}</span></button>)}</div>}</div><Btn onClick={()=>setModal({kind:'task',item:null})}>New</Btn></div><C/></main></div><div className="mobile">{nav.slice(0,8).map(([id,label])=><button key={id} className={page===id?'on':''} onClick={()=>setPage(id)}>{label}</button>)}</div><Modal/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
