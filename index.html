<style id="personal-os-v4-css">
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{background:#f5f5f7;color:#111113}
.v4-app{min-height:100vh;background:radial-gradient(circle at 15% 0%,#ffffff 0,rgba(255,255,255,.85) 25%,transparent 48%),linear-gradient(180deg,#f5f5f7 0%,#eef0f4 100%);letter-spacing:-.015em}

.v4-logo{display:flex;align-items:center;gap:12px;padding:8px 8px 18px}.v4-mark{width:42px;height:42px;border-radius:14px;background:#111113;color:#fff;display:grid;place-items:center;font-weight:800}.v4-muted{color:#8a8f98}.v4-nav{display:flex;flex-direction:column;gap:5px}.v4-nav button,.v4-mobile button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:14px;color:#686d76;font-weight:600;cursor:pointer}.v4-nav button.active,.v4-nav button:hover,.v4-mobile button.active{background:#111113;color:#fff}.v4-side-note{margin-top:auto;background:rgba(17,17,19,.92);color:#fff;border-radius:20px;padding:15px}.v4-content{flex:1;min-width:0;padding:6px 6px 28px}.v4-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 6px 18px}.v4-search{flex:1;max-width:700px;height:48px;border-radius:16px;border:1px solid rgba(17,17,19,.08);background:rgba(255,255,255,.72);box-shadow:0 10px 30px rgba(15,23,42,.05);padding:0 18px;font-size:15px;outline:0}.v4-actions{display:flex;gap:9px;align-items:center}.v4-btn{border:0;border-radius:15px;padding:12px 16px;font-weight:700;cursor:pointer}.v4-btn.dark{background:#111113;color:#fff}.v4-btn.soft{background:rgba(255,255,255,.74);color:#30323a;border:1px solid rgba(17,17,19,.07)}.v4-grid{display:grid;gap:16px}.v4-grid.cols4{grid-template-columns:repeat(4,1fr)}.v4-grid.cols2{grid-template-columns:repeat(2,1fr)}.v4-card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 60px rgba(15,23,42,.07);backdrop-filter:blur(26px);border-radius:26px;padding:22px}.v4-hero{padding:30px;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(244,245,248,.8))}.v4-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#8a8f98;font-weight:800}.v4-h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.055em;margin:8px 0 0;font-weight:800}.v4-h2{font-size:28px;letter-spacing:-.045em;margin:7px 0 0;font-weight:800}.v4-copy{color:#70757e;line-height:1.65}.v4-kpi{font-size:34px;font-weight:800;letter-spacing:-.05em;margin-top:6px}.v4-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.v4-list{display:flex;flex-direction:column;gap:10px}.v4-item{background:rgba(255,255,255,.66);border:1px solid rgba(17,17,19,.05);border-radius:18px;padding:15px}.v4-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#f0f1f4;color:#5e626b;font-size:12px;font-weight:750}.v4-pill.dark{background:#111113;color:#fff}.v4-progress{height:9px;border-radius:999px;background:#e5e7eb;overflow:hidden}.v4-bar{height:100%;background:#111113;border-radius:999px}.v4-section{margin-top:18px}.v4-table-head,.v4-task{display:grid;grid-template-columns:1.8fr .8fr .7fr .7fr auto;gap:12px;align-items:center}.v4-task{padding:14px;border-top:1px solid rgba(17,17,19,.06)}.v4-task:first-child{border-top:0}.v4-link{border:0;background:transparent;color:#6a6f78;cursor:pointer;font-weight:700}.v4-link:hover{color:#111113}.v4-input,.v4-select,.v4-textarea{width:100%;background:#f5f5f7;border:1px solid #e3e5e8;border-radius:14px;padding:12px 13px;outline:0}.v4-modal{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);display:grid;place-items:center;padding:20px;z-index:50}.v4-modal-inner{width:min(680px,100%);background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.95);border-radius:28px;padding:22px;box-shadow:0 30px 100px rgba(15,23,42,.2)}.v4-mobile{display:none}.v4-search-results{position:absolute;top:58px;left:0;right:0;background:rgba(255,255,255,.96);border:1px solid #eceef1;border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.12);padding:8px;z-index:20}.v4-search-wrap{position:relative;flex:1;max-width:700px}.v4-actionline{font-size:13px;color:#7d828b}.v4-accent{background:#111113;color:#fff;border-radius:20px;padding:18px}.v4-dot{width:9px;height:9px;border-radius:50%;background:#111113;display:inline-block}.v4-empty{padding:28px;text-align:center;color:#8a8f98}.v4-fade{animation:v4fade .35s ease}@keyframes v4fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:980px){.v4-shell{padding:10px;display:block}.v4-sidebar{display:none}.v4-content{padding-bottom:86px}.v4-grid.cols4{grid-template-columns:repeat(2,1fr)}.v4-grid.cols2{grid-template-columns:1fr}.v4-mobile{position:fixed;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-around;gap:4px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);box-shadow:0 16px 50px rgba(15,23,42,.15);backdrop-filter:blur(24px);border-radius:22px;padding:7px;z-index:40}.v4-mobile button{text-align:center;padding:11px 8px;font-size:11px}.v4-task,.v4-table-head{grid-template-columns:1fr auto}.v4-task>*:nth-child(2),.v4-task>*:nth-child(3),.v4-task>*:nth-child(4){display:none}.v4-top{flex-wrap:wrap}.v4-actions{width:100%}.v4-actions .v4-btn{flex:1}.v4-search-wrap{max-width:none;width:100%}}
@media(max-width:580px){.v4-grid.cols4{grid-template-columns:1fr}.v4-card,.v4-hero{border-radius:22px;padding:18px}.v4-h1{font-size:38px}.v4-actions .v4-btn.soft{display:none}}
</style></head><body><div id="root"></div><script type="text/babel">
const{useEffect,useMemo,useState}=React;
const KEY='personal_os_v2';
const oldKey='personal_os_v1';
const seed={tasks:[{id:1,title:'Complete Personal OS V1 structure',project:'Personal OS',priority:'High',status:'In Progress',due:'Today'},{id:2,title:'Review pending customer evidence request',project:'Work',priority:'High',status:'Todo',due:'Today'},{id:3,title:'Update SIEM troubleshooting knowledge',project:'Knowledge',priority:'Medium',status:'Todo',due:'Tomorrow'},{id:4,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'This week'},{id:5,title:'Clean up project notes',project:'Personal OS',priority:'Low',status:'Done',due:'Today'}],projects:[{id:1,name:'Personal OS',description:'Command Center + Knowledge Base + AI COO',progress:32,health:'On track'},{id:2,name:'SIEM Automation',description:'Evidence collection and reporting workflow',progress:78,health:'On track'},{id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus'},{id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source/destination, device and event type before requesting high-volume logs.'},{id:3,title:'Personal OS idea',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}],activity:[{text:'Personal OS V2 started',time:'Today',type:'system'},{text:'V1.1 data migrated',time:'Today',type:'system'}]};
const clone=x=>JSON.parse(JSON.stringify(x));
function initial(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.tasks)return v;const old=JSON.parse(localStorage.getItem(oldKey));if(old&&old.tasks){return{...clone(old),activity:[{text:'V1.1 data migrated to V2',time:'Today',type:'system'},...(old.activity||[])].slice(0,60)}}}catch{}return clone(seed)}
function stamp(){return new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date())}
function addLog(data,text,type='system'){return[{text,time:stamp(),type},...(data.activity||[])].slice(0,60)}
const nav=[['dashboard','Dashboard','⌂'],['focus','Focus','◉'],['tasks','Tasks','✓'],['projects','Projects','▣'],['knowledge','Knowledge','◈'],['activity','Activity','◷'],['ai','AI COO','✦'],['settings','Settings','⚙']];
const Btn=({children,onClick,primary=false})=><button onClick={onClick} className={'px-4 py-2.5 rounded-xl text-sm font-semibold '+(primary?'bg-indigo-500 hover:bg-indigo-400':'bg-white/5 hover:bg-white/10')}>{children}</button>;
const Input=({value,onChange,placeholder,type='text'})=><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 outline-none focus:border-indigo-400/50"/>;
function App(){const[data,setData]=useState(initial);const[page,setPage]=useState('dashboard');const[q,setQ]=useState('');const[focusId,setFocusId]=useState(null);const[cmd,setCmd]=useState(false);useEffect(()=>localStorage.setItem(KEY,JSON.stringify(data)),[data]);useEffect(()=>{const f=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setCmd(x=>!x)}if(e.key==='Escape'){setCmd(false)}};addEventListener('keydown',f);return()=>removeEventListener('keydown',f)},[]);
const update=x=>setData(x);const search=(arr)=>arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
const taskAdd=t=>update({...data,tasks:[{...t,id:Date.now()},...data.tasks],activity:addLog(data,'Task created: '+t.title,'task')});
const taskEdit=t=>update({...data,tasks:data.tasks.map(x=>x.id===t.id?t:x),activity:addLog(data,'Task updated: '+t.title,'task')});
const taskToggle=id=>{const t=data.tasks.find(x=>x.id===id);if(!t)return;const status=t.status==='Done'?'Todo':'Done';update({...data,tasks:data.tasks.map(x=>x.id===id?{...x,status}:x),activity:addLog(data,(status==='Done'?'Task completed: ':'Task reopened: ')+t.title,'task')})};
const taskDelete=id=>{const t=data.tasks.find(x=>x.id===id);update({...data,tasks:data.tasks.filter(x=>x.id!==id),activity:addLog(data,'Task deleted: '+(t?.title||'task'),'task')})};
const projectSave=p=>{const exists=data.projects.some(x=>x.id===p.id);update({...data,projects:exists?data.projects.map(x=>x.id===p.id?p:x):[{...p,id:Date.now()},...data.projects],activity:addLog(data,(exists?'Project updated: ':'Project created: ')+p.name,'project')})};
const projectDelete=id=>{const p=data.projects.find(x=>x.id===id);update({...data,projects:data.projects.filter(x=>x.id!==id),activity:addLog(data,'Project deleted: '+(p?.name||'project'),'project')})};
const noteSave=n=>{const exists=data.notes.some(x=>x.id===n.id);update({...data,notes:exists?data.notes.map(x=>x.id===n.id?n:x):[{...n,id:Date.now()},...data.notes],activity:addLog(data,(exists?'Knowledge updated: ':'Knowledge created: ')+n.title,'knowledge')})};
const noteDelete=id=>{const n=data.notes.find(x=>x.id===id);update({...data,notes:data.notes.filter(x=>x.id!==id),activity:addLog(data,'Knowledge deleted: '+(n?.title||'note'),'knowledge')})};
const exportData=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-os-v2-backup.json';a.click()};
const importData=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.tasks||!x.projects||!x.notes)throw Error();update({...x,activity:addLog(data,'V2 backup imported','system')})}catch{alert('Invalid Personal OS V2 backup.')}};r.readAsText(f);e.target.value=''};
const reset=()=>{if(confirm('Reset Personal OS V2 to demo data?'))update(clone(seed))};
const open=data.tasks.filter(t=>t.status!=='Done'),done=data.tasks.filter(t=>t.status==='Done'),high=open.filter(t=>t.priority==='High'),completion=data.tasks.length?Math.round(done.length/data.tasks.length*100):0;
return <div className="min-h-full bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,.16),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,.1),transparent_30%)]"><div className="max-w-[1500px] mx-auto min-h-screen flex"><aside className="w-64 shrink-0 border-r border-white/10 p-5 hidden md:flex flex-col"><div className="flex items-center gap-3 mb-8"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center font-black">P</div><div><b>Personal OS</b><div className="text-xs text-slate-400">V2.0 · local-first</div></div></div><div className="space-y-1">{nav.map(([k,l,i])=><button key={k} onClick={()=>setPage(k)} className={'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm '+(page===k?'bg-white/10':'text-slate-400 hover:bg-white/5')}>{i}<span>{l}</span></button>)}</div><div className="mt-auto glass rounded-2xl p-4"><div className="text-xs text-indigo-300">V2.0 · Offline-first</div><div className="text-sm font-medium mt-1">Private browser workspace.</div><div className="text-xs text-slate-500 mt-2">No server · No subscription</div></div></aside><main className="flex-1 min-w-0"><header className="sticky top-0 z-10 px-5 md:px-8 py-4 border-b border-white/10 bg-[#070b14]/85 backdrop-blur-xl"><div className="flex items-center gap-3"><div className="md:hidden font-bold">Personal OS</div><div className="relative flex-1 max-w-2xl"><span className="absolute left-3 top-2.5 text-slate-500">⌕</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search everything…  Ctrl+K" className="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-sm outline-none"/></div><Btn onClick={()=>setCmd(true)}>⌘K</Btn><Btn primary onClick={()=>setPage('ai')}>Ask AI COO</Btn></div><div className="md:hidden flex gap-1 mt-3 overflow-x-auto">{nav.map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'px-3 py-2 rounded-lg text-xs whitespace-nowrap '+(page===k?'bg-white/10':'text-slate-400')}>{l}</button>)}</div></header><section className="p-5 md:p-8 max-w-[1250px] mx-auto">{page==='dashboard'&&<Dashboard data={data} open={open} done={done} high={high} completion={completion} setPage={setPage} toggle={taskToggle}/>} {page==='focus'&&<Focus data={data} open={open} focusId={focusId} setFocusId={setFocusId} toggle={taskToggle}/>} {page==='tasks'&&<Tasks data={data} items={search(data.tasks)} add={taskAdd} edit={taskEdit} toggle={taskToggle} del={taskDelete}/>} {page==='projects'&&<Projects data={data} items={search(data.projects)} save={projectSave} del={projectDelete}/>} {page==='knowledge'&&<Knowledge data={data} items={search(data.notes)} save={noteSave} del={noteDelete}/>} {page==='activity'&&<Activity data={data}/>} {page==='ai'&&<AI data={data} completion={completion} setPage={setPage}/>} {page==='settings'&&<Settings data={data} exportData={exportData} importData={importData} reset={reset}/>}</section></main></div>{cmd&&<Command data={data} close={()=>setCmd(false)} setPage={setPage} add={taskAdd}/>}</div>}
function Title({title,sub,action}){return <div className="flex justify-between gap-4 items-start mb-7"><div><h1 className="text-3xl font-bold tracking-tight">{title}</h1><p className="text-slate-400 mt-2">{sub}</p></div>{action}</div>}
function Dashboard({data,open,done,high,completion,setPage,toggle}){const attention=data.projects.filter(p=>p.health==='Needs focus'||p.health==='At risk');return <><div className="mb-8"><div className="text-sm text-indigo-300 mb-2">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><h1 className="text-3xl md:text-4xl font-bold">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">V2 turns your Personal OS into a private offline workspace.</p></div><div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">{[['Open tasks',open.length],['Completed',done.length],['Projects',data.projects.length],['Knowledge',data.notes.length]].map((x,i)=><div className="glass rounded-2xl p-5" key={x[0]}><div className="text-sm text-slate-400">{x[0]}</div><div className="text-3xl font-bold mt-2">{x[1]}</div></div>)}</div><div className="grid lg:grid-cols-[1.4fr_1fr] gap-5"><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="flex justify-between"><div><b>Operating pulse</b><div className="text-xs text-slate-500 mt-1">{completion}% complete · {high.length} high-priority · {attention.length} projects need focus</div></div><button onClick={()=>setPage('focus')} className="text-xs text-indigo-300">Open Focus →</button></div><div className="mt-5 h-2 bg-white/5 rounded-full overflow-hidden"><div className="progress h-full rounded-full" style={{width:completion+'%'}}/></div></div><div className="glass rounded-2xl p-5"><div className="flex justify-between mb-4"><b>Next actions</b><button onClick={()=>setPage('tasks')} className="text-xs text-indigo-300">All tasks</button></div>{open.slice(0,6).map(t=><div key={t.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/[.03] mb-2 last:mb-0"><button onClick={()=>toggle(t.id)} className="w-5 h-5 rounded-full border border-slate-600 shrink-0"/><div className="fl   const exportJSON=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-os-v3-backup.json';a.click()};

const Btn=({children,onClick,primary})=><button onClick={onClick} className={'px-3 py-2 rounded-xl text-sm '+(primary?'bg-indigo-500':'bg-white/5')}>{children}</button>;
const Card=({children,className=''})=><div className={'glass rounded-2xl p-5 '+className}>{children}</div>;
function Dashboard({data,open,done,completion,top3,rec,setPage}){const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');return <><div className="mb-7"><div className="text-sm text-indigo-300">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><h1 className="text-3xl md:text-4xl font-bold mt-2">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">V3 turns Personal OS into a local operating system that ranks, connects and explains your work.</p></div><div className="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">{[['Open',open.length],['Done',done.length],['Completion',completion+'%'],['Projects',data.projects.length],['Knowledge',data.notes.length]].map(x=><Card key={x[0]}><div className="text-xs text-slate-400">{x[0]}</div><div className="text-2xl font-bold mt-2">{x[1]}</div></Card>)}</div><div className="grid lg:grid-cols-[1.4fr_1fr] gap-5"><div className="space-y-5"><Card><div className="flex items-center justify-between"><div><b>Today’s operating brief</b><p className="text-sm text-slate-400 mt-2">{rec[0].why}</p></div><Btn onClick={()=>setPage('ai')}>Explain →</Btn></div></Card><Card><div className="flex justify-between mb-4"><b>Daily Top 3</b><button onClick={()=>setPage('focus')} className="text-xs text-indigo-300">Open Focus →</button></div>{top3.map((t,i)=><div key={t.id} className="p-3 rounded-xl bg-white/[.03] mb-2"><div className="flex gap-3"><div className="w-7 h-7 rounded-full bg-white/10 grid place-items-center text-xs">{i+1}</div><div><div className="text-sm font-medium">{t.title}</div><div className="text-xs text-slate-500 mt-1">Score {Math.max(0,Math.round(scoreTask(t,data.projects)))} · {t.project} · {t.priority}</div></div></div></div>)}{!top3.length&&<div className="text-sm text-slate-500">Nothing pending. Define the next outcome.</div>}</Card></div><div className="space-y-5"><Card><div className="text-xs uppercase tracking-widest text-indigo-300">Do this now</div><div className="text-xl font-semibold mt-2">{rec[0].title}</div><p className="text-sm text-slate-400 mt-2">{rec[0].why}</p><button onClick={()=>setPage('focus')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Take me to Focus →</button></Card><Card><b>Attention signals</b>{risk.length?risk.map(p=><div key={p.id} className="mt-4 p-3 rounded-xl bg-white/[.03]"><div className="flex justify-between text-sm"><span>{p.name}</span><span>{p.progress}%</span></div><div className="text-xs text-amber-300 mt-2">{p.health}</div></div>):<div className="text-sm text-slate-500 mt-4">No project risk signals detected.</div>}</Card></div></div></>}
function Focus({top3,toggle}){const t=top3[0];return <><h1 className="text-3xl font-bold">Focus</h1><p className="text-slate-400 mt-2 mb-7">V3’s ranking engine chooses the strongest next move.</p><Card className="max-w-3xl mx-auto text-center p-8">{t?<><div className="text-xs uppercase tracking-widest text-indigo-300">Recommended focus</div><h2 className="text-2xl md:text-3xl font-bold mt-4">{t.title}</h2><div className="text-sm text-slate-500 mt-2">{t.project} · {t.priority}</div><button onClick={()=>toggle(t.id)} className="mt-7 px-6 py-3 rounded-xl bg-indigo-500 font-semibold">Mark complete</button></>:<div className="text-slate-500">Queue clear.</div>}</Card></>}
function Tasks({data,open,toggle,save,remove,setModal}){return <><div className="flex justify-between items-start mb-7"><div><h1 className="text-3xl font-bold">Tasks</h1><p className="text-slate-400 mt-2">Priority is calculated from urgency, age, project health and status.</p></div><Btn primary onClick={()=>setModal({kind:'task',item:null})}>+ Add</Btn></div><div className="glass rounded-2xl overflow-hidden">{data.tasks.map((t,i)=><div key={t.id} className={'p-4 '+(i?'border-t border-white/5':'')}><div className="flex gap-3 items-center"><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border '+(t.status==='Done'?'bg-emerald-500 border-emerald-500':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority} · due {t.due||'unscheduled'} · score {Math.max(0,Math.round(scoreTask(t,data.projects)))}</div></div><button onClick={()=>setModal({kind:'task',item:t})} className="text-xs text-indigo-300">Edit</button><button onClick={()=>remove('tasks',t.id)} className="text-xs text-rose-300">Delete</button></div></div>)}</div></>}

function Knowledge({data,save,remove}){const[q,setQ]=useState('');const rows=smartSearch(q,data).filter(x=>x._type==='Knowledge');return <><div className="mb-7"><h1 className="text-3xl font-bold">Knowledge</h1><p className="text-slate-400 mt-2">Search by meaning-like token relationships, tags and linked concepts—without an external AI service.</p></div><div className="mb-5"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="What do I already know about…" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3"/></div><div className="grid md:grid-cols-2 gap-5">{data.notes.map(n=><Card key={n.id}><div className="flex justify-between"><div><b>{n.title}</b><div className="text-xs text-indigo-300 mt-2">{n.tag}</div></div><button onClick={()=>remove('notes',n.id)} className="text-xs text-rose-300">Delete</button></div><p className="text-sm text-slate-400 mt-4 leading-6">{n.body}</p>{q&&rows.find(x=>x.id===n.id)&&<div className="text-xs text-emerald-300 mt-3">Relevant to this search</div>}</Card>)}<Card><b>Knowledge → action</b><p className="text-sm text-slate-400 mt-2">V3 relates notes to tasks/projects using shared concepts so your memory can influence execution.</p></Card></div></>}
function Insights({data,completion}){const open=data.tasks.filter(t=>t.status!=='Done');const aged=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>4*86400000);const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');const activity=data.activity.length;const byProject=data.projects.map(p=>({name:p.name,count:data.tasks.filter(t=>t.project===p.name&&t.status!=='Done').length})).sort((a,b)=>b.count-a.count);return <><h1 className="text-3xl font-bold">Insights</h1><p className="text-slate-400 mt-2 mb-7">Personal analytics generated locally from your workspace.</p><div className="grid md:grid-cols-3 gap-5"><Card><div className="text-xs text-slate-400">Completion</div><div className="text-3xl font-bold mt-2">{completion}%</div><p className="text-xs text-slate-500 mt-2">Completed / total tasks</p></Card><Card><div className="text-xs text-slate-400">Aging queue</div><div className="text-3xl font-bold mt-2">{aged.length}</div><p className="text-xs text-slate-500 mt-2">Open tasks older than 4 days</p></Card><Card><div className="text-xs text-slate-400">Project risk</div><div className="text-3xl font-bold mt-2">{risk.length}</div><p className="text-xs text-slate-500 mt-2">Needs focus / At risk</p></Card></div><Card className="mt-5"><b>Workload distribution</b><div className="mt-4 space-y-3">{byProject.map(x=><div key={x.name}><div className="flex justify-between text-sm"><span>{x.name}</span><span>{x.count}</span></div><div className="h-2 bg-white/5 rounded-full mt-1"><div className="h-full bg-indigo-500 rounded-full" style={{width:Math.min(100,x.count*20)+'%'}}/></div></div>)}</div></Card><div className="text-xs text-slate-600 mt-4">Local activity records: {activity}. Analytics improve as you use the system.</div></>}
function Activity({data}){return <><h1 className="text-3xl font-bold">Activity</h1><p className="text-slate-400 mt-2 mb-7">Your local operating history.</p><Card className="space-y-4">{data.activity.map((a,i)=><div key={i} className="flex gap-3"><div className="w-2.5 h-2.5 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{new Date(a.time).toLocaleString('en-IN')} · {a.type}</div></div></div>)}</Card></>}
function AI({data,rec,setPage}){const r=rec;const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');return <><h1 className="text-3xl font-bold">AI COO 3.0</h1><p className="text-slate-400 mt-2 mb-7">Deterministic local intelligence. No LLM, API key, server or subscription required.</p><div className="grid lg:grid-cols-2 gap-5">{r.map((x,i)=><Card key={i}><div className="text-xs uppercase tracking-widest text-indigo-300">{x.kind}</div><div className="text-xl font-semibold mt-2">{x.title}</div><p className="text-slate-400 mt-3">{x.why}</p>{x.taskId&&<button onClick={()=>setPage('focus')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open Focus →</button>}</Card>)}<Card className="lg:col-span-2"><b>System diagnosis</b><p className="text-slate-300 mt-3 leading-7">{risk.length?`Project attention is influencing the queue: ${risk.map(x=>x.name).join(', ')}.`:'No project health risk is currently amplifying the queue.'} {data.tasks.filter(t=>t.status!=='Done').length} open tasks and {data.notes.length} knowledge items are being considered by the local engine.</p></Card></div></>}
function Settings({data,exportJSON,importJSON,reset}){return <><h1 className="text-3xl font-bold">Settings</h1><p className="text-slate-400 mt-2 mb-7">Data health, schema and recovery controls.</p><div className="grid md:grid-cols-2 gap-5"><Card><b>Schema</b><div className="text-sm text-slate-400 mt-3">Version {data.schemaVersion} · last updated {new Date(data.updatedAt).toLocaleString('en-IN')}</div><div className="text-xs text-emerald-300 mt-3">V2 → V3 migration supported</div></Card><Card><b>Backup & restore</b><p className="text-sm text-slate-400 mt-2">Exports all tasks, projects, knowledge and activity to JSON.</p><div className="flex flex-wrap gap-2 mt-4"><Btn primary onClick={exportJSON}>Export V3 backup</Btn><label className="px-3 py-2 rounded-xl bg-white/5 text-sm cursor-pointer">Import<input type="file" accept="application/json" onChange={importJSON} className="hidden"/></label></div></Card><Card className="md:col-span-2"><b>Zero-cost & privacy</b><div className="grid md:grid-cols-3 gap-4 mt-4">{[['Local-first','Workspace data stays in browser storage unless you export it.'],['No external AI','V3 uses deterministic local reasoning and relationship scoring.'],['No installation','Runs directly in GitHub Pages through browser/CDN assets.']].map(x=><div key={x[0]} className="p-4 rounded-xl bg-white/[.03]"><b>{x[0]}</b><p className="text-xs text-slate-500 mt-2">{x[1]}</p></div>)}</div></Card><Card><b>Recovery</b><p className="text-sm text-slate-400 mt-2">Reset only when you intentionally want the V3 demo workspace.</p><button onClick={reset} className="mt-4 px-4 py-2 rounded-xl bg-rose-500/10 text-rose-300 text-sm">Reset demo</button></Card></div></>}

function App(){const[d,setD]=useState(load),[page,setPage]=useState('home'),[q,setQ]=useState(''),[modal,setModal]=useState(null);useEffect(()=>localStorage.setItem(K,JSON.stringify({...d,updatedAt:iso()})),[d]);const open=d.tasks.filter(x=>x.status!=='Done'),done=d.tasks.filter(x=>x.status==='Done'),pct=d.tasks.length?Math.round(done.length/d.tasks.length*100):0,ranked=[...open].sort((a,b)=>score(b,d.projects)-score(a,d.projects)),top3=ranked.slice(0,3),risk=d.projects.filter(x=>['At risk','Needs focus'].includes(x.health));const set=x=>setD(x);const log=(text,type='system')=>setD(x=>({...x,updatedAt:iso(),activity:[{text,time:iso(),type},...x.activity].slice(0,120)}));const toggle=id=>setD(x=>({...x,updatedAt:iso(),tasks:x.tasks.map(t=>t.id===id?{...t,status:t.status==='Done'?'Todo':'Done',completedAt:t.status==='Done'?undefined:iso(),updatedAt:iso()}:t),activity:[{text:'Task status changed',time:iso(),type:'task'},...x.activity].slice(0,120)}));const saveTask=t=>setD(x=>{const exists=x.tasks.some(a=>a.id===t.id),z={...t,id:t.id||Date.now(),createdAt:t.createdAt||iso(),updatedAt:iso()};return{...x,tasks:exists?x.tasks.map(a=>a.id===z.id?z:a):[z,...x.tasks],updatedAt:iso(),activity:[{text:(exists?'Updated task: ':'Created task: ')+z.title,time:iso(),type:'task'},...x.activity]}});const removeTask=id=>setD(x=>({...x,tasks:x.tasks.filter(t=>t.id!==id),updatedAt:iso()}));const saveProject=p=>setD(x=>{const exists=x.projects.some(a=>a.id===p.id),z={...p,id:p.id||Date.now()};return{...x,projects:exists?x.projects.map(a=>a.id===z.id?z:a):[z,...x.projects],updatedAt:iso(),activity:[{text:(exists?'Updated project: ':'Created project: ')+z.name,time:iso(),type:'project'},...x.activity]}});const saveNote=n=>setD(x=>{const exists=x.notes.some(a=>a.id===n.id),z={...n,id:n.id||Date.now()};return{...x,notes:exists?x.notes.map(a=>a.id===z.id?z:a):[z,...x.notes],updatedAt:iso(),activity:[{text:(exists?'Updated note: ':'Captured note: ')+z.title,time:iso(),type:'knowledge'},...x.ac ,i)=><button key={i} className="v4-link" style={{display:'block',width:'100%',textAlign:'left',padding:10}} onClick={()=>{setPage(x._type==='Task'?'tasks':x._type==='Project'?'projects':'knowledge');setQ('')}}><span className="v4-pill" style={{marginRight:7}}>{x._type}</span>{x.title||x.name}</button>)}{!search.length&&<div className="v4-empty">No matches.</div>}</div>}</div><div className="v4-actions"><Btn onClick={()=>setPage('focus')}>Focus</Btn><Btn dark onClick={()=>setPage('ai')}>AI COO</Btn></div></div><div className="v4-fade">{page==='home'&&<Home d={d} open={open} done={done} pct={pct} top3={top3} risk={risk} setPage={setPage} toggle={toggle}/>} {page==='focus'&&<Focus top3={top3} toggle={toggle}/>} {page==='tasks'&&<Tasks d={d} open={open} save={saveTask} remove={removeTask} toggle={toggle}/>} {page==='projects'&&<Projects d={d} save={saveProject} remove={remove}/>} {page==='knowledge'&&<Knowledge d={d} save={saveNote} remove={remove}/>} {page==='insights'&&<Insights d={d} pct={pct}/>} {page==='ai'&&<AI d={d} top3={top3} risk={risk} setPage={setPage}/>} {page==='settings'&&<Settings d={d} exportJSON={exportJSON} importJSON={importJSON} reset={reset}/>} {page==='activity'&&<Activity d={d}/>}</div><div className="v4-mobile">{nav.slice(0,7).map(([k,l])=><button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>{l}</button>)}</div></main></div>{modal&&<Editor kind={modal} d={d} onClose={()=>setModal(null)} saveTask={saveTask} saveProject={saveProject} saveNote={saveNote}/>}</div>}

function Tasks({d,open,save,remove,toggle}){const[editing,setEditing]=useState(null),[filter,setFilter]=useState('All');const list=open.filter(t=>filter==='All'||t.priority===filter);return <><Header title="Tasks" sub="Quiet execution, now prioritized by the V3 engine." action={<Btn dark onClick={()=>setEditing({id:null,title:'',project:'Personal OS',priority:'Medium',status:'Todo',due:''})}>+ Add task</Btn>}/><div style={{display:'flex',gap:8,marginBottom:12}}>{['All','High','Medium','Low'].map(x=><button className={'v4-pill '+(filter===x?'dark':'')} key={x} onClick={()=>setFilter(x)}>{x}</button>)}</div><div className="v4-card" style={{padding:0,overflow:'hidden'}}>{list.map(t=><div className="v4-task" key={t.id}><div><b>{t.title}</b><div className="v4-actionline">{t.project} · {t.due||'No due date'}</div></div><span className="v4-pill">{t.priority}</span><span className="v4-actionline">{t.status}</span><span className="v4-actionline">{Math.max(0,Math.round(score(t,d.projects)))} pts</span><div style={{display:'flex',gap:9,justifyContent:'flex-end'}}><button className="v4-link" onClick={()=>toggle(t.id)}>Done</button><button className="v4-link" onClick={()=>setEditing({...t})}>Edit</button><button className="v4-link" onClick={()=>remove(t.id)}>Delete</button></div></div>)}{!list.length&&<div className="v4-empty">No tasks here.</div>}</div>{editing&&<TaskEditor data={editing} projects={d.projects} onClose={()=>setEditing(null)} onSave={x=>{save(x);setEditing(null)}}/>}</>}
function TaskEditor({data,projects,onClose,onSave}){const[f,setF]=useState(data),s=(k,v)=>setF({...f,[k]:v});return <div className="v4-modal"><div className="v4-modal-inner"><Header title={f.id?'Edit task':'New task'} sub="Keep the task clear and actionable."/><div className="v4-grid cols2"><input className="v4-input" value={f.title} onChange={e=>s('title',e.target.value)} placeholder="Task title"/><select className="v4-select" value={f.project} onChange={e=>s('project',e.target.value)}>{projects.map(p=><option key={p.id}>{p.name}</option>)}<option>Work</option><option>Learning</option></select><select className="v4-select" value={f.priority} onChange={e=>s('priority',e.target.value)}><option>High</option><option>Medium</option><option>Low</option></select><select className="v4-select" value={f.status} onChange={e=>s('status',e.target.value)}><option>Todo</option><option>In Progress</option><option>Done</option></select><input className="v4-input" type="date" value={f.due||''} onChange={e=>s('due',e.target.value)}/></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}><Btn onClick={onClose}>Cancel</Btn><Btn dark onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save task</Btn></div></div></div>}
function Projects({d,save,remove}){const[e,setE]=useState(null);return <><Header title="Projects" sub="A calm view of where your attention is going." action={<Btn dark onClick={()=>setE({id:null,name:'',description:'',progress:0,health:'On track'})}>+ Add project</Btn>}/><div className="v4-grid cols2">{d.projects.map(p=><div className="v4-card" key={p.id}><div className="v4-row"><div><b style={{fontSize:20}}>{p.name}</b><div className="v4-copy" style={{fontSize:14}}>{p.description}</div></div><span className="v4-pill">{p.health}</span></div><div style={{marginTop:22,fontSize:32,fontWeight:800}}>{p.progress}%</div><div className="v4-progress" style={{marginTop:8}}><div className="v4-bar" style={{width:p.progress+'%'}}/></div><div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:15}}><button className="v4-link" onClick={()=>setE({...p})}>Edit</button><button className="v4-link" onClick={()=>remove('projects',p.id)}>Delete</button></div></div>)}</div>{e&&<ProjectEditor data={e} onClose={()=>setE(null)} onSave={x=>{save(x);setE(null)}}/>}</>}
function ProjectEditor({data,onClose,onSave}){const[f,setF]=useState(data),s=(k,v)=>setF({...f,[k]:v});return <div className="v4-modal"><div className="v4-modal-inner"><Header title={f.id?'Edit project':'New project'} sub="Projects set context for work."/><div className="v4-grid cols2"><input className="v4-input" value={f.name} onChange={e=>s('name',e.target.value)} placeholder="Project name"/><input className="v4-input" value={f.description} onChange={e=>s('description',e.target.value)} placeholder="Description"/><input className="v4-input" type="number" min="0" max="100" value={f.progress} onChange={e=>s('progress',Math.max(0,Math.min(100,Number(e.target.value))))}/><select className="v4-select" value={f.health} onChange={e=>s('health',e.target.value)}><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}><Btn onClick={onClose}>Cancel</Btn><Btn dark onClick={()=>f.name.trim()&&onSave({...f,name:f.name.trim()})}>Save project</Btn></div></div></div>}
function Knowledge({d,save,remove}){const[e,setE]=useState(null);return <><Header title="Knowledge" sub="Your memory layer, now presented like a premium library." action={<Btn dark onClick={()=>setE({id:null,title:'',tag:'General',body:''})}>+ Add note</Btn>}/><div className="v4-grid cols2">{d.notes.map(n=><div className="v4-card" key={n.id}><div className="v4-row"><div><div className="v4-eyebrow">{n.tag}</div><div style={{fontSize:21,fontWeight:800,marginTop:4}}>{n.title}</div></div><span className="v4-pill">Memory</span></div><div className="v4-copy" style={{marginTop:12}}>{n.body}</div><div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:16}}><button className="v4-link" onClick={()=>setE({...n})}>Edit</button><button className="v4-link" onClick={()=>remove('notes',n.id)}>Delete</button></div></div>)}</div>{e&&<NoteEditor data={e} onClose={()=>setE(null)} onSave={x=>{save(x);setE(null)}}/>}</>}
function NoteEditor({data,onClose,onSave}){const[f,setF]=useState(data),s=(k,v)=>setF({...f,[k]:v});return <div className="v4-modal"><div className="v4-modal-inner"><Header title={f.id?'Edit knowledge':'New knowledge'} sub="Capture context you want your future self to remember."/><div className="v4-grid cols2"><input className="v4-input" value={f.title} onChange={e=>s('title',e.target.value)} placeholder="Title"/><input className="v4-input" value={f.tag} onChange={e=>s('tag',e.target.value)} placeholder="Tag"/></div><textarea className="v4-textarea" style={{marginTop:10,minHeight:150}} value={f.body} onChange={e=>s('body',e.target.value)} placeholder="Knowledge…"/><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}><Btn onClick={onClose}>Cancel</Btn><Btn dark onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim(),tag:f.tag.trim()||'General'})}>Save note</Btn></div></div></div>}
function Insights({d,pct}){const open=d.tasks.filter(t=>t.status!=='Done'),done=d.tasks.filter(t=>t.status==='Done'),high=open.filter(t=>t.priority==='High').length,stale=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>4*86400000).length,risk=d.projects.filter(x=>['Needs focus','At risk'].includes(x.health)).length;const dist=[['High',high],['Medium',open.filter(t=>t.priority==='Medium').length],['Low',open.filter(t=>t.priority==='Low').length]];return <><Header title="Insights" sub="A lightweight operating picture generated locally from your workspace."/><div className="v4-grid cols4">{[['Completion',pct+'%'],['Open aging',stale],['High priority',high],['Project risk',risk]].map(x=><div className="v4-card" key={x[0]}><div className="v4-muted" style={{fontSize:13,fontWeight:700}}>{x[0]}</div><div className="v4-kpi">{x[1]}</div></div>)}</div><div className="v4-grid cols2 v4-section"><div className="v4-card"><div className="v4-eyebrow">Workload</div><div className="v4-h2" style={{fontSize:25}}>Open task mix</div>{dist.map(x=><div key={x[0]} style={{marginTop:18}}><div className="v4-row"><span>{x[0]}</span><b>{x[1]}</b></div><div className="v4-progress" style={{marginTop:7}}><div className="v4-bar" style={{width:(open.length?x[1]/open.length*100:0)+'%'}}/></div></div>)}</div><div className="v4-card"><div className="v4-eyebrow">Interpretation</div><div className="v4-h2" style={{fontSize:25}}>What the system sees</div><div className="v4-copy" style={{marginTop:12}}>{risk?'One or more projects need attention. Protect focus time and avoid unnecessary queue growth.':'Project health is stable. The highest leverage is finishing the top-ranked tasks consistently.'}</div><div className="v4-accent" style={{marginTop:18}}>V4 visual redesign keeps analytics calm and readable rather than turning them into a dense BI dashboard.</div></div></div></>}
function AI({d,top3,risk,setPage}){const t=top3[0],over=d.tasks.filter(x=>x.status!=='Done'&&/^\d{4}-\d{2}-\d{2}$/.test(x.due)&&new Date(x.due+'T23:59:59')<new Date()).length;return <><Header title="AI COO" sub="Local intelligence, presented as a calm executive layer."/><div className="v4-grid cols2"><div className="v4-card v4-hero"><div className="v4-eyebrow">Do this next</div><div className="v4-h2">{t?t.title:'Define the next outcome'}</div><div className="v4-copy" style={{marginTop:10}}>{t?'This task currently carries the strongest combined signal from priority, urgency, project health and age.':'Your execution queue is clear.'}</div><Btn dark onClick={()=>setPage('focus')} style={{marginTop:18}}>Take me to Focus</Btn></div><div className="v4-card"><div className="v4-eyebrow">Operating diagnosis</div><div className="v4-h2" style={{fontSize:25}}>{over?'Deadline risk is elevated.':risk.length?'Attention is fragmented.':'Execution looks healthy.'}</div><div className="v4-copy" style={{marginTop:12}}>{over?'Resolve overdue work before expanding scope.':risk.length?risk[0].name+' is asking for more focused attention.':'Keep the next action small, concrete and finishable.'}</div></div></div><div className="v4-card v4-section"><div className="v4-eyebrow">Current principles</div><div className="v4-grid cols2" style={{marginTop:12}}>{[['Prioritize signals','Priority, due date, project health and task age influence the local recommendation.'],['Reduce cognitive load','V4 keeps the interface quiet so the recommendation is easier to act on.'],['Stay private','No external LLM or API key is required for the current COO engine.'],['Prepare for V5','The visual and data layers remain separable so future AI adapters can plug in cleanly.']].map(x=><div className="v4-item" key={x[0]}><b>{x[0]}</b><div className="v4-actionline" style={{marginTop:7}}>{x[1]}</div></div>)}</div></div></>}
function Settings({d,exportJSON,importJSON,reset}){return <><Header title="Settings" sub="Your data, your browser, your control."/><div className="v4-grid cols2"><div className="v4-card"><div className="v4-eyebrow">Data</div><div className="v4-h2" style={{fontSize:25}}>Backup & restore</div><div className="v4-copy" style={{marginTop:10}}>Export the full workspace as JSON or restore a previous backup.</div><div style={{display:'flex',gap:8,marginTop:16}}><Btn dark onClick={exportJSON}>Export JSON</Btn><label className="v4-btn soft" style={{cursor:'pointer'}}>Import JSON<input type="file" accept="application/json" onChange={importJSON} style={{display:'none'}}/></label></div></div><div className="v4-card"><div className="v4-eyebrow">Architecture</div><div className="v4-h2" style={{fontSize:25}}>Local-first</div><div className="v4-copy" style={{marginTop:10}}>Schema version 4 · browser storage · no mandatory backend · no subscription.</div><div style={{marginTop:18}} className="v4-pill dark">personal_os_v4</div><div style={{marginTop:16}}><button className="v4-link" onClick={reset}>Reset demo workspace</button></div></div><div className="v4-card" style={{gridColumn:'1 / -1'}}><div className="v4-eyebrow">V4 design language</div><div className="v4-grid cols2" style={{marginTop:12}}>{[['Soft depth','Translucent cards and restrained shadows.'],['Native feel','System font stack, large type and compact controls.'],['Focus first','Less chrome, more whitespace, clearer primary actions.'],['Responsive','Floating mobile navigation and adaptive layouts.']].map(x=><div className="v4-item" key={x[0]}><b>{x[0]}</b><div className="v4-actionline" style={{marginTop:6}}>{x[1]}</div></div>)}</div></div></div></>}
function Activity({d}){return <><Header title="Activity" sub="A quiet audit trail of your recent changes."/><div className="v4-card">{d.activity.map((a,i)=><div key={i} style={{display:'flex',gap:12,padding:'13px 0',borderTop:i?'1px solid rgba(17,17,19,.06)':'0'}}><span className="v4-dot" style={{marginTop:6}}/><div><div style={{fontWeight:700}}>{a.text}</div><div className="v4-actionline" style={{marginTop:3}}>{new Date(a.time).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'})} · {a.type}</div></div></div>)}</div></>}
document.getElementById('root').innerHTML='<div id="v4-mount"></div>';ReactDOM.createRoot(document.getElementById('v4-mount')).render(<App/>);
</script><!-- PERSONAL_OS_V4 --></body></html>
