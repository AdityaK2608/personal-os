<script type="text/babel" id="personal-os-v4">
const{useEffect,useMemo,useState}=React;
const K='personal_os_v4', PREV=['personal_os_v3','personal_os_v2','personal_os_v1'];
const iso=()=>new Date().toISOString(); const cp=o=>JSON.parse(JSON.stringify(o));
const seed={schemaVersion:4,createdAt:iso(),updatedAt:iso(),tasks:[{id:1,title:'Finish Personal OS V4 release',project:'Personal OS',priority:'High',status:'In Progress',due:'2026-09-02',createdAt:iso()},{id:2,title:'Review important customer follow-up',project:'Work',priority:'High',status:'Todo',due:'2026-09-03',createdAt:iso()},{id:3,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'2026-09-06',createdAt:iso()},{id:4,title:'Capture one useful learning note',project:'Learning',priority:'Low',status:'Todo',due:'2026-09-08',createdAt:iso()}],projects:[{id:1,name:'Personal OS',description:'Premium personal command center',progress:48,health:'On track'},{id:2,name:'SIEM Automation',description:'Evidence collection and reporting',progress:78,health:'On track'},{id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus'},{id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source destination, device and event type before requesting high-volume logs.'},{id:3,title:'Personal OS principle',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}],activity:[{text:'Personal OS V4 initialized',time:iso(),type:'system'}]};
function load(){try{const a=JSON.parse(localStorage.getItem(K));if(a&&Array.isArray(a.tasks)&&Array.isArray(a.projects)&&Array.isArray(a.notes)&&Array.isArray(a.activity))return{...seed,...a,schemaVersion:4};for(const key of PREV){const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.projects)&&Array.isArray(x.notes))return{...seed,...cp(x),schemaVersion:4,updatedAt:iso(),tasks:(x.tasks||[]).map(t=>({...t,createdAt:t.createdAt||iso()})),activity:[{text:'Workspace migrated to V4',time:iso(),type:'system'},...(Array.isArray(x.activity)?x.activity:[])]}}}catch(e){}return cp(seed)}
const words=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean);
function score(t,projects){if(t.status==='Done')return-1e4;const p=projects.find(x=>x.name===t.project);let v={High:60,Medium:35,Low:15}[t.priority]||15;if(p?.health==='At risk')v+=35;if(p?.health==='Needs focus')v+=20;if(/^\d{4}-\d{2}-\d{2}$/.test(t.due)){const d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000);if(d<0)v+=55;else if(d===0)v+=45;else if(d===1)v+=30;else if(d<=3)v+=15}v+=Math.min(Math.max(0,Math.floor((Date.now()-new Date(t.createdAt||Date.now()))/86400000))*3,24);return v}
function smart(q,d){const tt=words(q);if(!tt.length)return[];const rows=[...d.tasks.map(x=>({...x,_type:'Task',_text:[x.title,x.project,x.priority,x.status].join(' ')})),...d.projects.map(x=>({...x,_type:'Project',_text:[x.name,x.description,x.health].join(' ')})),...d.notes.map(x=>({...x,_type:'Knowledge',_text:[x.title,x.tag,x.body].join(' ')}))];return rows.map(x=>({...x,_score:tt.reduce((n,t)=>n+(words(x._text).includes(t)?10:0)+(x._text.toLowerCase().includes(t)?3:0),0)})).filter(x=>x._score>0).sort((a,b)=>b._score-a._score).slice(0,8)}
const Btn=({children,onClick,dark=false})=><button className={'v4-btn '+(dark?'dark':'soft')} onClick={onClick}>{children}</button>;
function App(){const[d,setD]=useState(load),[page,setPage]=useState('home'),[q,setQ]=useState(''),[modal,setModal]=useState(null);useEffect(()=>localStorage.setItem(K,JSON.stringify({...d,updatedAt:iso()})),[d]);useEffect(()=>{const onKey=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('v4-global-search')?.focus()}if(e.key==='Escape'&&q)setQ('')};addEventListener('keydown',onKey);return()=>removeEventListener('keydown',onKey)},[q]);const open=d.tasks.filter(x=>x.status!=='Done'),done=d.tasks.filter(x=>x.status==='Done'),pct=d.tasks.length?Math.round(done.length/d.tasks.length*100):0,ranked=[...open].sort((a,b)=>score(b,d.projects)-score(a,d.projects)),top3=ranked.slice(0,3),risk=d.projects.filter(x=>['At risk','Needs focus'].includes(x.health));const set=x=>setD(x);const log=(text,type='system')=>setD(x=>({...x,updatedAt:iso(),activity:[{text,time:iso(),type},...x.activity].slice(0,120)}));const toggle=id=>setD(x=>({...x,updatedAt:iso(),tasks:x.tasks.map(t=>t.id===id?{...t,status:t.status==='Done'?'Todo':'Done',completedAt:t.status==='Done'?undefined:iso(),updatedAt:iso()}:t),activity:[{text:'Task status changed',time:iso(),type:'task'},...x.activity].slice(0,120)}));const saveTask=t=>setD(x=>{const exists=x.tasks.some(a=>a.id===t.id),z={...t,id:t.id||Date.now(),createdAt:t.createdAt||iso(),updatedAt:iso()};return{...x,tasks:exists?x.tasks.map(a=>a.id===z.id?z:a):[z,...x.tasks],updatedAt:iso(),activity:[{text:(exists?'Updated task: ':'Created task: ')+z.title,time:iso(),type:'task'},...(Array.isArray(x.activity)?x.activity:[])]}});const removeTask=id=>setD(x=>({...x,tasks:x.tasks.filter(t=>t.id!==id),updatedAt:iso()}));const saveProject=p=>setD(x=>{const exists=x.projects.some(a=>a.id===p.id),z={...p,id:p.id||Date.now()};return{...x,projects:exists?x.projects.map(a=>a.id===z.id?z:a):[z,...x.projects],updatedAt:iso(),activity:[{text:(exists?'Updated project: ':'Created project: ')+z.name,time:iso(),type:'project'},...(Array.isArray(x.activity)?x.activity:[])]}});const saveNote=n=>setD(x=>{const exists=x.notes.some(a=>a.id===n.id),z={...n,id:n.id||Date.now()};return{...x,notes:exists?x.notes.map(a=>a.id===z.id?z:a):[z,...x.notes],updatedAt:iso(),activity:[{text:(exists?'Updated note: ':'Captured note: ')+z.title,time:iso(),type:'knowledge'},...(Array.isArray(x.activity)?x.activity:[])]}});const remove=(key,id)=>setD(x=>({...x,[key]:Array.isArray(x[key])?x[key].filter(a=>a.id!==id):[],updatedAt:iso(),activity:[{text:'Deleted item',time:iso(),type:key},...(Array.isArray(x.activity)?x.activity:[])]}));const exportJSON=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='personal-os-v4-backup.json';a.click()};const importJSON=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.projects)||!Array.isArray(x.notes))throw Error();setD({...seed,...x,schemaVersion:4,updatedAt:iso(),activity:[{text:'V4 backup restored',time:iso(),type:'system'},...(x.activity||[])]})}catch{alert('Invalid Personal OS backup')}};r.readAsText(f);e.target.value=''};const reset=()=>{if(confirm('Reset Personal OS V4 to demo data?'))setD(cp(seed))};const search=smart(q,d);const nav=[['home','Home'],['focus','Focus'],['tasks','Tasks'],['projects','Projects'],['knowledge','Knowledge'],['insights','Insights'],['ai','AI COO'],['settings','Settings']];return <div className="v4-app"><div className="v4-shell"><aside className="v4-sidebar"><div className="v4-logo"><div className="v4-mark">P</div><div><div style={{fontWeight:800}}>Personal OS</div><div className="v4-muted" style={{fontSize:12}}>V4 · premium local</div></div></div><div className="v4-nav">{nav.map(([k,l])=><button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>{l}</button>)}</div><div className="v4-side-note"><div style={{fontSize:12,color:'#aaa'}}>PRIVATE BY DEFAULT</div><div style={{marginTop:5,fontWeight:700}}>Zero-cost. No server.</div><div style={{marginTop:4,fontSize:12,color:'#aaa'}}>V3 intelligence preserved.</div></div></aside><main className="v4-content"><div className="v4-top"><div className="v4-search-wrap"><input id="v4-global-search" className="v4-search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search your OS…  ⌘K" onKeyDown={e=>{if(e.key==='Escape')setQ('')}}/>{q&&<div className="v4-search-results">{search.map((x,i)=><button key={i} className="v4-link" style={{display:'block',width:'100%',textAlign:'left',padding:10}} onClick={()=>{setPage(x._type==='Task'?'tasks':x._type==='Project'?'projects':'knowledge');setQ('')}}><span className="v4-pill" style={{marginRight:7}}>{x._type}</span>{x.title||x.name}</button>)}{!search.length&&<div className="v4-empty">No matches.</div>}</div>}</div><div className="v4-actions"><Btn onClick={()=>setPage('focus')}>Focus</Btn><Btn dark onClick={()=>setPage('ai')}>AI COO</Btn></div></div><div className="v4-fade">{page==='home'&&<Home d={d} open={open} done={done} pct={pct} top3={top3} risk={risk} setPage={setPage} toggle={toggle}/>} {page==='focus'&&<Focus top3={top3} toggle={toggle}/>} {page==='tasks'&&<Tasks d={d} open={open} save={saveTask} remove={removeTask} toggle={toggle}/>} {page==='projects'&&<Projects d={d} save={saveProject} remove={remove}/>} {page==='knowledge'&&<Knowledge d={d} save={saveNote} remove={remove}/>} {page==='insights'&&<Insights d={d} pct={pct}/>} {page==='ai'&&<AI d={d} top3={top3} risk={risk} setPage={setPage}/>} {page==='settings'&&<Settings d={d} exportJSON={exportJSON} importJSON={importJSON} reset={reset}/>} {page==='activity'&&<Activity d={d}/>}</div><div className="v4-mobile">{nav.filter(([k])=>k!=='settings').map(([k,l])=><button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>{l}</button>)}<button className={page==='settings'?'active':''} onClick={()=>setPage('settings')}>More</button></div></main></div>{modal&&<Editor kind={modal} d={d} onClose={()=>setModal(null)} saveTask={saveTask} saveProject={saveProject} saveNote={saveNote}/>}</div>}
function Header({title,sub,action}){return <div className="v4-row" style={{marginBottom:18}}><div><div className="v4-eyebrow">Personal OS</div><div className="v4-h2">{title}</div><div className="v4-copy" style={{marginTop:5}}>{sub}</div></div>{action}</div>}
function Home({d,open,done,pct,top3,risk,setPage,toggle}){return <><div className="v4-card v4-hero"><div className="v4-eyebrow">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><div className="v4-h1">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya.</div><div className="v4-copy" style={{fontSize:17,maxWidth:680,marginTop:14}}>Your personal operating system is calm, focused and ready for the next meaningful move.</div><div style={{display:'flex',gap:9,flexWrap:'wrap',marginTop:20}}><Btn dark onClick={()=>setPage('focus')}>Start Focus</Btn><Btn onClick={()=>setPage('ai')}>Open AI COO</Btn></div></div><div className="v4-grid cols4 v4-section">{[['Open',open.length],['Completed',done.length],['Projects',d.projects.length],['Knowledge',d.notes.length]].map(x=><div className="v4-card" key={x[0]}><div className="v4-muted" style={{fontSize:13,fontWeight:700}}>{x[0]}</div><div className="v4-kpi">{x[1]}</div></div>)}</div><div className="v4-grid cols2 v4-section"><div className="v4-card"><div className="v4-row"><div><div className="v4-eyebrow">Daily Top 3</div><div className="v4-h2" style={{fontSize:25}}>What matters now</div></div><button className="v4-link" onClick={()=>setPage('focus')}>Focus →</button></div><div className="v4-list" style={{marginTop:16}}>{top3.map((t,i)=><div className="v4-item" key={t.id}><div className="v4-row"><div><div style={{fontWeight:800}}>{i+1}. {t.title}</div><div className="v4-actionline">{t.project} · {t.priority} · {t.due}</div></div><button className="v4-link" onClick={()=>toggle(t.id)}>Done</button></div></div>)}{!top3.length&&<div className="v4-empty">Your queue is clear.</div>}</div></div><div className="v4-card"><div className="v4-eyebrow">Operating brief</div><div className="v4-h2" style={{fontSize:25}}>{risk.length?'Protect attention.':'Keep momentum.'}</div><div className="v4-copy" style={{marginTop:12}}>{risk.length?risk[0].name+' needs attention. Keep the next block focused before creating more work.':'Execution is balanced. Finish the highest-value item before expanding your queue.'}</div><div style={{marginTop:18}}><div className="v4-row"><span className="v4-actionline">Workspace completion</span><b>{pct}%</b></div><div className="v4-progress" style={{marginTop:8}}><div className="v4-bar" style={{width:pct+'%'}}/></div></div></div></div><div className="v4-card v4-section"><div className="v4-row"><div><div className="v4-eyebrow">Projects</div><div style={{fontSize:22,fontWeight:800}}>Attention map</div></div><button className="v4-link" onClick={()=>setPage('projects')}>All projects →</button></div><div className="v4-grid cols2" style={{marginTop:14}}>{d.projects.map(p=><div className="v4-item" key={p.id}><div className="v4-row"><div><b>{p.name}</b><div className="v4-actionline">{p.health}</div></div><span className="v4-pill">{p.progress}%</span></div><div className="v4-progress" style={{marginTop:11}}><div className="v4-bar" style={{width:p.progress+'%'}}/></div></div>)}</div></div></>}
function Focus({top3,toggle}){const[t,setT]=useState(top3[0]);useEffect(()=>{if(!t||!top3.find(x=>x.id===t.id))setT(top3[0])},[top3]);return <><Header title="Focus" sub="One task. One context. No clutter."/><div className="v4-card" style={{maxWidth:900,margin:'0 auto',padding:'46px 28px',textAlign:'center'}}><div className="v4-eyebrow">CURRENT FOCUS</div>{t?<><div className="v4-h1" style={{fontSize:'clamp(34px,5vw,54px)',marginTop:12}}>{t.title}</div><div className="v4-copy" style={{marginTop:12}}>{t.project} · {t.priority} · {t.due}</div><Btn dark onClick={()=>toggle(t.id)} style={{marginTop:22}}>{t.status==='Done'?'Reopen':'Mark complete'}</Btn><div style={{marginTop:28}}>{top3.map(x=><button key={x.id} className={'v4-pill '+(x.id===t.id?'dark':'')} onClick={()=>setT(x)} style={{marginRight:7,cursor:'pointer'}}>{x.title}</button>)}</div></>:<div className="v4-empty">No open tasks.</div>}</div></>}
function Tasks({d,open,save,remove,toggle}){const[editing,setEditing]=useState(null),[filter,setFilter]=useState('All');const list=open.filter(t=>filter==='All'||t.priority===filter);return <><Header title="Tasks" sub="Quiet execution, now prioritized by the V3 engine." action={<Btn dark onClick={()=>setEditing({id:null,title:'',project:'Personal OS',priority:'Medium',status:'Todo',due:''})}>+ Add task</Btn>}/><div style={{display:'flex',gap:8,marginBottom:12}}>{['All','High','Medium','Low'].map(x=><button className={'v4-pill '+(filter===x?'dark':'')} key={x} onClick={()=>setFilter(x)}>{x}</button>)}</div><div className="v4-card" style={{padding:0,overflow:'hidden'}}>{list.map(t=><div className="v4-task" key={t.id}><div><b>{t.title}</b><div className="v4-actionline">{t.project} · {t.due||'No due date'}</div></div><span className="v4-pill">{t.priority}</span><span className="v4-actionline">{t.status}</span><span className="v4-actionline">{Math.max(0,Math.round(score(t,d.projects)))} pts</span><div style={{display:'flex',gap:9,justifyContent:'flex-end'}}><button className="v4-link" onClick={()=>toggle(t.id)}>Done</button><button className="v4-link" onClick={()=>setEditing({...t})}>Edit</button><button className="v4-link" onClick={()=>remove(t.id)}>Delete</button></div></div>)}{!list.length&&<div className="v4-empty">No tasks here.</div>}</div>{editing&&<TaskEditor data={editing} projects={d.projects} onClose={()=>setEditing(null)} onSave={x=>{save(x);setEditing(null)}}/>}</>}
function TaskEditor({data,projects,onClose,onSave}){const[f,setF]=useState(data),s=(k,v)=>setF({...f,[k]:v});return <div className="v4-modal"><div className="v4-modal-inner"><Header title={f.id?'Edit task':'New task'} sub="Keep the task clear and actionable."/><div className="v4-grid cols2"><input className="v4-input" value={f.title} onChange={e=>s('title',e.target.value)} placeholder="Task title"/><select className="v4-select" value={f.project} onChange={e=>s('project',e.target.value)}>{projects.map(p=><option key={p.id}>{p.name}</option>)}<option>Work</option><option>Learning</option></select><select className="v4-select" value={f.priority} onChange={e=>s('priority',e.target.value)}><option>High</option><option>Medium</option><option>Low</option></select><select className="v4-select" value={f.status} onChange={e=>s('status',e.target.value)}><option>Todo</option><option>In Progress</option><option>Done</option></select><input className="v4-input" type="date" value={f.due||''} onChange={e=>s('due',e.target.value)}/></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}><Btn onClick={onClose}>Cancel</Btn><Btn dark onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save task</Btn></div></div></div>}
function Projects({d,save,remove}){const[e,setE]=useState(null);return <><Header title="Projects" sub="A calm view of where your attention is going." action={<Btn dark onClick={()=>setE({id:null,name:'',description:'',progress:0,health:'On track'})}>+ Add project</Btn>}/><div className="v4-grid cols2">{d.projects.map(p=><div className="v4-card" key={p.id}><div className="v4-row"><div><b style={{fontSize:20}}>{p.name}</b><div className="v4-copy" style={{fontSize:14}}>{p.description}</div></div><span className="v4-pill">{p.health}</span></div><div style={{marginTop:22,fontSize:32,fontWeight:800}}>{p.progress}%</div><div className="v4-progress" style={{marginTop:8}}><div className="v4-bar" style={{width:p.progress+'%'}}/></div><div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:15}}><button className="v4-link" onClick={()=>setE({...p})}>Edit</button><button className="v4-link" onClick={()=>remove('projects',p.id)}>Delete</button></div></div>)}</div>{e&&<ProjectEditor data={e} onClose={()=>setE(null)} onSave={x=>{save(x);setE(null)}}/>}</>}
function ProjectEditor({data,onClose,onSave}){const[f,setF]=useState(data),s=(k,v)=>setF({...f,[k]:v});return <div className="v4-modal"><div className="v4-modal-inner"><Header title={f.id?'Edit project':'New project'} sub="Projects set context for work."/><div className="v4-grid cols2"><input className="v4-input" value={f.name} onChange={e=>s('name',e.target.value)} placeholder="Project name"/><input className="v4-input" value={f.description} onChange={e=>s('description',e.target.value)} placeholder="Description"/><input className="v4-input" type="number" min="0" max="100" value={f.progress} onChange={e=>s('progress',Math.max(0,Math.min(100,Number(e.target.value))))}/><select className="v4-select" value={f.health} onChange={e=>s('health',e.target.value)}><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}><Btn onClick={onClose}>Cancel</Btn><Btn dark onClick={()=>f.name.trim()&&onSave({...f,name:f.name.trim()})}>Save project</Btn></div></div></div>}
function Knowledge({d,save,remove}){const[e,setE]=useState(null);return <><Header title="Knowledge" sub="Your memory layer, now presented like a premium library." action={<Btn dark onClick={()=>setE({id:null,title:'',tag:'General',body:''})}>+ Add note</Btn>}/><div className="v4-grid cols2">{d.notes.map(n=><div className="v4-card" key={n.id}><div className="v4-row"><div><div className="v4-eyebrow">{n.tag}</div><div style={{fontSize:21,fontWeight:800,marginTop:4}}>{n.title}</div></div><span className="v4-pill">Memory</span></div><div className="v4-copy" style={{marginTop:12}}>{n.body}</div><div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:16}}><button className="v4-link" onClick={()=>setE({...n})}>Edit</button><button className="v4-link" onClick={()=>remove('notes',n.id)}>Delete</button></div></div>)}</div>{e&&<NoteEditor data={e} onClose={()=>setE(null)} onSave={x=>{save(x);setE(null)}}/>}</>}
function NoteEditor({data,onClose,onSave}){const[f,setF]=useState(data),s=(k,v)=>setF({...f,[k]:v});return <div className="v4-modal"><div className="v4-modal-inner"><Header title={f.id?'Edit knowledge':'New knowledge'} sub="Capture context you want your future self to remember."/><div className="v4-grid cols2"><input className="v4-input" value={f.title} onChange={e=>s('title',e.target.value)} placeholder="Title"/><input className="v4-input" value={f.tag} onChange={e=>s('tag',e.target.value)} placeholder="Tag"/></div><textarea className="v4-textarea" style={{marginTop:10,minHeight:150}} value={f.body} onChange={e=>s('body',e.target.value)} placeholder="Knowledge…"/><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}><Btn onClick={onClose}>Cancel</Btn><Btn dark onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim(),tag:f.tag.trim()||'General'})}>Save note</Btn></div></div></div>}
function Insights({d,pct}){const open=d.tasks.filter(t=>t.status!=='Done'),done=d.tasks.filter(t=>t.status==='Done'),high=open.filter(t=>t.priority==='High').length,stale=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>4*86400000).length,risk=d.projects.filter(x=>['Needs focus','At risk'].includes(x.health)).length;const dist=[['High',high],['Medium',open.filter(t=>t.priority==='Medium').length],['Low',open.filter(t=>t.priority==='Low').length]];return <><Header title="Insights" sub="A lightweight operating picture generated locally from your workspace."/><div className="v4-grid cols4">{[['Completion',pct+'%'],['Open aging',stale],['High priority',high],['Project risk',risk]].map(x=><div className="v4-card" key={x[0]}><div className="v4-muted" style={{fontSize:13,fontWeight:700}}>{x[0]}</div><div className="v4-kpi">{x[1]}</div></div>)}</div><div className="v4-grid cols2 v4-section"><div className="v4-card"><div className="v4-eyebrow">Workload</div><div className="v4-h2" style={{fontSize:25}}>Open task mix</div>{dist.map(x=><div key={x[0]} style={{marginTop:18}}><div className="v4-row"><span>{x[0]}</span><b>{x[1]}</b></div><div className="v4-progress" style={{marginTop:7}}><div className="v4-bar" style={{width:(open.length?x[1]/open.length*100:0)+'%'}}/></div></div>)}</div><div className="v4-card"><div className="v4-eyebrow">Interpretation</div><div className="v4-h2" style={{fontSize:25}}>What the system sees</div><div className="v4-copy" style={{marginTop:12}}>{risk?'One or more projects need attention. Protect focus time and avoid unnecessary queue growth.':'Project health is stable. The highest leverage is finishing the top-ranked tasks consistently.'}</div><div className="v4-accent" style={{marginTop:18}}>V4 visual redesign keeps analytics calm and readable rather than turning them into a dense BI dashboard.</div></div></div></>}
function AI({d,top3,risk,setPage}){const t=top3[0],over=d.tasks.filter(x=>x.status!=='Done'&&/^\d{4}-\d{2}-\d{2}$/.test(x.due)&&new Date(x.due+'T23:59:59')<new Date()).length;return <><Header title="AI COO" sub="Local intelligence, presented as a calm executive layer."/><div className="v4-grid cols2"><div className="v4-card v4-hero"><div className="v4-eyebrow">Do this next</div><div className="v4-h2">{t?t.title:'Define the next outcome'}</div><div className="v4-copy" style={{marginTop:10}}>{t?'This task currently carries the strongest combined signal from priority, urgency, project health and age.':'Your execution queue is clear.'}</div><Btn dark onClick={()=>setPage('focus')} style={{marginTop:18}}>Take me to Focus</Btn></div><div className="v4-card"><div className="v4-eyebrow">Operating diagnosis</div><div className="v4-h2" style={{fontSize:25}}>{over?'Deadline risk is elevated.':risk.length?'Attention is fragmented.':'Execution looks healthy.'}</div><div className="v4-copy" style={{marginTop:12}}>{over?'Resolve overdue work before expanding scope.':risk.length?risk[0].name+' is asking for more focused attention.':'Keep the next action small, concrete and finishable.'}</div></div></div><div className="v4-card v4-section"><div className="v4-eyebrow">Current principles</div><div className="v4-grid cols2" style={{marginTop:12}}>{[['Prioritize signals','Priority, due date, project health and task age influence the local recommendation.'],['Reduce cognitive load','V4 keeps the interface quiet so the recommendation is easier to act on.'],['Stay private','No external LLM or API key is required for the current COO engine.'],['Prepare for V5','The visual and data layers remain separable so future AI adapters can plug in cleanly.']].map(x=><div className="v4-item" key={x[0]}><b>{x[0]}</b><div className="v4-actionline" style={{marginTop:7}}>{x[1]}</div></div>)}</div></div></>}
function Settings({d,exportJSON,importJSON,reset}){return <><Header title="Settings" sub="Your data, your browser, your control."/><div className="v4-grid cols2"><div className="v4-card"><div className="v4-eyebrow">Data</div><div className="v4-h2" style={{fontSize:25}}>Backup & restore</div><div className="v4-copy" style={{marginTop:10}}>Export the full workspace as JSON or restore a previous backup.</div><div style={{display:'flex',gap:8,marginTop:16}}><Btn dark onClick={exportJSON}>Export JSON</Btn><label className="v4-btn soft" style={{cursor:'pointer'}}>Import JSON<input type="file" accept="application/json" onChange={importJSON} style={{display:'none'}}/></label></div></div><div className="v4-card"><div className="v4-eyebrow">Architecture</div><div className="v4-h2" style={{fontSize:25}}>Local-first</div><div className="v4-copy" style={{marginTop:10}}>Schema version 4 · browser storage · no mandatory backend · no subscription.</div><div style={{marginTop:18}} className="v4-pill dark">personal_os_v4</div><div style={{marginTop:16}}><button className="v4-link" onClick={reset}>Reset demo workspace</button></div></div><div className="v4-card" style={{gridColumn:'1 / -1'}}><div className="v4-eyebrow">V4 design language</div><div className="v4-grid cols2" style={{marginTop:12}}>{[['Soft depth','Translucent cards and restrained shadows.'],['Native feel','System font stack, large type and compact controls.'],['Focus first','Less chrome, more whitespace, clearer primary actions.'],['Responsive','Floating mobile navigation and adaptive layouts.']].map(x=><div className="v4-item" key={x[0]}><b>{x[0]}</b><div className="v4-actionline" style={{marginTop:6}}>{x[1]}</div></div>)}</div></div></div></>}
function Activity({d}){return <><Header title="Activity" sub="A quiet audit trail of your recent changes."/><div className="v4-card">{d.activity.map((a,i)=><div key={i} style={{display:'flex',gap:12,padding:'13px 0',borderTop:i?'1px solid rgba(17,17,19,.06)':'0'}}><span className="v4-dot" style={{marginTop:6}}/><div><div style={{fontWeight:700}}>{a.text}</div><div className="v4-actionline" style={{marginTop:3}}>{new Date(a.time).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'})} · {a.type}</div></div></div>)}</div></>}
document.getElementById('root').innerHTML='<div id="v4-mount"></div>';ReactDOM.createRoot(document.getElementById('v4-mount')).render(<App/>);
