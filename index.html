<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#070b14"/><title>Personal OS 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body,#root{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#eef2ff}*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}.glass{background:rgba(17,24,39,.72);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.12)}.progress{background:linear-gradient(90deg,#818cf8,#38bdf8)}.scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:20px}
</style>
</head><body><div id="root"></div><script type="text/babel">
const{useEffect,useMemo,useState}=React;
const KEY='personal_os_v2';
const oldKey='personal_os_v1';
const seed={tasks:[{id:1,title:'Complete Personal OS V1 structure',project:'Personal OS',priority:'High',status:'In Progress',due:'Today'},{id:2,title:'Review pending customer evidence request',project:'Work',priority:'High',status:'Todo',due:'Today'},{id:3,title:'Update SIEM troubleshooting knowledge',project:'Knowledge',priority:'Medium',status:'Todo',due:'Tomorrow'},{id:4,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'This week'},{id:5,title:'Clean up project notes',project:'Personal OS',priority:'Low',status:'Done',due:'Today'}],projects:[{id:1,name:'Personal OS',description:'Command Center + Knowledge Base + AI COO',progress:32,health:'On track'},{id:2,name:'SIEM Automation',description:'Evidence collection and reporting workflow',progress:78,health:'On track'},{id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus'},{id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady'}],notes:[{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source/destination, device and event type before requesting high-volume logs.'},{id:3,title:'Personal OS idea',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}],activity:[{text:'Personal OS V2 started',time:'Today',type:'system'},{text:'V1.1 data migrated',time:'Today',type:'system'}]};
const clone=x=>JSON.parse(JSON.stringify(x));
function initial(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.tasks)return v;const old=JSON.parse(localStorage.getItem(oldKey));if(old&&old.tasks){return{...clone(old),activity:[{text:'V1.1 data migrated to V2',time:'Today',type:'system'},...(old.activity||[])].slice(0,60)}}}catch{}return clone(seed)}
function stamp(){return new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date())}
function addLog(data,text,type='system'){return[{text,time:stamp(),type},...(data.activity||[])].slice(0,60)}
const nav=[['dashboard','Dashboard','⌂'],['focus','Focus','◉'],['tasks','Tasks','✓'],['projects','Projects','▣'],['knowledge','Knowledge','◈'],['activity','Activity','◷'],['ai','AI COO','✦'],['settings','Settings','⚙']];
const Btn=({children,onClick,primary=false})=><button onClick={onClick} className={'px-4 py-2.5 rounded-xl text-sm font-semibold '+(primary?'bg-indigo-500 hover:bg-indigo-400':'bg-white/5 hover:bg-white/10')}>{children}</button>;
const Input=({value,onChange,placeholder,type='text'})=><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 outline-none focus:border-indigo-400/50"/>;
function App(){const[data,setData]=useState(initial);const[page,setPage]=useState('dashboard');const[q,setQ]=useState('');const[focusId,setFocusId]=useState(null);const[cmd,setCmd]=useState(false);useEffect(()=>localStorage.setItem(KEY,JSON.stringify(data)),[data]);useEffect(()=>{const f=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setCmd(x=>!x)}if(e.key==='Escape'){setCmd(false)}};addEventListener('keydown',f);return()=>removeEventListener('keydown',f)},[]);
const update=x=>setData(x);const search=(arr)=>arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
const taskAdd=t=>update({...data,tasks:[{...t,id:Date.now()},...data.tasks],activity:addLog(data,'Task created: '+t.title,'task')});
const taskEdit=t=>update({...data,tasks:data.tasks.map(x=>x.id===t.id?t:x),activity:addLog(data,'Task updated: '+t.title,'task')});
const taskToggle=id=>{const t=data.tasks.find(x=>x.id===id);if(!t)return;const status=t.status==='Done'?'Todo':'Done';update({...data,tasks:data.tasks.map(x=>x.id===id?{...x,status}:x),activity:addLog(data,(status==='Done'?'Task completed: ':'Task reopened: ')+t.title,'task')})};
const taskDelete=id=>{const t=data.tasks.find(x=>x.id===id);update({...data,tasks:data.tasks.filter(x=>x.id!==id),activity:addLog(data,'Task deleted: '+(t?.title||'task'),'task')})};
const projectSave=p=>{const exists=data.projects.some(x=>x.id===p.id);update({...data,projects:exists?data.projects.map(x=>x.id===p.id?p:x):[{...p,id:Date.now()},...data.projects],activity:addLog(data,(exists?'Project updated: ':'Project created: ')+p.name,'project')})};
const projectDelete=id=>{const p=data.projects.find(x=>x.id===id);update({...data,projects:data.projects.filter(x=>x.id!==id),activity:addLog(data,'Project deleted: '+(p?.name||'project'),'project')})};
const noteSave=n=>{const exists=data.notes.some(x=>x.id===n.id);update({...data,notes:exists?data.notes.map(x=>x.id===n.id?n:x):[{...n,id:Date.now()},...data.notes],activity:addLog(data,(exists?'Knowledge updated: ':'Knowledge created: ')+n.title,'knowledge')})};
const noteDelete=id=>{const n=data.notes.find(x=>x.id===id);update({...data,notes:data.notes.filter(x=>x.id!==id),activity:addLog(data,'Knowledge deleted: '+(n?.title||'note'),'knowledge')})};
const exportData=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-os-v2-backup.json';a.click()};
const importData=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.tasks||!x.projects||!x.notes)throw Error();update({...x,activity:addLog(data,'V2 backup imported','system')})}catch{alert('Invalid Personal OS V2 backup.')}};r.readAsText(f);e.target.value=''};
const reset=()=>{if(confirm('Reset Personal OS V2 to demo data?'))update(clone(seed))};
const open=data.tasks.filter(t=>t.status!=='Done'),done=data.tasks.filter(t=>t.status==='Done'),high=open.filter(t=>t.priority==='High'),completion=data.tasks.length?Math.round(done.length/data.tasks.length*100):0;
return <div className="min-h-full bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,.16),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,.1),transparent_30%)]"><div className="max-w-[1500px] mx-auto min-h-screen flex"><aside className="w-64 shrink-0 border-r border-white/10 p-5 hidden md:flex flex-col"><div className="flex items-center gap-3 mb-8"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center font-black">P</div><div><b>Personal OS</b><div className="text-xs text-slate-400">V2.0 · local-first</div></div></div><div className="space-y-1">{nav.map(([k,l,i])=><button key={k} onClick={()=>setPage(k)} className={'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm '+(page===k?'bg-white/10':'text-slate-400 hover:bg-white/5')}>{i}<span>{l}</span></button>)}</div><div className="mt-auto glass rounded-2xl p-4"><div className="text-xs text-indigo-300">V2.0 · Offline-first</div><div className="text-sm font-medium mt-1">Private browser workspace.</div><div className="text-xs text-slate-500 mt-2">No server · No subscription</div></div></aside><main className="flex-1 min-w-0"><header className="sticky top-0 z-10 px-5 md:px-8 py-4 border-b border-white/10 bg-[#070b14]/85 backdrop-blur-xl"><div className="flex items-center gap-3"><div className="md:hidden font-bold">Personal OS</div><div className="relative flex-1 max-w-2xl"><span className="absolute left-3 top-2.5 text-slate-500">⌕</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search everything…  Ctrl+K" className="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-sm outline-none"/></div><Btn onClick={()=>setCmd(true)}>⌘K</Btn><Btn primary onClick={()=>setPage('ai')}>Ask AI COO</Btn></div><div className="md:hidden flex gap-1 mt-3 overflow-x-auto">{nav.map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'px-3 py-2 rounded-lg text-xs whitespace-nowrap '+(page===k?'bg-white/10':'text-slate-400')}>{l}</button>)}</div></header><section className="p-5 md:p-8 max-w-[1250px] mx-auto">{page==='dashboard'&&<Dashboard data={data} open={open} done={done} high={high} completion={completion} setPage={setPage} toggle={taskToggle}/>} {page==='focus'&&<Focus data={data} open={open} focusId={focusId} setFocusId={setFocusId} toggle={taskToggle}/>} {page==='tasks'&&<Tasks data={data} items={search(data.tasks)} add={taskAdd} edit={taskEdit} toggle={taskToggle} del={taskDelete}/>} {page==='projects'&&<Projects data={data} items={search(data.projects)} save={projectSave} del={projectDelete}/>} {page==='knowledge'&&<Knowledge data={data} items={search(data.notes)} save={noteSave} del={noteDelete}/>} {page==='activity'&&<Activity data={data}/>} {page==='ai'&&<AI data={data} completion={completion} setPage={setPage}/>} {page==='settings'&&<Settings data={data} exportData={exportData} importData={importData} reset={reset}/>}</section></main></div>{cmd&&<Command data={data} close={()=>setCmd(false)} setPage={setPage} add={taskAdd}/>}</div>}
function Title({title,sub,action}){return <div className="flex justify-between gap-4 items-start mb-7"><div><h1 className="text-3xl font-bold tracking-tight">{title}</h1><p className="text-slate-400 mt-2">{sub}</p></div>{action}</div>}
function Dashboard({data,open,done,high,completion,setPage,toggle}){const attention=data.projects.filter(p=>p.health==='Needs focus'||p.health==='At risk');return <><div className="mb-8"><div className="text-sm text-indigo-300 mb-2">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><h1 className="text-3xl md:text-4xl font-bold">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">V2 turns your Personal OS into a private offline workspace.</p></div><div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">{[['Open tasks',open.length],['Completed',done.length],['Projects',data.projects.length],['Knowledge',data.notes.length]].map((x,i)=><div className="glass rounded-2xl p-5" key={x[0]}><div className="text-sm text-slate-400">{x[0]}</div><div className="text-3xl font-bold mt-2">{x[1]}</div></div>)}</div><div className="grid lg:grid-cols-[1.4fr_1fr] gap-5"><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="flex justify-between"><div><b>Operating pulse</b><div className="text-xs text-slate-500 mt-1">{completion}% complete · {high.length} high-priority · {attention.length} projects need focus</div></div><button onClick={()=>setPage('focus')} className="text-xs text-indigo-300">Open Focus →</button></div><div className="mt-5 h-2 bg-white/5 rounded-full overflow-hidden"><div className="progress h-full rounded-full" style={{width:completion+'%'}}/></div></div><div className="glass rounded-2xl p-5"><div className="flex justify-between mb-4"><b>Next actions</b><button onClick={()=>setPage('tasks')} className="text-xs text-indigo-300">All tasks</button></div>{open.slice(0,6).map(t=><div key={t.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/[.03] mb-2 last:mb-0"><button onClick={()=>toggle(t.id)} className="w-5 h-5 rounded-full border border-slate-600 shrink-0"/><div className="flex-1 min-w-0"><div className="text-sm truncate">{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority} · {t.status}</div></div></div>)}</div></div><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="text-xs uppercase tracking-widest text-indigo-300">AI COO</div><div className="text-xl font-semibold mt-2">{high[0]?'Do this next':'Create your next meaningful action'}</div><p className="text-sm text-slate-400 mt-2">{high[0]?high[0].title:'Your queue is clear. Use Focus to define the next move.'}</p><button onClick={()=>setPage('ai')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open AI COO →</button></div><div className="glass rounded-2xl p-5"><b>Projects needing attention</b>{attention.length?attention.map(p=><div key={p.id} className="mt-4 p-3 rounded-xl bg-white/[.03]"><div className="flex justify-between text-sm"><span>{p.name}</span><span>{p.progress}%</span></div><div className="h-1.5 bg-white/5 rounded-full mt-2"><div className="progress h-full rounded-full" style={{width:p.progress+'%'}}/></div><div className="text-xs text-amber-300 mt-2">{p.health}</div></div>):<div className="text-sm text-slate-500 mt-4">Everything is on track.</div>}</div></div></div></>}
function TaskForm({initial,projects,onSave,onCancel}){const x=initial||{title:'',project:'Personal OS',priority:'Medium',status:'Todo',due:'Today'};const[f,setF]=useState(x);const s=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5 grid md:grid-cols-2 gap-3"><Input value={f.title} onChange={v=>s('title',v)} placeholder="Task title"/><select value={f.project} onChange={e=>s('project',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Personal OS</option>{projects.map(p=><option key={p.id}>{p.name}</option>)}<option>Work</option><option>Knowledge</option></select><select value={f.priority} onChange={e=>s('priority',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>High</option><option>Medium</option><option>Low</option></select><select value={f.status} onChange={e=>s('status',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Todo</option><option>In Progress</option><option>Done</option></select><input type="date" value={/^\d{4}-\d{2}-\d{2}$/.test(f.due)?f.due:''} onChange={e=>s('due',e.target.value||'Today')} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><div className="md:col-span-2 flex justify-end gap-2"><Btn onClick={onCancel}>Cancel</Btn><Btn primary onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save task</Btn></div></div>}
function Tasks({data,items,add,edit,toggle,del}){const[show,setShow]=useState(false),[editing,setEditing]=useState(null),[status,setStatus]=useState('All'),[priority,setPriority]=useState('All');const list=items.filter(t=>(status==='All'||t.status===status)&&(priority==='All'||t.priority===priority));return <><Title title="Tasks" sub="A structured execution queue with fast filters and inline editing." action={<Btn primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add task</Btn>}/><div className="flex gap-2 mb-5"><select value={status} onChange={e=>setStatus(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option>All</option><option>Todo</option><option>In Progress</option><option>Done</option></select><select value={priority} onChange={e=>setPriority(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option>All</option><option>High</option><option>Medium</option><option>Low</option></select><span className="text-xs text-slate-500 self-center">{list.length} shown</span></div>{show&&<TaskForm projects={data.projects} onCancel={()=>setShow(false)} onSave={x=>{add(x);setShow(false)}}/>}<div className="glass rounded-2xl overflow-hidden">{list.map((t,i)=><div key={t.id} className={'p-4 '+(i?'border-t border-white/5':'')}>{editing===t.id?<TaskForm initial={t} projects={data.projects} onCancel={()=>setEditing(null)} onSave={x=>{edit(x);setEditing(null)}}/>:<div className="flex items-center gap-3"><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border shrink-0 '+(t.status==='Done'?'bg-emerald-500 border-emerald-500':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1 min-w-0"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.due} · {t.status}</div></div><span className="text-xs px-2 py-1 rounded-full bg-white/5">{t.priority}</span><button onClick={()=>setEditing(t.id)} className="text-xs text-indigo-300">Edit</button><button onClick={()=>del(t.id)} className="text-xs text-rose-300">Delete</button></div>}</div>)}{!list.length&&<div className="p-8 text-center text-sm text-slate-500">No tasks match these filters.</div>}</div></>}
function Projects({data,items,save,del}){const[editing,setEditing]=useState(null);const form=editing==='new'?{id:null,name:'',description:'',progress:0,health:'On track'}:editing?items.find(x=>x.id===editing):null;return <><Title title="Projects" sub="Projects now act as strategic containers for execution." action={<Btn primary onClick={()=>setEditing('new')}>+ Add project</Btn>}/>{form&&<ProjectEditor data={form} onCancel={()=>setEditing(null)} onSave={x=>{save(x);setEditing(null)}}/>}<div className="grid md:grid-cols-2 gap-5">{items.map(p=><div key={p.id} className="glass rounded-2xl p-5"><div className="flex justify-between"><div><div className="text-lg font-semibold">{p.name}</div><p className="text-sm text-slate-400 mt-1">{p.description}</p></div><b>{p.progress}%</b></div><div className="h-2 bg-white/5 rounded-full mt-5"><div className="progress h-full rounded-full" style={{width:p.progress+'%'}}/></div><div className="flex justify-between mt-3 text-xs"><span className="text-slate-500">{p.health}</span><span className="flex gap-3"><button onClick={()=>setEditing(p.id)} className="text-indigo-300">Edit</button><button onClick={()=>del(p.id)} className="text-rose-300">Delete</button></span></div></div>)}</div></>}
function ProjectEditor({data,onSave,onCancel}){const[f,setF]=useState(data);const s=(k,v)=>setF({...f,[k]:v});return <div className="md:col-span-2 grid md:grid-cols-2 gap-3"><Input value={f.name} onChange={v=>s('name',v)} placeholder="Project name"/><Input value={f.description} onChange={v=>s('description',v)} placeholder="Description"/><Input type="number" value={f.progress} onChange={v=>s('progress',Math.max(0,Math.min(100,Number(v))))} placeholder="Progress"/><select value={f.health} onChange={e=>s('health',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select><div className="md:col-span-2 flex justify-end gap-2"><Btn onClick={onCancel}>Cancel</Btn><Btn primary onClick={()=>f.name.trim()&&onSave({...f,name:f.name.trim(),id:f.id||Date.now()})}>Save project</Btn></div></div>}
function Knowledge({data,items,save,del}){const[editing,setEditing]=useState(null),[tag,setTag]=useState('All');const tags=['All',...new Set(items.map(n=>n.tag))];const list=tag==='All'?items:items.filter(n=>n.tag===tag);return <><Title title="Knowledge" sub="A searchable memory layer for decisions, troubleshooting and ideas." action={<Btn primary onClick={()=>setEditing('new')}>+ Add note</Btn>}/><div className="flex gap-2 mb-5 overflow-x-auto">{tags.map(t=><button key={t} onClick={()=>setTag(t)} className={'px-3 py-2 rounded-xl text-xs '+(tag===t?'bg-indigo-500':'bg-white/5 text-slate-400')}>{t}</button>)}</div>{editing&&<NoteEditor data={editing==='new'?null:items.find(n=>n.id===editing)} onCancel={()=>setEditing(null)} onSave={x=>{save(x);setEditing(null)}}/>}<div className="grid md:grid-cols-2 gap-5">{list.map(n=><div key={n.id} className="glass rounded-2xl p-5"><div className="flex justify-between"><div><b>{n.title}</b><div className="text-xs text-indigo-300 mt-2">{n.tag}</div></div><span className="flex gap-2"><button onClick={()=>setEditing(n.id)} className="text-xs text-indigo-300">Edit</button><button onClick={()=>del(n.id)} className="text-xs text-rose-300">Delete</button></span></div><p className="text-sm text-slate-400 mt-4 leading-6">{n.body}</p></div>)}</div></>}

function Focus({data,open,focusId,setFocusId,toggle}){const task=open.find(t=>t.id===focusId)||open.find(t=>t.priority==='High')||open[0];return <><Title title="Focus" sub="A distraction-light execution mode. Pick one task and work it to completion."/><div className="max-w-3xl mx-auto glass rounded-3xl p-8 text-center"><div className="text-xs uppercase tracking-widest text-indigo-300">Current focus</div>{task?<><h2 className="text-2xl md:text-3xl font-bold mt-4">{task.title}</h2><p className="text-slate-400 mt-3">{task.project} · {task.priority} · {task.status}</p><button onClick={()=>toggle(task.id)} className="mt-7 px-6 py-3 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-semibold">{task.status==='Done'?'Reopen task':'Mark complete'}</button><div className="mt-8"><select value={focusId||task.id} onChange={e=>setFocusId(Number(e.target.value))} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option value={task.id}>Current: {task.title}</option>{open.filter(x=>x.id!==task.id).map(x=><option key={x.id} value={x.id}>{x.title}</option>)}</select></div></>:<div className="text-slate-500 mt-6">No open tasks. Your focus queue is clear.</div>}</div></>}

const Card=({children,className=''})=><div className={'glass rounded-2xl p-5 '+className}>{children}</div>;
function Dashboard({data,open,done,completion,top3,rec,setPage}){const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');return <><div className="mb-7"><div className="text-sm text-indigo-300">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><h1 className="text-3xl md:text-4xl font-bold mt-2">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">V3 turns Personal OS into a local operating system that ranks, connects and explains your work.</p></div><div className="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">{[['Open',open.length],['Done',done.length],['Completion',completion+'%'],['Projects',data.projects.length],['Knowledge',data.notes.length]].map(x=><Card key={x[0]}><div className="text-xs text-slate-400">{x[0]}</div><div className="text-2xl font-bold mt-2">{x[1]}</div></Card>)}</div><div className="grid lg:grid-cols-[1.4fr_1fr] gap-5"><div className="space-y-5"><Card><div className="flex items-center justify-between"><div><b>Today’s operating brief</b><p className="text-sm text-slate-400 mt-2">{rec[0].why}</p></div><Btn onClick={()=>setPage('ai')}>Explain →</Btn></div></Card><Card><div className="flex justify-between mb-4"><b>Daily Top 3</b><button onClick={()=>setPage('focus')} className="text-xs text-indigo-300">Open Focus →</button></div>{top3.map((t,i)=><div key={t.id} className="p-3 rounded-xl bg-white/[.03] mb-2"><div className="flex gap-3"><div className="w-7 h-7 rounded-full bg-white/10 grid place-items-center text-xs">{i+1}</div><div><div className="text-sm font-medium">{t.title}</div><div className="text-xs text-slate-500 mt-1">Score {Math.max(0,Math.round(scoreTask(t,data.projects)))} · {t.project} · {t.priority}</div></div></div></div>)}{!top3.length&&<div className="text-sm text-slate-500">Nothing pending. Define the next outcome.</div>}</Card></div><div className="space-y-5"><Card><div className="text-xs uppercase tracking-widest text-indigo-300">Do this now</div><div className="text-xl font-semibold mt-2">{rec[0].title}</div><p className="text-sm text-slate-400 mt-2">{rec[0].why}</p><button onClick={()=>setPage('focus')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Take me to Focus →</button></Card><Card><b>Attention signals</b>{risk.length?risk.map(p=><div key={p.id} className="mt-4 p-3 rounded-xl bg-white/[.03]"><div className="flex justify-between text-sm"><span>{p.name}</span><span>{p.progress}%</span></div><div className="text-xs text-amber-300 mt-2">{p.health}</div></div>):<div className="text-sm text-slate-500 mt-4">No project risk signals detected.</div>}</Card></div></div></>}
function Focus({top3,toggle}){const t=top3[0];return <><h1 className="text-3xl font-bold">Focus</h1><p className="text-slate-400 mt-2 mb-7">V3’s ranking engine chooses the strongest next move.</p><Card className="max-w-3xl mx-auto text-center p-8">{t?<><div className="text-xs uppercase tracking-widest text-indigo-300">Recommended focus</div><h2 className="text-2xl md:text-3xl font-bold mt-4">{t.title}</h2><div className="text-sm text-slate-500 mt-2">{t.project} · {t.priority}</div><button onClick={()=>toggle(t.id)} className="mt-7 px-6 py-3 rounded-xl bg-indigo-500 font-semibold">Mark complete</button></>:<div className="text-slate-500">Queue clear.</div>}</Card></>}
function Tasks({data,open,toggle,save,remove,setModal}){return <><div className="flex justify-between items-start mb-7"><div><h1 className="text-3xl font-bold">Tasks</h1><p className="text-slate-400 mt-2">Priority is calculated from urgency, age, project health and status.</p></div><Btn primary onClick={()=>setModal({kind:'task',item:null})}>+ Add</Btn></div><div className="glass rounded-2xl overflow-hidden">{data.tasks.map((t,i)=><div key={t.id} className={'p-4 '+(i?'border-t border-white/5':'')}><div className="flex gap-3 items-center"><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border '+(t.status==='Done'?'bg-emerald-500 border-emerald-500':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority} · due {t.due||'unscheduled'} · score {Math.max(0,Math.round(scoreTask(t,data.projects)))}</div></div><button onClick={()=>setModal({kind:'task',item:t})} className="text-xs text-indigo-300">Edit</button><button onClick={()=>remove('tasks',t.id)} className="text-xs text-rose-300">Delete</button></div></div>)}</div></>}
function Projects({data,save,remove,setModal}){return <><div className="flex justify-between items-start mb-7"><div><h1 className="text-3xl font-bold">Projects</h1><p className="text-slate-400 mt-2">Health is now part of task ranking and AI COO reasoning.</p></div><Btn primary onClick={()=>setModal({kind:'project',item:null})}>+ Add</Btn></div><div className="grid md:grid-cols-2 gap-5">{data.projects.map(p=><Card key={p.id}><div className="flex justify-between"><div><div className="text-lg font-semibold">{p.name}</div><div className="text-sm text-slate-400 mt-1">{p.description}</div></div><b>{p.progress}%</b></div><div className="h-2 bg-white/5 rounded-full mt-5"><div className="h-full rounded-full progress" style={{width:p.progress+'%'}}/></div><div className="flex justify-between mt-3 text-xs"><span className="text-slate-500">{p.health}</span><span className="flex gap-3"><button onClick={()=>setModal({kind:'project',item:p})} className="text-indigo-300">Edit</button><button onClick={()=>remove('projects',p.id)} className="text-rose-300">Delete</button></span></div></Card>)}</div></>}
function Knowledge({data,save,remove}){const[q,setQ]=useState('');const rows=smartSearch(q,data).filter(x=>x._type==='Knowledge');return <><div className="mb-7"><h1 className="text-3xl font-bold">Knowledge</h1><p className="text-slate-400 mt-2">Search by meaning-like token relationships, tags and linked concepts—without an external AI service.</p></div><div className="mb-5"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="What do I already know about…" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3"/></div><div className="grid md:grid-cols-2 gap-5">{data.notes.map(n=><Card key={n.id}><div className="flex justify-between"><div><b>{n.title}</b><div className="text-xs text-indigo-300 mt-2">{n.tag}</div></div><button onClick={()=>remove('notes',n.id)} className="text-xs text-rose-300">Delete</button></div><p className="text-sm text-slate-400 mt-4 leading-6">{n.body}</p>{q&&rows.find(x=>x.id===n.id)&&<div className="text-xs text-emerald-300 mt-3">Relevant to this search</div>}</Card>)}<Card><b>Knowledge → action</b><p className="text-sm text-slate-400 mt-2">V3 relates notes to tasks/projects using shared concepts so your memory can influence execution.</p></Card></div></>}
function Insights({data,completion}){const open=data.tasks.filter(t=>t.status!=='Done');const aged=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>4*86400000);const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');const activity=data.activity.length;const byProject=data.projects.map(p=>({name:p.name,count:data.tasks.filter(t=>t.project===p.name&&t.status!=='Done').length})).sort((a,b)=>b.count-a.count);return <><h1 className="text-3xl font-bold">Insights</h1><p className="text-slate-400 mt-2 mb-7">Personal analytics generated locally from your workspace.</p><div className="grid md:grid-cols-3 gap-5"><Card><div className="text-xs text-slate-400">Completion</div><div className="text-3xl font-bold mt-2">{completion}%</div><p className="text-xs text-slate-500 mt-2">Completed / total tasks</p></Card><Card><div className="text-xs text-slate-400">Aging queue</div><div className="text-3xl font-bold mt-2">{aged.length}</div><p className="text-xs text-slate-500 mt-2">Open tasks older than 4 days</p></Card><Card><div className="text-xs text-slate-400">Project risk</div><div className="text-3xl font-bold mt-2">{risk.length}</div><p className="text-xs text-slate-500 mt-2">Needs focus / At risk</p></Card></div><Card className="mt-5"><b>Workload distribution</b><div className="mt-4 space-y-3">{byProject.map(x=><div key={x.name}><div className="flex justify-between text-sm"><span>{x.name}</span><span>{x.count}</span></div><div className="h-2 bg-white/5 rounded-full mt-1"><div className="h-full bg-indigo-500 rounded-full" style={{width:Math.min(100,x.count*20)+'%'}}/></div></div>)}</div></Card><div className="text-xs text-slate-600 mt-4">Local activity records: {activity}. Analytics improve as you use the system.</div></>}
function Activity({data}){return <><h1 className="text-3xl font-bold">Activity</h1><p className="text-slate-400 mt-2 mb-7">Your local operating history.</p><Card className="space-y-4">{data.activity.map((a,i)=><div key={i} className="flex gap-3"><div className="w-2.5 h-2.5 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{new Date(a.time).toLocaleString('en-IN')} · {a.type}</div></div></div>)}</Card></>}
function AI({data,rec,setPage}){const r=rec;const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');return <><h1 className="text-3xl font-bold">AI COO 3.0</h1><p className="text-slate-400 mt-2 mb-7">Deterministic local intelligence. No LLM, API key, server or subscription required.</p><div className="grid lg:grid-cols-2 gap-5">{r.map((x,i)=><Card key={i}><div className="text-xs uppercase tracking-widest text-indigo-300">{x.kind}</div><div className="text-xl font-semibold mt-2">{x.title}</div><p className="text-slate-400 mt-3">{x.why}</p>{x.taskId&&<button onClick={()=>setPage('focus')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open Focus →</button>}</Card>)}<Card className="lg:col-span-2"><b>System diagnosis</b><p className="text-slate-300 mt-3 leading-7">{risk.length?`Project attention is influencing the queue: ${risk.map(x=>x.name).join(', ')}.`:'No project health risk is currently amplifying the queue.'} {data.tasks.filter(t=>t.status!=='Done').length} open tasks and {data.notes.length} knowledge items are being considered by the local engine.</p></Card></div></>}
function Settings({data,exportJSON,importJSON,reset}){return <><h1 className="text-3xl font-bold">Settings</h1><p className="text-slate-400 mt-2 mb-7">Data health, schema and recovery controls.</p><div className="grid md:grid-cols-2 gap-5"><Card><b>Schema</b><div className="text-sm text-slate-400 mt-3">Version {data.schemaVersion} · last updated {new Date(data.updatedAt).toLocaleString('en-IN')}</div><div className="text-xs text-emerald-300 mt-3">V2 → V3 migration supported</div></Card><Card><b>Backup & restore</b><p className="text-sm text-slate-400 mt-2">Exports all tasks, projects, knowledge and activity to JSON.</p><div className="flex flex-wrap gap-2 mt-4"><Btn primary onClick={exportJSON}>Export V3 backup</Btn><label className="px-3 py-2 rounded-xl bg-white/5 text-sm cursor-pointer">Import<input type="file" accept="application/json" onChange={importJSON} className="hidden"/></label></div></Card><Card className="md:col-span-2"><b>Zero-cost & privacy</b><div className="grid md:grid-cols-3 gap-4 mt-4">{[['Local-first','Workspace data stays in browser storage unless you export it.'],['No external AI','V3 uses deterministic local reasoning and relationship scoring.'],['No installation','Runs directly in GitHub Pages through browser/CDN assets.']].map(x=><div key={x[0]} className="p-4 rounded-xl bg-white/[.03]"><b>{x[0]}</b><p className="text-xs text-slate-500 mt-2">{x[1]}</p></div>)}</div></Card><Card><b>Recovery</b><p className="text-sm text-slate-400 mt-2">Reset only when you intentionally want the V3 demo workspace.</p><button onClick={reset} className="mt-4 px-4 py-2 rounded-xl bg-rose-500/10 text-rose-300 text-sm">Reset demo</button></Card></div></>}
function EditModal({kind,item,data,close,save}){const initial=item|| (kind==='task'?{title:'',project:data.projects[0]?.name||'Personal OS',priority:'Medium',status:'Todo',due:'',blockedBy:[]} :kind==='project'?{name:'',description:'',progress:0,health:'On track'}:{title:'',tag:'General',body:''});const[f,setF]=useState(initial);const field=(k,v)=>setF({...f,[k]:v});return <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-start justify-center pt-20 px-4"><div className="glass rounded-2xl p-5 w-full max-w-lg"><div className="flex justify-between mb-4"><b>{item?'Edit':'Add'} {kind}</b><button onClick={close}>✕</button></div>{kind==='task'&&<div className="space-y-3"><input value={f.title} onChange={e=>field('title',e.target.value)} placeholder="Task title" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.project} onChange={e=>field('project',e.target.value)} placeholder="Project" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><div className="grid grid-cols-2 gap-3"><select value={f.priority} onChange={e=>field('priority',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>High</option><option>Medium</option><option>Low</option></select><select value={f.status} onChange={e=>field('status',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Todo</option><option>In Progress</option><option>Done</option></select></div><input type="date" value={f.due||''} onChange={e=>field('due',e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/></div>}{kind==='project'&&<div className="space-y-3"><input value={f.name} onChange={e=>field('name',e.target.value)} placeholder="Project name" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.description} onChange={e=>field('description',e.target.value)} placeholder="Description" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input type="number" min="0" max="100" value={f.progress} onChange={e=>field('progress',Math.max(0,Math.min(100,Number(e.target.value))))} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><select value={f.health} onChange={e=>field('health',e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select></div>}{kind==='note'&&<div className="space-y-3"><input value={f.title} onChange={e=>field('title',e.target.value)} placeholder="Title" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.tag} onChange={e=>field('tag',e.target.value)} placeholder="Tag" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><textarea rows="5" value={f.body} onChange={e=>field('body',e.target.value)} placeholder="Knowledge" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/></div>}<div className="flex justify-end gap-2 mt-5"><Btn onClick={close}>Cancel</Btn><Btn primary onClick={()=>{save(f);close()}}>Save</Btn></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
