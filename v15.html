<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>Personal OS 15.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#101114;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.app{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:950;letter-spacing:-.04em}.muted{color:#858b94;font-size:11px}.btn{border:1px solid #dfe2e6;background:#fff;color:#151619;padding:9px 12px;border-radius:11px;font-weight:800;cursor:pointer}.dark{background:#111;color:#fff;border-color:#111}.layout{display:grid;grid-template-columns:210px 1fr 320px;gap:12px}.card{background:#fff;border:1px solid #e6e8eb;border-radius:20px;padding:15px;box-shadow:0 10px 35px #1011140a}.nav button{display:block;width:100%;text-align:left;margin:5px 0}.nav .active{background:#111;color:#fff;border-color:#111}.label{font-size:9px;letter-spacing:.17em;color:#9297a0;font-weight:950}.h{font-size:26px;letter-spacing:-.055em;font-weight:950;margin:5px 0 12px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.metric{padding:11px;border:1px solid #e8eaed;border-radius:14px;background:#fafafa}.metric b{display:block;font-size:21px;margin-top:3px}.hero{background:#111;color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}.hero .muted{color:#a2a6ad}.focus{font-size:18px;font-weight:900;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:7px}.item{border:1px solid #e8eaed;border-radius:13px;padding:10px}.item b{font-size:11px}.small{font-size:10px}.pill{float:right;background:#eef0f2;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.bar{height:6px;background:#e7e9ec;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#111}.chat{height:330px;overflow:auto;display:grid;align-content:start;gap:7px;margin:10px 0}.msg{max-width:90%;padding:9px 11px;border-radius:13px;font-size:11px;line-height:1.5;white-space:pre-wrap}.user{justify-self:end;background:#111;color:#fff}.ai{background:#eef0f2}.composer{display:flex;gap:6px}.input{width:100%;border:1px solid #dfe2e6;border-radius:11px;padding:11px;outline:0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.timeline{display:grid;gap:6px;max-height:260px;overflow:auto}.event{padding:9px;border-left:2px solid #111;background:#fafafa;border-radius:0 10px 10px 0;font-size:10px}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:15px;z-index:10}.modalin{width:min(680px,100%);background:#fff;border-radius:20px;padding:18px}.modalin textarea,.modalin input,.modalin select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin:4px 0 8px}.actions{display:flex;gap:7px;justify-content:flex-end}.toast{position:fixed;right:15px;bottom:15px;background:#111;color:#fff;padding:10px 13px;border-radius:11px;font-size:11px;font-weight:800}@media(max-width:1100px){.layout{grid-template-columns:180px 1fr}.right{grid-column:1/-1}.chat{height:220px}}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:none}.metrics{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}} </style></head><body><div class="app"><div class="top"><div><div class="brand">PERSONAL OS · 15.0</div><div class="muted">Personal Operating System 2.0 · local-first · Aditya</div></div><button class="btn" onclick="location.href='v14.html'">v14</button></div><div class="layout"><aside class="card nav"><div class="label">SYSTEM</div><button id="n-home" class="btn active" onclick="view('home')">Home</button><button id="n-work" class="btn" onclick="view('work')">Work</button><button id="n-projects" class="btn" onclick="view('projects')">Projects</button><button id="n-knowledge" class="btn" onclick="view('knowledge')">Knowledge</button><button id="n-decisions" class="btn" onclick="view('decisions')">Decisions</button><button id="n-journal" class="btn" onclick="view('journal')">Journal</button><button id="n-memory" class="btn" onclick="view('memory')">Memory</button><button class="btn" onclick="openTask()">+ New task</button><button class="btn" onclick="backup()">Export backup</button></aside><main id="main"></main><aside class="right"><div class="card"><div class="label">OS COPILOT</div><div id="chat" class="chat"></div><div class="composer"><input id="cmd" class="input" placeholder="e.g. plan my day around the top tasks"><button class="btn dark" onclick="send()">Run</button></div><div class="quick"><button class="btn" onclick="run('briefing')">Briefing</button><button class="btn" onclick="run('plan today')">Plan</button><button class="btn" onclick="run('review')">Review</button><button class="btn" onclick="run('show overdue')">Overdue</button></div></div><div class="card" style="margin-top:12px"><div class="label">SYSTEM HEALTH</div><div id="health" class="small" style="margin-top:8px"></div></div></aside></div></div><div id="modal"></div><script>(function(){'use strict';var KEY='personal_os_v80',MEM='personal_os_v12_memory',viewName='home',chat=[];function get(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],projects:[],notes:[],decisions:[],journal:[]}}catch(e){return{tasks:[],projects:[],notes:[],decisions:[],journal:[]}}}function put(d){d.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function memories(){try{return JSON.parse(localStorage.getItem(MEM)||'[]')}catch(e){return[]}}function score(t){var s=t.priority==='High'?60:t.priority==='Medium'?30:10;if(t.lane==='NOW')s+=25;if(t.status==='Blocked')s-=20;if(t.due){var x=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/864e5);if(x<0)s+=60;else if(x===0)s+=40;else if(x<=2)s+=25}return s}function st(){var d=get(),today=new Date().toISOString().slice(0,10),o=(d.tasks||[]).filter(t=>t.status!=='Done');return{d:d,o:o,over:o.filter(t=>t.due&&t.due<today),soon:o.filter(t=>t.due&&t.due>=today&&t.due<=new Date(Date.now()+2*864e5).toISOString().slice(0,10)),mem:memories()}}function log(d,text){d.activity=d.activity||[];d.activity.unshift({id:Date.now(),text:text,time:new Date().toISOString()});d.activity=d.activity.slice(0,100);put(d)}function answer(q){var d=get(),s=q.trim(),l=s.toLowerCase(),x=st();if(l==='help')return'You can ask for briefing, planning, review, tasks, overdue work, projects, notes, decisions, journal, memory, or use commands like “add task …”, “complete task …”, “move task … to blocked”, “remember …”, and “find …”.';if(l==='briefing'||l==='today'||l==='daily briefing'){var a=x.o.slice().sort((m,n)=>score(n)-score(m));return'DAILY BRIEFING\n\nFOCUS: '+(a[0]?a[0].title:'Nothing urgent')+'\n\nOVERDUE: '+(x.over[0]?x.over[0].title:'None')+'\n\nDUE SOON: '+(x.soon.slice(0,3).map(t=>t.title).join('\n')||'None')+'\n\nPROJECTS: '+((d.projects||[]).map(p=>p.name+' '+(p.progress||0)+'%').join(' · ')||'None')+'\n\nRecommendation: protect the top task before accepting new work.'}if(l==='plan'||l==='plan today'){var a=x.o.slice().sort((m,n)=>score(n)-score(m)).slice(0,7);return'TODAY PLAN\n\n'+(a.map((t,i)=>(i+1)+'. '+t.title+' — '+t.priority+' — '+(t.due||'no date')).join('\n')||'Nothing queued.')+'\n\nSuggested rhythm: top priority → due-soon work → admin/follow-up.'}if(l==='review')return'OPERATING REVIEW\n\nOpen: '+x.o.length+'\nOverdue: '+x.over.length+'\nDue soon: '+x.soon.length+'\nBlocked: '+x.o.filter(t=>t.status==='Blocked').length+'\nProjects: '+(d.projects||[]).length+'\nDecisions: '+(d.decisions||[]).length+'\nJournal entries: '+(d.journal||[]).length+'\nMemories: '+x.mem.length;if(l.startsWith('add task ')){var title=s.slice(9).trim();d.tasks=d.tasks||[];d.tasks.push({id:Date.now(),title:title,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'});log(d,'Added task: '+title);return'Created task: '+title}if(l.startsWith('complete task ')){var q=s.slice(14).trim(),t=(d.tasks||[]).find(a=>String(a.id)===q||a.title.toLowerCase()===q.toLowerCase());if(!t)return'Task not found.';t.status='Done';log(d,'Completed task: '+t.title);return'Completed: '+t.title}if(l.startsWith('move task ')){var p=s.slice(10).split(/\s+to\s+/i),name=(p[0]||'').trim(),lane=(p[1]||'').trim().toUpperCase(),t=(d.tasks||[]).find(a=>a.title.toLowerCase()===name.toLowerCase()||String(a.id)===name);if(!t)return'Task not found.';if(['NOW','FOLLOW-UP','WAITING','SOMEDAY','BLOCKED'].indexOf(lane)<0)return'Lane must be NOW, FOLLOW-UP, WAITING, SOMEDAY, or BLOCKED.';t.lane=lane;if(lane==='BLOCKED')t.status='Blocked';log(d,'Moved '+t.title+' to '+lane);return'Moved '+t.title+' → '+lane}if(l.startsWith('find ')){var term=l.slice(5),h=[];(d.tasks||[]).forEach(t=>{if((t.title+' '+t.project+' '+t.area).toLowerCase().includes(term))h.push('Task: '+t.title)});(d.notes||[]).forEach(n=>{if((n.title+' '+n.body+' '+n.tag).toLowerCase().includes(term))h.push('Note: '+n.title)});(d.projects||[]).forEach(p=>{if((p.name+' '+p.goal).toLowerCase().includes(term))h.push('Project: '+p.name)});return h.join('\n')||'No local matches.'}if(l.startsWith('remember ')){var m=x.mem;m.unshift({text:s.slice(9).trim(),time:new Date().toISOString()});localStorage.setItem(MEM,JSON.stringify(m.slice(0,80)));return'Remembered locally.'}if(l.startsWith('recall ')){var term=l.slice(7);return x.mem.filter(m=>m.text.toLowerCase().includes(term)).map(m=>'• '+m.text).join('\n')||'No matching memory.'}if(l.startsWith('note ')){d.notes=d.notes||[];d.notes.push({id:Date.now(),title:'OS Capture',tag:'Captured',body:s.slice(5).trim(),area:'Inbox'});log(d,'Captured note');return'Note saved.'}return'Try “briefing”, “plan today”, “review”, or “help”.'}function send(){var e=document.getElementById('cmd'),q=e.value.trim();if(!q)return;chat.push({r:'user',t:q},{r:'ai',t:answer(q)});e.value='';draw();render();}function draw(){document.getElementById('chat').innerHTML=chat.map(x=>'<div class="msg '+x.r+'">'+esc(x.t)+'</div>').join('');var c=document.getElementById('chat');c.scrollTop=c.scrollHeight}function run(q){document.getElementById('cmd').value=q;send()}window.run=run;window.send=send;window.view=function(v){viewName=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));var n=document.getElementById('n-'+v);if(n)n.classList.add('active');render()};function render(){var x=st(),d=x.d,m=document.getElementById('main');if(viewName==='home'){var top=x.o.slice().sort((a,b)=>score(b)-score(a)).slice(0,4);m.innerHTML='<div class="hero"><div class="label">TODAY</div><div class="h">Your operating system is ready.</div><div class="muted">One place for execution, projects, knowledge, decisions, reflection and memory.</div><div class="focus">'+esc(top[0]?top[0].title:'No priority task')+'</div></div><div class="metrics"><div class="metric">OPEN<b>'+x.o.length+'</b></div><div class="metric">OVERDUE<b>'+x.over.length+'</b></div><div class="metric">SOON<b>'+x.soon.length+'</b></div><div class="metric">PROJECTS<b>'+(d.projects||[]).length+'</b></div><div class="metric">MEMORY<b>'+x.mem.length+'</b></div></div><div class="grid2"><div class="card"><div class="label">NEXT ACTIONS</div><div class="list" style="margin-top:8px">'+top.map(t=>'<div class="item"><span class="pill">'+score(t)+'</span><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.priority)+' · '+esc(t.lane)+' · '+esc(t.due||'no date')+'</div></div>').join('')+'</div></div><div class="card"><div class="label">PROJECT PULSE</div><div class="list" style="margin-top:8px">'+(d.projects||[]).slice(0,5).map(p=>'<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.health||'')+' · '+(p.progress||0)+'%</div><div class="bar"><i style="width:'+Math.min(100,Number(p.progress)||0)+'%"></i></div></div>').join('')+'</div></div></div>'}else if(viewName==='work'){m.innerHTML='<div class="card"><div class="label">EXECUTION</div><div class="h">Work queue</div><div class="list">'+x.o.slice().sort((a,b)=>score(b)-score(a)).map(t=>'<div class="item"><span class="pill">'+score(t)+'</span><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.status)+' · '+esc(t.lane)+' · '+esc(t.priority)+' · '+esc(t.due||'no date')+'</div><button class="btn" style="margin-top:6px" onclick="completeBy('+t.id+')">Complete</button></div>').join('')+'</div></div>'}else if(viewName==='projects'){m.innerHTML='<div class="card"><div class="label">PORTFOLIO</div><div class="h">Projects</div>'+(d.projects||[]).map(p=>'<div class="item" style="margin-top:8px"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.goal||'')+'</div><div class="bar"><i style="width:'+Math.min(100,Number(p.progress)||0)+'%"></i></div><div class="muted">'+(p.progress||0)+'% · '+esc(p.health||'')+'</div></div>').join('')+'</div>'}else if(viewName==='knowledge'){var notes=d.notes||[];m.innerHTML='<div class="card"><div class="label">KNOWLEDGE</div><div class="h">Knowledge base</div><div class="list">'+notes.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.tag||'')+'</div><div class="small" style="margin-top:5px">'+esc(n.body||'')+'</div></div>').join('')||'<div class="muted">No captured knowledge yet.</div>'+'</div></div>'}else if(viewName==='decisions'){m.innerHTML='<div class="card"><div class="label">DECISION LOG</div><div class="h">Decisions</div><div class="list">'+(d.decisions||[]).map(z=>'<div class="item"><b>'+esc(z.title||z.name||'Decision')+'</b><div class="small">'+esc(z.body||z.decision||z.notes||'')+'</div></div>').join('')||'<div class="muted">No decisions logged yet.</div>'+'</div></div>'}else if(viewName==='journal'){m.innerHTML='<div class="card"><div class="label">REFLECTION</div><div class="h">Journal</div><div class="list">'+(d.journal||[]).map(j=>'<div class="item"><b>'+esc(j.title||'Journal entry')+'</b><div class="small">'+esc(j.body||j.text||'')+'</div></div>').join('')||'<div class="muted">No journal entries yet.</div>'+'</div></div>'}else{m.innerHTML='<div class="card"><div class="label">MEMORY</div><div class="h">Local memory</div><div class="list">'+x.mem.map(z=>'<div class="item"><b>'+esc(z.text)+'</b><div class="muted">'+esc(z.time||'')+'</div></div>').join('')||'<div class="muted">No memories saved.</div>'+'</div></div>'}document.getElementById('health').innerHTML='Local storage: <b>active</b><br>Open workload: '+x.o.length+'<br>Data model: v8-compatible<br>AI mode: local command engine';draw()}window.completeBy=function(id){var d=get(),t=(d.tasks||[]).find(x=>x.id===id);if(!t)return;t.status='Done';log(d,'Completed task: '+t.title);render();toast('Completed: '+t.title)};window.openTask=function(){document.getElementById('modal').innerHTML='<div class="modal"><div class="modalin"><div class="label">NEW TASK</div><div class="h">Capture work</div><input id="nt" placeholder="Task title"><select id="np"><option>Medium</option><option>High</option><option>Low</option></select><input id="nd" type="date"><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="saveTask()">Create</button></div></div></div>';document.getElementById('nt').focus()};window.closeModal=function(){document.getElementById('modal').innerHTML=''};window.saveTask=function(){var title=document.getElementById('nt').value.trim();if(!title)return;var d=get();d.tasks=d.tasks||[];d.tasks.push({id:Date.now(),title:title,project:'',area:'Inbox',lane:'NOW',priority:document.getElementById('np').value,status:'Todo',due:document.getElementById('nd').value,context:'Computer'});log(d,'Created task: '+title);closeModal();render();toast('Task created')};window.backup=function(){var b=new Blob([JSON.stringify({version:'15.0',data:get(),memory:memories(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v15-backup.json';a.click();URL.revokeObjectURL(a.href)};function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()});render();chat.push({r:'ai',t:'v15 online. This is Personal OS 2.0: execution, projects, knowledge, decisions, journal and memory in one workspace. Try “plan today”.'});draw()})()</script></body></html>
