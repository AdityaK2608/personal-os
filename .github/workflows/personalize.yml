name: Personalize UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update greeting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Good evening, papa 👋'
          new = 'Good evening, Aditya 👋'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update Personal OS greeting"
          git push
