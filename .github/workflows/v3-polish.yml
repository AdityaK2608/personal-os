name: Personal OS V3 polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v3-polish.yml']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build V3 shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          v3=r'''<script type="text/babel">
          const V3KEY='personal_os_v3';
          const V3OLD='personal_os_v2';
          const nowISO=()=>new Date().toISOString();
          const words=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean);
          const uniq=a=>[...new Set(a)];
          const copy=o=>JSON.parse(JSON.stringify(o));
          const base={schemaVersion:3,createdAt:nowISO(),updatedAt:nowISO(),tasks:[],projects:[],notes:[],activity:[]};
          const demo={tasks:[
            {id:1,title:'Finish Personal OS V3 release',project:'Personal OS',priority:'High',status:'In Progress',due:'2026-09-02',createdAt:'2026-09-01T09:00:00Z',updatedAt:'2026-09-02T10:00:00Z'},
            {id:2,title:'Review pending customer evidence request',project:'Work',priority:'High',status:'Todo',due:'2026-09-02',createdAt:'2026-08-30T09:00:00Z'},
            {id:3,title:'Update SIEM troubleshooting knowledge',project:'Knowledge',priority:'Medium',status:'Todo',due:'2026-09-03',createdAt:'2026-08-29T09:00:00Z'},
            {id:4,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'2026-09-06',createdAt:'2026-08-20T09:00:00Z'},
            {id:5,title:'Clean up project notes',project:'Personal OS',priority:'Low',status:'Done',due:'2026-09-02',createdAt:'2026-08-25T09:00:00Z',completedAt:'2026-09-01T12:00:00Z'}],
            projects:[
            {id:1,name:'Personal OS',description:'Command Center + Knowledge Base + AI COO',progress:32,health:'On track'},
            {id:2,name:'SIEM Automation',description:'Evidence collection and reporting workflow',progress:78,health:'On track'},
            {id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus'},
            {id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady'}],
            notes:[
            {id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},
            {id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source destination, device and event type before requesting high-volume logs.'},
            {id:3,title:'Personal OS idea',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}],
            activity:[{text:'Personal OS V3 initialized',time:nowISO(),type:'system'}]};
          function migrate(){
            try{const v=JSON.parse(localStorage.getItem(V3KEY));if(v&&v.schemaVersion>=3)return {...base,...v};
            const v2=JSON.parse(localStorage.getItem(V3OLD));if(v2&&v2.tasks){return {...base,...copy(v2),schemaVersion:3,createdAt:v2.createdAt||nowISO(),updatedAt:nowISO(),tasks:(v2.tasks||[]).map(t=>({...t,createdAt:t.createdAt||nowISO()})),activity:[{text:'V2 workspace migrated to V3',time:nowISO(),type:'system'},...(v2.activity||[])]};}}
            catch(e){} return copy({...base,...demo,updatedAt:nowISO()});}
          function scoreTask(t,projects){
            if(t.status==='Done')return -9999;
            const p=projects.find(x=>x.name===t.project); const pr={High:60,Medium:35,Low:15}[t.priority]||20; let s=pr;
            if(p?.health==='At risk')s+=35; else if(p?.health==='Needs focus')s+=20; else if(p?.health==='Steady')s+=5;
            if(/^\d{4}-\d{2}-\d{2}$/.test(t.due)){const d=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000); if(d<0)s+=55; else if(d===0)s+=45; else if(d===1)s+=30; else if(d<=3)s+=15;}
            const age=Math.max(0,Math.floor((Date.now()-new Date(t.createdAt||Date.now()))/86400000));s+=Math.min(age*3,24);
            if(t.blockedBy?.length)s-=10; return s;
          }
          function suggest(data){const open=data.tasks.filter(t=>t.status!=='Done'); if(!open.length)return [{title:'Create the next meaningful action',why:'Your execution queue is clear.',kind:'next'}]; const ranked=[...open].sort((a,b)=>scoreTask(b,data.projects)-scoreTask(a,data.projects)); const top=ranked[0]; const overdue=open.filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&new Date(t.due+'T23:59:59')<new Date()); const neglected=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>4*86400000); const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus'); const out=[{title:'Do this next',why:`${top.title} has the strongest local priority score (${Math.max(0,Math.round(scoreTask(top,data.projects)))}).`,kind:'next',taskId:top.id}]; if(overdue.length)out.push({title:`Resolve ${overdue.length} overdue task${overdue.length>1?'s':''}`,why:'Deadline risk is now the dominant execution signal.',kind:'risk'}); if(risk.length)out.push({title:`Review ${risk[0].name}`,why:`Project health is ${risk[0].health}. Reserve focused time before adding more work.`,kind:'project',projectId:risk[0].id}); if(neglected.length)out.push({title:`Unblock ${neglected[0].title}`,why:'This task has been open for several days and is losing momentum.',kind:'stale',taskId:neglected[0].id}); return out;}
          function smartSearch(q,data){const terms=words(q); if(!terms.length)return[]; const rows=[...data.tasks.map(x=>({...x,_type:'Task',_text:[x.title,x.project,x.priority,x.status].join(' ')})),...data.projects.map(x=>({...x,_type:'Project',_text:[x.name,x.description,x.health].join(' ')})),...data.notes.map(x=>({...x,_type:'Knowledge',_text:[x.title,x.tag,x.body].join(' ')}))]; return rows.map(x=>{const w=words(x._text),tags=uniq(terms.filter(t=>w.includes(t)));let score=tags.length*10; terms.forEach(t=>{if(x._text.toLowerCase().includes(t))score+=3}); if(x._type==='Knowledge'&&terms.some(t=>String(x.tag).toLowerCase().includes(t)))score+=8; return {...x,_score:score,_tags:tags}}).filter(x=>x._score>0).sort((a,b)=>b._score-a._score).slice(0,12);}
          function related(note,data){const nt=words([note.title,note.tag,note.body].join(' ')); const all=[...data.tasks.map(x=>({...x,_type:'Task',_text:[x.title,x.project].join(' ')})),...data.projects.map(x=>({...x,_type:'Project',_text:[x.name,x.description].join(' ')}))]; return all.map(x=>{const overlap=uniq(nt.filter(t=>words(x._text).includes(t))).length;return {...x,_score:overlap}}).filter(x=>x._score>0).sort((a,b)=>b._score-a._score).slice(0,5);}
          function App(){const[data,setData]=useState(migrate);const[page,setPage]=useState('dashboard');const[q,setQ]=useState('');const[modal,setModal]=useState(null);useEffect(()=>{localStorage.setItem(V3KEY,JSON.stringify({...data,updatedAt:nowISO()}))},[data]);useEffect(()=>{const f=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()} };addEventListener('keydown',f);return()=>removeEventListener('keydown',f)},[]);
            const open=data.tasks.filter(t=>t.status!=='Done'), done=data.tasks.filter(t=>t.status==='Done'), completion=data.tasks.length?Math.round(done.length/data.tasks.length*100):0; const ranked=[...open].sort((a,b)=>scoreTask(b,data.projects)-scoreTask(a,data.projects)); const top3=ranked.slice(0,3); const rec=suggest(data); const insights=page==='insights';
            const log=(text,type='system')=>setData(d=>({...d,updatedAt:nowISO(),activity:[{text,time:nowISO(),type},...d.activity].slice(0,100)}));
            const toggle=id=>setData(d=>({...d,updatedAt:nowISO(),tasks:d.tasks.map(t=>t.id===id?{...t,status:t.status==='Done'?'Todo':'Done',completedAt:t.status==='Done'?undefined:nowISO(),updatedAt:nowISO()}:t),activity:[{text:'Task status changed',time:nowISO(),type:'task'},...d.activity].slice(0,100)}));
            const saveTask=t=>setData(d=>{const exists=d.tasks.some(x=>x.id===t.id);const nt={...t,id:t.id||Date.now(),createdAt:t.createdAt||nowISO(),updatedAt:nowISO()};return {...d,updatedAt:nowISO(),tasks:exists?d.tasks.map(x=>x.id===t.id?nt:x):[nt,...d.tasks],activity:[{text:(exists?'Updated task: ':'Created task: ')+nt.title,time:nowISO(),type:'task'},...d.activity].slice(0,100)}});
            const saveProject=p=>setData(d=>{const exists=d.projects.some(x=>x.id===p.id);const np={...p,id:p.id||Date.now()};return {...d,updatedAt:nowISO(),projects:exists?d.projects.map(x=>x.id===p.id?np:x):[np,...d.projects],activity:[{text:(exists?'Updated project: ':'Created project: ')+np.name,time:nowISO(),type:'project'},...d.activity].slice(0,100)}});
            const saveNote=n=>setData(d=>{const exists=d.notes.some(x=>x.id===n.id);const nn={...n,id:n.id||Date.now()};return {...d,updatedAt:nowISO(),notes:exists?d.notes.map(x=>x.id===n.id?nn:x):[nn,...d.notes],activity:[{text:(exists?'Updated knowledge: ':'Captured knowledge: ')+nn.title,time:nowISO(),type:'knowledge'},...d.activity].slice(0,100)}});
            const remove=(kind,id)=>setData(d=>({...d,updatedAt:nowISO(),[kind]:d[kind].filter(x=>x.id!==id),activity:[{text:'Deleted item',time:nowISO(),type:kind},...d.activity].slice(0,100)}));
            const exportJSON=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-os-v3-backup.json';a.click()};
            const importJSON=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.projects)||!Array.isArray(x.notes))throw Error();setData({...base,...x,schemaVersion:3,updatedAt:nowISO(),activity:[{text:'V3 backup imported',time:nowISO(),type:'system'},...(x.activity||[])]});alert('V3 backup restored.')}catch{alert('Invalid Personal OS backup.')}};r.readAsText(f);e.target.value=''};
            const reset=()=>{if(confirm('Reset Personal OS V3 to demo data? This replaces the current V3 workspace.'))setData({...base,...copy(demo),updatedAt:nowISO(),activity:[{text:'Workspace reset to V3 demo data',time:nowISO(),type:'system'}]})};
            return <div className="min-h-screen bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,.18),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,.10),transparent_30%)] text-slate-100"><div className="max-w-[1500px] mx-auto min-h-screen flex"><aside className="w-64 shrink-0 border-r border-white/10 p-5 hidden md:flex flex-col"><div className="flex items-center gap-3 mb-8"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center font-black">P</div><div><b>Personal OS</b><div className="text-xs text-slate-400">V3.0 · local intelligence</div></div></div><nav className="space-y-1">{[['dashboard','Dashboard'],['focus','Focus'],['tasks','Tasks'],['projects','Projects'],['knowledge','Knowledge'],['insights','Insights'],['activity','Activity'],['ai','AI COO'],['settings','Settings']].map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'w-full text-left px-3 py-2.5 rounded-xl text-sm '+(page===k?'bg-white/10':'text-slate-400 hover:bg-white/5')}>{l}</button>)}</nav><div className="mt-auto glass rounded-2xl p-4"><div className="text-xs text-indigo-300">V3.0 · ₹0</div><div className="text-sm font-medium mt-1">Private browser workspace.</div><div className="text-xs text-slate-500 mt-2">No server · No API key</div></div></aside><main className="flex-1 min-w-0"><header className="sticky top-0 z-10 px-5 md:px-8 py-4 border-b border-white/10 bg-[#070b14]/85 backdrop-blur-xl"><div className="flex items-center gap-3"><div className="md:hidden font-bold">Personal OS</div><input id="globalSearch" value={q} onChange={e=>setQ(e.target.value)} placeholder="Smart search…  Ctrl+K" className="flex-1 max-w-2xl bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 outline-none"/><button onClick={()=>setPage('ai')} className="px-4 py-2.5 rounded-xl bg-indigo-500 text-sm font-semibold">AI COO</button></div><div className="md:hidden flex gap-1 mt-3 overflow-x-auto">{[['dashboard','Home'],['focus','Focus'],['tasks','Tasks'],['projects','Projects'],['knowledge','Knowledge'],['insights','Insights'],['ai','COO'],['settings','Settings']].map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'px-3 py-2 rounded-lg text-xs whitespace-nowrap '+(page===k?'bg-white/10':'text-slate-400')}>{l}</button>)}</div>{q&&<div className="mt-3 max-w-2xl">{smartSearch(q,data).slice(0,5).map((x,i)=><button key={i} onClick={()=>setPage(x._type==='Task'?'tasks':x._type==='Project'?'projects':'knowledge')} className="block w-full text-left bg-white/5 hover:bg-white/10 px-3 py-2 rounded-lg text-sm mb-1"><span className="text-indigo-300 mr-2">{x._type}</span>{x.title||x.name}</button>)}</div>}</header><section className="p-5 md:p-8 max-w-[1250px] mx-auto">{page==='dashboard'&&<Dashboard data={data} open={open} done={done} completion={completion} top3={top3} rec={rec} setPage={setPage}/>} {page==='focus'&&<Focus top3={top3} toggle={toggle}/>} {page==='tasks'&&<Tasks data={data} open={open} toggle={toggle} save={saveTask} remove={remove} setModal={setModal}/>} {page==='projects'&&<Projects data={data} save={saveProject} remove={remove} setModal={setModal}/>} {page==='knowledge'&&<Knowledge data={data} save={saveNote} remove={remove}/>} {page==='insights'&&<Insights data={data} completion={completion}/>} {page==='activity'&&<Activity data={data}/>} {page==='ai'&&<AI data={data} rec={rec} setPage={setPage}/>} {page==='settings'&&<Settings data={data} exportJSON={exportJSON} importJSON={importJSON} reset={reset}/>}</section></main></div>{modal&&<EditModal kind={modal.kind} item={modal.item} data={data} close={()=>setModal(null)} save={modal.kind==='task'?saveTask:modal.kind==='project'?saveProject:saveNote}/>}</div>}
          }
          const Btn=({children,onClick,primary})=><button onClick={onClick} className={'px-3 py-2 rounded-xl text-sm '+(primary?'bg-indigo-500':'bg-white/5')}>{children}</button>;
          const Card=({children,className=''})=><div className={'glass rounded-2xl p-5 '+className}>{children}</div>;
          function Dashboard({data,open,done,completion,top3,rec,setPage}){const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');return <><div className="mb-7"><div className="text-sm text-indigo-300">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><h1 className="text-3xl md:text-4xl font-bold mt-2">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">V3 turns Personal OS into a local operating system that ranks, connects and explains your work.</p></div><div className="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">{[['Open',open.length],['Done',done.length],['Completion',completion+'%'],['Projects',data.projects.length],['Knowledge',data.notes.length]].map(x=><Card key={x[0]}><div className="text-xs text-slate-400">{x[0]}</div><div className="text-2xl font-bold mt-2">{x[1]}</div></Card>)}</div><div className="grid lg:grid-cols-[1.4fr_1fr] gap-5"><div className="space-y-5"><Card><div className="flex items-center justify-between"><div><b>Today’s operating brief</b><p className="text-sm text-slate-400 mt-2">{rec[0].why}</p></div><Btn onClick={()=>setPage('ai')}>Explain →</Btn></div></Card><Card><div className="flex justify-between mb-4"><b>Daily Top 3</b><button onClick={()=>setPage('focus')} className="text-xs text-indigo-300">Open Focus →</button></div>{top3.map((t,i)=><div key={t.id} className="p-3 rounded-xl bg-white/[.03] mb-2"><div className="flex gap-3"><div className="w-7 h-7 rounded-full bg-white/10 grid place-items-center text-xs">{i+1}</div><div><div className="text-sm font-medium">{t.title}</div><div className="text-xs text-slate-500 mt-1">Score {Math.max(0,Math.round(scoreTask(t,data.projects)))} · {t.project} · {t.priority}</div></div></div></div>)}{!top3.length&&<div className="text-sm text-slate-500">Nothing pending. Define the next outcome.</div>}</Card></div><div className="space-y-5"><Card><div className="text-xs uppercase tracking-widest text-indigo-300">Do this now</div><div className="text-xl font-semibold mt-2">{rec[0].title}</div><p className="text-sm text-slate-400 mt-2">{rec[0].why}</p><button onClick={()=>setPage('focus')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Take me to Focus →</button></Card><Card><b>Attention signals</b>{risk.length?risk.map(p=><div key={p.id} className="mt-4 p-3 rounded-xl bg-white/[.03]"><div className="flex justify-between text-sm"><span>{p.name}</span><span>{p.progress}%</span></div><div className="text-xs text-amber-300 mt-2">{p.health}</div></div>):<div className="text-sm text-slate-500 mt-4">No project risk signals detected.</div>}</Card></div></div></>}
          function Focus({top3,toggle}){const t=top3[0];return <><h1 className="text-3xl font-bold">Focus</h1><p className="text-slate-400 mt-2 mb-7">V3’s ranking engine chooses the strongest next move.</p><Card className="max-w-3xl mx-auto text-center p-8">{t?<><div className="text-xs uppercase tracking-widest text-indigo-300">Recommended focus</div><h2 className="text-2xl md:text-3xl font-bold mt-4">{t.title}</h2><div className="text-sm text-slate-500 mt-2">{t.project} · {t.priority}</div><button onClick={()=>toggle(t.id)} className="mt-7 px-6 py-3 rounded-xl bg-indigo-500 font-semibold">Mark complete</button></>:<div className="text-slate-500">Queue clear.</div>}</Card></>}
          function Tasks({data,open,toggle,save,remove,setModal}){return <><div className="flex justify-between items-start mb-7"><div><h1 className="text-3xl font-bold">Tasks</h1><p className="text-slate-400 mt-2">Priority is calculated from urgency, age, project health and status.</p></div><Btn primary onClick={()=>setModal({kind:'task',item:null})}>+ Add</Btn></div><div className="glass rounded-2xl overflow-hidden">{data.tasks.map((t,i)=><div key={t.id} className={'p-4 '+(i?'border-t border-white/5':'')}><div className="flex gap-3 items-center"><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border '+(t.status==='Done'?'bg-emerald-500 border-emerald-500':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority} · due {t.due||'unscheduled'} · score {Math.max(0,Math.round(scoreTask(t,data.projects)))}</div></div><button onClick={()=>setModal({kind:'task',item:t})} className="text-xs text-indigo-300">Edit</button><button onClick={()=>remove('tasks',t.id)} className="text-xs text-rose-300">Delete</button></div></div>)}</div></>}
          function Projects({data,save,remove,setModal}){return <><div className="flex justify-between items-start mb-7"><div><h1 className="text-3xl font-bold">Projects</h1><p className="text-slate-400 mt-2">Health is now part of task ranking and AI COO reasoning.</p></div><Btn primary onClick={()=>setModal({kind:'project',item:null})}>+ Add</Btn></div><div className="grid md:grid-cols-2 gap-5">{data.projects.map(p=><Card key={p.id}><div className="flex justify-between"><div><div className="text-lg font-semibold">{p.name}</div><div className="text-sm text-slate-400 mt-1">{p.description}</div></div><b>{p.progress}%</b></div><div className="h-2 bg-white/5 rounded-full mt-5"><div className="h-full rounded-full progress" style={{width:p.progress+'%'}}/></div><div className="flex justify-between mt-3 text-xs"><span className="text-slate-500">{p.health}</span><span className="flex gap-3"><button onClick={()=>setModal({kind:'project',item:p})} className="text-indigo-300">Edit</button><button onClick={()=>remove('projects',p.id)} className="text-rose-300">Delete</button></span></div></Card>)}</div></>}
          function Knowledge({data,save,remove}){const[q,setQ]=useState('');const rows=smartSearch(q,data).filter(x=>x._type==='Knowledge');return <><div className="mb-7"><h1 className="text-3xl font-bold">Knowledge</h1><p className="text-slate-400 mt-2">Search by meaning-like token relationships, tags and linked concepts—without an external AI service.</p></div><div className="mb-5"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="What do I already know about…" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3"/></div><div className="grid md:grid-cols-2 gap-5">{data.notes.map(n=><Card key={n.id}><div className="flex justify-between"><div><b>{n.title}</b><div className="text-xs text-indigo-300 mt-2">{n.tag}</div></div><button onClick={()=>remove('notes',n.id)} className="text-xs text-rose-300">Delete</button></div><p className="text-sm text-slate-400 mt-4 leading-6">{n.body}</p>{q&&rows.find(x=>x.id===n.id)&&<div className="text-xs text-emerald-300 mt-3">Relevant to this search</div>}</Card>)}<Card><b>Knowledge → action</b><p className="text-sm text-slate-400 mt-2">V3 relates notes to tasks/projects using shared concepts so your memory can influence execution.</p></Card></div></>}
          function Insights({data,completion}){const open=data.tasks.filter(t=>t.status!=='Done');const aged=open.filter(t=>Date.now()-new Date(t.createdAt||Date.now())>4*86400000);const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');const activity=data.activity.length;const byProject=data.projects.map(p=>({name:p.name,count:data.tasks.filter(t=>t.project===p.name&&t.status!=='Done').length})).sort((a,b)=>b.count-a.count);return <><h1 className="text-3xl font-bold">Insights</h1><p className="text-slate-400 mt-2 mb-7">Personal analytics generated locally from your workspace.</p><div className="grid md:grid-cols-3 gap-5"><Card><div className="text-xs text-slate-400">Completion</div><div className="text-3xl font-bold mt-2">{completion}%</div><p className="text-xs text-slate-500 mt-2">Completed / total tasks</p></Card><Card><div className="text-xs text-slate-400">Aging queue</div><div className="text-3xl font-bold mt-2">{aged.length}</div><p className="text-xs text-slate-500 mt-2">Open tasks older than 4 days</p></Card><Card><div className="text-xs text-slate-400">Project risk</div><div className="text-3xl font-bold mt-2">{risk.length}</div><p className="text-xs text-slate-500 mt-2">Needs focus / At risk</p></Card></div><Card className="mt-5"><b>Workload distribution</b><div className="mt-4 space-y-3">{byProject.map(x=><div key={x.name}><div className="flex justify-between text-sm"><span>{x.name}</span><span>{x.count}</span></div><div className="h-2 bg-white/5 rounded-full mt-1"><div className="h-full bg-indigo-500 rounded-full" style={{width:Math.min(100,x.count*20)+'%'}}/></div></div>)}</div></Card><div className="text-xs text-slate-600 mt-4">Local activity records: {activity}. Analytics improve as you use the system.</div></>}
          function Activity({data}){return <><h1 className="text-3xl font-bold">Activity</h1><p className="text-slate-400 mt-2 mb-7">Your local operating history.</p><Card className="space-y-4">{data.activity.map((a,i)=><div key={i} className="flex gap-3"><div className="w-2.5 h-2.5 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{new Date(a.time).toLocaleString('en-IN')} · {a.type}</div></div></div>)}</Card></>}
          function AI({data,rec,setPage}){const r=rec;const risk=data.projects.filter(p=>p.health==='At risk'||p.health==='Needs focus');return <><h1 className="text-3xl font-bold">AI COO 3.0</h1><p className="text-slate-400 mt-2 mb-7">Deterministic local intelligence. No LLM, API key, server or subscription required.</p><div className="grid lg:grid-cols-2 gap-5">{r.map((x,i)=><Card key={i}><div className="text-xs uppercase tracking-widest text-indigo-300">{x.kind}</div><div className="text-xl font-semibold mt-2">{x.title}</div><p className="text-slate-400 mt-3">{x.why}</p>{x.taskId&&<button onClick={()=>setPage('focus')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open Focus →</button>}</Card>)}<Card className="lg:col-span-2"><b>System diagnosis</b><p className="text-slate-300 mt-3 leading-7">{risk.length?`Project attention is influencing the queue: ${risk.map(x=>x.name).join(', ')}.`:'No project health risk is currently amplifying the queue.'} {data.tasks.filter(t=>t.status!=='Done').length} open tasks and {data.notes.length} knowledge items are being considered by the local engine.</p></Card></div></>}
          function Settings({data,exportJSON,importJSON,reset}){return <><h1 className="text-3xl font-bold">Settings</h1><p className="text-slate-400 mt-2 mb-7">Data health, schema and recovery controls.</p><div className="grid md:grid-cols-2 gap-5"><Card><b>Schema</b><div className="text-sm text-slate-400 mt-3">Version {data.schemaVersion} · last updated {new Date(data.updatedAt).toLocaleString('en-IN')}</div><div className="text-xs text-emerald-300 mt-3">V2 → V3 migration supported</div></Card><Card><b>Backup & restore</b><p className="text-sm text-slate-400 mt-2">Exports all tasks, projects, knowledge and activity to JSON.</p><div className="flex flex-wrap gap-2 mt-4"><Btn primary onClick={exportJSON}>Export V3 backup</Btn><label className="px-3 py-2 rounded-xl bg-white/5 text-sm cursor-pointer">Import<input type="file" accept="application/json" onChange={importJSON} className="hidden"/></label></div></Card><Card className="md:col-span-2"><b>Zero-cost & privacy</b><div className="grid md:grid-cols-3 gap-4 mt-4">{[['Local-first','Workspace data stays in browser storage unless you export it.'],['No external AI','V3 uses deterministic local reasoning and relationship scoring.'],['No installation','Runs directly in GitHub Pages through browser/CDN assets.']].map(x=><div key={x[0]} className="p-4 rounded-xl bg-white/[.03]"><b>{x[0]}</b><p className="text-xs text-slate-500 mt-2">{x[1]}</p></div>)}</div></Card><Card><b>Recovery</b><p className="text-sm text-slate-400 mt-2">Reset only when you intentionally want the V3 demo workspace.</p><button onClick={reset} className="mt-4 px-4 py-2 rounded-xl bg-rose-500/10 text-rose-300 text-sm">Reset demo</button></Card></div></>}
          function EditModal({kind,item,data,close,save}){const initial=item|| (kind==='task'?{title:'',project:data.projects[0]?.name||'Personal OS',priority:'Medium',status:'Todo',due:'',blockedBy:[]} :kind==='project'?{name:'',description:'',progress:0,health:'On track'}:{title:'',tag:'General',body:''});const[f,setF]=useState(initial);const field=(k,v)=>setF({...f,[k]:v});return <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-start justify-center pt-20 px-4"><div className="glass rounded-2xl p-5 w-full max-w-lg"><div className="flex justify-between mb-4"><b>{item?'Edit':'Add'} {kind}</b><button onClick={close}>✕</button></div>{kind==='task'&&<div className="space-y-3"><input value={f.title} onChange={e=>field('title',e.target.value)} placeholder="Task title" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.project} onChange={e=>field('project',e.target.value)} placeholder="Project" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><div className="grid grid-cols-2 gap-3"><select value={f.priority} onChange={e=>field('priority',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>High</option><option>Medium</option><option>Low</option></select><select value={f.status} onChange={e=>field('status',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Todo</option><option>In Progress</option><option>Done</option></select></div><input type="date" value={f.due||''} onChange={e=>field('due',e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/></div>}{kind==='project'&&<div className="space-y-3"><input value={f.name} onChange={e=>field('name',e.target.value)} placeholder="Project name" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.description} onChange={e=>field('description',e.target.value)} placeholder="Description" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input type="number" min="0" max="100" value={f.progress} onChange={e=>field('progress',Math.max(0,Math.min(100,Number(e.target.value))))} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><select value={f.health} onChange={e=>field('health',e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select></div>}{kind==='note'&&<div className="space-y-3"><input value={f.title} onChange={e=>field('title',e.target.value)} placeholder="Title" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.tag} onChange={e=>field('tag',e.target.value)} placeholder="Tag" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><textarea rows="5" value={f.body} onChange={e=>field('body',e.target.value)} placeholder="Knowledge" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/></div>}<div className="flex justify-end gap-2 mt-5"><Btn onClick={close}>Cancel</Btn><Btn primary onClick={()=>{save(f);close()}}>Save</Btn></div></div></div>}
          ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
          </script>'''
          s=s.replace('</body>',v3+'</body>')
          p.write_text(s)
          PY
