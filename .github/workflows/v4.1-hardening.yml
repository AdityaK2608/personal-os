name: Personal OS V4.1 hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v4.1-hardening.yml']
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Harden V4.1 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function load(){try{const a=JSON.parse(localStorage.getItem(K));if(a&&Array.isArray(a.tasks)&&Array.isArray(a.projects)&&Array.isArray(a.notes))return{...seed,...a,schemaVersion:4};for(const key of PREV){const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.projects)&&Array.isArray(x.notes))return{...seed,...cp(x),schemaVersion:4,updatedAt:iso(),tasks:(x.tasks||[]).map(t=>({...t,createdAt:t.createdAt||iso()})),activity:[{text:'Workspace migrated to V4',time:iso(),type:'system'},...(x.activity||[])]}}}catch(e){}return cp(seed)}"
          new="function load(){try{const a=JSON.parse(localStorage.getItem(K));if(a&&Array.isArray(a.tasks)&&Array.isArray(a.projects)&&Array.isArray(a.notes)&&Array.isArray(a.activity))return{...seed,...a,schemaVersion:4};for(const key of PREV){const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.projects)&&Array.isArray(x.notes))return{...seed,...cp(x),schemaVersion:4,updatedAt:iso(),tasks:(x.tasks||[]).map(t=>({...t,createdAt:t.createdAt||iso()})),activity:[{text:'Workspace migrated to V4',time:iso(),type:'system'},...(Array.isArray(x.activity)?x.activity:[])]}}}catch(e){}return cp(seed)}"
          if old not in s: raise SystemExit('load block not found')
          s=s.replace(old,new)
          old2='<div className="v4-h1">Good afternoon, Aditya.</div>'
          new2="<div className=\"v4-h1\">Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Aditya.</div>"
          if old2 not in s: raise SystemExit('greeting block not found')
          s=s.replace(old2,new2)
          old3="<div className=\"v4-mobile\">{nav.slice(0,7).map(([k,l])=><button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>{l}</button>)}</div>"
          new3="<div className=\"v4-mobile\">{nav.filter(([k])=>k!=='settings').map(([k,l])=><button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>{l}</button>)}<button className={page==='settings'?'active':''} onClick={()=>setPage('settings')}>More</button></div>"
          if old3 not in s: raise SystemExit('mobile nav block not found')
          s=s.replace(old3,new3)
          old4="const saveTask=t=>setD(x=>{const exists=x.tasks.some(a=>a.id===t.id),z={...t,id:t.id||Date.now(),createdAt:t.createdAt||iso(),updatedAt:iso()};return{...x,tasks:exists?x.tasks.map(a=>a.id===z.id?z:a):[z,...x.tasks],updatedAt:iso(),activity:[{text:(exists?'Updated task: ':'Created task: ')+z.title,time:iso(),type:'task'},...x.activity]}});"
          new4="const saveTask=t=>setD(x=>{const exists=x.tasks.some(a=>a.id===t.id),z={...t,id:t.id||Date.now(),createdAt:t.createdAt||iso(),updatedAt:iso()};return{...x,tasks:exists?x.tasks.map(a=>a.id===z.id?z:a):[z,...x.tasks],updatedAt:iso(),activity:[{text:(exists?'Updated task: ':'Created task: ')+z.title,time:iso(),type:'task'},...(Array.isArray(x.activity)?x.activity:[])]}});"
          if old4 not in s: raise SystemExit('saveTask block not found')
          s=s.replace(old4,new4)
          old5="const saveProject=p=>setD(x=>{const exists=x.projects.some(a=>a.id===p.id),z={...p,id:p.id||Date.now()};return{...x,projects:exists?x.projects.map(a=>a.id===z.id?z:a):[z,...x.projects],updatedAt:iso(),activity:[{text:(exists?'Updated project: ':'Created project: ')+z.name,time:iso(),type:'project'},...x.activity]}});"
          new5="const saveProject=p=>setD(x=>{const exists=x.projects.some(a=>a.id===p.id),z={...p,id:p.id||Date.now()};return{...x,projects:exists?x.projects.map(a=>a.id===z.id?z:a):[z,...x.projects],updatedAt:iso(),activity:[{text:(exists?'Updated project: ':'Created project: ')+z.name,time:iso(),type:'project'},...(Array.isArray(x.activity)?x.activity:[])]}});"
          if old5 not in s: raise SystemExit('saveProject block not found')
          s=s.replace(old5,new5)
          old6="const saveNote=n=>setD(x=>{const exists=x.notes.some(a=>a.id===n.id),z={...n,id:n.id||Date.now()};return{...x,notes:exists?x.notes.map(a=>a.id===z.id?z:a):[z,...x.notes],updatedAt:iso(),activity:[{text:(exists?'Updated note: ':'Captured note: ')+z.title,time:iso(),type:'knowledge'},...x.activity]}});"
          new6="const saveNote=n=>setD(x=>{const exists=x.notes.some(a=>a.id===n.id),z={...n,id:n.id||Date.now()};return{...x,notes:exists?x.notes.map(a=>a.id===z.id?z:a):[z,...x.notes],updatedAt:iso(),activity:[{text:(exists?'Updated note: ':'Captured note: ')+z.title,time:iso(),type:'knowledge'},...(Array.isArray(x.activity)?x.activity:[])]}});"
          if old6 not in s: raise SystemExit('saveNote block not found')
          s=s.replace(old6,new6)
          old7="const remove=(key,id)=>setD(x=>({...x,[key]:x[key].filter(a=>a.id!==id),updatedAt:iso()}));"
          new7="const remove=(key,id)=>setD(x=>({...x,[key]:Array.isArray(x[key])?x[key].filter(a=>a.id!==id):[],updatedAt:iso(),activity:[{text:'Deleted item',time:iso(),type:key},...(Array.isArray(x.activity)?x.activity:[])]}));"
          if old7 not in s: raise SystemExit('remove block not found')
          s=s.replace(old7,new7)
          p.write_text(s)
          PY
          git config user.name 'Personal OS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: harden Personal OS V4.1 runtime edge cases'
          git push
