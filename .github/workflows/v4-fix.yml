name: Personal OS V4 fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v4-fix.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix V4 mount
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("ReactDOM.createRoot(document.getElementById('root')).render(<><div id=\"v4-mount\"></div></>);const root=document.getElementById('v4-mount');ReactDOM.createRoot(root).render(<App/>);", "document.getElementById('root').innerHTML='<div id=\"v4-mount\"></div>';ReactDOM.createRoot(document.getElementById('v4-mount')).render(<App/>);")
          p.write_text(s)
          PY
          git config user.name 'Personal OS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: stabilize Personal OS V4 mount'
          git push
