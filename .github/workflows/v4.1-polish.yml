name: Personal OS V4.1 polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v4.1-polish.yml']
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix V4 regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function load(){try{const a=JSON.parse(localStorage.getItem(K));if(a&&a.tasks)return{...seed,...a,schemaVersion:4};for(const key of PREV){const x=JSON.parse(localStorage.getItem(key));if(x&&x.tasks)return{...seed,...cp(x),schemaVersion:4,updatedAt:iso(),tasks:(x.tasks||[]).map(t=>({...t,createdAt:t.createdAt||iso()})),activity:[{text:'Workspace migrated to V4',time:iso(),type:'system'},...(x.activity||[])]}}}catch(e){}return cp(seed)}"
          new="function load(){try{const a=JSON.parse(localStorage.getItem(K));if(a&&Array.isArray(a.tasks)&&Array.isArray(a.projects)&&Array.isArray(a.notes))return{...seed,...a,schemaVersion:4};for(const key of PREV){const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.projects)&&Array.isArray(x.notes))return{...seed,...cp(x),schemaVersion:4,updatedAt:iso(),tasks:(x.tasks||[]).map(t=>({...t,createdAt:t.createdAt||iso()})),activity:[{text:'Workspace migrated to V4',time:iso(),type:'system'},...(x.activity||[])]}}}catch(e){}return cp(seed)}"
          if old not in s: raise SystemExit('load block not found')
          s=s.replace(old,new)
          old2="function App(){const[d,setD]=useState(load),[page,setPage]=useState('home'),[q,setQ]=useState(''),[modal,setModal]=useState(null);useEffect(()=>localStorage.setItem(K,JSON.stringify({...d,updatedAt:iso()})),[d]);const open="
          new2="function App(){const[d,setD]=useState(load),[page,setPage]=useState('home'),[q,setQ]=useState(''),[modal,setModal]=useState(null);useEffect(()=>localStorage.setItem(K,JSON.stringify({...d,updatedAt:iso()})),[d]);useEffect(()=>{const onKey=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('v4-global-search')?.focus()}if(e.key==='Escape'&&q)setQ('')};addEventListener('keydown',onKey);return()=>removeEventListener('keydown',onKey)},[q]);const open="
          if old2 not in s: raise SystemExit('App block not found')
          s=s.replace(old2,new2)
          old3="<div className=\"v4-eyebrow\">Wednesday · September 2, 2026</div>"
          new3="<div className=\"v4-eyebrow\">{new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div>"
          if old3 not in s: raise SystemExit('static date not found')
          s=s.replace(old3,new3)
          old4='<input className="v4-search" value={q}'
          new4='<input id="v4-global-search" className="v4-search" value={q}'
          if old4 not in s: raise SystemExit('search input not found')
          s=s.replace(old4,new4,1)
          p.write_text(s)
          PY
          git config user.name 'Personal OS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore V4.1 search shortcut and dynamic date'
          git push
