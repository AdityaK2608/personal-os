name: Personal OS V1.1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade index.html to V1.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'data-version="1.1"' in s:
              print('V1.1 already installed')
              raise SystemExit(0)
          html=r'''<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070b14" />
<title>Personal OS</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body,#root{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#eef2ff}*{box-sizing:border-box}.glass{background:rgba(17,24,39,.72);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.12)}.scrollbar::-webkit-scrollbar{width:8px}.scrollbar::-webkit-scrollbar-thumb{background:#334155;border-radius:20px}.progress{background:linear-gradient(90deg,#818cf8,#38bdf8)}button,input,select,textarea{font:inherit}button{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-version="1.1">
const {useEffect,useMemo,useState}=React;
const KEY='personal_os_v1';
const seed={tasks:[
{id:1,title:'Complete Personal OS V1 structure',project:'Personal OS',priority:'High',status:'In Progress',due:'Today'},
{id:2,title:'Review pending customer evidence request',project:'Work',priority:'High',status:'Todo',due:'Today'},
{id:3,title:'Update SIEM troubleshooting knowledge',project:'Knowledge',priority:'Medium',status:'Todo',due:'Tomorrow'},
{id:4,title:'Review Prod1 next milestone',project:'Prod1',priority:'Medium',status:'Todo',due:'This week'},
{id:5,title:'Clean up project notes',project:'Personal OS',priority:'Low',status:'Done',due:'Today'}],projects:[
{id:1,name:'Personal OS',description:'Command Center + Knowledge Base + AI COO',progress:32,health:'On track',color:'from-indigo-500 to-sky-400'},
{id:2,name:'SIEM Automation',description:'Evidence collection and reporting workflow',progress:78,health:'On track',color:'from-emerald-500 to-cyan-400'},
{id:3,name:'Prod1',description:'Personal product development',progress:64,health:'Needs focus',color:'from-fuchsia-500 to-violet-400'},
{id:4,name:'Learning',description:'AI, development and security learning',progress:41,health:'Steady',color:'from-amber-400 to-orange-500'}],notes:[
{id:1,title:'RHEL CPU troubleshooting',tag:'Linux',body:'Use top, ps, uptime, vmstat and pidstat to understand CPU pressure and process usage.'},
{id:2,title:'Firewall log investigation',tag:'SIEM',body:'Start with exact timeframe, source/destination, device and event type before requesting high-volume logs.'},
{id:3,title:'Personal OS idea',tag:'Product',body:'One system should connect work, knowledge, progress and recommendations.'}],activity:[
{text:'Personal OS V1 started',time:'Today · 4:10 PM',type:'project'},
{text:'Project milestone reviewed',time:'Today · 2:30 PM',type:'progress'},
{text:'Firewall investigation note captured',time:'Yesterday · 6:05 PM',type:'knowledge'},
{text:'Customer follow-up completed',time:'Yesterday · 4:40 PM',type:'task'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const old=JSON.parse(localStorage.getItem(KEY));return old&&old.tasks?old:clone(seed)}catch{return clone(seed)}}
function today(){return new Date()}
function dateLabel(){return new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today())}
function timeLabel(){return new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit'}).format(today())}
function log(data,text,type='task'){return [{text,time:'Today · '+timeLabel(),type},...(data.activity||[])].slice(0,40)}
const nav=[['dashboard','Dashboard','⌂'],['tasks','Tasks','✓'],['projects','Projects','▣'],['knowledge','Knowledge','◈'],['activity','Activity','◷'],['ai','AI COO','✦']];
const Button=({children,onClick,primary=false,small=false})=><button onClick={onClick} className={(small?'px-3 py-1.5 text-xs ':'px-4 py-2.5 text-sm ')+(primary?'bg-indigo-500 hover:bg-indigo-400':'bg-white/5 hover:bg-white/10')+' rounded-xl font-semibold'}>{children}</button>;
function App(){
 const [data,setData]=useState(load);const [page,setPage]=useState('dashboard');const [query,setQuery]=useState('');
 useEffect(()=>localStorage.setItem(KEY,JSON.stringify(data)),[data]);
 const update=(next)=>setData(next);const search=(arr)=>arr.filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
 function addTask(t){const next={...data,tasks:[{...t,id:Date.now()},...data.tasks]};next.activity=log(data,'Task created: '+t.title,'task');update(next)}
 function toggle(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;const status=t.status==='Done'?'Todo':'Done';update({...data,tasks:data.tasks.map(x=>x.id===id?{...x,status}:x),activity:log(data,(status==='Done'?'Task completed: ':'Task reopened: ')+t.title,'task')})}
 function editTask(t){update({...data,tasks:data.tasks.map(x=>x.id===t.id?t:x),activity:log(data,'Task updated: '+t.title,'task')})}
 function deleteTask(id){const t=data.tasks.find(x=>x.id===id);update({...data,tasks:data.tasks.filter(x=>x.id!==id),activity:log(data,'Task deleted: '+(t?.title||'task'),'task')})}
 function addProject(p){update({...data,projects:[{...p,id:Date.now()},...data.projects],activity:log(data,'Project created: '+p.name,'project')})}
 function editProject(p){update({...data,projects:data.projects.map(x=>x.id===p.id?p:x),activity:log(data,'Project updated: '+p.name,'project')})}
 function deleteProject(id){const p=data.projects.find(x=>x.id===id);update({...data,projects:data.projects.filter(x=>x.id!==id),activity:log(data,'Project deleted: '+(p?.name||'project'),'project')})}
 function addNote(n){update({...data,notes:[{...n,id:Date.now()},...data.notes],activity:log(data,'Knowledge note created: '+n.title,'knowledge')})}
 function editNote(n){update({...data,notes:data.notes.map(x=>x.id===n.id?n:x),activity:log(data,'Knowledge note updated: '+n.title,'knowledge')})}
 function deleteNote(id){const n=data.notes.find(x=>x.id===id);update({...data,notes:data.notes.filter(x=>x.id!==id),activity:log(data,'Knowledge note deleted: '+(n?.title||'note'),'knowledge')})}
 function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
 function importData(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.tasks||!x.projects||!x.notes)throw Error();update({...x,activity:log(data,'Backup imported','system')})}catch{alert('Invalid Personal OS backup file.')}};r.readAsText(file);e.target.value=''}
 function reset(){if(confirm('Reset Personal OS to demo data? Your current browser data will be replaced.'))update(clone(seed))}
 const done=data.tasks.filter(t=>t.status==='Done').length,total=data.tasks.length,completion=total?Math.round(done/total*100):0;
 return <div className="min-h-full bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,.16),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,.1),transparent_30%)]"><div className="max-w-[1500px] mx-auto min-h-screen flex">
 <aside className="w-64 shrink-0 border-r border-white/10 px-5 py-6 hidden md:flex flex-col"><div className="flex items-center gap-3 mb-8"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center font-black">P</div><div><div className="font-bold tracking-tight">Personal OS</div><div className="text-xs text-slate-400">your operating system</div></div></div><div className="space-y-1">{nav.map(([k,l,i])=><button key={k} onClick={()=>setPage(k)} className={'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm '+(page===k?'bg-white/10 text-white':'text-slate-400 hover:bg-white/5 hover:text-white')}><span className="w-5">{i}</span>{l}</button>)}</div><div className="mt-auto glass rounded-2xl p-4"><div className="text-xs text-indigo-300 mb-1">V1.1 · Local-first</div><div className="text-sm font-medium">Data stays in this browser.</div><div className="text-xs text-slate-500 mt-2">No server · No subscription</div></div></aside>
 <main className="flex-1 min-w-0"><header className="sticky top-0 z-10 px-5 md:px-8 py-4 border-b border-white/10 bg-[#070b14]/85 backdrop-blur-xl"><div className="flex items-center gap-3"><div className="md:hidden font-bold">Personal OS</div><div className="relative flex-1 max-w-xl"><span className="absolute left-3 top-2.5 text-slate-500">⌕</span><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search tasks, projects, knowledge..." className="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-sm outline-none focus:border-indigo-400/50"/></div><Button onClick={()=>setPage('ai')} primary>Ask AI COO</Button></div><div className="md:hidden flex gap-1 mt-3 overflow-x-auto">{nav.map(([k,l])=><button key={k} onClick={()=>setPage(k)} className={'px-3 py-2 rounded-lg text-xs whitespace-nowrap '+(page===k?'bg-white/10':'text-slate-400')}>{l}</button>)}</div></header>
 <section className="p-5 md:p-8 max-w-[1250px] mx-auto">{page==='dashboard'&&<Dashboard data={data} completion={completion} setPage={setPage} toggle={toggle} addTask={addTask}/>} {page==='tasks'&&<Tasks data={data} search={search} toggle={toggle} addTask={addTask} editTask={editTask} deleteTask={deleteTask}/>} {page==='projects'&&<Projects data={data} search={search} addProject={addProject} editProject={editProject} deleteProject={deleteProject}/>} {page==='knowledge'&&<Knowledge data={data} search={search} addNote={addNote} editNote={editNote} deleteNote={deleteNote}/>} {page==='activity'&&<Activity data={data}/>} {page==='ai'&&<AICOO data={data} completion={completion}/>}</section></main></div></div>}
function Title({title,sub,action}){return <div className="flex items-start justify-between gap-4 mb-7"><div><h1 className="text-3xl font-bold tracking-tight">{title}</h1><p className="text-slate-400 mt-2">{sub}</p></div>{action}</div>}
function Dashboard({data,completion,setPage,toggle,addTask}){const active=data.tasks.filter(t=>t.status!=='Done');const high=active.filter(t=>t.priority==='High');return <><div className="mb-8"><div className="text-sm text-indigo-300 mb-2">{dateLabel()}</div><h1 className="text-3xl md:text-4xl font-bold tracking-tight">Good {today().getHours()<12?'morning':today().getHours()<18?'afternoon':'evening'}, Aditya 👋</h1><p className="text-slate-400 mt-2">Here’s your current picture. Focus on what moves the needle.</p></div><div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">{[['Open tasks',active.length,'text-sky-300'],['Completed',data.tasks.filter(t=>t.status==='Done').length,'text-emerald-300'],['Projects',data.projects.length,'text-indigo-300'],['Knowledge notes',data.notes.length,'text-amber-300']].map(x=><div className="glass rounded-2xl p-5" key={x[0]}><div className="text-sm text-slate-400">{x[0]}</div><div className={'text-3xl font-bold mt-2 '+x[2]}>{x[1]}</div></div>)}</div><div className="grid lg:grid-cols-[1.5fr_1fr] gap-5"><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="flex justify-between mb-5"><div><div className="font-semibold">Today’s focus</div><div className="text-xs text-slate-500 mt-1">{completion}% task completion · {high.length} high priority open</div></div><button onClick={()=>setPage('tasks')} className="text-xs text-indigo-300">View all →</button></div><div className="w-full h-2 bg-white/5 rounded-full overflow-hidden mb-5"><div className="progress h-full rounded-full" style={{width:completion+'%'}}/></div><div className="space-y-2">{active.slice(0,5).map(t=><div key={t.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/[.03]"><button onClick={()=>toggle(t.id)} className="w-5 h-5 rounded-full border border-slate-500 hover:border-indigo-400"/><div className="flex-1"><div className="text-sm">{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.priority} · {t.status}</div></div><span className="text-xs text-slate-400">{t.due}</span></div>)}</div></div><div className="glass rounded-2xl p-5"><div className="font-semibold mb-4">Project health</div><div className="space-y-4">{data.projects.map(p=><div key={p.id}><div className="flex justify-between text-sm mb-2"><span>{p.name}</span><span className="text-slate-400">{p.progress}%</span></div><div className="h-2 bg-white/5 rounded-full overflow-hidden"><div className={'h-full rounded-full bg-gradient-to-r '+p.color} style={{width:p.progress+'%'}}/></div><div className="text-xs text-slate-500 mt-1.5">{p.health}</div></div>)}</div></div></div><div className="space-y-5"><div className="glass rounded-2xl p-5"><div className="text-xs uppercase tracking-widest text-indigo-300 mb-2">AI COO</div><div className="text-xl font-semibold">Priority recommendation</div><p className="text-slate-400 text-sm mt-2">{high[0]?'Start with “'+high[0].title+'”. High-priority work should lead the queue.':'Your open queue has no high-priority tasks. Use the time to move a project forward.'}</p><button onClick={()=>setPage('ai')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-500/20 text-indigo-200 text-sm">Open AI COO →</button></div><div className="glass rounded-2xl p-5"><div className="flex justify-between mb-4"><div className="font-semibold">Recent activity</div><button onClick={()=>setPage('activity')} className="text-xs text-indigo-300">See all</button></div>{data.activity.slice(0,5).map((a,i)=><div key={i} className="flex gap-3 mb-4 last:mb-0"><div className="w-2 h-2 rounded-full bg-sky-400 mt-1.5"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{a.time}</div></div></div>)}</div></div></div></>}
function TaskForm({initial,onSave,onCancel,projects}){const x=initial||{title:'',project:'Personal OS',priority:'Medium',status:'Todo',due:'Today'};const [f,setF]=useState(x);const set=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5"><div className="grid md:grid-cols-2 gap-3"><input autoFocus value={f.title} onChange={e=>set('title',e.target.value)} placeholder="Task title" className="md:col-span-2 bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 outline-none"/><select value={f.project} onChange={e=>set('project',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Personal OS</option>{projects.filter(p=>p.name!=='Personal OS').map(p=><option key={p.id}>{p.name}</option>)}<option>Work</option><option>Knowledge</option><option>Prod1</option></select><select value={f.priority} onChange={e=>set('priority',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>High</option><option>Medium</option><option>Low</option></select><select value={f.status} onChange={e=>set('status',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>Todo</option><option>In Progress</option><option>Done</option></select><input type="date" value={/^\d{4}-\d{2}-\d{2}$/.test(f.due)?f.due:''} onChange={e=>set('due',e.target.value||'Today')} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><div className="md:col-span-2 flex gap-2 justify-end"><Button onClick={onCancel}>Cancel</Button><Button primary onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save task</Button></div></div></div>}
function Tasks({data,search,toggle,addTask,editTask,deleteTask}){const [show,setShow]=useState(false),[editing,setEditing]=useState(null),[status,setStatus]=useState('All'),[priority,setPriority]=useState('All');let tasks=search(data.tasks);if(status!=='All')tasks=tasks.filter(t=>t.status===status);if(priority!=='All')tasks=tasks.filter(t=>t.priority===priority);return <div><Title title="Tasks" sub="Capture work, keep it moving, and close the loop." action={<Button primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add task</Button>}/><div className="flex flex-wrap gap-2 mb-5"><select value={status} onChange={e=>setStatus(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option>All</option><option>Todo</option><option>In Progress</option><option>Done</option></select><select value={priority} onChange={e=>setPriority(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm"><option>All</option><option>High</option><option>Medium</option><option>Low</option></select><span className="text-xs text-slate-500 self-center">{tasks.length} shown</span></div>{show&&<TaskForm projects={data.projects} onCancel={()=>setShow(false)} onSave={t=>{addTask(t);setShow(false)}}/>}<div className="glass rounded-2xl overflow-hidden">{tasks.length?tasks.map((t,i)=><div key={t.id} className={'p-4 '+(i?'border-t border-white/5':'')}>{editing===t.id?<TaskForm initial={t} projects={data.projects} onCancel={()=>setEditing(null)} onSave={x=>{editTask(x);setEditing(null)}}/>:<div className="flex items-center gap-4"><button onClick={()=>toggle(t.id)} className={'w-6 h-6 rounded-full border flex items-center justify-center shrink-0 '+(t.status==='Done'?'bg-emerald-500 border-emerald-500':'border-slate-600')}>{t.status==='Done'?'✓':''}</button><div className="flex-1 min-w-0"><div className={'font-medium '+(t.status==='Done'?'line-through text-slate-500':'')}>{t.title}</div><div className="text-xs text-slate-500 mt-1">{t.project} · {t.due} · {t.status}</div></div><span className={'text-xs px-2.5 py-1 rounded-full bg-white/5 '+(t.priority==='High'?'text-rose-300':t.priority==='Medium'?'text-amber-300':'text-slate-400')}>{t.priority}</span><button onClick={()=>setEditing(t.id)} className="text-xs text-indigo-300">Edit</button><button onClick={()=>deleteTask(t.id)} className="text-xs text-rose-300">Delete</button></div>}</div>):<Empty text="No tasks match these filters."/>}</div></div>}
function ProjectForm({initial,onSave,onCancel}){const x=initial||{name:'',description:'',progress:0,health:'On track',color:'from-indigo-500 to-sky-400'};const [f,setF]=useState(x);const set=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5 grid md:grid-cols-2 gap-3"><input autoFocus value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Project name" className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.description} onChange={e=>set('description',e.target.value)} placeholder="Description" className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input type="number" min="0" max="100" value={f.progress} onChange={e=>set('progress',Math.max(0,Math.min(100,Number(e.target.value))))} placeholder="Progress %" className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><select value={f.health} onChange={e=>set('health',e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"><option>On track</option><option>Steady</option><option>Needs focus</option><option>At risk</option></select><div className="md:col-span-2 flex justify-end gap-2"><Button onClick={onCancel}>Cancel</Button><Button primary onClick={()=>f.name.trim()&&onSave({...f,name:f.name.trim()})}>Save project</Button></div></div>}
function Projects({data,search,addProject,editProject,deleteProject}){const [show,setShow]=useState(false),[editing,setEditing]=useState(null);return <div><Title title="Projects" sub="See what is active, healthy, and at risk." action={<Button primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add project</Button>}/>{show&&<ProjectForm onCancel={()=>setShow(false)} onSave={p=>{addProject(p);setShow(false)}}/>}<div className="grid md:grid-cols-2 gap-5">{search(data.projects).map(p=>editing===p.id?<ProjectForm key={p.id} initial={p} onCancel={()=>setEditing(null)} onSave={x=>{editProject(x);setEditing(null)}}/>:<div className="glass rounded-2xl p-5" key={p.id}><div className={'h-1.5 w-20 rounded-full bg-gradient-to-r '+p.color+' mb-4'}/><div className="flex justify-between gap-4"><div><div className="text-lg font-semibold">{p.name}</div><p className="text-sm text-slate-400 mt-1">{p.description}</p></div><div className="text-2xl font-bold">{p.progress}%</div></div><div className="mt-5 h-2 bg-white/5 rounded-full overflow-hidden"><div className={'h-full rounded-full bg-gradient-to-r '+p.color} style={{width:p.progress+'%'}}/></div><div className="flex items-center justify-between text-xs text-slate-500 mt-3"><span>{p.health}</span><span className="flex gap-3"><button onClick={()=>setEditing(p.id)} className="text-indigo-300">Edit</button><button onClick={()=>deleteProject(p.id)} className="text-rose-300">Delete</button></span></div></div>)}{!search(data.projects).length&&<Empty text="No projects found."/>}</div></div>}
function NoteForm({initial,onSave,onCancel}){const x=initial||{title:'',tag:'General',body:''};const [f,setF]=useState(x);const set=(k,v)=>setF({...f,[k]:v});return <div className="glass rounded-2xl p-5 mb-5 space-y-3"><input autoFocus value={f.title} onChange={e=>set('title',e.target.value)} placeholder="Note title" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><input value={f.tag} onChange={e=>set('tag',e.target.value)} placeholder="Tag / category" className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5"/><textarea rows="5" value={f.body} onChange={e=>set('body',e.target.value)} placeholder="Write your knowledge..." className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 resize-y"/><div className="flex justify-end gap-2"><Button onClick={onCancel}>Cancel</Button><Button primary onClick={()=>f.title.trim()&&onSave({...f,title:f.title.trim()})}>Save note</Button></div></div>}
function Knowledge({data,search,addNote,editNote,deleteNote}){const [show,setShow]=useState(false),[editing,setEditing]=useState(null),[tag,setTag]=useState('All');const tags=['All',...new Set(data.notes.map(n=>n.tag))];let notes=search(data.notes);if(tag!=='All')notes=notes.filter(n=>n.tag===tag);return <div><Title title="Knowledge" sub="Capture useful knowledge and make it easy to retrieve." action={<Button primary onClick={()=>{setShow(true);setEditing(null)}}>+ Add note</Button>}/><div className="flex gap-2 mb-5 overflow-x-auto">{tags.map(t=><button key={t} onClick={()=>setTag(t)} className={'px-3 py-2 rounded-xl text-xs whitespace-nowrap '+(tag===t?'bg-indigo-500':'bg-white/5 text-slate-400')}>{t}</button>)}</div>{show&&<NoteForm onCancel={()=>setShow(false)} onSave={n=>{addNote(n);setShow(false)}}/>}<div className="grid md:grid-cols-2 gap-5">{notes.map(n=>editing===n.id?<NoteForm key={n.id} initial={n} onCancel={()=>setEditing(null)} onSave={x=>{editNote(x);setEditing(null)}}/>:<div className="glass rounded-2xl p-5" key={n.id}><div className="flex justify-between gap-3"><div><div className="text-lg font-semibold">{n.title}</div><span className="inline-block mt-2 text-xs px-2 py-1 rounded-full bg-indigo-500/10 text-indigo-300">{n.tag}</span></div><div className="flex gap-2"><button onClick={()=>setEditing(n.id)} className="text-xs text-indigo-300">Edit</button><button onClick={()=>deleteNote(n.id)} className="text-xs text-rose-300">Delete</button></div></div><p className="text-sm text-slate-400 mt-4 leading-6">{n.body}</p></div>)}{!notes.length&&<Empty text="No knowledge notes found."/>}</div></div>}
function Activity({data}){return <div><Title title="Activity" sub="A lightweight history of what changed in your Personal OS."/><div className="glass rounded-2xl p-5 space-y-5">{data.activity.length?data.activity.map((a,i)=><div key={i} className="flex gap-4"><div className="w-3 h-3 rounded-full bg-sky-400 mt-1.5 shrink-0"/><div><div className="text-sm">{a.text}</div><div className="text-xs text-slate-500 mt-1">{a.time} · {a.type}</div></div></div>):<Empty text="No activity yet."/>}</div></div>}
function AICOO({data,completion}){const open=data.tasks.filter(t=>t.status!=='Done'),high=open.filter(t=>t.priority==='High'),focus=high[0]||open[0];return <div><Title title="AI COO" sub="Your deterministic, local-first operating assistant."/><div className="grid lg:grid-cols-2 gap-5"><div className="glass rounded-2xl p-6"><div className="text-xs uppercase tracking-widest text-indigo-300">Next move</div><div className="text-2xl font-semibold mt-2">{focus?focus.title:'Everything is clear.'}</div><p className="text-slate-400 mt-3">{focus?`Priority: ${focus.priority}. Status: ${focus.status}. Project: ${focus.project}.`: 'You have no open tasks. Consider creating the next meaningful action.'}</p></div><div className="glass rounded-2xl p-6"><div className="text-xs uppercase tracking-widest text-sky-300">System pulse</div><div className="grid grid-cols-2 gap-4 mt-4"><div><div className="text-2xl font-bold">{completion}%</div><div className="text-xs text-slate-500">task completion</div></div><div><div className="text-2xl font-bold">{open.length}</div><div className="text-xs text-slate-500">open tasks</div></div><div><div className="text-2xl font-bold">{data.projects.filter(p=>p.health==='Needs focus'||p.health==='At risk').length}</div><div className="text-xs text-slate-500">projects needing focus</div></div><div><div className="text-2xl font-bold">{data.notes.length}</div><div className="text-xs text-slate-500">knowledge notes</div></div></div></div><div className="glass rounded-2xl p-6 lg:col-span-2"><div className="font-semibold">Operating guidance</div><div className="grid md:grid-cols-3 gap-4 mt-4"><div className="p-4 rounded-xl bg-white/[.03]"><div className="font-medium">1 · Protect focus</div><p className="text-xs text-slate-500 mt-2">Do the highest-priority open task before adding more work.</p></div><div className="p-4 rounded-xl bg-white/[.03]"><div className="font-medium">2 · Keep projects moving</div><p className="text-xs text-slate-500 mt-2">Use project progress and health to spot where attention is needed.</p></div><div className="p-4 rounded-xl bg-white/[.03]"><div className="font-medium">3 · Capture knowledge</div><p className="text-xs text-slate-500 mt-2">Turn repeated troubleshooting and decisions into searchable notes.</p></div></div></div></div></div>}
function Empty({text}){return <div className="glass rounded-2xl p-8 text-center text-sm text-slate-500 md:col-span-2">{text}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>'''
