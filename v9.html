<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal OS 9.0</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f5f7;color:#111}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900}.sub{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e7e8eb;border-radius:22px;padding:20px;box-shadow:0 12px 40px #1111}.big{font-size:38px;font-weight:900;letter-spacing:-.06em;margin-top:5px}.label{font-size:10px;letter-spacing:.14em;color:#888;font-weight:800}.wide{grid-column:span 2}.bar{height:9px;background:#e8e9ec;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111}.list{display:grid;gap:9px}.item{padding:12px;border-radius:15px;background:#f7f7f8}.row{display:flex;justify-content:space-between;gap:10px}.pill{background:#eee;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800}.btn{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.dark{background:#111;color:#fff;border-color:#111}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{border:0;background:#e9eaed;padding:9px 12px;border-radius:12px;font-weight:750}.nav button.on{background:#111;color:#fff}.insight{font-size:14px;line-height:1.6}.spark{height:90px;display:flex;align-items:end;gap:6px}.spark i{flex:1;background:#111;border-radius:5px 5px 2px 2px;min-height:8px}.score{font-size:55px;font-weight:900;letter-spacing:-.07em}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">Personal OS 9.0</div><div class="sub">Analytics & Weekly Review · Aditya</div></div><button class="btn dark" onclick="location.href='index.html'">Back to OS</button></div><div class="nav"><button class="on">Overview</button><button onclick="review()">Weekly Review</button><button onclick="forecast()">Forecast</button><button onclick="exportData()">Export</button></div><div id="view"></div></div><script>(function(){var KEY='personal_os_v80';function data(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],projects:[],activity:[]}}catch(e){return{tasks:[],projects:[],activity:[]}}}function render(){var d=data(),t=d.tasks||[],done=t.filter(x=>x.status==='Done').length,open=t.filter(x=>x.status!=='Done'),over=t.filter(x=>x.status!=='Done'&&x.due&&x.due<new Date().toISOString().slice(0,10)).length,rate=t.length?Math.round(done/t.length*100):0;var bars=Array.from({length:14},(_,i)=>'<i style="height:'+(15+((d.activity||[]).length*7+i*13)%75)+'%"></i>').join('');document.getElementById('view').innerHTML='<div class="grid"><div class="card"><div class="label">COMPLETION</div><div class="big">'+rate+'%</div><div class="sub">'+done+' completed</div></div><div class="card"><div class="label">OPEN WORK</div><div class="big">'+open.length+'</div><div class="sub">'+over+' overdue</div></div><div class="card"><div class="label">PROJECTS</div><div class="big">'+(d.projects||[]).length+'</div><div class="sub">Active workstreams</div></div><div class="card"><div class="label">ACTIVITY</div><div class="big">'+(d.activity||[]).length+'</div><div class="sub">Recorded events</div></div><div class="card wide"><div class="label">MOMENTUM</div><h2>Recent operating rhythm</h2><div class="spark">'+bars+'</div><div class="sub">A lightweight visual signal based on local activity.</div></div><div class="card wide"><div class="label">PROJECT HEALTH</div><div class="list">'+(d.projects||[]).map(p=>'<div class="item"><div class="row"><b>'+esc(p.name)+'</b><span class="pill">'+esc(p.health)+'</span></div><div class="sub" style="margin:6px 0">'+esc(p.goal)+'</div><div class="bar"><i style="width:'+Math.min(100,Math.max(0,p.progress||0))+'%"></i></div></div>').join('')+'</div></div><div class="card wide"><div class="label">TOP ATTENTION</div><h2>Highest leverage open work</h2><div class="list">'+open.slice().sort((a,b)=>(b.priority==='High'?2:1)-(a.priority==='High'?2:1)).slice(0,6).map(x=>'<div class="item"><div class="row"><b>'+esc(x.title)+'</b><span class="pill">'+esc(x.priority||'Medium')+'</span></div><div class="sub">'+esc(x.project||x.area||'Unassigned')+' · '+esc(x.due||'No date')+'</div></div>').join('')+'</div></div><div class="card wide"><div class="label">OPERATING SCORE</div><div class="score">'+Math.max(0,Math.min(100,Math.round(rate*.7+(100-Math.min(100,over*12))*.3)))+'</div><p class="insight">The score balances completion with backlog pressure. Use it as a reflection prompt, not a target.</p></div></div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.review=function(){alert('Weekly Review:\n1. What moved?\n2. What is stuck?\n3. What should stop?\n\nUse the main OS to update the queue.')}window.forecast=function(){var d=data(),o=(d.tasks||[]).filter(x=>x.status!=='Done'),p=(d.projects||[]).map(x=>x.name+': '+(x.progress||0)+'%');alert('Forecast\n\nOpen tasks: '+o.length+'\nProjects: '+p.join(', '))}window.exportData=function(){var b=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v9-backup.json';a.click()}render()})()</script></body></html>
