<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>Personal OS 16.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#151515;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.app{max-width:1440px;margin:auto;padding:14px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:-.04em}.muted{color:#898d93;font-size:11px}.shell{display:grid;grid-template-columns:230px 1fr;gap:12px}.nav{background:#111;color:#fff;border-radius:20px;padding:13px;min-height:calc(100vh - 90px);position:sticky;top:10px}.nav .muted{color:#888}.nav button{width:100%;display:block;text-align:left;margin:5px 0;background:#191919;color:#ddd;border:1px solid #292929}.nav button.active{background:#fff;color:#111}.main{min-width:0}.hero{background:#111;color:#fff;border-radius:22px;padding:22px;margin-bottom:12px}.hero .muted{color:#a1a1a1}.hero h1{font-size:30px;letter-spacing:-.06em;margin:4px 0}.heroRow{display:flex;justify-content:space-between;gap:15px;align-items:end}.focus{font-size:18px;font-weight:900;margin-top:15px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.metric{background:#fff;border:1px solid #e5e5e2;border-radius:15px;padding:11px}.metric b{display:block;font-size:21px;margin-top:3px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.card{background:#fff;border:1px solid #e4e4e1;border-radius:19px;padding:15px}.label{font-size:9px;letter-spacing:.17em;color:#92969b;font-weight:950}.h{font-size:22px;letter-spacing:-.05em;font-weight:950;margin:4px 0 10px}.list{display:grid;gap:7px}.item{border:1px solid #e8e8e5;border-radius:13px;padding:10px}.item b{font-size:11px}.pill{float:right;background:#ececeb;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.bar{height:6px;background:#e8e8e5;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#111}.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fafafa;border:1px solid #e7e7e4;border-radius:12px;padding:8px;min-height:105px}.day strong{font-size:9px}.day .dot{margin-top:6px;padding:5px;border-radius:7px;background:#111;color:#fff;font-size:8px}.chat{height:205px;overflow:auto;display:grid;align-content:start;gap:6px;margin:8px 0}.msg{max-width:90%;font-size:10px;line-height:1.5;padding:8px 10px;border-radius:12px;white-space:pre-wrap}.user{justify-self:end;background:#111;color:#fff}.ai{background:#eef0ee}.composer{display:flex;gap:6px}.input{flex:1;border:1px solid #ddd;padding:10px;border-radius:10px;outline:0}.btn{border:1px solid #ddd;background:#fff;color:#111;padding:9px 11px;border-radius:10px;font-weight:800;cursor:pointer}.dark{background:#111;color:#fff;border-color:#111}.quick{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.toast{position:fixed;right:15px;bottom:15px;background:#111;color:#fff;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800}@media(max-width:1050px){.shell{grid-template-columns:180px 1fr}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{grid-template-columns:1fr}.nav{position:static;min-height:auto}.nav button{display:inline-block;width:auto;margin-right:3px}.timeline{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr 1fr}} </style></head><body><div class="app"><div class="top"><div><div class="brand">PERSONAL OS · 16.0</div><div class="muted">Canvas UI · command center · local-first · Aditya</div></div><button class="btn" onclick="location.href='v15.html'">v15</button></div><div class="shell"><aside class="nav"><div class="label">PERSONAL OS</div><button id="n-home" class="btn active" onclick="view('home')">◉ Command Center</button><button id="n-work" class="btn" onclick="view('work')">▣ Work</button><button id="n-projects" class="btn" onclick="view('projects')">◆ Projects</button><button id="n-knowledge" class="btn" onclick="view('knowledge')">◇ Knowledge</button><button id="n-decisions" class="btn" onclick="view('decisions')">✓ Decisions</button><button id="n-journal" class="btn" onclick="view('journal')">✦ Journal</button><button id="n-memory" class="btn" onclick="view('memory')">∞ Memory</button><button class="btn" onclick="newTask()">＋ Capture</button><button class="btn" onclick="backup()">⇩ Backup</button><div class="muted" style="margin-top:20px;line-height:1.7">Everything here runs in your browser. No install. No backend.</div></aside><main class="main"><div id="content"></div></main></div></div><script>(function(){'use strict';var KEY='personal_os_v80',MEM='personal_os_v12_memory',page='home',chat=[];function get(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[]}}catch(e){return{tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[]}}}function put(d){d.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d))}function mem(){try{return JSON.parse(localStorage.getItem(MEM)||'[]')}catch(e){return[]}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function score(t){var s=t.priority==='High'?60:t.priority==='Medium'?30:10;if(t.lane==='NOW')s+=25;if(t.status==='Blocked')s-=20;if(t.due){var n=Math.ceil((new Date(t.due+'T23:59:59')-new Date())/864e5);if(n<0)s+=60;else if(n===0)s+=40;else if(n<=2)s+=25}return s}function state(){var d=get(),today=new Date().toISOString().slice(0,10),o=(d.tasks||[]).filter(t=>t.status!=='Done');return{d:d,o:o,over:o.filter(t=>t.due&&t.due<today),soon:o.filter(t=>t.due&&t.due>=today&&t.due<=new Date(Date.now()+2*864e5).toISOString().slice(0,10)),mem:mem()}}function log(d,text){d.activity=d.activity||[];d.activity.unshift({id:Date.now(),text:text,time:new Date().toISOString()});d.activity=d.activity.slice(0,100);put(d)}function ai(q){var d=get(),l=q.trim().toLowerCase(),x=state();if(l==='briefing'||l==='today'){var a=x.o.slice().sort((m,n)=>score(n)-score(m));return'FOCUS: '+(a[0]?a[0].title:'Nothing urgent')+'\n\nOVERDUE: '+(x.over[0]?x.over[0].title:'None')+'\n\nDUE SOON: '+(x.soon.slice(0,3).map(t=>t.title).join('\n')||'None')+'\n\nProtect the highest-scoring item first.'}if(l==='plan'||l==='plan today'){return'TODAY PLAN\n\n'+x.o.slice().sort((a,b)=>score(b)-score(a)).slice(0,7).map((t,i)=>(i+1)+'. '+t.title+' — '+t.priority+' — '+(t.due||'no date')).join('\n')}if(l==='review')return'REVIEW\nOpen '+x.o.length+' · Overdue '+x.over.length+' · Due soon '+x.soon.length+' · Blocked '+x.o.filter(t=>t.status==='Blocked').length+'\nProjects '+(d.projects||[]).length+' · Decisions '+(d.decisions||[]).length+' · Memory '+x.mem.length;if(l==='help')return'Commands: briefing · plan today · review · add task … · complete task … · move task … to blocked · find … · remember … · recall … · note …';if(l.startsWith('add task ')){var title=q.trim().slice(9);d.tasks=d.tasks||[];d.tasks.push({id:Date.now(),title:title,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'});log(d,'Added task: '+title);return'Created: '+title}if(l.startsWith('complete task ')){var z=q.trim().slice(14),t=(d.tasks||[]).find(a=>String(a.id)===z||a.title.toLowerCase()===z.toLowerCase());if(!t)return'Task not found.';t.status='Done';log(d,'Completed: '+t.title);return'Completed: '+t.title}if(l.startsWith('move task ')){var p=q.trim().slice(10).split(/\s+to\s+/i),name=p[0].trim(),lane=(p[1]||'').trim().toUpperCase(),t=(d.tasks||[]).find(a=>a.title.toLowerCase()===name.toLowerCase()||String(a.id)===name);if(!t)return'Task not found.';if(['NOW','FOLLOW-UP','WAITING','SOMEDAY','BLOCKED'].indexOf(lane)<0)return'Lane: NOW, FOLLOW-UP, WAITING, SOMEDAY, BLOCKED';t.lane=lane;if(lane==='BLOCKED')t.status='Blocked';log(d,'Moved '+t.title+' to '+lane);return'Moved: '+t.title+' → '+lane}if(l.startsWith('find ')){var term=l.slice(5),h=[];(d.tasks||[]).forEach(t=>{if((t.title+' '+t.project+' '+t.area).toLowerCase().includes(term))h.push('Task: '+t.title)});(d.notes||[]).forEach(n=>{if((n.title+' '+n.body+' '+n.tag).toLowerCase().includes(term))h.push('Note: '+n.title)});(d.projects||[]).forEach(p=>{if((p.name+' '+p.goal).toLowerCase().includes(term))h.push('Project: '+p.name)});return h.join('\n')||'No local matches.'}if(l.startsWith('remember ')){var m=x.mem;m.unshift({text:q.trim().slice(9),time:new Date().toISOString()});localStorage.setItem(MEM,JSON.stringify(m.slice(0,80)));return'Remembered locally.'}if(l.startsWith('recall ')){var term=l.slice(7);return x.mem.filter(m=>m.text.toLowerCase().includes(term)).map(m=>'• '+m.text).join('\n')||'No matching memory.'}if(l.startsWith('note ')){d.notes=d.notes||[];d.notes.push({id:Date.now(),title:'OS Capture',tag:'Captured',body:q.trim().slice(5),area:'Inbox'});log(d,'Captured note');return'Note saved.'}return'Try “help”. I can plan, execute, search, remember and review.'}function render(){var x=state(),d=x.d,c=document.getElementById('content');if(page==='home'){var top=x.o.slice().sort((a,b)=>score(b)-score(a)).slice(0,4);c.innerHTML='<div class="hero"><div class="label">COMMAND CENTER · WEDNESDAY</div><div class="heroRow"><div><h1>Run your day from one canvas.</h1><div class="muted">Execution, projects, knowledge, decisions, journal and memory.</div></div><div class="focus">'+esc(top[0]?top[0].title:'No priority task')+'</div></div></div><div class="metrics"><div class="metric">OPEN<b>'+x.o.length+'</b></div><div class="metric">OVERDUE<b>'+x.over.length+'</b></div><div class="metric">DUE SOON<b>'+x.soon.length+'</b></div><div class="metric">PROJECTS<b>'+(d.projects||[]).length+'</b></div><div class="metric">DECISIONS<b>'+(d.decisions||[]).length+'</b></div><div class="metric">MEMORY<b>'+x.mem.length+'</b></div></div><div class="card" style="margin-bottom:12px"><div class="label">7-DAY HORIZON</div><div class="timeline" style="margin-top:8px">'+days(x)+'</div></div><div class="grid"><div class="card"><div class="label">TOP WORK</div><div class="h">Next actions</div><div class="list">'+top.map(t=>'<div class="item"><span class="pill">'+score(t)+'</span><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.priority)+' · '+esc(t.lane)+' · '+esc(t.due||'no date')+'</div></div>').join('')+'</div></div><div class="card"><div class="label">PROJECT PULSE</div><div class="list" style="margin-top:8px">'+(d.projects||[]).slice(0,5).map(p=>'<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+(p.progress||0)+'% · '+esc(p.health||'')+'</div><div class="bar"><i style="width:'+Math.min(100,Number(p.progress)||0)+'%"></i></div></div>').join('')+'</div></div></div>'}else if(page==='work'){c.innerHTML='<div class="card"><div class="label">EXECUTION</div><div class="h">All open work</div><div class="list">'+x.o.slice().sort((a,b)=>score(b)-score(a)).map(t=>'<div class="item"><span class="pill">'+score(t)+'</span><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.status)+' · '+esc(t.lane)+' · '+esc(t.priority)+' · '+esc(t.due||'no date')+'</div><button class="btn" style="margin-top:6px" onclick="done('+t.id+')">Complete</button></div>').join('')+'</div></div>'}else if(page==='projects'){c.innerHTML='<div class="card"><div class="label">PORTFOLIO</div><div class="h">Projects</div><div class="list">'+(d.projects||[]).map(p=>'<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.goal||'')+'</div><div class="bar"><i style="width:'+Math.min(100,Number(p.progress)||0)+'%"></i></div><div class="muted">'+(p.progress||0)+'% · '+esc(p.health||'')+'</div></div>').join('')+'</div></div>'}else{var map={knowledge:['KNOWLEDGE','Knowledge base',d.notes||[]],decisions:['DECISIONS','Decision log',d.decisions||[]],journal:['JOURNAL','Reflection',d.journal||[]],memory:['MEMORY','Local memory',x.mem]};var q=map[page];c.innerHTML='<div class="card"><div class="label">'+q[0]+'</div><div class="h">'+q[1]+'</div><div class="list">'+q[2].map(z=>'<div class="item"><b>'+esc(z.title||z.name||z.text||'Entry')+'</b><div class="small muted">'+esc(z.body||z.decision||z.notes||z.text||'')+'</div></div>').join('')+'</div></div>'}renderCopilot();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));var n=document.getElementById('n-'+page);if(n)n.classList.add('active')}function days(x){var out='';for(var i=0;i<7;i++){var d=new Date(Date.now()+i*864e5),ds=d.toISOString().slice(0,10),items=x.o.filter(t=>t.due===ds).slice(0,3);out+='<div class="day"><strong>'+d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})+'</strong>'+(items.map(t=>'<div class="dot">'+esc(t.title)+'</div>').join('')||'<div class="muted" style="margin-top:8px">—</div>')+'</div>'}return out}function renderCopilot(){var r=document.getElementById('copilot');if(!r)return;r.innerHTML='<div class="label">OS COPILOT</div><div id="chat" class="chat">'+chat.map(x=>'<div class="msg '+x.r+'">'+esc(x.t)+'</div>').join('')+'</div><div class="composer"><input id="cmd" class="input" placeholder="Tell the OS what to do"><button class="btn dark" onclick="send()">Run</button></div><div class="quick"><button class="btn" onclick="run(\'briefing\')">Briefing</button><button class="btn" onclick="run(\'plan today\')">Plan</button><button class="btn" onclick="run(\'review\')">Review</button><button class="btn" onclick="run(\'show overdue\')">Overdue</button></div>';document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()});var c=document.getElementById('chat');c.scrollTop=c.scrollHeight}function layoutCopilot(){var r=document.querySelector('.right')||document.getElementById('copilot')}function send(){var e=document.getElementById('cmd'),q=e.value.trim();if(!q)return;chat.push({r:'user',t:q},{r:'ai',t:ai(q)});e.value='';render()}function newTask(){var title=prompt('Task title');if(!title)return;var d=get();d.tasks=d.tasks||[];d.tasks.push({id:Date.now(),title:title,project:'',area:'Inbox',lane:'NOW',priority:'Medium',status:'Todo',due:'',context:'Computer'});log(d,'Created task: '+title);render();toast('Task created')}function done(id){var d=get(),t=(d.tasks||[]).find(x=>x.id===id);if(!t)return;t.status='Done';log(d,'Completed task: '+t.title);render();toast('Completed')}function backup(){var b=new Blob([JSON.stringify({version:'16.0',data:get(),memory:mem(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='personal-os-v16-backup.json';a.click();URL.revokeObjectURL(a.href)}function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}window.view=function(v){page=v;render()};window.send=send;window.run=function(q){document.getElementById('cmd').value=q;send()};window.newTask=newTask;window.done=done;window.backup=backup;document.querySelector('.main').insertAdjacentHTML('afterbegin','<div id="copilot" style="display:none"></div>');var side=document.createElement('div');side.className='card';side.style.cssText='position:fixed;right:14px;bottom:14px;width:min(320px,calc(100% - 28px));z-index:4';side.id='copilot';document.body.appendChild(side);render();chat.push({r:'ai',t:'v16 online. Welcome to the new Canvas UI. Try “briefing” or “plan today”.'});render()})()</script></body></html>
