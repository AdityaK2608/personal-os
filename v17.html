<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Personal OS 17.0</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e8eaed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:1440px;margin:auto;padding:16px}.top{height:58px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:-.04em}.muted{color:#858b94;font-size:11px}.shell{display:grid;grid-template-columns:230px 1fr;gap:12px}.nav,.card{background:#11151a;border:1px solid #242a31;border-radius:18px}.nav{padding:12px;min-height:calc(100vh - 90px);position:sticky;top:10px}.nav button{width:100%;display:block;text-align:left;margin:5px 0;background:#171b20;color:#cdd2d8;border:1px solid #282e36}.nav button.active{background:#e8eaed;color:#0b0d10}.btn{border:1px solid #2b323a;background:#15191e;color:#dce0e5;padding:9px 11px;border-radius:10px;font-weight:800;cursor:pointer}.dark{background:#e8eaed;color:#0b0d10}.main{min-width:0}.hero{background:#e8eaed;color:#0b0d10;border-radius:20px;padding:20px;margin-bottom:12px}.hero h1{font-size:28px;letter-spacing:-.06em;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:15px}.label{font-size:9px;letter-spacing:.17em;color:#7d858e;font-weight:900}.h{font-size:21px;font-weight:900;letter-spacing:-.05em;margin:4px 0 12px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}.metric{background:#11151a;border:1px solid #242a31;border-radius:13px;padding:10px}.metric b{display:block;font-size:20px;margin-top:3px}.list{display:grid;gap:7px}.item{border:1px solid #242a31;border-radius:12px;padding:10px}.item b{font-size:11px}.pill{float:right;background:#252b32;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.bar{height:5px;background:#252b32;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#e8eaed}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid #242a31}.ok{font-weight:900}.warn{font-weight:900}.composer{display:flex;gap:6px}.input{flex:1;border:1px solid #2b323a;background:#0d1014;color:#eee;padding:10px;border-radius:10px;outline:0}.toast{position:fixed;right:15px;bottom:15px;background:#e8eaed;color:#0b0d10;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:#aeb5be}.row{display:flex;gap:7px;align-items:center;justify-content:space-between}.stack{display:grid;gap:8px}@media(max-width:1050px){.shell{grid-template-columns:180px 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{grid-template-columns:1fr}.nav{position:static;min-height:auto}.nav button{display:inline-block;width:auto}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}} </style></head><body><div class="app"><div class="top"><div><div class="brand">PERSONAL OS · 17.0</div><div class="muted">Technical Core · local-first · schema v17 · Aditya</div></div><button class="btn" onclick="backup()">Export System</button></div><div class="shell"><aside class="nav"><div class="label">SYSTEM</div><button id="n-overview" class="btn active" onclick="view('overview')">◉ Overview</button><button id="n-data" class="btn" onclick="view('data')">▣ Data Store</button><button id="n-audit" class="btn" onclick="view('audit')">◌ Audit Log</button><button id="n-search" class="btn" onclick="view('search')">⌕ Search Index</button><button id="n-health" class="btn" onclick="view('health')">◇ Health</button><button id="n-tools" class="btn" onclick="view('tools')">⚙ Developer Tools</button><div style="height:12px"></div><div class="label">APP</div><button class="btn" onclick="location.href='v16.html'">Open v16 UI</button><div class="muted" style="margin-top:18px;line-height:1.7">No server. No install. The technical layer runs entirely in this browser.</div></aside><main class="main"><div id="content"></div></main></div></div><script>(function(){'use strict';var KEY='personal_os_v80',MEM='personal_os_v12_memory',SCHEMA=17,page='overview';var DEFAULT={schemaVersion:17,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),tasks:[],projects:[],notes:[],decisions:[],journal:[],activity:[],settings:{},meta:{}};function now(){return new Date().toISOString()}function readRaw(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function seed(){var d=readRaw();if(!d||typeof d!=='object'){d=JSON.parse(JSON.stringify(DEFAULT));save(d,'system:init');return d}return migrate(d)}function migrate(d){var changed=false;['tasks','projects','notes','decisions','journal','activity'].forEach(function(k){if(!Array.isArray(d[k])){d[k]=[];changed=true}});if(!d.settings)d.settings={};if(!d.meta)d.meta={};if(!d.createdAt)d.createdAt=now();if((d.schemaVersion||0)<SCHEMA){d.meta.migrationFrom=d.schemaVersion||1;d.schemaVersion=SCHEMA;changed=true}if(!d.updatedAt)d.updatedAt=now();if(changed)localStorage.setItem(KEY,JSON.stringify(d));return d}function save(d,action){d.updatedAt=now();d.schemaVersion=SCHEMA;d.meta=d.meta||{};d.meta.lastAction=action||'update';localStorage.setItem(KEY,JSON.stringify(d));audit(action||'update',d);return d}function audit(action,d){var a=[];try{a=JSON.parse(localStorage.getItem('personal_os_v17_audit')||'[]')}catch(e){}a.unshift({id:Date.now(),action:action,time:now(),schema:d.schemaVersion,counts:counts(d)});localStorage.setItem('personal_os_v17_audit',JSON.stringify(a.slice(0,300)))}function counts(d){return{tasks:d.tasks.length,projects:d.projects.length,notes:d.notes.length,decisions:d.decisions.length,journal:d.journal.length,activity:d.activity.length}}function memory(){try{return JSON.parse(localStorage.getItem(MEM)||'[]')}catch(e){return[]}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}function allRecords(d){var r=[];['tasks','projects','notes','decisions','journal'].forEach(function(k){(d[k]||[]).forEach(function(x){r.push({type:k.slice(0,-1),id:x.id||x.name||x.title,text:JSON.stringify(x)})})});return r}function health(){var d=seed(),issues=[];if(Number(d.schemaVersion)!==SCHEMA)issues.push('Schema version mismatch');if(!Array.isArray(d.tasks))issues.push('Tasks collection invalid');if(!Array.isArray(d.projects))issues.push('Projects collection invalid');try{JSON.stringify(d)}catch(e){issues.push('Data is not serializable')}return{d:d,issues:issues,records:allRecords(d)}}function countsHtml(c){return Object.keys(c).map(function(k){return '<div class="metric">'+k.toUpperCase()+'<b>'+c[k]+'</b></div>'}).join('')}function render(){var h=health(),d=h.d,c=document.getElementById('content'),ct=counts(d),audit=getAudit();if(page==='overview')c.innerHTML='<div class="hero"><div class="label">TECHNICAL CORE · ONLINE</div><h1>The backend is now a real data layer.</h1><div class="muted">Schema versioning, migrations, audit history, indexing, validation and deterministic import/export — all local-first.</div></div><div class="metrics">'+countsHtml(ct)+'<div class="metric">MEMORY<b>'+memory().length+'</b></div></div><div class="grid"><div class="card"><div class="label">RUNTIME</div><div class="h">System status</div><div class="stack"><div class="item"><b>Storage</b><div class="muted">localStorage · '+formatBytes(JSON.stringify(d).length)+'</div></div><div class="item"><b>Schema</b><div class="muted">v'+d.schemaVersion+' · migration aware</div></div><div class="item"><b>Integrity</b><div class="muted">'+(h.issues.length?'Needs attention':'Healthy')+'</div></div></div></div><div class="card"><div class="label">RECENT EVENTS</div><div class="h">Audit stream</div><div class="list">'+audit.slice(0,6).map(function(a){return '<div class="item"><b>'+esc(a.action)+'</b><div class="muted">'+esc(a.time)+' · '+JSON.stringify(a.counts)+'</div></div>'}).join('')+'</div></div></div>';else if(page==='data')c.innerHTML='<div class="card"><div class="label">PERSISTENCE</div><div class="h">Data Store</div><div class="row"><span class="muted">Canonical key</span><span class="code">'+KEY+'</span></div><table class="table"><tr><th>Collection</th><th>Records</th><th>Indexed</th></tr>'+Object.keys(ct).map(function(k){return '<tr><td>'+k+'</td><td>'+ct[k]+'</td><td>yes</td></tr>'}).join('')+'</table><div style="margin-top:12px" class="row"><button class="btn dark" onclick="backup()">Export JSON</button><button class="btn" onclick="resetIndex()">Rebuild Index</button></div></div>';else if(page==='audit')c.innerHTML='<div class="card"><div class="label">OBSERVABILITY</div><div class="h">Audit Log</div><div class="list">'+audit.map(function(a){return '<div class="item"><b>'+esc(a.action)+'</b><div class="muted">'+esc(a.time)+' · schema '+a.schema+' · '+JSON.stringify(a.counts)+'</div></div>'}).join('')+'</div></div>';else if(page==='search')c.innerHTML='<div class="card"><div class="label">LOCAL INDEX</div><div class="h">Search Index</div><div class="composer"><input id="sq" class="input" placeholder="Search tasks, projects, notes, decisions…"><button class="btn dark" onclick="searchNow()">Search</button></div><div id="results" style="margin-top:12px" class="list"><div class="muted">The index is generated from the canonical store on demand.</div></div></div>';else if(page==='health')c.innerHTML='<div class="card"><div class="label">DIAGNOSTICS</div><div class="h">Health & Integrity</div><div class="list"><div class="item"><b>Schema</b><div class="muted">Expected v'+SCHEMA+' · actual v'+d.schemaVersion+'</div></div><div class="item"><b>Serialization</b><div class="muted">JSON round-trip: '+(h.issues.length?'failed':'passed')+'</div></div><div class="item"><b>Collections</b><div class="muted">'+(h.issues.length?h.issues.join(' · '):'All canonical collections valid')+'</div></div></div><button class="btn dark" style="margin-top:10px" onclick="repair()">Run Safe Repair</button></div>';else c.innerHTML='<div class="grid"><div class="card"><div class="label">DEVELOPER TOOLS</div><div class="h">Storage diagnostics</div><div class="stack"><div class="item"><b>localStorage keys</b><div class="muted">'+Object.keys(localStorage).length+' total</div></div><div class="item"><b>OS payload</b><div class="muted">'+formatBytes(JSON.stringify(d).length)+'</div></div><div class="item"><b>Audit payload</b><div class="muted">'+formatBytes(JSON.stringify(audit).length)+'</div></div></div></div><div class="card"><div class="label">COMMAND CONSOLE</div><div class="h">Technical commands</div><div class="composer"><input id="cmd" class="input" placeholder="stats / validate / rebuild"><button class="btn dark" onclick="command()">Run</button></div><pre id="out" class="code" style="white-space:pre-wrap"></pre></div></div>';document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('active')});var n=document.getElementById('n-'+page);if(n)n.classList.add('active')}function getAudit(){try{return JSON.parse(localStorage.getItem('personal_os_v17_audit')||'[]')}catch(e){return[]}}function formatBytes(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'}function view(p){page=p;render()}function searchNow(){var q=(document.getElementById('sq').value||'').toLowerCase().trim(),r=health().records.filter(x=>x.text.toLowerCase().includes(q)).slice(0,50);document.getElementById('results').innerHTML=r.map(function(x){var obj;try{obj=JSON.parse(x.text)}catch(e){obj={}}return '<div class="item"><span class="pill">'+esc(x.type)+'</span><b>'+esc(obj.title||obj.name||obj.text||x.id)+'</b><div class="muted">'+esc((obj.body||obj.goal||obj.decision||obj.notes||'').slice(0,180))+'</div></div>'}).join('')||'<div class="muted">No matches.</div>'}function resetIndex(){var d=seed(),idx={version:1,builtAt:now(),records:health().records.map(function(x){return{x.type,id:x.id,text:x.text}})};localStorage.setItem('personal_os_v17_index',JSON.stringify(idx));toast('Search index rebuilt')}function repair(){var d=seed();d.tasks=d.tasks||[];d.projects=d.projects||[];d.notes=d.notes||[];d.decisions=d.decisions||[];d.journal=d.journal||[];d.activity=d.activity||[];save(d,'system:repair');resetIndex();toast('Safe repair completed');render()}function command(){var q=(document.getElementById('cmd').value||'').trim().toLowerCase(),d=seed(),o=document.getElementById('out');if(q==='stats')o.textContent=JSON.stringify(counts(d),null,2);else if(q==='validate')o.textContent=health().issues.length?health().issues.join('\n'):'PASS — schema and collections valid';else if(q==='rebuild')resetIndex(),o.textContent='PASS — index rebuilt';else if(q==='clear audit')localStorage.removeItem('personal_os_v17_audit'),o.textContent='Audit cleared';else o.textContent='Commands: stats · validate · rebuild · clear audit'}function backup(){var payload={format:'personal-os-system',version:SCHEMA,exportedAt:now(),data:seed(),memory:memory(),audit:getAudit(),index:(function(){try{return JSON.parse(localStorage.getItem('personal_os_v17_index')||'null')}catch(e){return null}})()};var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='personal-os-system-v17-'+now().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('System export created')}function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},1800)}window.view=view;window.searchNow=searchNow;window.resetIndex=resetIndex;window.repair=repair;window.command=command;window.backup=backup;render()})();</script></body></html>
